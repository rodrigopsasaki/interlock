interlock: commits@v0
entries:
  - message: >-
      feat(runner): preserve signed attempts when agents cannot commit


      Let runtime profiles give commit custody to the runner while keeping agent

      custody as the default and reading every earlier catalogue version.


      Settle code before preparing the debrief, validate declared paths and
      secret

      rules before staging, and sign only exact paths. Roll back a failed commit

      sequence to its starting head while preserving every worktree file. Commit

      validated session artifacts last so debrief head_sha remains the code
      head.


      Fixture signing and session proofs cover ordering, trailers, fallback
      paths,

      refusals, rollback, declared-path forwarding and final artifact custody.

      The standing test command is blocked by sandbox-denied HTTP listeners.
