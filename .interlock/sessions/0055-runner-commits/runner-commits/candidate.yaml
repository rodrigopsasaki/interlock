decisions:
  - id: profile-commit-custody
    what: Publish runtimes@v1 with runner or agent commit custody, keep runtimes@v0
      readable, default missing custody to agent, and opt every shipped codex
      profile into runner custody.
    because: The catalogue had only v0 in this checkout. Explicit custody moves
      signing outside an agent sandbox while existing profiles and the legacy
      local runtime retain their behavior.
    rests_on:
      - .interlock/graphs/0055-runner-commits.yaml
      - packages/runner/src/runtimeCatalogue.ts:18-28
      - packages/runner/src/runtimeCatalogue.ts:105-119
    hunks:
      - packages/runner/src/runtimeCatalogue.ts
      - packages/runner/test/runtimeSelection.test.ts
      - packages/runner/test/runtimes.test.ts
      - schemas/runtimes@v1.json
      - packages/schemas/test/runtimes.test.ts
      - packages/schemas/test/runtimesExample.test.ts
      - runtimes.example.yaml
  - id: validate-plan-and-custody-before-staging
    what: Add commits@v0 and validate messages, literal paths, duplicate and
      unchanged entries, reserved artifacts and fallback coverage. Check
      declared paths and secret names or the first 64 KB before staging, and
      retain debrief candidates and sources for phase 2.
    because: A complete preflight avoids partial commits on a known refusal.
      Uninspectable symbolic links refuse rather than following a path outside
      the worktree, and custom debrief candidate filenames need the same custody
      as conventional names.
    rests_on:
      - .interlock/graphs/0055-runner-commits.yaml
      - packages/runner/src/runnerCommits.ts:40-199
    hunks:
      - packages/runner/src/runnerCommits.ts:40-199
      - schemas/commits@v0.json
      - packages/schemas/test/commits.test.ts
  - id: sign-exact-path-sequences-and-rollback
    what: Commit exact literal paths in plan order with signed Git commits and
      attempt, runtime and optional co-author trailers. Reset a failed sequence
      to its starting HEAD with a mixed reset, preserving files and leaving them
      unstaged.
    because: Signing must use the owner’s normal Git environment. NUL status
      preserves literal filenames; checking both sides of renames prevents
      path-scope escapes. Resetting only the named index paths before staging
      also handles already-staged deletions without including unrelated staged
      files. The existing brief commit and its trailer remain intact.
    rests_on:
      - .interlock/graphs/0055-runner-commits.yaml
      - packages/runner/src/worktree.ts:78-135
      - packages/runner/src/runnerCommits.ts:201-283
    hunks:
      - packages/runner/src/worktree.ts
      - packages/runner/src/runnerCommits.ts:201-283
      - test/support/gitFixture.ts
  - id: settle-code-before-authoring-the-debrief
    what: Give runner custody a dirty code settlement, commit code before the second
      pane prompt, validate debrief identity, role kinds and notes, then commit
      session artifacts last before judging. Record runner refusals as failed
      outcomes with a disposition and because while retaining explicit
      before-judge holds.
    because: Debrief prepare must see the last code HEAD so its verification range
      includes runner commits. A dirty code path in phase 2 fails by name.
      Optional screen snapshots are persisted only when ignored in runner mode,
      preventing a new dirty path after the final commit. Agent custody retains
      its existing instructions and settlement.
    rests_on:
      - docs/design/0001-interlock.md:224-240
      - .interlock/graphs/0055-runner-commits.yaml
      - packages/runner/src/runnerCommits.ts:286-344
    hunks:
      - packages/runner/src/openingPrompt.ts
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/runnerCommits.ts:286-344
      - packages/runner/test/runnerCommits.test.ts
  - id: carry-graph-declared-paths
    what: Read optional node path globs from the graph and carry them through
      interlock run into the session commit check, with the node session
      directory always declared.
    because: The commit check needs the declaration from the approved graph rather
      than an agent-supplied scope. Without an explicit declaration it permits
      ordinary tracked and new paths while excluding Git metadata, other
      sessions and graph files.
    rests_on:
      - .interlock/graphs/0055-runner-commits.yaml
      - packages/runner/src/runnerCommits.ts:136-143
    hunks:
      - packages/face/src/document.ts
      - packages/cli/src/run.ts
      - schemas/graph@v0.json
      - packages/runner/test/runnerCommits.test.ts:650-653
  - id: retain-the-artifact-reference-and-design-reason
    what: Regenerate the artifact reference for commits@v0, runtimes@v1 and node
      paths, select the updated catalogue example, retain historical schemas,
      and record the D26 revisit in the bend log.
    because: The artifact reference must describe the published shapes, and the
      design needs the reason dirty code may settle even though judging still
      waits for committed proof.
    rests_on:
      - docs/design/0001-interlock.md:224-240
      - schemas/commits@v0.json
      - schemas/runtimes@v1.json
    hunks:
      - docs/design/0001-interlock.md:666
      - docs/shapes.md
      - packages/schemas/src/reference/corpus.ts
      - packages/schemas/test/reference.test.ts
