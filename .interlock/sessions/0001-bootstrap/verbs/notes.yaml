interlock: notes@v0
node: verbs
entries:
  - kind: choice
    at: "2026-09-11T14:05:00Z"
    chose: >
      Added one shared `proposeOutcomeMove(current, next)` to
      `packages/ledger/src/outcome.ts`, mirroring `proposeGateMove`'s shape:
      a terminal outcome kind (`cleared`, `cancelled`, `superseded`,
      `failed`) never accepts another move; anything else, including no
      outcome yet, does. `node cancel` and `node reset` both call it.
    because: >
      The brief says "the ledger's own transition rules decide what is
      legal; an illegal move is a sentence," but no such rule existed for
      Outcome before this session -- only Gate had one. The node lifecycle
      diagram in docs/design/0001-interlock.md draws `cleared`, `cancelled`
      and `superseded` going to `[*]` with no arrows leaving them, and
      `failed` (disposition `terminal-failure`) is the same kind of end by
      name. Putting the rule in `packages/ledger/src/outcome.ts`, which is
      in scope, keeps one definition of "terminal" instead of one guess per
      verb, and mirrors `gate.ts`'s existing pattern rather than inventing
      a new shape.
    rejected: >
      ["a bespoke if-chain per verb (duplicates the same terminal-kind
      judgment twice, and the next verb that needs it would duplicate it a
      third time)", "encoding the rule as a method on Outcome itself
      (Outcome is a plain discriminated union everywhere else in this
      package; Gate's own transition rule is a free function, not a
      method, so this matches the established shape)"]
  - kind: choice
    at: "2026-09-11T14:20:00Z"
    chose: >
      Sourced the `receipts` field on the `cancelled`/`reset` outcome
      `node cancel`/`node reset` write from `NodeView.receipts` (the
      node's full accumulated receipt list), never from the prior
      outcome's own `.receipts`.
    because: >
      `packages/runner/src/sweep.ts`'s existing abandon-on-expiry write
      already answers exactly this question the same way --
      `ledger.projection().nodes.get(nodeKey(session.node))?.receipts ??
      []` -- for the same `outcome.cancelled(...)` call. Reusing that
      precedent keeps one reading of an otherwise ambiguous field
      (`Outcome.receipts` is not documented as "carried forward from the
      prior outcome" anywhere) instead of a second, invented one.
  - kind: choice
    at: "2026-09-11T14:25:00Z"
    chose: >
      `node reset` refuses with a distinct sentence, "has no outcome yet;
      nothing to reset", when the node has never had an outcome-set event
      at all, rather than treating that as a legal `proposeOutcomeMove`
      source the way `node cancel` does.
    because: >
      The node lifecycle diagram draws `queued --> cancelled: authorized,
      with because` explicitly -- cancelling a never-run node is a real,
      named path. No edge anywhere reads a never-run node back into
      `reset`; the verb's own acceptance text ("so the runner may lease
      the node again") presumes something to un-stick. `cleared` /
      `cancelled` / `superseded` / `failed` stay refused by the shared
      `proposeOutcomeMove` terminal rule underneath this check, the same
      as for `cancel`.
  - kind: surprise
    at: "2026-09-11T14:35:00Z"
    expected: >
      Appending a `lease-taken` event alone, with no prior
      `session-started`, would be enough to make a node read as under a
      live lease in the projection, for a `node reset` live-lease test.
    observed: >
      `packages/ledger/src/projection.ts`'s `withSession` silently no-ops
      any event for a session id the projection has never seen via
      `session-started` -- `lease-taken` included. The test had to append
      `session-started` first (a stub `Brief`) for the lease to register
      at all. Recorded here rather than in the ledger's own files: this
      package is in scope for other work this session did
      (`outcome.ts`), but `projection.ts`'s behavior itself is unchanged,
      an existing constraint this session had to work around, not
      redesign.
  - kind: choice
    at: "2026-09-11T14:45:00Z"
    chose: >
      `gate waive` finds "the gate's latest receipt" by filtering
      `NodeView.receipts` (every receipt ever written for the node) to
      `receipt.gate === gateId` and taking the last match, rather than
      reading the receipt off the current `Gate` value (which only
      `satisfied` and `waived` carry).
    because: >
      `packages/runner/src/gateJudge.ts` writes a gate's receipt via
      `receipt-written` before deciding `satisfied` or `blocked` --
      confirmed by reading it in full. A gate stuck `blocked` on a real
      failure still has a real receipt in the journal; that is exactly
      the case a person waiving a gate needs to reach. Reading only
      `Gate.receipt` would make waive unable to waive the one state it
      exists for.
  - kind: choice
    at: "2026-09-11T14:50:00Z"
    chose: >
      Pulled `graph/approve.ts`'s local `parseFlag(args, flag)` into
      `packages/cli/src/flags.ts` and had all four verbs (`approve`,
      `node cancel`, `node reset`, `gate waive`) import it from there.
    because: >
      Three new call sites needing the identical four-line
      `--flag value` reader made the duplication real rather than
      speculative; AGENTS.md's own convention calls for "small
      single-purpose files named for the vocabulary," which a one-function
      `flags.ts` is. Refactoring `approve.ts` too keeps one definition
      instead of one now-stale copy sitting beside the shared one.
  - kind: choice
    at: "2026-09-11T15:10:00Z"
    chose: >
      Added exactly one bend-log row to `docs/design/0002-face.md`
      recording that `node cancel`, `node reset` and `gate waive` are
      built and `pause` is not, naming the missing `Outcome` kind and
      that it needs its own event version -- no other edit to that file.
    because: >
      The brief asks for this literally ("Add one bend-log row... That
      row is the only design-note edit you make"). D15 already names the
      `pause` gap in prose; this session's build is the first place a
      real verb session confirms it against working code rather than
      design-time reasoning alone, which is what a bend-log entry is for.
  - kind: choice
    at: "2026-09-11T15:20:00Z"
    chose: >
      Captured each verb's `--because`-missing refusal sentence by
      running the built CLI (`node packages/cli/src/bin.ts ...`) against
      a real scratch git repository under
      `packages/cli/test/.runs/verbs-refusal-scratch` (gitignored, a
      sibling of every test suite's own `.runs`), rather than only citing
      the unit tests that assert the same string.
    because: >
      The brief asks for these sentences "verbatim, from a scratch
      repository" as a debrief requirement distinct from the gate suite
      itself; running the real binary end to end is the only way to see
      exactly what a person would see, not what a test's `expect(...)`
      happens to assert. The scratch repository was removed with a plain
      `rm -r` on the exact path this session created, once the three
      sentences were captured; `git status` confirms nothing it touched
      is tracked.
  - kind: surprise
    at: "2026-09-11T15:30:00Z"
    expected: >
      Running `interlock verify 0001-bootstrap verbs` against this
      session's own debrief once filed would root every discovery's
      `found_at`, since each one names a real file this session actually
      read.
    observed: >
      Two discoveries' `found_at` prose each quoted a string in double
      quotes that named the *finding* (a word not present, or another
      file's own message text) rather than content literally present in
      the file the prose also named --
      `packages/verifier/src/foundAt.ts`'s `checkFoundAt` treats any
      quoted substring beside a resolvable path as a claim that the quote
      is literally in that file's content at `head_sha`, and marks it
      unrooted otherwise. Rewrote both as a `$ grep -n ...`-prefixed
      command citation instead (`checkFoundAt`'s command form roots
      unconditionally) with the real grep output quoted beneath it,
      confirmed by re-running `interlock verify`: unrooted dropped from 2
      to 0.
