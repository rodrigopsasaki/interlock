discoveries:
  - id: d1
    what: >
      The graph's professed gate command `pnpm test --filter ledger --
      --grep replay` cannot run as written: pnpm's --filter must precede the
      script name (following `test` it is forwarded to vitest as an unknown
      option), and vitest 2.x has no --grep flag at all, only
      -t/--testNamePattern. Adding the `--` separator pnpm's own script
      forwarding otherwise inserts also breaks vitest's own flag parsing.
    found_at: >
      running `pnpm test --filter ledger -- --grep replay` (CACError: Unknown
      option `--filter`), then `pnpm --filter ledger test -- --testNamePattern
      replay` (ran all tests, unfiltered), then `pnpm --filter ledger test
      --testNamePattern replay` (correctly filtered)
    mattered_because: >
      both node-declared gates (replay, illegal-states) are professed with
      this exact broken shape; the working invocation had to be found and
      recorded rather than assumed.
  - id: d2
    what: >
      The published @phyxiusjs/drain@0.3.0's stop() calls flushBuffer(true)
      exactly once and that call is a no-op (classifyFlush returns "skip")
      whenever a write from an earlier auto-triggered flush is still in
      flight -- it never awaits that in-flight write and never loops for a
      still-nonempty buffer the way flush() does.
    found_at: node_modules/.pnpm/@phyxiusjs+drain@0.3.0.../dist/index.js, createDrain's stop()/flushBuffer/classifyFlush
    mattered_because: >
      confirms the scouted API map's flag directly against the actual
      compiled source, and shows a small batchSize makes the window WORSE
      (every append starts its own in-flight write) rather than better, which
      is the opposite of my first instinct.
  - id: d3
    what: >
      The workspace tsconfig's noPropertyAccessFromIndexSignature refuses
      `value.field` dot access on anything typed as (or narrowed to) an
      index-signature-only type such as Record<string, unknown> -- every
      untyped-JSON validator needed bracket access instead.
    found_at: "a real `tsc --noEmit` run: ~90 TS4111 errors across every isX guard function"
    mattered_because: >
      the replay boundary (parsing JSON back into LedgerEvent) is exactly
      where untyped input meets these guards; centralized the bracket access
      behind one `prop()` helper rather than scattering it.
  - id: d4
    what: >
      @phyxiusjs/clock's MonoMs has no public constructor from a raw number
      -- it is only ever minted from a live clock reading or deadlineFrom --
      so an Instant read back from JSON after a process restart can never
      honestly satisfy the branded type without a cast.
    found_at: "node_modules/.pnpm/@phyxiusjs+clock.../dist/index.d.ts, MonoMs's own doc comment"
    mattered_because: >
      ruled out putting Instant anywhere in a journaled domain type; Lease's
      expiry and Note's/Mandate's timestamps are plain numbers/ISO strings
      instead, which round-trip through the sink with no cast at all.
  - id: d5
    what: >
      "disposition" is used directly in brief.md's own illegal-states
      sentence ("An outcome records failure, disposition and because as
      three fields") and in the design note's Gates section, but is not a
      row in AGENTS.md's own closed vocabulary table.
    found_at: "brief.md, \"Illegal states unrepresentable\"; AGENTS.md, Vocabulary table (absent)"
    mattered_because: >
      decided this is brief-sanctioned, not a coinage, since the brief's own
      sentence names it -- but the gap between the brief's language and
      AGENTS.md's table is real and worth closing there, not just here.
  - id: d6
    what: >
      reference implementation, supplied out of band: climb-step-machine.ts
      wraps openClimbStage/closeClimbStage rather than owning a parallel
      state column, and its terminal `completed` state's empty transition
      table is exactly what makes a second completion a pre-flight refusal.
    found_at: "reference implementation, supplied out of band: climb-step-machine.ts"
    mattered_because: >
      confirmed the scout's Law 01 distillation by reading the file directly
      and gave the concrete shape proposeGateMove renames and generalizes:
      terminal states (waived, superseded here) refuse every further move.
  - id: d7
    what: >
      reference implementation, supplied out of band: justification.ts's
      InferenceDerivation is an all-optional bag (strategy/source/model/
      promptId/lensRef), a different shape from what this ledger's
      Derivation needed -- the acceptance's own union requires each kind's
      fields, never optional. mandate.ts's Mandate names its justification
      field `note`, which collides with this ledger's Note type.
    found_at: "reference implementation, supplied out of band: justification.ts; reference implementation, supplied out of band: mandate.ts"
    mattered_because: >
      ruled out mirroring InferenceDerivation's shape for Derivation, and
      forced the field rename to `because` on Mandate so the same word
      doesn't mean two different things in the same codebase.
  - id: d8
    what: "@phyxiusjs/fp is published at 0.2.1 and matches this checkout's resolved version exactly."
    found_at: "`npm view @phyxiusjs/fp version` => 0.2.1"
    mattered_because: "verified before adding it as a new dependency, per the constraint that every added package is checked against npm."
  - id: d9
    what: >
      @phyxiusjs/journal's Journal.fromJSON expects each entry's own id and a
      full Instant timestamp ({wallMs, monoMs}), but @phyxiusjs/drain's
      fileSink flattens only an ISO-formatted wall time and a sequence
      number onto each journal.jsonl line -- the sink's own persisted shape
      cannot rebuild a Journal's entries on restart without inventing a
      monoMs and an id from nothing.
    found_at: >
      node_modules/.pnpm/@phyxiusjs+journal.../dist/index.d.ts (Journal.fromJSON,
      SerializedJournal) against packages/ledger/src/sink.ts's fileSink usage
    mattered_because: >
      ruled out reconstructing the in-memory Journal object itself on
      restart (verifier finding 3's fix); createLedger instead seeds only
      the live LedgerProjection from readReplay, leaving the sink as sole
      source of truth for everything before the current process -- matching
      "state is a projection over the journal," not "the journal itself is
      durable."
