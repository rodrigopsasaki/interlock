gates_run_by_agent:
  - { id: typecheck, result: pass }
  - { id: test, result: pass }
  - { id: debrief-valid, result: fail, note: "fails closed by design until the debrief-schema node lands" }
  - { id: replay, result: pass, invocation: "pnpm --filter ledger test --testNamePattern replay" }
  - { id: illegal-states, result: pass, invocation: "pnpm --filter ledger test --testNamePattern unrepresentable" }
open:
  - >
    Both node-declared gate commands as professed in the graph
    (`pnpm test --filter ledger -- --grep replay` and the --grep
    unrepresentable twin) do not run: `--filter` must precede the script
    name for pnpm to treat it as a workspace filter rather than forwarding it
    to the script, and vitest 2.x has no --grep flag, only
    -t/--testNamePattern; pnpm's own `--` insertion when forwarding args
    additionally breaks testNamePattern parsing if included literally. The
    invocation that actually runs each is recorded on its gate above. Per
    the brief, the graph itself is left as professed.
  - >
    @phyxiusjs/drain@0.3.0 (published) predates a stop()-correctness fix
    (await an in-flight write, loop until the buffer stops shrinking, report
    an honest `remaining`) that exists only in the phyxius workspace's local
    source and on an unmerged origin/changeset-release/main branch, per the
    scaffold-supplied API map. This ledger works around the published gap by
    keeping the drain's default batch size (a run smaller than the
    threshold never triggers a mid-stream auto-flush for close() to race)
    and calling flush() before stop(), but a write that happens to already
    be in flight at the moment close() is called can still be lost -- a
    residual gap in the published dependency, not something this node's own
    code can close without vendoring a patched drain or depending on the
    phyxius workspace source directly.
  - >
    "disposition" is used as a type name here (packages/ledger/src/
    disposition.ts) on the strength of brief.md's own sentence and the
    design note's Gates section, but it is not a row in AGENTS.md's closed
    vocabulary table. Worth a table entry there so a future session does not
    have to re-derive this.
  - >
    Graph and Node are deliberately thin (an id, and a node's owning graph
    id) with no dependency edges, acceptance text, or gate declarations --
    that topology belongs to the interpreter, which does not exist yet.
    Extending them later to carry it is additive, not a rename, but is
    unproven against this node's own tests.
  - >
    No node or gate transition here is wired against
    @phyxiusjs/durable-step's StateStore, since nothing in this node's
    acceptance drives concurrent execution. proposeGateMove and renewLease
    return the same Result shape a StateStore's trySet does, which should
    compose under an async wrapper when the runner node needs it, but that
    composition has not been built or tested here.
