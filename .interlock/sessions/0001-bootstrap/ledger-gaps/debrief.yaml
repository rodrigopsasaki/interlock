discoveries:
  - id: d1
    what: >
      `receipts: readonly Receipt[]` is a field on EVERY Outcome arm, not
      only `held` -- cleared, failed, cancelled and superseded all carry
      it too.
    found_at: >
      reading packages/ledger/src/outcome.ts's Outcome union in full before
      writing the v1 upcaster.
    mattered_because: >
      A v1-to-v2 upcast of ANY outcome kind needs its embedded receipts
      upcast for duration, not only held's -- upcastOutcome
      (packages/ledger/src/upcast/v1.ts:168-189) maps `receipts` through
      upcastReceipt unconditionally, before the per-kind switch, or every
      non-held v1 outcome would keep pre-duration receipts.
  - id: d2
    what: >
      `git rev-parse --git-common-dir` returns a RELATIVE path (".git")
      when run from inside the main worktree itself, but an ABSOLUTE path
      when run from a linked worktree.
    found_at: >
      running `git rev-parse --git-common-dir` by hand both from this
      linked worktree (an absolute path) and from the repository's main
      worktree (a relative ".git"), before writing journalDirectory.
    mattered_because: >
      journalDirectory (packages/face/src/root.ts:22-28) resolves the
      command's output with node:path's `resolve(repoRoot, commonDir)`
      rather than a bare `join`, so both cases land on the same absolute
      path; a bare join would have produced a wrong nested path for the
      main-worktree case.
  - id: d3
    what: >
      `interlock graph show 0001-bootstrap`, run from this worktree after
      the journal-per-repository fix, reads the repository's own real
      journal for the first time (a two-line event@v1 journal a person
      wrote earlier with `interlock graph approve`, the same content as
      the fixture supplied to this session) and reports the graph STALE,
      not approved and not not-approved.
    found_at: >
      `mise exec -- pnpm interlock graph show 0001-bootstrap` from this
      worktree's own root, at head_sha.
    mattered_because: >
      Confirms the fix reaches the repository's real, previously-invisible
      approval. The STALE report is itself correct, not a defect: this
      very node (ledger-gaps) was added to the graph after that approval
      was recorded, which is exactly D20 and the bend log's own documented
      stale-on-edit rule. Re-approving is a human action
      (`interlock graph approve`) and stays out of this session's scope.
