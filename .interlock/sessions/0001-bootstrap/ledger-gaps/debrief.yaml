open:
  - >
    v1 reset upcast: a v1 `outcome-set{kind:"reset"}` event refuses to
    upcast (returns undefined) rather than inventing an authority or a
    because, since v1 never recorded either. This is a typed, per-body
    refusal using replay.ts's existing registered-tag-but-guard-fails
    path; no real v1 journal known to exist carries a reset outcome, so
    this is untested against real data, only against a hand-authored
    synthetic line (replay.test.ts:329-343).
  - >
    v1 debrief-filed upcast: refuses unconditionally, for every body,
    rather than a parallel V1Debrief type -- Debrief's four new required
    fields (graphBaseSha, sessionStartSha, derivation, gatesRunByAgent)
    have no v1 equivalent and no honest "unknown" arm the way duration
    does. No code anywhere converts a debrief.yaml file into a
    debrief-filed event yet, so this path is unreachable in practice
    today; recorded here in case that changes before debrief-schema lands.
  - >
    DebriefDerivation vs Derivation: Debrief's new `derivation` field is a
    genuinely different concept from ledger's existing per-receipt
    Derivation (gate/model/human) -- it names who ran the whole SESSION
    (agent{runtime,model} | human{who}), not who produced one receipt or
    mark. Sharing the word `derivation` for two different shapes is a
    real vocabulary tension, not a coinage or a silent widening; flagged
    here per I3 rather than resolved by renaming either one, since the
    brief's own instruction and the on-disk debrief.yaml both use
    `derivation` for this field.
  - >
    Graph 0001-bootstrap reports STALE, not approved, when read from this
    worktree via `interlock graph show` at head_sha (discovery d3). The
    repository's real journal is read correctly for the first time; the
    staleness itself is the graph file having grown a ledger-gaps node
    since the recorded approval, which is D20's own documented behaviour,
    not a defect. Re-approving is a human action
    (`interlock graph approve 0001-bootstrap --by ... --because ...`) and
    is out of this session's scope to perform.
  - >
    After the receipt-identity fix (c26-c29), `interlock graph show
    0001-bootstrap` still reports STALE at this round's head_sha
    (7855138cf5c8a3071085a9149566e6c2c149bf01), same as before the fix, and
    that is correct, not a regression: the receipt already recorded in the
    repository's real, shared journal was computed by `interlock graph
    approve` under the OLD (absolute-path) hashing, against the graph
    content before this session's own `ledger-gaps` node existed. The new
    relative-path hash naturally reads that old receipt as not matching
    today's content, for the same reason discovery d3 already gives (D20's
    stale-on-edit rule), now compounded by the hashing algorithm itself
    having changed underneath it. The real journal was left untouched by
    this fix round, as instructed; a person re-approves the current graph
    content with `interlock graph approve 0001-bootstrap --by <who>
    --because <why>` when ready, and the new receipt will carry the
    corrected, location-independent id.
