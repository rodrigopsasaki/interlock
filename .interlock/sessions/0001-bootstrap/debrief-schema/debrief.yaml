gates_run_by_agent:
  - { id: typecheck, result: pass, invocation: "mise exec -- pnpm typecheck" }
  - { id: test, result: pass, invocation: "mise exec -- pnpm test", note: "202 tests across ledger, face, debrief, runner, cli" }
  - { id: debrief-valid, result: pass, invocation: "mise exec -- pnpm interlock debrief validate 0001-bootstrap debrief-schema", note: "run for real against this session's own files at this round's head_sha; see d1 and d6" }
open:
  - >
    packages/ledger/src/projection.ts's withSession stays a no-op for a
    session id that never appeared in a session-started event (d5). A
    node judged through interlock backfill therefore writes real
    debrief-filed and note-appended events for a v2 debrief but shows no
    SessionView for them; a node judged through interlock run does, since
    it always appends session-started first. Fixing this is projection.ts's
    own decision -- either session-started becomes optional for
    withSession to adopt a session on first sight, or backfill starts
    appending its own session-started events -- and belongs to whichever
    node next touches the ledger's projection or the face's session views.
  - >
    This node depended on ledger, held (not cleared) on debrief-valid, as
    a recorded bootstrap exception the brief itself named. Once this
    node's own gates clear, the four nodes runner-command-gate's backfill
    left held purely on debrief-valid's fail-closed stub -- scaffold,
    ledger, ledger-gaps, face-read -- are eligible to re-backfill and
    clear for real; that re-run is not part of this node's acceptance and
    was not performed here.
  - >
    "drafted" exists on the type and the v2 reader (accepts and round-trips
    a drafted: {by, from} block) but nothing in this session produces one,
    per the brief. The post-hoc drafted-debrief command itself -- a model
    drafting one from the diff, on request only -- is still unbuilt.
  - >
    The corpus has no real example of a malformed SHA field (every
    base_sha/graph_base_sha/session_start_sha/head_sha across all five
    prior sessions is exactly 40 hex characters), so the "head_sha not a
    SHA" sentence the brief requires is proven only by a hand-authored
    fixture in packages/debrief/test/debrief.test.ts, not by a real
    session.
  - >
    verifier-hunks (the inverse check: every hunk has a decision) is out
    of scope for this node and was not run against this debrief. The
    manifest claim above -- every changed file named in some decision's
    hunks or produces -- is self-asserted against `git diff --name-only`,
    not machine-verified; that check is exactly what verifier-hunks is
    for.
