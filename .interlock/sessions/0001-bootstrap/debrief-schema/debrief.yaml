  - id: d1
    what: >
      scaffold, the very first hand-authored session, has no notes.yaml at
      all -- only brief.md and debrief.yaml.
    found_at: >
      .interlock/sessions/0001-bootstrap/scaffold/ (directory listing),
      confirmed by running this node's own validator against it before
      the leniency below existed.
    mattered_because: >
      the notes@v0 reader and the "graph/node" validate command both had
      to treat a missing notes.yaml as zero notes rather than a refusal,
      or scaffold -- one of the five directories the brief requires to
      validate -- could never pass.
  - id: d2
    what: >
      ledger-gaps and runner-command-gate's debrief@v1 files already carry
      a "because" on every decision, despite the v1 tag; ledger and
      face-read do not.
    found_at: >
      grepping "because:" inside the decisions: block of all four
      debrief@v1 fixtures -- ledger-gaps 35/35, runner-command-gate 46/46,
      ledger 0/28, face-read 0/19.
    mattered_because: >
      confirms legacy-valid has to be decided purely by the literal shape
      tag, never by field completeness, or the two content-complete files
      would wrongly read as ingestable v2 debriefs under a version they
      never declared.
  - id: d3
    what: >
      Eight notes.yaml entries across ledger-gaps and runner-command-gate
      write "rejected: >", a YAML folded block scalar whose body looks
      like a JSON array but parses to a single string.
    found_at: >
      ledger-gaps/notes.yaml entries 1, 3, 18 and runner-command-gate/notes.yaml
      entries 1, 2, 18, 19, 20 (1-based, counted by "- kind:" markers).
    mattered_because: >
      ledger's own isNote guard rejects all eight entries outright over
      that one optional field; the notes@v0 reader this node builds had
      to be more lenient there to keep the corpus valid, rather than
      inventing structure the file never had or failing an otherwise
      honest entry.
  - id: d4
    what: >
      runner-command-gate's seven discoveries all spell the field
      "matters_because" (present tense), not "mattered_because".
    found_at: "runner-command-gate/debrief.yaml, discoveries d1-d7."
    mattered_because: >
      a legacy reader that deep-checks every discovery field against the
      current Discovery type would fail this file for a spelling slip
      that mattered nothing when it was written; legacy validation stays
      shallow (id and what only) at the per-item level because of this.
  - id: d5
    what: >
      packages/ledger/src/projection.ts's withSession is a no-op when the
      session id it is given was never seen in a prior session-started
      event.
    found_at: >
      packages/ledger/src/projection.ts's withSession, found while writing
      the ingestion test in packages/runner/test/gateJudge.test.ts.
    mattered_because: >
      a node ingested through interlock backfill, which never appends
      session-started, writes real debrief-filed and note-appended events
