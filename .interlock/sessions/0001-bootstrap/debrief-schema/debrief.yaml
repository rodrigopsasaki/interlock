      judged after interlock run gets both the events and the live view.
      Recorded under open rather than changed, since projection.ts belongs
      to the ledger node, not this one.
  - id: d6
    what: >
      The debrief-valid validator, run for real against all six session
      directories -- the five prior ones and this session's own -- at
