interlock: notes@v0
node: runner-command-gate
entries:
  - kind: choice
    at: "2026-09-10T00:10:00Z"
    chose: >
      Derived a node's "graph base SHA" from the graph node's own `approved`
      gate receipt (`receipt.commitSha`), never from markdown in a brief.md
      file.
    because: >
      Nothing in graph@v0 carries a machine-readable base SHA per node --
      only prose in each session's hand-written brief does. D20's own rule
      (no session is briefed until the graph carries an approved receipt
      for its current content) already ties one commit to the whole
      approved plan: the receipt that gates leasing already names it.
      Reusing that receipt composes with existing typed machinery
      (approvalState, receiptId) instead of parsing prose.
    rejected: >
      ["regex-parsing 'graph base SHA:' out of brief.md (brittle, and the
      brief explicitly says brief authoring/format is not the runner's
      job)", "a new graph.yaml field (graph.yaml is off limits this
      session and the graph's own approval-receipt commit already answers
      the question)"]
  - kind: choice
    at: "2026-09-10T00:15:00Z"
    chose: >
      Wrote the sweeper's `abandoned` write as `outcome.cancelled(receipts,
      "sweeper", because)` rather than adding a seventh Outcome union arm,
      and recorded the missing kind under `open`.
    because: >
      The orchestrator's own instruction: add to the current event@v2 shape
      only when it is a new OPTIONAL FIELD; a new union arm or required
      field is a shape change to stop on and route around with the closest
      existing typed shape. `cancelled` already carries exactly the shape
      abandonment needs -- receipts, authority, because -- so it is the
      closest existing typed shape, not a stretch.
    rejected: >
      ["a seventh Outcome kind 'abandoned' (a real union-arm shape change,
      touching isOutcome's switch and every exhaustive Outcome.kind switch
      in face and this package; the brief's own routing rule says stop for
      this, not build it)"]
  - kind: surprise
    at: "2026-09-10T00:20:00Z"
    expected: >
      A node's "scope" for receipt content-addressing would be declared
      somewhere in graph.yaml or config.yaml.
    observed: >
      Neither file declares a per-node or per-gate scope; a gate command
      like `pnpm typecheck` genuinely runs over the whole workspace. Scoped
      every gate receipt to `git ls-files` at the content root (the
      worktree for `interlock run`, the ephemeral main checkout for
      backfill) -- the one honest, already-typed answer `receiptId`
      supports without inventing an out-of-band scope registry graph.yaml
      cannot carry this session (graph.yaml is off limits).
  - kind: choice
    at: "2026-09-10T00:30:00Z"
    chose: >
      Extended face's `GateDeclaration` with an optional `run?: string` and
      `NodeDeclaration` with an optional `acceptance?: string`, parsed from
      the fields graph.yaml already carries per node/gate but
      `loadGraphDocument` previously dropped.
    because: >
      The runner needs a gate's command and a node's acceptance text to
      build gate invocations and a ledger Brief; both fields are already
      present in every node's YAML (graph.yaml's own `run:` and
      `acceptance:` lines) and were simply unparsed. Extending face's
      parser composes with the one place graph.yaml is already read,
      rather than a second, duplicate YAML reader in this package. Both
      additions are optional fields on TypeScript types face itself owns,
      not the persisted ledger event shape, so this is unrelated to the
      event@v2 shape-change question above.
  - kind: choice
    at: "2026-09-10T00:45:00Z"
    chose: >
      `interlock backfill` checks out a SEPARATE, ephemeral git worktree at
      main's real SHA (`git rev-parse main`), installs there, gates there,
      then removes it -- rather than gating in place in this session's own
      worktree.
    because: >
      This worktree's HEAD is one commit ahead of main (the session-start
      brief commit) and, unlike main, carries `.interlock/sessions/.../
      runner-command-gate/` itself; git-ls-files-scoped receipts computed
      in place would content-address a tree main never had. A real,
      separate checkout at main's own resolved SHA is the only way to gate
      "the current main content" honestly, and reuses the same worktree
      primitive `interlock run` needs.
  - kind: surprise
    at: "2026-09-10T00:50:00Z"
    expected: >
      A fake Unix-domain socket for tests could live at any path under a
      gitignored temp directory.
    observed: >
      `server.listen()` on this absolute worktree path raised `EINVAL`: a
      Unix socket's `sun_path` is capped near 104 bytes on macOS, and this
      worktree's own absolute path alone is already most of that budget.
      Fixed by writing every test socket path relative to `process.cwd()`
      (vitest runs each package from its own directory), which is short
      regardless of how long this worktree's absolute path is.
  - kind: choice
    at: "2026-09-10T01:00:00Z"
    chose: >
      The herdr adapter mints its own agent name (`interlock-<uuid>`)
      rather than reading one back from `agent.start`'s result, and uses
      that name as the `target` for every later `agent.*` call.
    because: >
      herdr's own CLI usage text says agent targets accept "unique agent
      names ... that currently host agents" -- the caller-supplied `name`
      IS the identity, not a server-minted id `agent.start` hands back. It
      also sidesteps `agent_started`'s `agent: AgentInfo` shape, whose
      exact fields the schema does not bind per-method (flagged inferred
      by the scouting read), so the adapter reads back nothing it does not
      have to.
  - kind: choice
    at: "2026-09-10T01:05:00Z"
    chose: >
      The herdr adapter does not call `events.subscribe`; `waitUntil` is
      one blocking `agent.wait` round trip.
    because: >
      `agent.wait` already blocks on `until`/`timeout_ms` server-side,
      which is exactly what the runner's own wait step needs, and the
      schema's own mapping from a subscribed CRUD event type to a wire
      frame is flagged not directly attested (inferred, not schema-proven)
      in the scouting read. One fewer request/response pair to get wrong
      inside the one file that cannot be cross-checked against a live
      server this session.
  - kind: choice
    at: "2026-09-10T01:10:00Z"
    chose: >
      The tmux adapter's `waitUntil` always returns a `timeout` refusal,
      unconditionally, for every call.
    because: >
      D3 names this exactly: tmux is the escape hatch if herdr's seam
      closes, "with a loss of state detection, not a rewrite." tmux can
      host a pane and capture its screen; it has no notion of idle,
      blocked or done. Returning timeout honestly is the compiling,
      unwired fallback the acceptance asks for, not a fabricated status.
  - kind: choice
    at: "2026-09-10T01:20:00Z"
    chose: >
      `judgeGates` re-runs every declared gate whose current receipt's
      spend is `none` on every judgement, and only skips (keeps as-is) a
      gate whose spend is `metered` or `local`.
    because: >
      This is D8 and the brief's own words, literally: a receipt that cost
      nothing is re-earned by re-running; one that cost inference or money
      is kept and never re-spent. It also makes "cleared decided only by
      the runner's own run" true by construction -- nothing about WHO
      wrote a prior spend-none receipt matters, because it is never
      trusted as proof; it is always regenerated fresh, under this run's
      own derivation.
  - kind: choice
    at: "2026-09-10T01:25:00Z"
    chose: >
      Receipt idempotence is enforced by the runner, not the ledger:
      before appending `receipt-written`, `judgeGates` checks whether a
      receipt with the same `id` already sits in the node's `receipts`
      array, and skips the append (reusing the existing receipt object for
      the `gate-moved` that follows) when it does.
    because: >
      `applyEvent`'s `receipt-written` case appends unconditionally with
      no identity check -- confirmed by reading projection.ts -- so
      nothing upstream guarantees "same content, one fact." The
      `receipt-idempotent` gate's own wording asks for exactly this
      property, so it has to be built here.
  - kind: choice
    at: "2026-09-10T01:35:00Z"
    chose: >
      `cli/src/run.ts` wraps the whole post-ledger-open body in a single
      `try`/`finally` that closes the pane (if opened) and the ledger,
      instead of a manual `await ledger.close()` before each early return.
    because: >
      `graph/approve.ts`'s literal repeated-close style reads fine at
      three early returns; `interlock run` has roughly a dozen (approval,
      dependencies, worktree, four herdr calls, gate judging), and
      `try`/`finally` guarantees the close fires exactly once on every
      path without retyping it a dozen times. A deliberate, noted
      deviation from the exact prior shape, not a different rule.
  - kind: choice
    at: "2026-09-10T01:40:00Z"
    chose: >
      `.interlock/local.yaml`'s `worktree_root` defaults to `.worktrees`
      in both `local.example.yaml` and this machine's own `local.yaml`.
    because: >
      The scaffold node's own `.gitignore` already carries a `.worktrees/`
      entry with no file in this session's history ever having used it --
      a discovery that a future consumer was anticipated before this
      session existed. Matching it composes with that intent instead of
      picking a fresh, competing convention.
  - kind: choice
    at: "2026-09-10T01:45:00Z"
    chose: >
      A held outcome's `disposition` is always `"hold"` at this stage, and
      its `expiry` is `now + a fixed constant` (24h for backfill, the
      configured lease length for `interlock run`), never computed from a
      retry budget.
    because: >
      AGENTS.md's retry budget ("conserved... nothing inside a node mints
      its own retries") and repair/retry disposition logic are explicitly
      out of scope for this node's command-gate acceptance; `hold` is the
      one disposition that asks for nothing this session does not already
      have. The constants are a judgment call with no other source of
      truth in this graph or config format yet.
  - kind: surprise
    at: "2026-09-10T02:00:00Z"
    expected: >
      A fake herdr socket server's `close()` would resolve promptly once
      the test finished its assertions.
    observed: >
      `net.Server#close()` waits for every open connection to end first;
      the herdr adapter holds one long-lived client socket for a whole
      `Runtime`'s life and has no separate "disconnect" step (by design --
      `Runtime`'s own `close` step is `closePane`, an RPC call, not a
      transport teardown). Fixed by having the fake server track and
      `destroy()` its accepted sockets on `close()`, matching how a real
      server must already tolerate a client that never says goodbye.
  - kind: choice
    at: "2026-09-10T02:10:00Z"
    chose: >
      Injected the concrete `Runtime` as an optional parameter on
      `runInterlockRun`'s options, defaulting to `createHerdrRuntime()`
      when omitted, rather than hard-wiring the herdr factory call inside
      the function body with no seam.
    because: >
      Lets `interlock run`'s own refusal logic, lease/heartbeat sequencing
      and gate judging be exercised end to end in a CLI-level test with a
      stub `Runtime`, with no live or fake herdr socket in the loop at
      all. The production path (no `runtime` option passed) still wires
      herdr as the only implementation anywhere `run` is actually invoked.
