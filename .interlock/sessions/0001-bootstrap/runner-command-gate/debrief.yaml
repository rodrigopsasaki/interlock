decisions:
  - id: c1
    what: >
      Defined the `Runtime` interface (packages/runner/src/runtime.ts):
      openPane(cwd), startAgent(pane, kind, args), reportIdentity(agent,
      label, identity), waitUntil(agent, until, timeoutMs), read(agent),
      closePane(pane), each returning a `Result` with a typed
      `RuntimeRefusal` (no-socket | unknown-agent-kind | timeout |
      transport) and an `explainRuntimeRefusal` sentence-builder. Added
      packages/runner/src/validate.ts, the same minimal isRecord/isString/
      prop/stringAt guard set ledger and face each carry their own copy
      of, needed to read herdr's JSON responses without `as`.
    because: >
      "brief:What the runner is -- One adapter" names exactly these six
      operations as the interface's surface; a typed refusal per step
      instead of throwing keeps every caller's errors-as-sentences
      obligation possible without a try/catch at each call site.
    rests_on: ["brief:What the runner is", "brief:Constraints"]
    hunks:
      - "packages/runner/src/runtime.ts"
      - "packages/runner/src/validate.ts"
  - id: c2
    what: >
      Built the herdr adapter (packages/runner/src/herdr/adapter.ts): a
      newline-delimited JSON-RPC client over a raw Unix socket (id-keyed
      pending-request map, no framing library), implementing `Runtime` via
      workspace.create, agent.start, pane.report_agent,
      pane.report_agent_session, agent.wait, agent.read and pane.close.
      The agent's own herdr identity is a name this adapter mints itself
      (`interlock-<uuid>`), never a value read back from agent.start's
      result.
    because: notes:8, notes:9
    rests_on:
      [
        "brief:Read first item 6",
        "brief:What the runner is -- One adapter",
        "notes:8",
        "notes:9",
      ]
    hunks:
      - "packages/runner/src/herdr/adapter.ts"
