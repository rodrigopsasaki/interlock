discoveries:
  - id: d1
    what: >
      Nothing in graph@v0 carries a machine-readable "graph base SHA" per
      node -- only prose in each session's hand-written brief.md does.
    found_at: >
      reading packages/face/src/document.ts's GraphDocument/NodeDeclaration
      types in full and grepping .interlock/graphs/0001-bootstrap.yaml for
      a base-sha-shaped field; neither exists.
    matters_because: >
      interlock run needs this SHA to create the node's worktree, and
      cannot parse brief.md prose (brief authoring/format is explicitly
      not this node's job). The graph's own `approved` gate receipt
      already carries a commitSha for exactly the content the whole plan
      runs against (D20), so the runner reads it from there instead.
  - id: d2
    what: >
      graph.yaml already writes a `run:` command per gate and an
      `acceptance:` string per node (visible on every node in
      .interlock/graphs/0001-bootstrap.yaml), but face's GraphDocument
      parser (packages/face/src/document.ts) captured neither field.
    found_at: >
      comparing 0001-bootstrap.yaml's node entries against
      GateDeclaration/NodeDeclaration's fields and isGateDeclaration's
      validator before writing gateCommand.ts.
    matters_because: >
      The runner needs a gate's actual command and a node's acceptance
      text to build gate invocations and a ledger Brief; extending face's
      existing parser with two optional fields reads this data face
      already owns instead of a second YAML reader.
  - id: d3
    what: >
      This worktree's HEAD (the session-start brief commit) is exactly one
      commit ahead of `main`, and `git diff --stat` between `main` and
      `graph_base_sha` is empty -- the two are the same commit,
      1833f7950a28cf17ea02790cf7b13e70471ee323.
    found_at: >
      `git rev-parse main` and `git diff --stat 1833f79... main` run by
      hand in the main repository before writing backfill.ts.
    matters_because: >
      Confirms this session's own worktree cannot be gated in place as
      "main's current content" (it carries one extra committed file this
      session added), so backfill has to check out a separate, real
      worktree at main's own resolved SHA rather than reuse this one.
  - id: d4
    what: >
      A Unix-domain socket's `sun_path` is capped near 104 bytes on macOS;
      `net.Server#listen()` on an absolute path built from this worktree's
      own location raised EINVAL well before any test logic ran.
    found_at: >
      running the herdr adapter's fake-socket test for the first time; the
      raised error's own message names the exact failing absolute path.
    matters_because: >
      Every socket path a test builds has to be short and relative to
      `process.cwd()` rather than derived from this worktree's absolute
      location, or the fake server never binds at all, regardless of what
      it is supposed to test.
  - id: d5
    what: >
      `debrief-valid` (a standing gate on every node, per
      .interlock/config.yaml) is a stub that always exits 1 until
      debrief-schema lands, which means `buildCleared`
      (packages/ledger/src/outcome.ts) can never construct `cleared` for
      ANY node in this repository right now -- the honest outcome for
      every node is always `held`.
    found_at: >
      the real backfill's first run against the shared journal: only
      `scaffold` (the one node with no dependencies) was backfilled, and
      it landed at `held`, not `cleared`; ledger, ledger-gaps and
      face-read were silently skipped because their dependency's ledger
      outcome could never satisfy "cleared" either.
    matters_because: >
      This is a real, structural fact about the repository today, not a
      bug in this session's runner: no node -- backfilled or freshly run
      through `interlock run` -- can reach `cleared` until debrief-schema
      exists. It forced changing backfill's eligibility check (see
      decision c22) and is recorded under `open` below rather than worked
      around by forcing a receipt.
  - id: d6
    what: >
      Running `pnpm install` inside a fresh git worktree nested under this
      repository's own working tree (packages/runner/test/.runs/backfill-*
      and the real .worktrees/backfill-* the real backfill used) does not
      pick up this repository's own pnpm-workspace.yaml; pnpm treats the
      fixture/worktree as its own standalone project.
    found_at: >
      the backfill unit test and the real backfill run both completing
      without pnpm complaining about an unlisted workspace member.
    matters_because: >
      This is what makes it safe to build backfill's ephemeral checkout
      directly inside this worktree (as the wall rules require) rather
      than needing to escape it.
  - id: d7
    what: >
      `interlock graph show 0001-bootstrap`, run for real in this
