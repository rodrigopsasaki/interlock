open:
  - >
    No `abandoned` Outcome kind exists (event@v2's Outcome union has six
    arms: cleared | held | reset | failed | cancelled | superseded). The
    sweeper writes `outcome.cancelled(receipts, "sweeper", because)`
    instead, per this session's own routing instruction (a new union arm
    is a shape change to stop on, not build). Proposal for a future
    session: add `abandoned` as a seventh, additive Outcome union arm --
    `{kind:"abandoned", receipts, because}` (no `authority`, since the
    sweeper is not a person and Derivation has no system-actor kind
    either) -- bumping to event@v3 with an upcaster that reads a v2
    `cancelled` whose authority is literally "sweeper" back as
    `abandoned`, the same lossless-where-honest pattern ledger-gaps used
    for reset/held.
  - >
    Outcome has no typed `derivation: Derivation` field; "the sweeper as
    derivation" is in practice the free-text `authority: "sweeper"` string
    on the `cancelled` outcome it writes, not a typed Derivation value
    (Derivation's three kinds -- gate | model | human -- have no
    system-actor arm for "the sweeper" or "the runner" outside a gate
    receipt's own `runner: string` field). Worth deciding explicitly
    alongside the `abandoned` proposal above rather than assumed away.
  - >
    debrief-valid is a standing gate on every node and its stub always
    exits 1 until debrief-schema lands (discovery d5): no node in this
    repository, backfilled or freshly run through `interlock run`, can
    reach `cleared` right now. The real backfill run below (see the
    before/after `graph show` output) moved scaffold, ledger, ledger-gaps
    and face-read from ready/blocked to `held`, each with its own declared
    gates satisfied and real receipts in the shared journal -- but not to
    `cleared`, and the critical path still reads
    "scaffold -> ledger -> ledger-gaps -> runner-command-gate -> face ->
    self-run", not beginning at runner-command-gate as the acceptance's
    aspirational sentence describes. This is the honest, expected state
    until debrief-schema exists; forcing debrief-valid to pass for
    backfilled nodes was refused, per this session's own instruction never
    to force a receipt.
  - >
    The journal's one-writer-per-repository rule is enforced only by
    convention today, exactly as the brief says to state plainly: the
    runner (`judgeGates`) always re-runs every spend-none gate itself and
    never trusts a receipt already in the journal as proof, and it
    records which receipts it wrote in which run via each receipt's own
    `derivation.runner` id (`run-<sessionId>` for `interlock run`,
    `backfill-<uuid>` for backfill). Nothing on this one machine, for this
    one user, stops a second process from opening the same journal file
    concurrently and interleaving writes -- @phyxiusjs/journal's sink is a
    synchronous `appendFileSync` per event with no lock file or advisory
    lock of its own. This is unchanged from the ledger session's own
    debrief, which already recorded the same honest gap.
  - >
    Receipt scope for every gate this session's runner writes is
    `git ls-files` at the content root (the worktree for `interlock run`,
    the ephemeral main checkout for backfill) -- the whole repository's
    tracked files, not a narrower per-node or per-gate scope, since
    neither graph.yaml nor config.yaml declares one and this session
    cannot edit either file. This is correct (never a false pass) but
    coarse: an edit anywhere in the repository invalidates every node's
    receipts, not only the ones a gate's command actually reads. A future
    session could add a declared `scope:` list per gate to graph.yaml or
    config.yaml to narrow this.
  - >
    `interlock run`'s own end-to-end path (lease, worktree, herdr pane,
    gate judging) is proven against the fake herdr socket server
    (adapter.test.ts) and, separately, end to end at the CLI layer with an
    injected stub `Runtime` (run.test.ts) -- never against a live herdr
    process, since this session was told not to start or configure herdr
    and no socket was present throughout (confirmed by the live smoke
    test's own skip). The herdr adapter's few schema fields the
    distillation itself flagged as inferred rather than schema-proven
    (agent.wait's and the four "ok"-mutation methods' result shapes) are
    therefore unverified against a real server.
  - >
    Held's `disposition` is always `"hold"` and its `expiry` is a fixed
    constant (this session's configured lease length for `interlock run`,
    24 hours for backfill), never computed from a retry budget --
    AGENTS.md's conserved retry budget and the failure/disposition/because
    healing loop's retry-repair-cancel machinery are out of this node's
    acceptance and not built here.
  - >
    Fix round, blocking finding 1 (interlock run never wrote a node's
    brief into the worktree it creates, because the worktree is checked
    out at the graph's base SHA and a node's own brief is committed in a
    later, node-specific commit in the general case): fixed, not left
    open. `packages/runner/src/sessionBrief.ts` gained
    `writeBriefIntoWorktree`, called from `cli/src/run.ts` between
    `createNodeWorktree` and the first herdr call; `packages/cli/test/
    run.test.ts`'s happy-path test now commits the graph content and the
    node's brief as two separate commits, matching how briefs are
    actually authored in this repository, and asserts the brief's own
    bytes land inside the created worktree. The immutable node brief's own
    "What the runner is" section still says "copies nothing, the brief is
    already in the tree" -- the assumption this finding disproved -- and
    the wall rules forbid editing brief.md to correct it; the acceptance's
    own "writes the brief into the worktree" clause is the binding text
    this fix follows, and the contradiction is recorded here rather than
    silently resolved. This round did not re-run the real backfill
    (unaffected: `interlock backfill` never opens a herdr pane or reads a
    brief) or re-capture `interlock graph show`; the before/after output
    already on record above is unchanged by this fix.
