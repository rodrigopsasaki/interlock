interlock: notes@v0
node: verifier-hunks
entries:
  - kind: choice
    at: "2026-09-10T16:00:00Z"
    chose: >
      No ledger event kind carries a mark (event.ts's LedgerEvent union has no
      "mark-*" arm). Per the brief's own instruction, this is a shape question
      for `open`, not a coinage: this node builds the verifier library and the
      `interlock verify` CLI command only, and does not touch gateJudge.ts's
      ingestion path or event.ts. The exact proposal (a new event kind, or
      folding marks into debrief-filed) is recorded under this debrief's
      `open`, not built.
    because: >
      "brief:Ingestion" is explicit: "if event@v2 has none, adding one is a
      new union arm, a shape change you are not licensed to make; record the
      exact proposal under open and print marks without persisting them."
    rejected: >
      Adding a "mark-recorded" event arm myself, reasoning that it is
      additive (Compatibility's own rule: "a new field is optional... a rename
      is a new version" suggests new arms are cheap) -- rejected because the
      brief names this exact fork and answers it directly; the brief is
      binding.
  - kind: choice
    at: "2026-09-10T16:10:00Z"
    chose: >
      The inverse check (every changed file covered by a decision or marked
      unexplained) operates at whole-file granularity, using
      `git diff --name-only` semantics, not at the sub-file @@ hunk
      granularity `git diff -U0` exposes.
    because: >
      "What the verifier is" states the inverse check as "For every file
      changed in the range: covered by some decision's hunks or produces, or
      marked unexplained" -- file, not hunk. The acceptance's own sentence
      ("every hunk has a decision... unexplained") is the informal restating
      of the same rule one paragraph later in the design note, not a second,
      stricter check; the "What the verifier is" section is this node's own
      brief and is the more specific of the two.
  - kind: choice
    at: "2026-09-10T16:15:00Z"
    chose: >
      A decision's cited hunk ("path" or "path:start-end") is `rooted` when
      the path is a file changed in the range AND, if a line range is given,
      that range *overlaps* at least one added hunk's new-file line range for
      that path -- not when it matches a hunk exactly.
    because: >
      Proven against debrief-schema's own debrief.yaml, my first real
      fixture: decision c9 cites "packages/ledger/src/debrief.ts:116-137" as
      one citation, but the real diff at that range (session_start_sha
      0a02b4d0..head_sha 910f8a19, checked with `git diff -U0`) has two
      separate hunks in that span -- `+121` (a single line) and `+136,2`.
      An exact-match rule would call this citation unrooted, and citation
      c9:20-31 against the real hunk `+26,6` (26-31) would too -- both are
      genuine, honest citations of real changes, rounded generously. A
      verifier that marks the very first real v2 debrief mostly unrooted on
      its first run has a threshold set wrong, and "err toward gap" (the
      brief's own words for the vocabulary check) reads as the general
      posture: a mark is telemetry, not a verdict, so the rooted check should
      confirm genuine overlap, not demand line-for-line precision no agent
      is asked to produce.
  - kind: choice
    at: "2026-09-10T16:25:00Z"
    chose: >
      A discovery's `found_at` is classified in this order: (1) command form,
      if the trimmed text (or a line within it) starts with "$ "; (2) path
      form, if a path-shaped token extracted from the free text resolves to a
      real path at head_sha, tried first as repo-root-relative, then as
      relative to `.interlock/sessions/<graph>/` (sibling-session shorthand);
      when a quoted substring is also present, its content must appear in the
      resolved file, or the mark is `unrooted` instead of `rooted`; (3) quoted
      out-of-band citation, if no path resolved but a quoted substring is
      present anywhere in the text; (4) otherwise `unrooted`, naming what
      none of the three forms matched.
    because: >
      "Read first" item 6 names the four forms literally: "found_at as a
      path, a path with lines, a command, or a quoted out-of-band citation".
      debrief-schema's own six discoveries (the only real v2 fixture besides
      this session's own) are free prose, not clean single-form strings --
      d1 embeds a directory path mid-sentence, d2 has no path at all but
      quotes a grep term, d3 embeds two paths that are valid only relative to
      the sessions directory, d4-d5 embed clean repo-root paths mid-sentence,
      d6 is a `$`-prefixed shell transcript. A classifier has to extract
      candidates from prose, not expect a bare citation, or it marks the
      exemplar debrief mostly unrooted on the corpus it was written to
      demonstrate.
    rejected: >
      Requiring found_at to be *exactly* one of the four forms (no prose)
      -- rejected because every real found_at in the corpus is prose; that
      rule would make every real discovery unrooted and only a
      hand-crafted fixture rooted, which contradicts the "measured on real
      sessions" promise in D6.
  - kind: choice
    at: "2026-09-10T16:35:00Z"
    chose: >
      Harness vocabulary for the gap check is read from AGENTS.md's own
      "## Vocabulary" markdown table at read time (the `term` column, parsed
      as a real table, not hardcoded as a duplicate list in code), then
      matched against extracted words as PascalCase, camelCase and the raw
      term, case-insensitively. "Plain programming English" is a small fixed
      list this node defines and ships in `src/vocabulary.ts`, covering
      TS/JS reserved words, primitive and standard utility types, and common
      single-letter generic parameters. The professed domain vocabulary is
      read as an empty list: `.interlock/config.yaml` (the only place a team
      could profess one) has no such field today, and this node may not add
      one (config.yaml is out of scope).
    because: >
      Hardcoding a second copy of AGENTS.md's vocabulary table would drift
      the moment AGENTS.md's table does, and AGENTS.md is the copy that
      binds (AGENTS.md's own first paragraph). Reading it directly keeps the
      verifier's harness vocabulary honestly derived rather than invented.
      "Plain programming English is a fixed list you define and record" is
      the brief's own instruction to hardcode that half.
  - kind: surprise
    at: "2026-09-10T16:40:00Z"
    expected: >
      That "professed domain vocabulary" would have some existing config
      shape to read from, since the brief's Acceptance names it as one of
      "the two vocabularies".
    observed: >
      `.interlock/config.yaml` (config@v0) has only `standing_gates` and
      `substrate`; no field for a professed domain vocabulary exists
      anywhere in the repo. This node treats it as an always-empty list and
      records the gap under `open`: a team that wants domain terms
      recognized (rather than gapped) needs a config field this node is not
      licensed to add.
  - kind: surprise
    at: "2026-09-10T16:45:00Z"
    expected: >
      `pnpm test` to pass clean before touching anything, as a floor to gate
      new work against.
    observed: >
      packages/debrief/test/brief.test.ts's own "every existing brief under
      .interlock/sessions" suite fails on "0001-bootstrap/verifier-hunks
      validates as brief@v0" the moment this worktree exists, because that
      table asserts every session directory's brief.md is still the
      scaffolded legacy placeholder -- true for every prior node, but this
      brief's own front matter says the runner rewrote brief.md into a real
      brief@v1 in this worktree before the session started (this is the
      first node `interlock run` itself has leased). The floor failure is
      the corpus catching up to its own newest fact, not a break this
      session caused.
  - kind: choice
    at: "2026-09-10T16:47:00Z"
    chose: >
      Pulled "verifier-hunks" out of brief.test.ts's shared legacy table and
      gave it its own test asserting brief@v1, naming the runner rewrite as
      the reason in a comment.
    because: >
      packages/debrief/test/brief.test.ts is in this brief's own scope
      list, and the test's premise (every session's brief.md is untouched
      since scaffolding) is now false for exactly one entry, for a reason
      this node's own brief documents. Correcting the one stale assertion,
      rather than reverting the runner's real rewrite or leaving the floor
      red, is the fix at the cause.
    rejected: >
      Leaving the test red and noting it under `open` -- rejected because
      the fix is a one-line scope move with a clear, checkable reason, not
      an open design question, and "gate every change against that
      baseline" means a red floor gets fixed, not carried.
