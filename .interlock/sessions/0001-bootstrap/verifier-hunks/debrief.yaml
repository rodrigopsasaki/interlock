gates_run_by_agent:
  - { id: typecheck, result: pass, invocation: "mise exec -- pnpm typecheck" }
  - { id: test, result: pass, invocation: "mise exec -- pnpm test", note: "378 tests across ledger, debrief, face, verifier, runner, cli" }
  - { id: debrief-valid, result: pass, invocation: "mise exec -- pnpm interlock debrief validate 0001-bootstrap verifier-hunks" }
  - { id: inverse-check, result: pass, invocation: "mise exec -- pnpm --filter verifier --fail-if-no-match test --testNamePattern unexplained", note: "7 tests passed, matching expect_output" }
open:
  - >
    No LedgerEvent arm exists for a mark (d1). The exact proposal: either a
    new "mark-recorded" event kind ({ kind: "mark-recorded", session:
    string, mark: Mark }), appended by gateJudge.ts's ingestion path
    alongside debrief-filed and note-appended for a cleared v2 session; or
    marks are never persisted at all and stay a pure read-side computation
    interlock verify performs on demand against the ledger's own
    debrief-filed event. Deciding between those two is gateJudge.ts's and
    event.ts's own call, not this node's -- this node prints marks without
    persisting them, per the brief's own instruction.
  - >
    Professed domain vocabulary (d2) has nowhere to live: config@v0 has no
    field for it. verifyDebrief's professedDomainVocabulary option is real
    and tested but always called empty by the CLI today. A team that wants
    its own domain terms recognized, rather than gapped, needs a
    "vocabulary:" field added to .interlock/config.yaml -- a config-shape
    decision for whichever node next owns that file.
  - >
    This session found and fixed one environment-dependent diffFiles bug
    (d6, --no-renames for diff.renames). Other git config knobs that can
    change `git diff`'s own output shape (diff.algorithm, whitespace
    handling, core.autocrlf) were not separately audited, since none
    surfaced against the real corpus this session ran against; worth a
    follow-up sweep of diffFiles' own git invocation if a future session
    hits another machine-dependent mark.
