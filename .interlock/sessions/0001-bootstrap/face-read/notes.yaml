interlock: notes@v0
node: face-read
entries:
  - kind: surprise
    at: "2026-09-09T21:15:00Z"
    expected: >
      packages/cli's src/bin.ts would be able to import from packages/ledger the same way it
      already imports its own sibling files (via explicit .ts specifiers), once ledger is added
      as a workspace dependency.
    observed: >
      A probe (node run.ts importing ./lib.js with only lib.ts on disk) reproduced scaffold's own
      d1 finding: raw Node's ESM loader does not remap a .js specifier to a sibling .ts file. A
      second probe proved the fix: a package.json "main" pointing directly at "./src/index.ts",
      with every internal relative import in that package also using an explicit .ts specifier,
      resolves correctly under raw Node (confirmed with a two-package pnpm-style symlink probe
      before touching any real file). ledger's own src/*.ts files all import each other via .js
      specifiers, which is exactly the case scaffold's d1 already named as broken for direct Node
      execution; this had never mattered before because nothing outside packages/ledger had ever
      imported it at runtime.
  - kind: choice
    at: "2026-09-09T21:25:00Z"
    chose: >
      Converted every internal relative import in packages/ledger/src from a ".js" specifier to
      an explicit ".ts" one (20 files, one line each), added allowImportingTsExtensions to
      ledger's tsconfig.json, and pointed ledger's package.json "main"/"types" at
      "./src/index.ts". Did the same for the new face package from the start.
    because: >
      This is the same convention packages/cli already uses for its own internal imports
      (scaffold's decision c5), generalized to every workspace package a raw-Node-executed CLI
      command now actually has to load. It requires no build step, matching this repository's
      existing zero-build posture for packages that have no external consumer, rather than adding
      a tsc/tsup build + dist output whose only purpose would be satisfying Node's resolver.
    rejected:
      - "giving ledger and face a real build step (tsc emit to dist/, package.json main pointing at dist/index.js), matching how the published @phyxiusjs/* packages ship -- rejected because those packages have external npm consumers and this repository's own packages do not; a build step that must run before every `pnpm interlock ...` invocation is exactly the ceremony scaffold's own c5 already declined to pay for cli itself, and there is no reason ledger/face should pay it first."
      - "leaving ledger's .js specifiers alone and only rewriting cli's new command files to reach into ledger's individual source files by relative path, bypassing package resolution entirely -- rejected because it would mean two different ways of consuming the same package (bare specifier for anything that only needs types, relative reach-through for anything the CLI actually runs), and because it does not fix the same problem inside ledger's own module graph (index.ts's re-exports still walk every .js-specified file transitively)."
  - kind: surprise
    at: "2026-09-09T21:30:00Z"
    expected: >
      Converting ledger's internal imports to .ts specifiers might require touching
      packages/ledger/test/*.ts too, since those files import the same modules via ".js"
      specifiers.
    observed: >
      They did not need to change. TypeScript's NodeNext module resolution treats a ".js"
      specifier with only a sibling ".ts" file on disk as valid by design (the "write .ts, import
      .js, a future build fills the gap" convention) independent of allowImportingTsExtensions,
      which only governs whether an explicit ".ts" specifier is itself legal to write. vitest's
      own esbuild-based resolution never cared about the distinction either way. `pnpm --filter
      ledger typecheck` and `pnpm --filter ledger test` both passed clean immediately after only
      touching src/*.ts, tsconfig.json and package.json.
  - kind: choice
    at: "2026-09-09T21:40:00Z"
    chose: >
      Pinned the new "yaml" dependency to an exact "2.9.0" (published 2026-05-11, about four
      months before this session) in packages/face/package.json, rather than a floating "^2.9.0".
    because: >
      Matches scaffold's own c3 precedent for @types/node: pnpm's minimumReleaseAge policy rejects
      a same-day-published version outright, and an exact, already-aged pin keeps a fresh install
      deterministic regardless of the day it runs. Checked the real published version list and
      publish timestamps via `npm view yaml versions/time` before choosing it, rather than assuming
      a version number was safe.
  - kind: choice
    at: "2026-09-09T21:45:00Z"
    chose: >
      Wrote packages/face/src/validate.ts as a near-verbatim copy of ledger's own
      validate.ts (isRecord/isString/isStringArray/prop), rather than importing it from ledger.
    because: >
      ledger's index.ts does not export these guards; they are private to that package. The brief
      asks explicitly for "the same hand-written guards style the ledger uses," not a shared
      dependency on ledger's internals, and duplicating four small structural predicates costs far
      less than adding a cross-package internal API for something this small.
  - kind: choice
    at: "2026-09-09T21:50:00Z"
    chose: >
      Named the graph file's own raw shapes GraphDocument/NodeDeclaration/GateDeclaration rather
      than reusing ledger's Node/Gate names.
    because: >
      ledger's Node is {graph, id} with no dependency edges (decision c11: "that topology belongs
      to the interpreter") and Gate is a five-state runtime union -- neither shape matches what a
      graph@v0 file's own "nodes[]"/"gates[]" entries actually carry (dependency edges, a command
      string, no runtime state at all). Reusing the same names for a different shape would read as
      the same concept when it is not, and both types are in scope together in position.ts
      (imported from ledger) and document.ts (declared locally), so a name collision would need an
      import alias regardless. "Document" is the brief's own word for this
      ("a function from (graph document, projection, ...)"); "Declaration" is plain programming
      English for one entry in it, not a harness noun -- flagged under `open` per I3, matching how
      the ledger session flagged "disposition" for the same reason.
  - kind: choice
    at: "2026-09-09T22:10:00Z"
    chose: >
      topologicalOrder returns Result<readonly NodeDeclaration[], CycleRefusal>, a Kahn's-algorithm
      order over the already-validated node list, with the cycle refusal naming only the nodes
      actually still stuck (not every node in the graph).
    because: >
      A graph this size (single digits of nodes today, dozens at most before it stops being "a
      position you glance at") has no need for a shortest-cycle-finding algorithm; reporting every
      node Kahn's algorithm could not place is an honest, exact answer to "what is stuck," not an
      approximation, and is what the loader's sentence error and criticalPath's own DP both need
      as their one shared source of order.
  - kind: choice
    at: "2026-09-09T22:20:00Z"
    chose: >
      criticalPath takes an already-topologically-sorted node list (not a document) and computes
      the longest chain by node count via one forward dynamic-programming pass, breaking ties by
      keeping the first-encountered maximum.
    because: >
      Reusing topologicalOrder's own output, rather than re-deriving order inside criticalPath,
      is the one-validator-one-source-of-truth principle applied to topology as well as to shape
      validation; a forward DP pass over a topological order is the standard unweighted-longest-
      path construction and needs no separate cycle check of its own, since its input is already
      guaranteed acyclic by the caller.
    rejected:
      - "computing critical path directly from GraphDocument and re-deriving topological order inside criticalPath itself -- rejected because it would duplicate topologicalOrder's own traversal for no benefit, and because computePosition already needs the ordered list for node position too."
  - kind: surprise
    at: "2026-09-09T22:35:00Z"
    expected: >
      The bootstrap graph's own critical path would run through verifier-hunks, since it is the
      node with the most dependencies (debrief-schema and runner-command-gate both).
    observed: >
      Hand-computing the DP by the algorithm's own tie-break rule (first-encountered max, scanning
      each node's depends_on in the order the graph file lists them) gives scaffold -> ledger ->
      runner-command-gate -> face -> self-run, five nodes -- the same length as the
      verifier-hunks-through path, but face's branch is reached first because runner-command-gate
      is listed before debrief-schema in the nodes each downstream node depends on. Running the
      real CLI against the actual graph file confirmed this exact path before any test asserted it,
      so the test in criticalPath.test.ts encodes the verified real answer, not a guess.
  - kind: choice
    at: "2026-09-09T22:45:00Z"
    chose: >
      computePosition takes (document, projection, contentHash) and is fully synchronous; every
      I/O (reading the graph file, computing the content hash via ledger's own receiptId, reading
      the journal via readReplay) happens in the CLI command before calling it.
    because: >
      This is the exact signature the brief specifies ("a function from (graph document,
      projection, current graph content hash) to a position value"), and keeping every read
      outside it is what makes it testable with plain fold()-built projections and literal graph
      document objects, with no file system or ledger instance needed anywhere in position.test.ts.
  - kind: choice
    at: "2026-09-09T22:50:00Z"
    chose: >
      approvalState treats a waived "approved" gate the same as a satisfied one (compares its
      receipt id to the current content hash either way); every other gate kind (pending, blocked,
      superseded, or no gate at all) is not-approved.
    because: >
      D20 and the graph's own gates: block only ever name a human gate; buildCleared elsewhere in
      ledger already treats satisfied and waived as the two receipt-bearing gate kinds
      uniformly for the same reason. approve itself only ever produces satisfied, never waived --
      nothing in this node ever constructs a waived approval -- but approvalState should still
      answer correctly if a person waives the gate by hand later, since that is what the type
      already allows.
  - kind: choice
    at: "2026-09-09T23:00:00Z"
    chose: >
      renderPosition is a separate pure function from computePosition, taking only a Position
      value, with its own file (render.ts). Every correctness assertion in position.test.ts reads
      the Position value directly; render.test.ts only smoke-tests that the text function is pure
      and does not silently drop a node or the critical path.
    because: >
      The brief is explicit that tests hit the value, not the text; keeping computePosition free
      of any string formatting is what makes that possible, and a plain text renderer is the
      cheapest thing that satisfies "show reports approved, stale... or not approved" without
      inventing a second display layer this node was never asked to build (no pane, no columns).
  - kind: choice
    at: "2026-09-09T23:10:00Z"
    chose: >
      Wrote findRepoRoot/graphFilePath/journalDirectory/currentCommitSha in packages/face/src/root.ts,
      after grepping packages/ledger/src and packages/cli/src for any existing repo-root utility
      and finding none.
    because: >
      D14 puts "reads fresh, owns nothing" loaders in packages/face, and both CLI commands need
      the identical repo-root resolution (a graph id alone is not a path); one shared
      implementation is the "one validator, two callers" principle applied to path resolution,
      not just shape validation.
  - kind: surprise
    at: "2026-09-09T23:20:00Z"
    expected: >
      A CLI-level test could exercise findRepoRoot's "no .interlock directory found" refusal by
      pointing a fixture's cwd at a fresh temp directory under packages/cli/test/.runs/.
    observed: >
      Every writable location under this worktree's own constraint ("do not create files outside
      this worktree") is, by construction, nested somewhere under this repository's own root --
      which does carry a real .interlock/. findRepoRoot correctly walked up past the empty fixture
      directory and found the real .interlock/, so the test asserted the wrong thing (it found the
      worktree's actual graphs directory instead of failing). Removed that one test rather than
      constructing a fixture outside the worktree to make it pass; the "not found" branch stays
      defensive code without a dedicated regression test, which is honest given the constraint,
      not an oversight -- recorded under `open`.
  - kind: choice
    at: "2026-09-09T23:35:00Z"
    chose: >
      graph approve requires both --by and --because, refusing with a sentence naming whichever
      is missing, before touching the file system or opening a ledger at all.
    because: >
      derivation.human(who) has no honest empty-string default -- "approved by nobody" is not a
      fact the harness should be willing to record -- and the brief's own acceptance line always
      shows both flags together ("--by <who> --because <why>"). Only --because is named as a
      required-refusal test in the brief's own checklist, so --by's refusal is additional coverage
      this node chose to add, not a named requirement; recorded here rather than left silent.
  - kind: choice
    at: "2026-09-09T23:45:00Z"
    chose: >
      graph approve appends node-created only when the pseudo graph-node is absent from the
      current projection (checked via ledger.projection() right after createLedger opens); every
      approval, first or repeat, appends exactly one gate-moved.
    because: >
      applyEvent's own node-created case is a no-op on a node that already has a view (withNode
      just returns the existing view unchanged), so skipping the redundant append changes nothing
      about the resulting projection -- it only keeps the journal itself free of a repeated event
      with no information in it. A test (`does not re-append node-created on a second approval`)
      proves this: two approvals of the same fixture graph produce exactly
      ["node-created", "gate-moved", "gate-moved"], not three "node-created" events.
    rejected:
      - "appending node-created unconditionally on every approve call -- rejected as journal noise with no projection effect, once the no-op was confirmed by reading applyEvent's own withNode helper rather than assumed."
  - kind: choice
    at: "2026-09-09T23:50:00Z"
    chose: >
      approve reads the current commit SHA via `git rev-parse HEAD` (packages/face/src/root.ts's
      currentCommitSha, shelled through node:child_process) at the moment of approval, for the
      receipt's commitSha field.
    because: >
      receipt.ts's own docstring-level contract says commitSha is required and is history, not
      identity (identity is the content hash receiptId already computes from the scope files).
      The real, current HEAD of the repository the approval happens in is the only honest value
      to put there; a placeholder or empty string would be a fabricated fact recorded into a
      journal that other tools may read later.
  - kind: surprise
    at: "2026-09-10T00:00:00Z"
    expected: >
      approve's fixture tests would need to be run inside a real git repository for
      currentCommitSha to succeed, since `git rev-parse HEAD` fails outside one.
    observed: >
      packages/cli/test/.runs/run-* fixtures are themselves nested inside this real git worktree
      (gitignored, but still on disk under it), so `git rev-parse HEAD` run with that directory as
      cwd resolves the enclosing repository's real HEAD without any special test setup -- the same
      fact that made the repo-root "not found" test impossible to construct (the prior surprise)
      made this one free.
  - kind: choice
    at: "2026-09-10T00:10:00Z"
    chose: >
      show and approve both surface a journal ReplayRefusal as
      "<journal path>: line <n> has shape tag \"<tag>\", which this build does not recognize.",
      reusing the exact {tag, line} fields readReplay's own Result already carries rather than
      re-deriving anything.
    because: >
      "the line where possible" is literally possible here, unlike the graph file's own shape-tag
      error (a parsed YAML value has no line-number mapping back to source without a dedicated YAML
      source-map, which this loader does not build); readReplay already computed the exact line,
      so using it is the cheapest honest answer, not an omission.
  - kind: choice
    at: "2026-09-10T00:15:00Z"
    chose: >
      bin.ts now routes a zero exit code's message to stdout and a non-zero one to stderr, instead
      of always writing to stderr.
    because: >
      Every command before this node always failed (debrief validate is a permanent stub, an
      unknown command is always wrong), so "always stderr" was never actually tested against a
      real success message. graph show's whole reason to exist is a person reading its output; a
      real position belongs on stdout the way any other read command's output does, and an error
      belongs on stderr so it does not get piped or redirected as if it were data.
  - kind: choice
    at: "2026-09-10T00:20:00Z"
    chose: >
      main.ts's run() is now `async`, returning Promise<CommandResult> uniformly for every branch,
      including the pre-existing debrief-validate and unknown-command ones; main.test.ts's two
      existing tests now `await run(...)`.
    because: >
      createLedger, readReplay and createReceipt are all Promise-returning; a single dispatch
      function with one signature is simpler than a sync/async split by command, and the brief's
      own builder note names updating the existing test as an accepted consequence of whichever
      signature change was chosen, not a constraint against changing it.
  - kind: choice
    at: "2026-09-10T00:25:00Z"
    chose: >
      Left loadGraphDocument's file-read error handling to rethrow any non-ENOENT error (mirroring
      readReplay's own identical pattern in packages/ledger/src/replay.ts), and left
      currentCommitSha free to throw if `git rev-parse HEAD` fails outside a git repository.
    because: >
      Neither case is one of the five named sentence-error scenarios (missing file, unknown
      dependency, cycle, malformed shape tag, ReplayRefusal); ledger's own precedent already
      treats an unexpected file-system failure as exceptional infrastructure trouble rather than a
      sentence-worthy input problem, and this repository's own worktree is always a git repository
      in every path this node's acceptance describes. Recorded under `open` rather than engineered
      around for an untested exotic failure mode outside the acceptance.
  - kind: choice
    at: "2026-09-10T00:32:00Z"
    chose: >
      Added .interlock/ledger/ to .gitignore, alongside packages/face/test/.runs/ and
      packages/cli/test/.runs/ matching ledger's own test/.runs/ entry.
    because: >
      The journal is per-machine state, not a committed artifact, for now -- this is the one
      decision in the brief that should be revisited when the runner exists, since a shared
      journal across machines is exactly what a real runner would need to change.
