discoveries:
  - id: d1
    what: >
      Raw Node's ESM loader does not remap a ".js" import specifier to a sibling ".ts" file across
      a package boundary either -- the same gap scaffold's own d1 named for a single file, one
      level up, at the point where one workspace package imports another. packages/ledger/src's
      own internal imports all use ".js" specifiers pointing at ".ts" files, which vitest and
      tsc's own NodeNext resolution both tolerate, but which raw Node (the interpreter
      packages/cli's bin.ts actually runs under, with no build step) does not. Nothing before
      face-read had ever imported ledger at runtime, so this had never mattered.
    found_at: >
      two probes run by hand before touching any real file: `node run.ts` importing `./lib.js`
      (only lib.ts on disk) failed with ERR_MODULE_NOT_FOUND, matching scaffold's own d1 exactly;
      a second probe (two directories, a manual node_modules symlink, one package.json "main"
      pointing at "./src/index.ts") proved that a bare package specifier resolves correctly under
      raw Node when the target package's own internal imports also use explicit ".ts" specifiers.
    mattered_because: >
      This is the one discovery this session's whole cross-package architecture rests on: without
      it, `pnpm interlock graph show/approve` would fail at the first `import ... from "ledger"`
      the moment bin.ts actually ran, no matter how correct face's or cli's own code was, and the
      fix (converting ledger's own internal imports) touches 20 files that are otherwise
      untouched by this node's own acceptance.
  - id: d2
    what: >
      TypeScript's NodeNext module resolution treats a ".js" specifier with only a sibling ".ts"
      file on disk as legal by design (the "author in .ts, a future build fills in .js"
      convention), independent of the allowImportingTsExtensions flag -- that flag only governs
      whether an explicit ".ts" specifier is itself legal to write, not whether a ".js" one
      resolves to a ".ts" file.
    found_at: >
      `pnpm --filter ledger typecheck` and `pnpm --filter ledger test` both passed clean
      immediately after converting only packages/ledger/src's own imports (not
      packages/ledger/test's, which still use ".js" specifiers) -- no compiler or test-runner
      error appeared naming the untouched test files.
    mattered_because: >
      Confirmed that fixing d1 required touching only ledger's src/ (20 files), not its test/
      (12 files) too -- a materially smaller, more mechanical diff than converting the whole
      package would have been.
  - id: d3
    what: >
      The bootstrap graph's own unweighted critical path runs scaffold -> ledger ->
      runner-command-gate -> face -> self-run (five nodes), not through verifier-hunks, even
      though verifier-hunks depends on two nodes (debrief-schema and runner-command-gate) where
      face only depends on one path through runner-command-gate. Both chains tie at length five;
      face's branch wins because runner-command-gate is listed before debrief-schema in every
      node that depends on both, and the tie-break keeps the first-encountered maximum.
    found_at: >
      hand-computed against the real .interlock/graphs/0001-bootstrap.yaml before writing
      criticalPath.test.ts's own assertion, then confirmed by running the real CLI
      (`mise exec -- pnpm interlock graph show 0001-bootstrap`) against the actual repository and
      reading its "critical path:" line.
    mattered_because: >
      criticalPath.test.ts's "matches the bootstrap graph's own five-node chain" case encodes this
      verified real answer, not an assumption about which branch should win a tie.
  - id: d4
    what: >
      Every writable location under this worktree, by construction, is nested somewhere under the
      worktree's own root -- which does carry a real .interlock/. A test fixture built under
      packages/cli/test/.runs/ therefore can never exercise findRepoRoot's "no .interlock
      directory found in this directory or any parent" branch: the walk always finds the real one
      partway up, before reaching any filesystem boundary.
    found_at: >
      a failing assertion in an early draft of graph/show.test.ts: a fixture cwd with no
      .interlock/ of its own still resolved the worktree's real graphs directory instead of
      refusing, because findRepoRoot correctly kept walking up past it.
    mattered_because: >
      Removed that one test rather than construct a fixture outside the worktree (which the
      brief's own constraints forbid) to make a false refusal pass; findRepoRoot's "not found"
      branch stays real, reachable code with no dedicated regression test, which is an honest gap
      given the constraint, not an oversight -- recorded under `open`.
  - id: d5
    what: >
      `git rev-parse HEAD` run with its cwd set to a gitignored temp fixture nested inside this
      worktree resolves the enclosing repository's real current HEAD, since git's own discovery
      walks up past a directory with no .git of its own to find the one that does.
    found_at: >
      packages/cli/test/graph/approve.test.ts's fixtures (under packages/cli/test/.runs/), which
      are plain directories with no git repository of their own, yet every approve call against
      them succeeds and records a real, valid commit SHA.
    mattered_because: >
      No dependency injection or fixture git-init was needed to make approve's commitSha field
      honest in tests; the same fact that produced d4's gap (fixtures are always nested inside a
      real repository) made this one free instead of costly.
  - id: d6
    what: >
      The "yaml" npm package's most recent stable release before this session, 2.9.0, was
      published 2026-05-11 -- about four months before this session's own date -- well outside
