  - { id: typecheck, result: pass, invocation: "mise exec -- pnpm typecheck" }
  - { id: test, result: pass, invocation: "mise exec -- pnpm test" }
  - { id: debrief-valid, result: fail, invocation: "mise exec -- pnpm interlock debrief validate", note: "fails closed by design until the debrief-schema node lands" }
  - { id: stale-approval, result: pass, invocation: "mise exec -- pnpm --filter face test --testNamePattern stale-approval" }
open:
  - >
    Graph-as-node obstacle 1 (carried from the brief, confirmed, routed around, not fixed):
    node-created carries no gates payload (event.ts), so the graph's own declared gates can never
    be persisted on that event. Every call that needs them (proposeGateMove inside approve,
    computePosition's approval read) re-reads document.gates from the graph file itself, never
    from the projection -- exactly D14's "two sources of truth" framing, not a workaround for a
    gap.
  - >
    Graph-as-node obstacle 2 (carried from the brief, confirmed, routed around, not fixed):
    nothing at the type level stops a real node inside a graph from sharing an id with the graph
    itself, which would collide in the same nodes map (nodeKey is "<graph>::<id>", and the
    pseudo-node's key is "<graphId>::<graphId>"). Not a blocker: the bootstrap graph's own eight
    node ids never equal "0001-bootstrap". Worth a type-level fix (e.g. a branded or reserved id)
    if a future graph ever names a node after itself.
  - >
    "approval"/ApprovalState is used as a noun throughout packages/face (a Position's `approval`
    field, the approvalState function) on the strength of D20's own repeated use ("the approval is
    a mandate over the whole graph," "the approval is agnostic of what produced the plan"), but it
    is not a row in AGENTS.md's closed vocabulary table -- the same treatment, and the same gap,
    the ledger session already recorded for "disposition."
  - >
    "Document" and "Declaration" (GraphDocument, NodeDeclaration, GateDeclaration) are plain
    programming English, not AGENTS.md vocabulary or design-note nouns, used because ledger's own
    Node and Gate already name a different, narrower shape (no dependency edges, no command
    string) that both types are in scope alongside in position.ts. "Document" itself is the
    brief's own word ("a function from (graph document, projection, ...)"); "Declaration" is not.
    Neither word ever appears in rendered position text (renderPosition uses only vocabulary and
    D20-sanctioned words), so I3 is not broken by anything a person actually reads -- but both
    names are recorded here per I3's own rule that an unmatched word is a gap, never a silent
    coinage.
  - >
    loadGraphDocument rethrows any file-read error that is not ENOENT, and currentCommitSha throws
    if `git rev-parse HEAD` fails outside a git repository -- mirroring readReplay's own identical
    ENOENT-only handling in packages/ledger/src/replay.ts. Neither case is one of the five named
    sentence-error scenarios, and this repository's own worktree is always a git repository in
    every path this node's acceptance describes, so this was a deliberate parity choice with an
    existing precedent, not an oversight -- but it means an unexpected filesystem failure or a
    non-git .interlock/ repository would still surface a raw stack trace rather than a sentence.
  - >
    findRepoRoot's "no .interlock directory found" branch has no dedicated regression test: every
    writable location under this worktree's own "do not create files outside this worktree"
    constraint is, by construction, nested inside a real .interlock/-bearing repository (d4), so no
    fixture built inside the worktree can honestly exercise it. The branch is real and reachable
    code, exercised informally (by hand, before this constraint was recognized), just not covered
    by an automated test.
  - >
    Four ledger gaps this node was explicitly told not to fix, confirmed still present and routed
    around rather than patched: no Outcome kind for a voluntary, non-failure pause; reset's
    constructor takes only receipts, no because or authority; Receipt has no duration field;
    the Debrief TS type (packages/ledger/src/debrief.ts) still lacks the derivation,
    graph_base_sha, session_start_sha, and gates_run_by_agent fields this very file's on-disk YAML
    carries.
  - >
    The live demonstration this deliverable requires (d9): `interlock graph show 0001-bootstrap`
    against the real, journal-less repository, a real `interlock graph approve 0001-bootstrap
    --by "Rodrigo Sasaki" --because "approved in conversation on 2026-09-09 against
    79521ddccff79088"`, and `show` again -- run for real in this worktree, not mocked, with its
    full verbatim output recorded under discovery d9 above. This is the first real receipt this
    journal has ever held.
