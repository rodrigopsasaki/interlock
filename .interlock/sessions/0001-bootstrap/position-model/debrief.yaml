  ledger — cleared
    gates: replay satisfied, illegal-states satisfied
  ledger-gaps — cleared
    gates: upcast-v1 satisfied
  debrief-schema — cleared
    gates: none declared
  face-read — cleared
    gates: stale-approval satisfied
  runner-command-gate — cleared
    gates: one-adapter satisfied, receipt-idempotent satisfied
  verifier-hunks — cleared
    gates: inverse-check satisfied
  attempts — cleared
    gates: narration-events satisfied
  verbs — cleared
    gates: cancel-writes-outcome satisfied
  position-model — ready
    gates: position-shape pending
  face — blocked on position-model
    gates: no-write-surface pending
  self-run — blocked on face
    gates: dogfood pending

  critical path: scaffold -> ledger -> ledger-gaps -> runner-command-gate -> attempts -> position-model -> face -> self-run
