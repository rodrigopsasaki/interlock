  kind: agent
  runtime: claude-code
  model: claude-sonnet-5
discoveries:
  - id: d1
    what: >
      The herdr adapter (packages/runner/src/herdr/adapter.ts) exposed no
      way to find a pane from the graph/node/session tokens
      pane.report_metadata writes -- every existing Runtime method needs
      an already-known Agent or Pane value. D16's own prose ("the face
      resolves 'which pane is session X' by reading that metadata back
      through herdr's own pane reads") describes a capability that did
      not exist in code before this session.
    found_at: >
      packages/runner/src/runtime.ts's Runtime interface (openPane,
      startAgent, reportIdentity, prompt, waitUntil, read, sendKeys,
      closePane -- all operate on an Agent/Pane the caller already holds)
    mattered_because: >
      This node's own acceptance names herdr status as something
      "supplied by the CLI, which resolves a session's pane through the
      existing adapter's reads" -- the reads did not exist yet, so this
      session had to add Runtime.reportedAgentStatus rather than only
      wire an existing one. Recorded as an unverified-against-live-herdr
      risk in open.
  - id: d2
    what: >
      NodeView already carries leaseGeneration and outcomeSetAtGeneration
      specifically so a later reader can tell whether a node's current
      outcome belongs to a given session or is a stale one left by an
      earlier, abandoned attempt -- but nothing in the codebase read them
      before this session. session show (built by attempts) always shows
      a node's current outcome regardless of which session earned it,
      correct for one attempt and silently wrong for an earlier one on a
      node with a retry history.
    found_at: "packages/ledger/src/projection.ts:11-19"
    mattered_because: >
      position@v1's own "attempts with outcome and lease" (plural, one
      per session) needed exactly this join to be correct; reusing
      session show's simpler pattern would have attached the node's
      current outcome to every attempt, including ones that never earned
      it.
  - id: d3
    what: >
      Every one of the 156 receipt-written events in the repository's own
      shared journal already carries duration.kind === "measured" --
      ledger-gaps' own work already wired real timing into every receipt
      this repository has produced so far.
    found_at: >
      .interlock/ledger/journal.jsonl, inspected directly: 156
      receipt-written events, 156 with duration.kind "measured", 0
      "unknown"
    mattered_because: >
      Weight and float compute real numbers against the real graph
      immediately for every cleared node, not just placeholders exercised
      only by this session's own tests -- and the real graph's own float
      still reads unknown for every node today only because its three
      not-yet-run nodes (position-model, face, self-run) haven't produced
      a receipt yet, never because duration data is missing upstream.
  - id: d4
    what: >
      packages/runner/package.json already depends on face
      ("face": "workspace:*"); packages/face/package.json depends on
      neither runner nor ledger's runtime concerns. face importing
      runner, even for a type, would be a package-level cycle.
    found_at: >
      packages/face/package.json and packages/runner/package.json,
      dependencies fields
    mattered_because: >
      Settles, structurally rather than by convention alone, that the
      CLI (not face) must be the place that resolves herdr status and
      hands positionOf a plain synchronous lookup -- and that face's own
      AgentStatus type has to be declared locally rather than imported.
  - id: d5
    what: >
      packages/runner/test/fixtures/herdr-socket-schema.json documents
      every method's params and every named payload shape (PaneInfo
      included, with its own tokens and agent_status fields) but carries
      no explicit result shape for pane.list itself, unlike some other
      calls.
    found_at: >
      packages/runner/test/fixtures/herdr-socket-schema.json's
      success_response.$defs (no PaneListResult entry)
    mattered_because: >
      The { panes: PaneInfo[] } response shape this session's adapter
      code assumes is inferred from the { agent: AgentInfo } pattern
      agent.get already uses in the same file, not confirmed against a
      live herdr instance -- flagged in open, the same failure mode a
      prior session's own bend-log entry against D16 already recorded
      once.
decisions:
  - id: c1
    what: >
      positionOf(document, projection, contentHash, agentStatusFor?)
      keeps contentHash as an explicit required parameter (computePosition's
      own shape), rather than the brief's shorter gloss.
    because: notes:1
    rests_on:
      - "brief:One function. positionOf(graphDocument, projection, agentStatusFor?) in packages/face, pure"
      - "packages/face/src/position.ts (prior computePosition)"
      - "notes:1"
    hunks:
      - "packages/face/src/position.ts:1-16"
      - "packages/face/src/position.ts:84-138"
  - id: c2
    what: >
      Split each declared gate's ledger Gate into a PositionGateState
      (positionGate.ts) plus an optional ReceiptSummary (receiptSummary.ts:
      id, commit, duration, spend, derivation's kind only -- no proof).
    because: >
      brief:gates as { id, state, receipt? } where the receipt summary is
      id, commit, duration, spend and derivation kind
    rests_on:
      - "packages/ledger/src/gate.ts"
      - "packages/ledger/src/receipt.ts"
    hunks:
      - "packages/face/src/receiptSummary.ts:1-19"
      - "packages/face/src/positionGate.ts:1-68"
  - id: c3
    what: >
      face declares its own local AgentStatus string union
      (agentStatus.ts) instead of importing runner's identically-shaped
      type.
    because: notes:6
    rests_on:
      - "packages/face/package.json"
      - "packages/runner/package.json"
      - "notes:6"
    hunks:
      - "packages/face/src/agentStatus.ts:1"
  - id: c4
    what: >
      nodeWeight (weight.ts) sums only the receipts in a node's outcome
      whose duration is measured; zero such receipts (no outcome, or
      every duration unknown) weighs unknown, named by the node itself.
    because: notes:7
    rests_on:
      - "brief:A node's weight is the sum of the measured durations of the receipts in its outcome; a node without them weighs unknown"
      - "notes:7"
    hunks:
      - "packages/face/src/weight.ts:1-24"
      - "packages/face/test/weight.test.ts:1-60"
  - id: c5
    what: >
      floatOf (float.ts) runs a real forward (earliest-finish) then
      backward (latest-finish) CPM pass over the whole graph, anchoring
      every sink node -- not just the graph's intended final node -- to
      one shared makespan (the latest earliest-finish among all of them),
      so a dead-end branch nothing depends on shares the graph's real
      finish line instead of its own always-zero-float one.
    because: notes:9,11,12
    rests_on:
      - "AGENTS.md:float: How long a node can wait without moving the graph's finish."
      - "brief:each node's float, a number only where every duration on the path is measured and unknown otherwise"
      - "notes:9"
      - "notes:11"
      - "notes:12"
    hunks:
      - "packages/face/src/float.ts:1-145"
      - "packages/face/test/float.test.ts:1-106"
  - id: c6
    what: >
      criticalPath gains an optional weight lookup: both candidate chains
      need a fully known weight before it overrides the existing hop-count
      comparison, and a weight tie falls through to hop count rather than
      trusting the tie.
    because: notes:8,10
    rests_on:
      - "packages/face/test/criticalPath.test.ts (four pre-existing unweighted cases)"
      - "notes:8"
      - "notes:10"
    hunks:
      - "packages/face/src/criticalPath.ts:1-64"
      - "packages/face/test/criticalPath.test.ts:54-101"
  - id: c7
    what: >
      renderPosition prints a float: line under a node only when its
      value is measured; verified byte-identical against a captured
      pre-session baseline for the real bootstrap graph's rendered text.
    because: notes:13
    rests_on:
      - "brief:the rendered text for the real bootstrap graph stays identical to today's for every line it prints today, plus float where it is measured"
      - "notes:13"
    hunks:
      - "packages/face/src/render.ts:58-75"
      - "packages/face/test/render.test.ts:52-97"
  - id: c8
    what: >
      attemptsFor (attempts.ts) joins a session to the node's current
      outcome only when the session's leaseGeneration equals the node's
      outcomeSetAtGeneration; agentStatus is only looked up for a live
      (leased, unexpired) session.
    because: notes:14,15
    rests_on:
      - "packages/ledger/src/projection.ts:11-19"
      - "notes:14"
      - "notes:15"
    hunks:
      - "packages/face/src/attempts.ts:1-43"
      - "packages/face/test/position.test.ts:190-268"
  - id: c9
    what: >
      Added Runtime.reportedAgentStatus(query), optional on the interface,
      implemented in the herdr adapter with one pane.list call matching
      tokens against the query and returning the matching pane's
      agent_status or undefined -- never a guess. pane.list joined the
      adapter-boundary test's forbidden-pattern list.
    because: notes:3
    rests_on:
      - "docs/design/0002-face.md:D16"
      - "packages/runner/test/adapterBoundary.test.ts (one-adapter boundary)"
      - "notes:2"
      - "notes:3"
    hunks:
      - "packages/runner/src/runtime.ts:19-25"
      - "packages/runner/src/runtime.ts:83-89"
      - "packages/runner/src/herdr/adapter.ts:428-448"
      - "packages/runner/test/adapterBoundary.test.ts:17-19"
      - "packages/runner/test/herdr/fakeServer.ts:14-16"
      - "packages/runner/test/herdr/fakeServer.ts:69-71"
      - "packages/runner/test/herdr/fakeServer.ts:166-171"
      - "packages/runner/test/herdr/fakeServer.ts:196-204"
      - "packages/runner/test/herdr/adapter.test.ts:665-740"
  - id: c10
    what: >
      graph show calls positionOf instead of the superseded
      computePosition, adds --json (stable key order, verbatim object),
      and resolves live sessions' herdr agent status through an
      injectable runtime option before calling positionOf, so positionOf
      itself stays synchronous.
    because: notes:16
    rests_on:
      - "brief:interlock graph show <id> --json prints the object, stable key order"
      - "packages/cli/src/run.ts (the injectable-runtime pattern this reuses)"
      - "notes:16"
    hunks:
      - "packages/cli/src/graph/show.ts:1-126"
      - "packages/cli/test/graph/show.test.ts:94-203"
  - id: c11
    what: >
      This session's own notes.yaml, appended at every choice and
      surprise across this session's code commits.
    because: >
      brief:notes.yaml beside this brief (notes@v0), appended at every
      choice and surprise, committed
    rests_on: []
    hunks:
      - ".interlock/sessions/0001-bootstrap/position-model/notes.yaml:1-297"
gates_run_by_agent:
  - { id: typecheck, result: pass, invocation: "mise exec -- pnpm typecheck", note: "6 of 6 workspace packages with a typecheck script report Done" }
  - { id: test, result: pass, invocation: "mise exec -- pnpm test", note: "493 tests across ledger, face, debrief, verifier, runner, cli (99+54+41+42+132+125), exit 0" }
  - { id: position-shape, result: pass, invocation: "mise exec -- pnpm --filter face test --testNamePattern position", note: "Tests 14 passed | 40 skipped (54)" }
  - { id: debrief-valid, result: pass, invocation: "mise exec -- pnpm interlock debrief validate 0001-bootstrap position-model", note: "run for real against this debrief and notes.yaml at head_sha, after this file was written" }
open:
  - >
    Runtime.reportedAgentStatus's pane.list response shape
    ({ panes: PaneInfo[] }) is inferred, not verified against a live
    herdr instance -- none is reachable in this environment. Recorded in
    d1, d5 and notes:2-3.
  - >
    renderPosition never prints a node's attempts (session, outcome,
    lease, agentStatus) in plain text -- the brief's own "stays identical
    ... plus float" names only float as the new thing the text view
    grows, and attempts are out of scope for the text renderer per the
    acceptance's own reservation of session detail to session show
    (attempts) and the future interactive face. Attempts are fully
    present in positionOf's return value and in --json.
  - >
    Float and criticalPath's weighting are both new, real algorithms
    (CPM forward/backward pass; a weight-or-hop-count comparator) built
    for a graph this session found already has an orphaned branch
    (verbs) -- correct against the two dedicated tests and the real
    graph's own render, but with only this one small real graph and this
    session's own synthetic test graphs to check them against. A larger
    or more tangled real graph, once one exists, is the next real
    exercise of both.
