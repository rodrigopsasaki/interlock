open:
  - >-
    The tmux adapter joins kind and args into one shell string (packages/runner/src/tmux/adapter.ts:36),
    so a writable root with a space would be split if that adapter were ever wired in. Production
    launches go through herdr, which passes a list. Out of this node's scope; it is worth a node
    of its own before tmux is used.
  - >-
    The operator still has to remove the hard-coded --add-dir lines from this machine's real
    runtimes.yaml and add writable_root_args: [--add-dir, "{path}"] to each codex entry. A runner
    built before this change rejects a catalogue entry carrying the key as unknown, so the real
    catalogue should change only after this merges.
  - >-
    The narrated argv includes every literal catalogue arg. They are trusted operator
    configuration and are already visible in herdr, but anything an operator puts in args now
    also lands in the shared journal as narration.
