decisions:
  - id: d1
    what: Existing delivery identities now make an acknowledgment claim only after readOutboxEvidence verifies the request, delivery record, and retained acknowledgment; response artifact and delivery persistence failures remain uncertain until reopen evidence proves otherwise.
    because: D1 requires observed responses to remain doubt on the live read and permits recovery acknowledgment only from surviving retained evidence, never a projection label or resend.
    rests_on:
      - .interlock/graphs/0009-delivery-boundary-proof.yaml
      - packages/ledger/src/outbox.ts
    hunks:
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/absorbOutbox.failure.test.ts
  - id: d2
    what: Intent-only and uncertain recovered identities suppress another dispatch after real ledger reopen, while a complete delivery record that survived fsync failure is separately verified before its acknowledgment narration.
    because: D2 requires recovery to preserve doubt without another judgment and never redispatch either uncertain or acknowledged logical identities.
    rests_on:
      - .interlock/graphs/0009-delivery-boundary-proof.yaml
      - packages/ledger/src/ledger.ts
    hunks:
      - packages/runner/test/absorbOutbox.failure.test.ts
  - id: d3
    what: Two production-created receipts differing only in measured duration produce distinct HTTP-prepared requests; the runner refuses the changed retained request for the same identity and permits a distinct session identity.
    because: D3 requires a stable identity to defend its exact retained request while a new session gets a new effect identity.
    rests_on:
      - .interlock/graphs/0009-delivery-boundary-proof.yaml
      - packages/substrate/src/httpClient.ts
    hunks:
      - packages/runner/test/absorbOutbox.failure.test.ts
  - id: d4
    what: The actual HTTP adapter records received non-2xx, malformed JSON, schema-invalid response, and transport failure as uncertainty, while its useful refusal detail redacts the bearer token.
    because: D4 requires failure detail without converting any unconfirmed response into acknowledgment or exposing credentials.
    rests_on:
      - .interlock/graphs/0009-delivery-boundary-proof.yaml
      - packages/substrate/src/httpClient.ts
      - packages/substrate/src/responseDetail.ts
    hunks:
      - packages/runner/test/absorbOutbox.failure.test.ts
  - id: d5
    what: None and credential, query, and fragment unsafe targets stop during preparation with neither an outbox intent nor an adapter call.
    because: D5 requires target validation before any durable effect or network dispatch.
    rests_on:
      - .interlock/graphs/0009-delivery-boundary-proof.yaml
      - packages/substrate/src/httpClient.ts
    hunks:
      - packages/runner/test/absorbOutbox.failure.test.ts
