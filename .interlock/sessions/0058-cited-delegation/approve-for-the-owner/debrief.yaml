decisions:
  - id: strict-citation-flags
    what: Added typed present-value parsing for --for, --cites, and --reading, with exact citation parsing for said, msg, and GitHub comment URLs and refusal of missing, empty, option-following, padded, or malformed values.
    because: A present flag must never be silently reinterpreted as absent or as another option, and the accepted citation identity must be unambiguous before it can authorize an act.
    rests_on:
      - .interlock/graphs/0058-cited-delegation.yaml
      - packages/cli/src/flags.ts
      - packages/cli/src/delegation.ts
    applies_to: { kind: path, path: packages/cli/src/flags.ts }
    hunks:
      - packages/cli/src/flags.ts
      - packages/cli/src/delegation.ts
      - packages/cli/test/citedApproval.test.ts
  - id: adapter-bound-citation-verification
    what: Extended machine@v0 and local@v1 additively with the cite provider and owner login, sending citation kind and id as separate provider arguments and keeping GitHub comment verification behind the git-host adapter.
    because: Citation verification needs provider-specific and host-specific behavior without leaking runtime or host assumptions into the command flows; older machine and local artifacts remain readable.
    rests_on:
      - .interlock/graphs/0058-cited-delegation.yaml
      - packages/runner/src/machineProvider.ts
      - packages/runner/src/localConfig.ts
      - schemas/machine@v0.json
      - schemas/local@v1.json
    applies_to: { kind: path, path: packages/runner/src/machineProvider.ts }
    hunks:
      - packages/runner/src/machineProvider.ts
      - packages/runner/src/localConfig.ts
      - packages/cli/src/gitHostAdapter.ts
      - packages/cli/src/delegation.ts
      - schemas/machine@v0.json
      - schemas/local@v1.json
      - packages/schemas/test/machine.test.ts
  - id: delegated-receipt-provenance
    what: Represented delegated human receipts with verified author, owner words, driver reading, canonical cite identity, action target, and graph content hash; added additive event schema support, one-use cite checks, and owner-only append-only retraction.
    because: The ledger must distinguish delegated authority from the owner's own receipt, bind one cite to one exact act and content, and preserve consumed provenance after retraction without changing existing human receipt readers.
    rests_on:
      - .interlock/graphs/0058-cited-delegation.yaml
      - packages/ledger/src/derivation.ts
      - packages/ledger/src/event.ts
      - packages/ledger/src/projection.ts
      - packages/cli/src/receipt/retract.ts
    applies_to: { kind: path, path: packages/ledger/src/derivation.ts }
    hunks:
      - packages/ledger/src/derivation.ts
      - packages/ledger/src/event.ts
      - packages/ledger/src/projection.ts
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/gate/clear.ts
      - packages/cli/src/receipt/retract.ts
      - schemas/parts/derivation.json
      - schemas/event@v10.json
      - packages/cli/test/citedApproval.test.ts
  - id: content-bound-clearance
    what: Made a delegated human clearance stop counting when the current graph file hash differs from the receipt's bound hash, emitting a pending gate-moved state while retaining the old receipt and allowing a fresh cite-bound clearance.
    because: A clearance authorizes the graph content that was cited, so an edited graph must be held rather than treating the old delegated approval as current; the append-only journal remains the provenance path.
    rests_on:
      - .interlock/graphs/0058-cited-delegation.yaml
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/gateJudge.test.ts
    applies_to: { kind: path, path: packages/runner/src/gateJudge.ts }
    hunks:
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/gateJudge.test.ts
      - packages/ledger/src/projection.ts
  - id: public-shape-reference
    what: Regenerated docs/shapes.md for the additive local, machine, and event shape changes and covered delegated and existing human receipts in the schema test.
    because: Published artifact descriptions must match the schemas that accept both new delegated receipts and every existing human receipt.
    rests_on:
      - docs/shapes.md
      - schemas/parts/derivation.json
      - schemas/event@v10.json
    applies_to: { kind: path, path: docs/shapes.md }
    hunks:
      - docs/shapes.md
      - packages/cli/test/citedApproval.test.ts
