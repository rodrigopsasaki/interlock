open:
  - >-
    Not detached, so outside this ask, but a real concurrent writer: the foreground
    reflog-expire runs `git reflog expire --all` and writes every linked worktree's admin
    HEAD.lock and logs/HEAD. If a runner brief commit (or any person's commit) runs while a
    separate backfill invocation is removing its worktree, it can write into the admin directory
    being removed. It is due only when the committing worktree's HEAD reflog holds at least
    maintenance.reflog-expire.auto (default 100) expired entries, which a fresh node worktree
    does not. Containment would be serializing backfill against concurrent runner commits, or
    `-c maintenance.reflog-expire.auto=0` on the brief commit; a person should choose.
  - >-
    A detached worktree-prune from some other worktree, running while removeWorktree is part-way
    through deleting the backfill admin directory (gitdir file already gone), can delete the same
    entry. That is a deletion race that can fail the removal, not a write; not probed further.
  - >-
    Outside the stated configuration: with rerere enabled (rerere.enabled=true or an rr-cache
    directory), a gate or worktree_setup command that commits or merges inside the backfill
    worktree would launch a daemon whose rerere-gc writes that worktree's admin MERGE_RR.lock
    while removeWorktree deletes it. Neither condition holds here: no rr-cache, and no standing
    gate or setup command commits there. Other Git versions or a non-default
    maintenance.strategy are unsupported; the proof re-derives the split on every run and fails
    if it moves.
  - >-
    A note slip: notes.yaml 07:15 says the proof forces "each default task's" auto condition;
    the test forces all ten known tasks (KNOWN_TASKS), which is what lets it detect a newly
    enabled one.
  - >-
    head_sha is 2ad105c, a notes-only commit that moved the evidence; the last commit touching
    code is c78f4b4. The debrief-valid gate is run after filing.
