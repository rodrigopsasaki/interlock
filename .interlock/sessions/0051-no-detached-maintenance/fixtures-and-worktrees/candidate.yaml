open:
  - >-
    The guard reads direct child_process use in test sources. Git that fixtures provoke through
    production code (face's spawnedGit, the runner's brief commit and worktree commands, gate and
    setup commands) is contained only by the repository-local maintenance.auto=false the
    initializers pin; whether production needs its own containment is the worktree-maintenance
    node's question.
  - >-
    The helper does not follow include.path or other indirect configuration supplied with -c;
    a fixture could in principle re-enable maintenance that way. No fixture does, and the
    guard does not read argv contents passed to fixtureGit.
  - >-
    The migration commit dfecb33 still carries the old fixtureCleanup.test.ts, whose direct git
    call the guard flags; the following commit 4adf405 completes it. Only the head is green on
    the guard.
