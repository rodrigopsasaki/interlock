discoveries:
  - id: filing-is-session-scoped
    what: The projection stores a current debrief on each session and later debrief-filed events replace that session's read without rewriting earlier events.
    mattered_because: A corrected selected debrief must be filed against the judged session, while a second session for the same node remains unchanged.
    found_at: packages/ledger/src/projection.ts:161-165
decisions:
  - id: file-changed-v2-content-without-replaying-notes
    what: Read the current valid v2 debrief before deciding whether to file it, append a debrief-filed event only when its decoded value differs from the session's projected debrief, and append notes only with the first filing.
    because: The latest filing becomes the session position while unchanged, malformed, legacy, and missing reads retain the prior current debrief and cannot duplicate notes.
    rests_on:
      - .interlock/graphs/0028-current-handoff.yaml
      - .interlock/sessions/0028-current-handoff/record-current-handoff/notes.yaml
      - packages/ledger/src/projection.ts
    hunks:
      - packages/runner/src/gateJudge.ts:323-334
  - id: prove-session-local-content-sensitive-filing
    what: Added runner coverage for two sessions of the same node, one corrected filing, semantic equality after reordered reserialization, and malformed, legacy, and missing current reads.
    because: The filing boundary must distinguish session identity from node identity, retain raw history, and make every unreadable or equivalent rejudge a no-op.
    rests_on:
      - .interlock/graphs/0028-current-handoff.yaml
      - .interlock/sessions/0028-current-handoff/record-current-handoff/notes.yaml
    hunks:
      - packages/runner/test/gateJudge.test.ts:932-1006
  - id: prove-ordinary-evidence-reads-corrected-replay
    what: Added a CLI fixture that selects an authored correction, rejudges it, checks raw filings and notes, and reads ordinary evidence from the persisted journal.
    because: Public evidence must show the corrected judged filing rather than the first source range or a direct current-disk fallback.
    rests_on:
      - .interlock/graphs/0028-current-handoff.yaml
      - .interlock/sessions/0028-current-handoff/record-current-handoff/notes.yaml
      - packages/cli/src/evidence.ts
    hunks:
      - packages/cli/test/evidence.test.ts:359-432
