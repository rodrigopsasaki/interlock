interlock: notes@v0
node: deliver-context-slice
entries:
  - kind: surprise
    at: "2026-09-15T23:28:35Z"
    expected: The generated session would already contain its notes artifact.
    observed: notes.yaml was absent, so this file was created before implementation work.
  - kind: choice
    at: "2026-09-15T23:28:35Z"
    chose: Append the canonical Context slice section only when the rendered composition source has no such heading.
    because: The existing headed path already replaces through the following section, while the unheaded path must retain authored body and make the rendered slice readable by the same bounds reader.
  - kind: choice
    at: "2026-09-15T23:30:07Z"
    chose: Preserve the authored body as the prefix and add only the separator needed before an appended Context slice heading.
    because: This keeps authored content intact for empty and nonempty bodies while later composition finds the canonical heading and replaces rather than duplicates the rendered section.
  - kind: surprise
    at: "2026-09-15T23:30:28Z"
    expected: The focused style check would accept the added context-slice import.
    observed: Biome requires sibling source imports in path order, so the test import was reordered before committing.
  - kind: choice
    at: "2026-09-15T23:31:48Z"
    chose: Prove the rendered result retains the full source body as its exact prefix and exercise refusal separately from no substrate.
    because: Prefix equality makes authored-content preservation explicit, while a refused addressed context must retain body and address without being treated as the none outcome.
  - kind: surprise
    at: "2026-09-15T23:35:55Z"
    expected: The locally validated debrief derivation would be accepted by the real receiver.
    observed: The real receiver held iteration 4 with HTTP 400 because /debrief/derivation forbids the additional reasoning_effort property.
  - kind: choice
    at: "2026-09-15T23:35:55Z"
    chose: Select an authored schema-compatible debrief revision with only kind, runtime, and model in derivation.
    because: The published derivation schema is authoritative for receiver compatibility, and debrief revise retains the original authored bytes before installing the correction.
  - kind: surprise
    at: "2026-09-15T23:37:39Z"
    expected: The reported receiver refusal could be listed as a gate run in the worker debrief.
    observed: Root reported that the real receiver held the prior debrief with HTTP 400, but the worker did not run that receiver operation.
  - kind: surprise
    at: "2026-09-15T23:37:39Z"
    expected: The full harness test gate would provide a passing receipt after the correction.
    observed: Root reported that its full harness test gate failed in corpus.files.test.ts on the same derivation field, while debrief validation passed.
  - kind: choice
    at: "2026-09-15T23:37:39Z"
    chose: Keep root-reported receiver and harness outcomes in attributed notes and remove the receiver outcome from gates_run_by_agent.
    because: The debrief gate list records only commands this worker ran, while typed notes retain externally reported facts without presenting them as worker proof.
