interlock: notes@v0
node: judge-tests-stand-alone
entries:
  - kind: choice
    at: "2026-11-09T20:10:00Z"
    chose: Re-measure the acceptance's listed slow cases before editing and preserve integration boundaries while making logic cases deterministic.
    because: The acceptance requires case-by-case classification from current evidence, budgets derived from real deadlines, and no blanket timeout changes.
  - kind: surprise
    at: "2026-11-09T20:12:00Z"
    expected: The runner JSON baseline would be written after the package completed.
    observed: The runner baseline stopped in worktreeMaintenance because its fixture could not lock a nested Git worktree reference under the package run directory, so no JSON report was produced; a follow-up inspection command also used the login shell's Node instead of the pinned PATH and will be corrected before any Node command.
  - kind: surprise
    at: "2026-11-09T20:17:00Z"
    expected: The serial selected-file measurement would finish within the tool poll and expose a report.
    observed: The shell command continued running after the poll returned and its Vitest process was still active without a session handle; I terminated that process group before continuing so no background test runner remained.
  - kind: choice
    at: "2026-11-09T20:35:00Z"
    chose: Record slow integration budgets in Vitest metadata through one shared helper that also sets each test's actual timeout.
    because: The JSON reporter carries test metadata and duration together, so the gate can validate declaration, reason, existence and budget without a global timeout or file-wide wrapper.
  - kind: choice
    at: "2026-11-09T20:36:00Z"
    chose: Forward the existing gate command-runner and output-directory seams through judgeWorktree, session drive, and CLI run/judge options.
    because: Logic tests must replace only process execution and output storage while production callers keep today's defaults and receipt construction.
  - kind: surprise
    at: "2026-11-09T20:55:00Z"
    expected: Injected Herdr timers would let the adapter tests advance deadlines without wall-clock waits.
    observed: Capturing the global timer functions when the module loaded bypassed Vitest fake timers, and advancing a whole budget before socket responses hid intermediate calls; dynamic timer lookup plus explicit I/O checkpoints made the tests deterministic.
  - kind: choice
    at: "2026-11-09T20:56:00Z"
    chose: Keep HerdrCall real and use the injected timing seam with scoped fake timers and socket-call checkpoints in the deadline and retry tests.
    because: This preserves the adapter's actual Unix-socket request and response behavior while making only its clock, sleep and deadline scheduling deterministic.
  - kind: surprise
    at: "2026-11-09T21:03:00Z"
    expected: The package-script inspection would use the pinned Node PATH guard.
    observed: A read-only shell loop invoked the login shell's default Node before the guard was applied; it produced no writes or owner-path access, and all subsequent Node, pnpm and test commands use the required pinned PATH export and version checks.
  - kind: choice
    at: "2026-11-09T21:18:00Z"
    chose: Declare the landed-cache world-refresh case with a bounded integration budget while retaining its existing injected Git reader.
    because: The case exercises a real Git-backed fixture and crossed the 1.5 second accounting threshold under the serial package sweep; its explicit cache reason and budget preserve the graph's integration boundary and make the variance visible.
  - kind: choice
