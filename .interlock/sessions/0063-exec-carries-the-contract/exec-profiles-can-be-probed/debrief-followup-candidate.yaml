      - packages/runner/test/execProbe.test.ts
      - packages/cli/test/execProbe.test.ts
  - id: release-on-throw-and-history-proof
    what: Releases a lifecycle that was bound before a process runner throws, supplies effective forwarded values when only the runner environment defines them, and adds CLI proof that a thrown child releases its identity and removes the prepared probe worktree while a changed forwarded value makes runtime list historical without retaining the value.
    because: The acceptance requires release and cleanup on every exit path and requires the earlier pass to become historical when effective forwarded state changes, with values never persisted.
    rests_on:
