    what: Extended the runtime probe lifecycle contract with process identity and made the CLI admit, bind, and release every non-runner-custody check around the actual child, including release on failed checks and launch cleanup on every exit path.
    because: The shared preparation requires provider binding to use the real probe process identity and requires release and launch cleanup even when a check throws or refuses.
