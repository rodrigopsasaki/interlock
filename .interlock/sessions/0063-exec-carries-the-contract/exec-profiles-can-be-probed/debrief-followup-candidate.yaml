      - packages/cli/src/runtime/list.ts
      - packages/cli/test/execProbe.test.ts
  - id: prepared-contract-reaches-child
    what: Matched the exec probe template against the unexpanded declared skeleton, then launched the fully prepared argv so expanded writable roots, exclusive MCP arguments, and forwarded names remain in the child contract while the headless prompt is replaced at its shifted position.
    because: Root expansion can add arguments before the headless tail and MCP/forwarding preparation adds arguments after it; validation must stay declared while execution must preserve the complete preparation.
    rests_on:
      - "Acceptance (verbatim from the graph): the shared preparation ... reaches the probed process"
    applies_to: { kind: path, path: packages/runner/src/runtimeProbe.ts }
    hunks:
