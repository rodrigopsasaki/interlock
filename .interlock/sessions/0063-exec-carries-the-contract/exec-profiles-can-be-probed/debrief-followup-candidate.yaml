    what: Made exec probes derive their expected argv from the prepared program, declared args, and headless_args, refusing a command before the program, a missing access argument, an invalid prompt position, or a profile without headless_args before spawning.
    because: A probe may report passed only when the real check body runs through the profile's declared access, so an inferred or malformed split must be unavailable without starting a process.
