  - id: hash-forwarded-environment-provenance
    what: Added hashes of effective forwarded environment values to probe configuration provenance and bumped the implementation version used by probe records and probe listing comparisons.
    because: Changing a forwarded value must make an earlier pass historical without storing the value itself, and the persisted probe implementation must identify the new behavior.
    rests_on:
      - "Acceptance (verbatim from the graph): probe provenance includes a hash of the effective forwarded environment values"
    applies_to: { kind: path, path: packages/cli/src/runtime/probe.ts }
    hunks:
