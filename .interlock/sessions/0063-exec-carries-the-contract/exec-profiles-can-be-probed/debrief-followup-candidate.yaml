    what: Shipped executable interlock-probe-{shm,loopback,worktree-file,git-metadata,signed-commit} bodies and placed their directory first in the child PATH; nonzero process output becomes a refused check result.
    because: The acceptance names real shared-memory, loopback, worktree-file, metadata, and signed-commit checks, and the profile must execute those bodies without a host-shell substitute.
