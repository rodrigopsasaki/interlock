decisions:
  - id: additive-headless-args-contract
    what: Added headless_args as an additive runtimes@v2 template, parsed it with the whole {prompt} contract, and appended its expanded tail in the shared exec launch preparation while preserving prior catalogue fields.
    because: The acceptance makes the access split explicit and requires existing runtime artifacts and readers to remain valid while headless profiles may omit {prompt} from args.
    rests_on:
      - "Acceptance (verbatim from the graph): runtimes@v2 gains headless_args additively"
    applies_to: { kind: path, path: packages/runner/src/runtimeCatalogue.ts }
    hunks:
      - packages/runner/src/runtimeCatalogue.ts
      - schemas/runtimes@v2.json
      - docs/shapes.md
      - packages/schemas/test/runtimesV2.test.ts
  - id: refuse-undeclared-or-mismatched-access
    what: Made exec probes derive their expected argv from the prepared program, declared args, and headless_args, refusing a command before the program, a missing access argument, an invalid prompt position, or a profile without headless_args before spawning.
    because: A probe may report passed only when the real check body runs through the profile's declared access, so an inferred or malformed split must be unavailable without starting a process.
    rests_on:
      - "Acceptance (verbatim from the graph): the probe template must expand with the program at argv[0]"
    applies_to: { kind: path, path: packages/runner/src/runtimeProbe.ts }
    hunks:
      - packages/runner/src/runtimeProbe.ts
      - packages/runner/test/execProbe.test.ts
  - id: ship-real-probe-bodies
    what: Shipped executable interlock-probe-{shm,loopback,worktree-file,git-metadata,signed-commit} bodies and placed their directory first in the child PATH; nonzero process output becomes a refused check result.
    because: The acceptance names real shared-memory, loopback, worktree-file, metadata, and signed-commit checks, and the profile must execute those bodies without a host-shell substitute.
    rests_on:
      - "Acceptance (verbatim from the graph): the checks are real"
    applies_to: { kind: path, path: packages/runner/src/probe-bin }
    hunks:
      - packages/runner/src/probe-bin/interlock-probe-shm
      - packages/runner/src/probe-bin/interlock-probe-loopback
      - packages/runner/src/probe-bin/interlock-probe-worktree-file
      - packages/runner/src/probe-bin/interlock-probe-git-metadata
      - packages/runner/src/probe-bin/interlock-probe-signed-commit
      - packages/runner/src/runtimeProbe.ts
      - packages/runner/test/execProbe.test.ts
      - packages/cli/test/execProbe.test.ts
  - id: per-process-provider-lifecycle
    what: Extended the runtime probe lifecycle contract with process identity and made the CLI admit, bind, and release every non-runner-custody check around the actual child, including release on failed checks and launch cleanup on every exit path.
    because: The shared preparation requires provider binding to use the real probe process identity and requires release and launch cleanup even when a check throws or refuses.
    rests_on:
      - "Acceptance (verbatim from the graph): the probe uses the shared preparation of exec-carries-roots-mcp-and-env"
    applies_to: { kind: path, path: packages/cli/src/runtime/probe.ts }
    hunks:
      - packages/runner/src/runtime.ts
      - packages/runner/src/index.ts
      - packages/runner/src/runtimeProbe.ts
      - packages/cli/src/runtime/probe.ts
      - packages/cli/test/execProbe.test.ts
  - id: hash-forwarded-environment-provenance
    what: Added hashes of effective forwarded environment values to probe configuration provenance and bumped the implementation version used by probe records and probe listing comparisons.
    because: Changing a forwarded value must make an earlier pass historical without storing the value itself, and the persisted probe implementation must identify the new behavior.
    rests_on:
      - "Acceptance (verbatim from the graph): probe provenance includes a hash of the effective forwarded environment values"
    applies_to: { kind: path, path: packages/cli/src/runtime/probe.ts }
    hunks:
