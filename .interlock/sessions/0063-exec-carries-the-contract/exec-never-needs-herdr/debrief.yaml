decisions:
  - id: runtime-branch-before-herdr
    what: >-
      Resolve the runtime branch before herdr preflight: exec sessions skip herdr creation and
      server checks, while pane sessions retain the early preflight refusal and pane recovery.
    because: >-
      Exec profiles must run without herdr, while pane launches must preserve today's not-ready
      message and machine custody. The session driver is the shared seam where the runtime-specific
      behavior can be separated before either launch path performs its effects.
    applies_to: { kind: path, path: packages/runner/src/sessionDrive.ts }
    rests_on:
      - packages/runner/src/sessionDrive.ts:299-318
      - packages/runner/src/sessionDrive.ts:772-788
    hunks:
      - packages/runner/src/sessionDrive.ts:299-318
      - packages/runner/src/sessionDrive.ts:772-788
  - id: exec-recovery-stays-unresolved
    what: >-
      Select the resolved runtime before run-start machine recovery and disable recovery for exec,
      narrating pending pane-era intents as unresolved while retaining their outbox records.
    because: >-
      An exec launch has no herdr runtime with which to reconcile a pane-era effect, so it must not
      resolve, drop or guess delivery. Pane launches remain the only path that recovers those intents.
    applies_to: { kind: path, path: packages/cli/src/run.ts }
    rests_on:
      - packages/cli/src/run.ts:171-190
      - packages/runner/src/machineOutbox.ts:306-348
      - packages/cli/test/execWithoutHerdr.test.ts:335-387
    hunks:
      - packages/cli/src/run.ts:171-190
      - packages/runner/src/machineOutbox.ts:306-348
      - packages/cli/test/execWithoutHerdr.test.ts:335-387
  - id: phase-prompt-boundary
    what: >-
      Build every exec phase request from its own prompt, replacing the opening prompt in the argv
      copy and passing the same phase prompt separately for stdin delivery.
    because: >-
      Work and debrief are distinct contract phases. Reusing the opening argv would deliver the
      work prompt to debrief, while stdin delivery depends on the request's phase prompt.
    applies_to: { kind: path, path: packages/runner/src/sessionDrive.ts }
    rests_on:
      - packages/runner/src/sessionDrive.ts:529-647
      - packages/cli/test/execWithoutHerdr.test.ts:262-333
      - packages/runner/test/execWithoutHerdr.test.ts:125-132
    hunks:
      - packages/runner/src/sessionDrive.ts:529-647
      - packages/cli/test/execWithoutHerdr.test.ts:262-333
      - packages/runner/test/execWithoutHerdr.test.ts:125-132
  - id: acceptance-fixtures-own-the-proof
    what: >-
      Keep the complete herdr-free acceptance proof in the node's CLI and runner test files: PATH
      and temporary HOME assertions, pending-intent preservation, running-session listing, held
      session judgement, pane refusal, injected-runtime non-use, and done zero phase records.
    because: >-
      The graph names these cases as this node's acceptance, so a broader fixture suite cannot stand
      in for direct proof. The CLI tests exercise the command boundaries and the runner test exercises
      direct session driving under the same isolated runtime conditions.
    applies_to: { kind: path, path: packages/cli/test/execWithoutHerdr.test.ts }
    rests_on:
      - packages/cli/test/execWithoutHerdr.test.ts:190-249
      - packages/cli/test/execWithoutHerdr.test.ts:335-524
      - packages/runner/test/execWithoutHerdr.test.ts:70-185
    hunks:
