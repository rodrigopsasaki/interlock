interlock: notes@v0
node: exec-never-needs-herdr
entries:
  - kind: choice
    at: '2026-11-09T11:30:00Z'
    chose: >-
      Select the resolved runtime before machine recovery, report pending pane-era machine intents
      as unresolved for exec, and keep recovery plus herdr preflight on the pane path.
    because: >-
      Exec must not create, check or connect to herdr, while pane recovery must retain its existing
      outbox custody and behavior. Runtime selection is the seam that makes that distinction before
      either side can perform a runtime-specific effect.
  - kind: choice
    at: '2026-11-09T11:31:00Z'
    chose: >-
      Rebuild exec argv independently for the work and debrief phases from the phase prompt.
    because: >-
      A whole prompt placeholder is phase data, so caching the work-expanded argv would violate the
      contract by delivering the work prompt to the debrief program.
  - kind: surprise
    at: '2026-11-09T11:35:00Z'
    expected: The captured typecheck wrapper would print its result after the command completed.
    observed: >-
      zsh treats `status` as a read-only special variable, so the wrapper exited while assigning
      the command result; the typecheck output remained safely captured in the run file.
  - kind: choice
    at: '2026-11-09T11:40:00Z'
    chose: >-
      Add focused runner and CLI regressions around phase-specific prompts and the exec launch
      path, using only fixture programs and temporary test roots.
    because: >-
      The acceptance is a runtime boundary, so the proof must exercise the session driver and CLI
      without starting a real agent or relying on herdr availability.
  - kind: surprise
    at: '2026-11-09T11:50:00Z'
    expected: The post-commit typecheck would accept the new focused CLI test on the first pass.
    observed: >-
      TypeScript rejected an unused `describe` import in the new test; the import was removed
      before rerunning the gate.
  - kind: surprise
    at: '2026-11-09T11:55:00Z'
    expected: The standing lint gate would report no findings from the focused regression files.
    observed: >-
      Lint passed but reported one new fixture-string warning and two existing warnings in
      runnerCommits.test.ts; the focused warning was removed before the gate is rerun.
  - kind: surprise
    at: '2026-11-09T12:05:00Z'
    expected: Moving herdr preflight behind the runtime branch would preserve all existing refusal timing.
    observed: >-
      The full suite's refusalOutcomes regression showed that pane preflight must still refuse before
      worktree or ledger side effects; the fix keeps that early boundary for non-exec runtimes only.
  - kind: choice
    at: '2026-11-09T12:40:00Z'
    chose: Author the first debrief candidate as an agent run using runtime codex and model GPT-5.
    because: >-
      This session is an implementer agent session, and the candidate derivation must identify the
      runtime and model that produced its claims before the final debrief is filed.
  - kind: surprise
    at: '2026-11-09T12:45:00Z'
    expected: The authored candidate's full head SHA would match the code commit used for its rooted range.
    observed: >-
      Debrief preview rejected a mistyped full SHA for the code commit; the exact value is being
      used in a fresh candidate after this notes correction.
  - kind: choice
    at: '2026-11-09T12:50:00Z'
    chose: Add a second CLI fixture for stdin-delivered exec phase prompts before filing the debrief.
    because: >-
      The graph acceptance covers both argv and stdin delivery forms; exercising stdin in the same
      herdr-free fixture makes the phase contract proof cover both forms before handoff.
  - kind: choice
    at: '2026-11-09T13:00:00Z'
    chose: Extend the CLI fixture coverage to all five acceptance cases and assert both exec phase records are done with exit zero.
    because: >-
      The acceptance assigns these cases to this node's own CLI and runner test files; broader
      fixture coverage is not an acceptable substitute for direct proof of pending outbox recovery,
      synchronization listing, hand judgement, pane refusal, and skipped injected herdr preflight.
  - kind: surprise
    at: '2026-11-09T13:05:00Z'
    expected: The expanded CLI test module would collect after the import changes.
    observed: >-
      The import rewrite omitted Vitest's afterEach symbol, so collection failed before any test
      body ran; the missing import was restored before the focused rerun.
  - kind: surprise
    at: '2026-11-09T13:10:00Z'
    expected: The temporary HOME and rebuilt PATH would still let the runner create its fixture commits.
    observed: >-
      The first focused execution reached runner brief creation but Git had no identity after HOME
      isolation, so all exec launches stopped before phase execution; the fixture now supplies only
      non-owner Git identity/config variables.
  - kind: surprise
    at: '2026-11-09T13:20:00Z'
    expected: Making the exec fixture dirty would leave a held result available for a later judge call.
    observed: >-
      The runner judged that dirty worktree during the launch and returned the held refusal itself;
      the test now completes the exec launch cleanly, then adds the uncommitted file before invoking
      judge --session so the session is held and unleased at the intended boundary.
  - kind: surprise
    at: '2026-11-09T13:25:00Z'
    expected: A clean successful exec launch could be judged again after adding a dirty file.
    observed: >-
      The successful launch records a terminal cleared outcome, which judge correctly refuses before
      reading the worktree; the fixture now records an explicit held outcome after the lease ends,
      then exercises judge --session against that unleased session.
  - kind: surprise
    at: '2026-11-09T13:30:00Z'
    expected: lease.stop would immediately make the session unleased in the ledger projection.
    observed: >-
      The lease handle cancels heartbeats but leaves the recorded expiry as the liveness boundary;
      the judge fixture advances its controlled clock beyond that expiry before calling --session.
  - kind: choice
    at: '2026-11-09T13:35:00Z'
    chose: Add a runner-level direct-drive regression that injects a failing herdr runtime and checks both exec phase records.
    because: >-
      The CLI fixtures prove the command boundary, while the runner test must prove the session
      driver itself skips injected herdr checks and still records work and debrief completion.
  - kind: choice
    at: '2026-11-09T13:55:00Z'
    chose: Refile the debrief from a fresh candidate rooted at the committed test-and-notes head, with the five acceptance cases closed in the open list.
    because: >-
      The prior debrief accurately described the earlier prompt-only proof but left acceptance cases
      that this node now directly exercises; the final debrief must point at 9fcefba and report no
      untested acceptance item from the graph's required fixture set.
  - kind: surprise
    at: '2026-11-09T14:00:00Z'
    expected: The fresh candidate could be prepared under the ignored package test runs directory.
    observed: >-
      Debrief preparation refused a candidate outside this session directory before writing it; the
      candidate is being prepared in the session directory and will be removed after filing.
  - kind: surprise
    at: '2026-11-09T13:40:00Z'
    expected: The runner direct-drive fixture would ignore its common Git run artifacts by default.
    observed: >-
      Its scope guard saw the shared interlock run records as changed paths because the generic
      fixture lacked the CLI fixture's interlock ignore rule; the runner fixture now commits that
      rule before driving.
