decisions:
  - id: runtime-branch-before-herdr
    what: >-
      Resolve the runtime branch before herdr preflight: exec sessions skip herdr creation and
      server checks, while pane sessions keep the existing early preflight refusal and perform
      machine recovery only after the pane runtime is ready.
    because: >-
      An exec profile must be runnable without herdr, but pane launches must retain today's
      not-ready refusal boundary and pane recovery behavior. Keeping the branch at the driver seam
      makes both effects runtime-specific without changing the pane adapter.
    applies_to: { kind: path, path: packages/runner/src/sessionDrive.ts }
    rests_on:
      - packages/runner/src/sessionDrive.ts:292-318
      - packages/runner/src/sessionDrive.ts:772-788
    hunks:
      - packages/runner/src/sessionDrive.ts:292-318
      - packages/runner/src/sessionDrive.ts:772-788
  - id: exec-recovery-stays-unresolved
    what: >-
      Select the resolved runtime before run-start machine recovery and pass recovery disabled for
      exec runs, narrating unresolved pending pane-era intents without changing their outbox
      records; pane runs retain recovery.
    because: >-
      A pane-era effect cannot be guessed delivered or discarded when an exec run has no herdr
      runtime available. The outbox remains the durable record and the pane path remains the only
      recovery path.
    applies_to: { kind: path, path: packages/cli/src/run.ts }
    rests_on:
      - packages/cli/src/run.ts:171-190
      - packages/runner/src/machineOutbox.ts:306-348
    hunks:
      - packages/cli/src/run.ts:171-190
      - packages/runner/src/machineOutbox.ts:306-348
  - id: phase-prompt-boundary
    what: >-
      Build each exec phase request from its phase prompt by replacing the opening prompt in the
      argv copy while passing the phase prompt separately for stdin delivery.
    because: >-
      Work and debrief are separate contract phases; caching the opening argv would send the work
      prompt to the debrief program, while the stdin form already depends on the request prompt.
    applies_to: { kind: path, path: packages/runner/src/sessionDrive.ts }
    rests_on:
      - packages/runner/src/sessionDrive.ts:529-647
      - packages/cli/test/execWithoutHerdr.test.ts:121-188
      - packages/runner/test/execWithoutHerdr.test.ts:15-22
    hunks:
