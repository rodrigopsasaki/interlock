decisions:
  - id: gate-runner-seam
    applies_to: { kind: path, path: packages/runner/src/gateJudge.ts }
    what: >-
      Added an optional typed GateCommandRunner that receives the complete mise exec wrapper argv,
      with the existing spawnGateCommand behavior as its default, and an optional output directory
      that uses the real storeGateOutput path when supplied while preserving today's worktree-based
      retention by default.
    because: >-
      The receipt proof needs to control only execution and storage location; keeping command
      substitution, output hashing, commandReceiptId, deduplication, gate selection, and default
      spawning in judgeGates preserves production behavior and the receipt contract.
    rests_on:
      - packages/runner/src/gateJudge.ts:93-128
      - packages/runner/src/gateJudge.ts:146-178
      - packages/runner/src/gateJudge.ts:333-347
      - packages/runner/src/gateJudge.ts:415-439
    hunks:
