      - packages/runner/src/index.ts
  - id: marker-boundary
    applies_to: { kind: path, path: packages/runner/test/markerNeverDropped.test.ts }
    what: >-
      Made the marker fixture root a short system-temporary directory and computed its filler from
      the actual serialized unmarked byte count and marker delta, asserting the exact under-limit
      unmarked line, the marked line crossing by 15 bytes, the nonnegative filler, and the marked
      line remaining under 1024 JavaScript characters; retained the separate base-at-limit refusal
      case.
    because: >-
      The old fixture made HOME, XDG_STATE_HOME, and CODEX_HOME depend on checkout path length and
      only asserted a broad byte boundary. The new proof isolates the UTF-8 byte policy from the
      worktree and prevents a character-count implementation from passing.
    rests_on:
      - packages/runner/test/markerNeverDropped.test.ts:140-167
      - packages/runner/test/markerNeverDropped.test.ts:169-198
    hunks:
      - packages/runner/test/markerNeverDropped.test.ts:40-43
      - packages/runner/test/markerNeverDropped.test.ts:169-198
    produces:
      - packages/runner/test/markerNeverDropped.test.ts
  - id: receipt-identity-fixture
    applies_to: { kind: path, path: packages/runner/test/receiptCarriesItsRun.test.ts }
    what: >-
      Replaced real command and Git-fixture work with a typed fake runner that advances one
      controlled clock, checks the full wrapper argv, and returns execution bytes; the test uses a
      temporary output directory with real gate-output storage and covers pass/fail identity,
      duration-insensitive deduplication, output matching, and distinct receipts for identical
      bytes under different patterns.
    because: >-
      The receipt test must isolate execution latency and repository metadata while leaving proof
      construction, output hashing and storage, commandReceiptId, deduplication, and gate selection
      real; the cases therefore test the identity contract without a loaded-machine timeout.
    rests_on:
      - packages/runner/test/receiptCarriesItsRun.test.ts:1-70
      - packages/runner/test/receiptCarriesItsRun.test.ts:73-155
    hunks:
      - packages/runner/test/receiptCarriesItsRun.test.ts:1-70
      - packages/runner/test/receiptCarriesItsRun.test.ts:73-155
    produces:
      - packages/runner/test/receiptCarriesItsRun.test.ts
  - id: durable-evidence
    applies_to: { kind: path, path: .interlock/sessions/0063-exec-carries-the-contract/tests-stand-alone/notes.yaml }
    what: >-
      Recorded every implementation choice and observed surprise, then retained pinned-toolchain
      focused, standing, and three consecutive full-suite results with output paths and totals tied
      to code head 9ea96999dffb86e4624f0817b7f75db8e6a190d7.
    because: >-
      The runner needs a way back from the compressed debrief to the exact commands and the one
      observed existing timeout, while the acceptance requires honest proof that runs 4, 5, and 6
      passed without raising a timeout or weakening a case.
    rests_on:
