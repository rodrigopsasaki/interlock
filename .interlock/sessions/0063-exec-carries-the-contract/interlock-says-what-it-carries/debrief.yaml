    The generated shape reference reports capabilities as an artifact term with
    no AGENTS.md vocabulary row. This is an intentional gap: the acceptance
    requires the new artifact and AGENTS.md is outside this node's scope; the
    schema and command use capabilities exactly as the accepted contract names it.
