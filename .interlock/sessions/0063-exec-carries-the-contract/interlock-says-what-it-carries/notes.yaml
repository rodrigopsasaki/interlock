interlock: notes@v0
node: interlock-says-what-it-carries
entries:
  - kind: choice
    at: "2026-11-09T22:59:55Z"
    chose: >-
      Publish one exported capability constant beside each selected exec-runtime
      implementation, collect those constants in a pure top-level capabilities
      command, and publish capabilities@v0 with a generated shapes reference.
    because: >-
      The acceptance makes ownership visible at the implementation seam while
      forbidding a hand-written string list, and the command must read nothing
      from the machine, catalogue, ledger, herdr or repository.
  - kind: surprise
    at: "2026-11-09T23:00:20Z"
