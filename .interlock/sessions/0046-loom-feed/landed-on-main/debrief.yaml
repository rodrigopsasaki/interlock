open:
  - >-
    loom@v0 mapping. loom's Landed is a bare string ("on-main" | "not-on-main" |
    "reverted-on-main") or { unknown: true, because }; the position says { kind, ... } with
    evidence fields, as it does for float. The cockpit's reader maps kind to the string and
    unknown to { unknown, because }, and drops main, head, by and revertedBy, which loom has no
    field for. loom's Workstream.done maps exactly.
  - >-
    A revert without a trailer of one commit in a multi-commit attempt is not detected: the
    reverse-patch check compares the whole change only. Such an attempt reads on-main.
  - >-
    A squash whose commit resolved a conflict, or whose context lines differ from the branch's,
    has a different patch-id and reads not-on-main rather than on-main. git's patch-id is the
    rule the acceptance names; a fuzzier match would be a guess.
  - >-
    Nodes cleared by backfill or by hand with no runner receipt read unknown, saying no commit
    is known to have cleared.
  - >-
    The face re-runs these git reads on every refresh, one set per cleared node. It took about
    a second for this graph on this repository; a graph with many cleared nodes over a long
    main will cost more, and caching would break the face's read-fresh rule.
