discoveries:
  - id: journal-role-still-worker
    what: >-
      interlock debrief prepare refused the derived filing with "session-started event does not
      match the local brief", the same refusal every earlier node of this chain met: the runner
      that starts 0046 sessions runs from main, which records role worker, while this brief
      says implementer.
    found_at: '.interlock/sessions/0046-loom-feed/lines-in-voice/brief.md:5 "role: implementer"'
    mattered_because: >-
      This debrief is authored by hand against debrief@v2 and checked with interlock debrief
      validate, as landed-on-main's was.
  - id: journal-drops-entry-timestamps
    what: >-
      The ledger sink writes only entry.data, so Phyxius's JournalEntry timestamp never reaches
      the journal. Only session-narrated, person-said and the note inside note-appended carry a
      time; gate-moved, outcome-set, receipt-written and lease events carry none.
    found_at: 'packages/ledger/src/sink.ts:54 "operations.write(descriptor, `${JSON.stringify(envelopeFor(entry.data))}\n`);"'
    mattered_because: >-
      changedAt, sinceAt and "newer than its latest observed change" can only be dated from
      those three facts. Gate moves and outcomes are dated through the runner's narration of
      them, which it writes at every step.
  - id: vocabulary-check-reads-identifiers-not-sentences
    what: >-
      The verifier's vocabulary check extracts identifiers and module names from added lines of
      a diff; it never reads string contents, so on its own it cannot see the words of a
      composed sentence.
    found_at: 'packages/verifier/src/vocabulary.ts:192 "for (const word of [...identifierWords(line), ...moduleWords(line)]) {"'
    mattered_because: >-
      "The existing vocabulary check covers the new sentences" is met by reusing its reader of
      the vocabulary (harnessVocabulary, acceptedForms) in a test that checks every observed
      sentence word by word.
  - id: outcome-words-live-in-a-part
    what: >-
      The outcome kinds a sentence may say (cancelled, failed, reset, superseded) are declared in
      schemas/parts/outcome.json, which position@v1.json references rather than inlines.
    found_at: 'schemas/parts/outcome.json:54 "cancelled"'
    mattered_because: >-
      The I3 test first flagged "cancelled" as a coinage; it now follows parts/ references when
      it collects the position's own words.
decisions:
  - id: standing-ranked-then-spoken
    what: >-
      line.ts names each node's standing as a tagged union (held, asking, approval, person-gate,
      ready, working, waiting, ended, cleared, done), ranks it in the acceptance's order with
      ties kept in topological order, and composes the observed sentence from the standing
      alone. Unnamed outcomes (failed, reset, cancelled, superseded) rank as ended, after
      waiting and before cleared; within cleared, on-main ranks last. An unapproved or stale
      graph is a person's gate open on the graph itself.
    because: >-
      The order reads outcome, live attempt, asking, gate kinds and states and landed at once;
      naming the standing makes it one switch and each sentence one case, so a test can pin one
      sentence per state. Ended work is unfinished and a person may act on it, so it comes
      before cleared work and after moving work. approved is the graph's human gate and nothing
      leases before it.
    rests_on:
      - packages/face/src/position.ts
      - packages/face/src/landed.ts
      - packages/face/src/asking.ts
    hunks:
      - packages/face/src/line.ts:1-211
  - id: person-gate-open-only-when-next
    what: >-
      A node's human gate counts as open when it is pending, the node has no outcome and no
      unmet upstream, and every other declared gate is satisfied or waived.
    because: >-
      Before the node's own gates pass, the human gate is not the next move; reading it as open
      on a fresh node would put every node with a review gate ahead of ready work.
    rests_on:
      - packages/runner/src/gateJudge.ts
    hunks:
      - packages/face/src/line.ts:1-211
  - id: said-quotes-one-field-exactly
    what: >-
      An attempt's said is its latest note: kind, the one field that is the session's words (a
      choice's chose, a surprise's observed, a question's asked) and the note's own at string.
      The line is said when the attention node's live or latest attempt has a note newer than
      its latest narrated step or delivered words; who is the runtime's name. A note whose at
      does not parse never claims to be newer.
    because: >-
      Joining chose and because would compose words the session did not write. position@v1
      already quotes note times as strings (asking.at); parsing to a number would lose a time
      that is not RFC 3339.
    rests_on:
      - packages/ledger/src/note.ts
      - packages/face/src/asking.ts
    hunks:
      - packages/face/src/said.ts:1-34
      - packages/face/src/attempts.ts:17-17
      - packages/face/src/attempts.ts:29-30
      - packages/face/src/attempts.ts:57-57
      - packages/face/src/attempts.ts:69-70
  - id: moments-from-named-facts
    what: >-
      changedAt is the latest of every attempt's narrated steps, delivered words and latest
      note; sinceAt is the latest narrated step or delivered words on the latest attempt of the
      node the line is about (the graph's latest narrated step when done). Each carries the
      fact it came from (session-narrated, note-appended, person-said), or unknown with a
      because.
    because: >-
      The acceptance asks for a named journal fact, and only these three facts carry a time.
      Stamping every event would be a new event version with upcasters for nine older ones,
      outside this node.
    rests_on:
      - packages/ledger/src/sink.ts
      - packages/ledger/src/event.ts
      - packages/runner/src/narration.ts
    hunks:
      - packages/face/src/moment.ts:1-85
  - id: position-carries-what-faces-read-beside-it
    what: >-
      positionOf adds the graph's ask, line, changedAt and sinceAt; each node's acceptance (as
      declared) and notes (every note of its live or latest attempt, as the journal holds it);
      each gate's declared kind. The graph loader reads ask and refuses one that is not a
      string.
    because: >-
      So no face reads the graph file beside the position. ask follows the rule role and
