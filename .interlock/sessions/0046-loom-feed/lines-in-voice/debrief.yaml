open:
  - >-
    loom@v0 mapping. Line maps field for field except at: loom's Line.at is a number, the
    position's said at is the note's own string, so the cockpit's reader parses it. Attempt.said
    likewise. Attempt.runner is loom's string list; the position gives { at, line } and the
    reader keeps line. Node.notes is loom's string list; the position gives the typed notes, and
    the reader picks the words (chose, observed, asked). Workstream.changedAt and sinceAt are
    numbers in loom; the position's are { kind: known, at, fact } or { kind: unknown, because },
    which loom cannot carry: the cockpit's reader needs a fallback or loom needs Known<number>.
  - >-
    sinceAt is the latest narrated step on the attention node's latest attempt, which is when
    the runner last moved it, not a recorded transition. It reads unknown for a ready or waiting
    node with no attempt and for the graph's approval. A true "entered this state at" needs
    journal entries to keep their timestamp (the sink drops it), which is a new event version.
  - >-
    A live session that is idle or done (not blocked) reads as working until the runner judges
    it; the line does not distinguish waiting-to-be-judged from working.
  - >-
    The working sentence counts the node's declared gates that are pending; standing gates from
    config.yaml are not in the position, so the count leaves them out.
  - >-
    The ranking is the acceptance's order plus choices for what it does not name (ended outcomes,
    on-main last, a stale or missing approval as a person's gate). A person may want failed work
    ranked above ready work.
  - >-
    I sent one typecheck log to the directory above the worktree (../lv-typecheck.log), against
    the brief, and removed it at once with plain rm.
