open:
  - >-
    loom@v0 mapping. Attempt.asking.at is a number in loom@v0. The position carries a string: the
    question note's own at verbatim, or an ISO time when asked is null. A face maps it with
    Date.parse. A note's at is free text in notes@v0, so a face must treat an unparseable at as
    unknown rather than invent one. Every other field of loom's asking (asked, options, because)
    has a producer.
  - >-
    For asked null, at is when this read observed the blocked status, not when the session
    first blocked, because the journal does not record status changes. A durable "blocked since"
    needs the runner to record what it observed, for example as a session-facts field. That is
    the next additive step if a face wants it.
  - >-
    Until say-into-pane lands, a question is answered only when the attempt ends. A person who
    answers by typing straight into the pane leaves the question showing if the session blocks
    again without writing a new one. say-into-pane's person-said fact is the planned close.
    askingOf takes whether the question is answered as one input, so it can be extended there.
  - >-
    The runner records a question when it observes blocked. A session that writes its question
    and blocks before the runner's next status wait still gets it recorded on that observation.
    But a question written while the runner is not driving the session (a session started by
    hand, or a runner restart) reaches the journal only at debrief time.
  - >-
    interlock debrief prepare refuses this node for the reason in journal-role-still-worker. The
    debrief is authored by hand, as role-shapes-the-session's was.
