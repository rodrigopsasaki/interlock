  - id: asking-on-the-attempt
    what: >-
      askingOf in packages/face/src/asking.ts takes the latest question note on the attempt. It
      returns { asked, options?, at } from that note, or { asked: null, because, at } when there
      is no question or the attempt has its own outcome. In the null case, at is the read's time.
      attemptsFor sets asking only when the resolved agent status is blocked. position@v1.json
      gains attemptAsking and a dependentSchemas rule that asking requires agentStatus blocked.
    because: >-
      The acceptance defines answered as a person's words reaching the pane (say-into-pane, not
      yet built) or the attempt ending. The attempt's own outcome is the only "ended" that can
      still report blocked, since status is resolved only for a live lease. The two becauses say
      which case it is in plain words. The words come only from the session's own note, never the
      screen. at stays a string, the note's own value verbatim, so the face never rewrites the
      session's record. Tests pin: blocked with a question, blocked without one, working, an
      answered question, and an expired lease.
    rests_on:
