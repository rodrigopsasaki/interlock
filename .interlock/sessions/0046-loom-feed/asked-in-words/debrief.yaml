  - id: runner-records-questions-when-blocked
    what: >-
      waitForSession takes an optional recordBlocked hook and awaits it each time it observes
      blocked. sessionDrive fills it with recordQuestionNotes, which reads the worktree's
      notes.yaml and appends each question not yet in the journal. ingestDebrief now goes
      through appendUnrecordedNotes, which skips a question already recorded that way.
    because: >-
      The runner already watches the pane's status and owns a session's journal writes, so the
      question is in the journal while the session waits. It reads the session's own file and
      never the pane. Only questions are deduplicated, so the old behaviour for choices and
      surprises is unchanged. Having the face read notes.yaml itself was rejected: the position
      would depend on a file outside the journal and stop being a replay.
    rests_on:
