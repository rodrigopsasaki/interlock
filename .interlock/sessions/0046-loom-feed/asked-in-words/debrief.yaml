discoveries:
  - id: journal-role-still-worker
    what: >-
      This session's session-started event in the shared journal records role "worker", while
      its brief says "implementer". interlock debrief prepare refused the derived filing with
      "session-started event does not match the local brief", the same refusal
      role-shapes-the-session met.
    found_at: '.interlock/sessions/0046-loom-feed/asked-in-words/brief.md:5 "role: implementer"'
    mattered_because: >-
      The runner that starts 0046 sessions runs from the main checkout, which still lacks
      node-role's fix. Every node in this chain will keep hitting the refusal until the chain
      lands. This debrief is authored by hand against debrief@v2, then checked with
      interlock debrief validate and interlock verify.
  - id: notes-enter-journal-only-at-debrief
    what: >-
      The runner appended note-appended only in ingestDebrief, after a debrief was filed. A
      question written while a session waits would have reached the position only after the
      session ended.
    found_at: 'packages/runner/src/gateJudge.ts:341 "appendUnrecordedNotes(ledger, session, read.notes);"'
    mattered_because: >-
      The acceptance asks for asking while the agent is blocked. With notes recorded only at
      debrief time it would always have been null. So this node also records questions live,
      from the runner's own blocked observation.
  - id: agent-status-resolved-at-read
    what: >-
      The agent status the position carries is resolved from the multiplexer at read time, for
      live leases only, and is never recorded in the journal. The runner's only record of
      "blocked" is a narration line.
    found_at: 'packages/face/src/attempts.ts:46 "const agentStatus = isLive ? agentStatusFor?.(session.session) : undefined;"'
    mattered_because: >-
      "at, being when the blocked status was observed" can only be the read's own time. Nothing
      earlier is recorded except narration text, and parsing that would be guessing.
decisions:
  - id: question-note-kind
    what: >-
      Note gains a third kind, question { at, asked, options? }, with QuestionNote, note.question,
      isQuestionNote and its guard. notes.yaml's reader accepts it and refuses a question without
      asked or with options that are not a list of strings. The session-columns renderer prints
      it. The vocabulary's note row names the kind.
    because: >-
      The acceptance adds the kind to notes@v0, additively. Options are strict because a face
      offers them as the session's own answers. The folded-scalar leniency that rejected gets
      exists only for history, and a question has none. Every notes file this repository has
      recorded still reads, and a test pins that.
    rests_on:
      - packages/ledger/src/note.ts
      - packages/debrief/src/notes.ts
    hunks:
      - packages/ledger/src/note.ts:3-9
      - packages/ledger/src/note.ts:23-24
      - packages/ledger/src/note.ts:37-40
      - packages/ledger/src/note.ts:43-46
      - packages/ledger/src/note.ts:62-65
      - packages/ledger/src/index.ts:62-63
      - packages/debrief/src/notes.ts:78-86
      - packages/face/src/sessionColumns.ts:83-89
      - AGENTS.md:77-77
      - packages/debrief/test/notes.test.ts:1-1
      - packages/debrief/test/notes.test.ts:159-243
  - id: event-v8-with-older-tags-refusing-questions
    what: >-
      EVENT_SHAPE moves to event@v8. upcastV7 and a predatesQuestionNotes wrapper on every older
      upcaster refuse a note-appended carrying a question under tags v1 to v7. Every other older
      line passes through unchanged.
    because: >-
      An old reader refuses a question note outright, so it cannot be additive within event@v7.
      The acceptance gives this node the next event version, an upcaster for every older version
      and a replay gate. One wrapper in the table keeps "an older version carries only what it
      could have written" in one place. The replay gate checks, per older tag, that a choice
      replays and a question is refused, that each fixture journal replays to the same projection
      with and without the v8 entry, and that a question round-trips at event@v8. The real shared
      journal replays too (70 sessions).
    rests_on:
      - packages/ledger/src/envelope.ts
      - packages/ledger/src/upcast/v6.ts
    hunks:
      - packages/ledger/src/envelope.ts:7-7
      - packages/ledger/src/envelope.ts:10-10
      - packages/ledger/src/envelope.ts:28-31
      - packages/ledger/src/envelope.ts:34-40
      - packages/ledger/src/upcast/v7.ts:1-13
      - packages/ledger/test/replay.test.ts:15-15
      - packages/ledger/test/replay.test.ts:529-622
  - id: embedded-note-schema
    what: >-
      Added schemas/event@v8.json, whose note-appended note is one of parts/note.json or the new
      parts/question-note.json. event@v7's schema gains a rule that its note-appended note is not
      a question. notes@v0.json gains the question entry. The corpus guards, the registry list
      and a schema test pin all three. docs/shapes.md is regenerated.
    because: >-
      Widening parts/note.json would let event@v1-v4's schemas accept a kind they never had.
      event@v7 never constrained note-appended, so without the rule a v7 line with a question
      would validate against its schema while its upcaster refused it. I validated all 3,156
      lines of the real shared journal against their schemas after the change, and none was
      refused.
    rests_on:
      - schemas/parts/note.json
      - packages/schemas/test/corpus.journal.test.ts
    hunks:
