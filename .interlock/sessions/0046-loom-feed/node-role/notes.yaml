interlock: notes@v0
node: node-role
entries:
  - kind: surprise
    at: "2026-11-05T01:00:00Z"
    expected: >
      This session's ledger session-started brief and its worktree brief
      front matter to carry the same role, since deriveSessionStart refuses
      a debrief when they differ.
    observed: >
      The shared journal records role "worker" for session
      834ca8ec-4581-4653-ba4f-4623881ba57b (run.ts hardcodes it) while the
      worktree brief front matter says "implementer" (the repository copy's
      own word). Derived filing for this very session may refuse with
      "session-started event does not match the local brief"; the fix this
      node makes (run.ts passes the graph's role to both) only helps
      sessions started after it lands.
  - kind: choice
    at: "2026-11-05T01:05:00Z"
    chose: >
      The closed set lives in packages/face/src/role.ts beside the graph
      loader, and the nearest-term search moves from the verifier's
      vocabulary check into packages/ledger as nearestTerm so the graph
      loader and the verifier share one implementation.
    because: >
      face owns graph@v0 parsing and every reader of a node (runner, cli,
      schemas) already depends on it; a second Levenshtein beside the
      verifier's would be a reinvention, and ledger is the one package both
      face and verifier already import.
  - kind: choice
    at: "2026-11-05T01:10:00Z"
    chose: >
      When the graph names a role, the runner makes it authoritative in the
      worktree brief front matter (narrated when the repository copy said
      something else), in the ledger's session-started brief and in the
      opening prompt; when the graph names none, the front matter is left
      exactly as the repository copy wrote it and the ledger and prompt keep
      "worker".
    because: >
      "Supplied by the graph, never self-declared" means the repository
      copy's word cannot override the graph's, exactly as gates and scope
      are already overwritten from the runner's view; leaving the no-role
      path untouched is what keeps the old brief byte for byte.
  - kind: choice
    at: "2026-11-05T01:30:00Z"
    chose: >
      interlock plan's own session keeps the role "interpreter"; the planner
      role is a graph node's word, and the plan verb proves its output by a
      pre-judgement check that every drafted node names a role, holding the
      plan with a sentence when one does not.
    because: >
      Renaming interpreter would make every historical plan brief and
      session-started event disagree with the new word for no gain this
      node needs; the check makes "plan drafts graphs whose nodes each name
      a role" a harness proof (I1) rather than a line in the brief alone.
  - kind: choice
    at: "2026-11-05T01:35:00Z"
    chose: >
      The runner's role parameter became a union SessionRole = worker |
      interpreter | NodeRole instead of string, and the opening prompt picks
      its sentence by an exhaustive switch over it; every non-interpreter
      role keeps the derived filing sentence.
    because: >
      A string let any word reach the prompt with no sentence; the union
      makes an unsentenced role unrepresentable. All six roles under
      interlock run still file a debrief the same way; what each must
      return is role-shapes-the-session's job.
  - kind: surprise
    at: "2026-11-05T01:45:00Z"
    expected: >
      The standing comments gate to pass on the graph base.
    observed: >
      Nine comment lines in packages/*/src (git buffer constants in four
      files, a herdr u64 note) arrived from main and failed pnpm
      check:comments before any change of mine. Fixed in its own commit by
      naming the reason in the identifiers; behaviour unchanged.
  - kind: surprise
    at: "2026-11-05T01:50:00Z"
    expected: >
      The written worktree brief to start its body right after the closing
      front-matter fence.
    observed: >
      renderBriefFile keeps the repository body's leading blank line, so
      the byte-for-byte pin carries an empty line after "---".
