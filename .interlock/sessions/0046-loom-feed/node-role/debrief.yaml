open:
  - >-
    gap: interlock debrief prepare refused this session ("session-started event does not match
    the local brief"), because the journal recorded role worker while the brief says
    implementer. This debrief was authored by hand against debrief@v2 instead of through
    file-derived. The other 0046 nodes' briefs also say implementer, so any of them started
    before this fix merges will hit the same refusal. Merging this node before starting the
    next one avoids it.
  - >-
    A repository brief whose node has no graph role still records ledger role worker whatever
    the brief's own word is. This is today's behaviour, kept on purpose for the byte-for-byte
    promise, so such a brief that says something else still cannot be filed through the
    derived path.
  - >-
    loom@v0 Node.role is filled, and its Role union names exactly the same six words
    (cockpit/loom/schema.ts:24). One shape difference: loom declares role as Role | null, while
    the acceptance asks for position@v1 to leave it absent when the graph names none. A face
    maps absent to null; the position does not emit null. loom's Brief.role (also Role | null)
    belongs to role-shapes-the-session's attempt brief, not to this node.
