open:
  - >-
    gap: interlock debrief prepare refused this session ("session-started event does not match
    the local brief") because the shared journal recorded role worker. The runner that started it
    runs from main, which lacks node-role's fix. This debrief is authored by hand. Merging
    node-role and this node to the runner's main before starting asked-in-words avoids the same
    refusal there.
  - >-
    loom@v0 mapping. Brief.role is absent rather than null when the session's role is not one of
    the six; a face maps absent to null. Brief.walk is Known<string[]>, while the position
    carries a structured walk ({ kind address, address, steps of { verb, ask } } or { kind none,
    because }); a face renders each step as "verb: ask" and maps none to { unknown: true,
    because }. Debrief.version is the number of times the session's debrief was filed, not the
    shape's version, which is always debrief@v2 in the journal. Debrief.marks is { kind counted,
    counts } or { kind unknown, because }, which a face flattens to the Record loom expects. Every
    field of loom's Brief and Debrief now has a producer.
  - >-
    The attempt's debrief appears only once a debrief is ingested, and the runner ingests only
    on a cleared outcome. A node held by debrief-valid for missing kinds therefore shows a brief
    but no debrief in the position. Ingesting on hold too would change judgement order, so it was
    left out of this node.
  - >-
    interlock debrief validate --file does not check role kinds, because it has no session brief
    to take the role from. Only the graph/node form, which the gate runs, holds on kinds.
  - >-
    The verifier's found_at path pattern ([A-Za-z0-9_./-]+ in packages/verifier/src/foundAt.ts)
    has no "@", so a discovery cannot cite any schema file (schemas/event@v7.json and so on) by
    path and line; it reads as unrooted. This debrief cites the reader in event.ts instead. Adding
    "@" to the pattern is a small fix for whichever node next touches the verifier.
  - >-
    interlock debrief prepare's candidate does not scaffold a role's sections (proof, findings,
    graph_file, marks). A session authors them from the role paragraph and the brief.
  - >-
    One full pnpm test run failed two runner tests (gateJudge "leaves old receipts honestly
    without output ..." and sessionBrief "gives the verifier session an empty walk ...") that pass
    alone. The next two full runs were green. The failure output was not kept. Parallel git-fixture
    load is the likeliest cause, and it is unconfirmed.
