discoveries:
  - id: journal-role-still-worker
    what: >-
      This session's session-started event in the shared journal records role "worker", while
      its brief says "implementer". interlock debrief prepare refused the derived filing with
      "session-started event does not match the local brief".
    found_at: '.interlock/sessions/0046-loom-feed/role-shapes-the-session/brief.md:5 "role: implementer"'
    mattered_because: >-
      node-role's fix (179edc8) makes run.ts record the graph's role. The journal lives under the
      main checkout, and that checkout's main (1049b02) does not contain the fix, so this session
      was started by a runner without it. Every 0046 node started before node-role reaches the
      runner's main will hit the same refusal. This debrief is authored by hand against
      debrief@v2 for that reason, and checked with interlock debrief validate, which now includes
      the implementer's kinds.
  - id: event-v7-open-where-it-mattered
    what: >-
      event@v7 constrains only `session` on session-started and has no block for debrief-filed.
      parts/session-brief.json and parts/debrief-event.json are referenced only by event@v1-v4.
      The readers check only the keys they know.
    found_at: 'packages/ledger/src/event.ts:121 "isBrief(prop(value,"'
    mattered_because: >-
      Recording the walk and the mark counts looked like it needed event@v8, which
      asked-in-words' acceptance already claims. Because event@v7 is open there and isBrief and
      isDebrief ignore unknown keys, both went in as optional fields within event@v7, recorded in
      the bend log.
  - id: no-substrate-verb-for-sessions
    what: >-
      interlock has no command through which a session asks the substrate anything. The client's
      context verb is called only by the runner while it composes a brief.
    found_at: 'packages/substrate/src/client.ts:59 "context(node: Node, scope: readonly string[], role: string): Promise<ContextOutcome>;"'
    mattered_because: >-
      "The whole substrate is open to the session through its address" can only mean the address
      itself, so the brief names it. The runner does not ask the walk's questions for the
      session, because that would be a fourth substrate call, which D4 requires a bend-log entry
      for.
  - id: marks-never-journaled
    what: >-
      Before this node, the verifier's marks were computed at judgement only to build absorb
      evidence, and never written to the journal.
    found_at: 'packages/runner/src/gateJudge.ts:357 "const verified = await verifyDebrief(worktree, debrief);"'
    mattered_because: >-
      "Marks counted by mark" in the position needs a journal fact, because a face cannot run git.
      Ingest now verifies once more and writes the counts on debrief-filed.
