discoveries:
  - id: journal-role-still-worker
    what: >-
      This session's session-started event in the shared journal records role "worker", while
      its brief says "implementer". interlock debrief prepare refused the derived filing with
      "session-started event does not match the local brief", the same refusal the three
      earlier nodes of this chain met.
    found_at: '.interlock/sessions/0046-loom-feed/say-into-pane/brief.md:5 "role: implementer"'
    mattered_because: >-
      The runner that starts 0046 sessions runs from the main checkout, which lacks node-role's
      fix until the chain lands. This debrief is authored by hand against debrief@v2, then
      checked with interlock debrief validate.
  - id: herdr-refuses-prompts-to-blocked-agents
    what: >-
      herdr's agent.prompt rejects a submission to an agent that is already blocked, with
      agent_blocked, before any input is sent (herdr agent prompt --help). The position shows
      asking only while the agent is blocked.
    found_at: 'packages/runner/src/herdr/adapter.ts:383 "const prompted = await call("'
    mattered_because: >-
      The main use of say, answering a blocked session's question, may be refused by the
      multiplexer. Say records that refusal as an uncertain delivery, never as delivered, and the
      question stays open saying why. A test pins exactly that case. Whether answering a blocked
      agent needs a different delivery (keys into its prompt) is a question for the adapter, in
      open below.
  - id: prompt-needs-the-agent-not-the-pane
    what: >-
      Runtime.prompt takes an Agent (herdr's agent name and its pane), and the only lookup by a
      session's identity, resolvePane, returned the pane alone. herdr's agent.list entries carry
      name and pane_id, checked with a read-only herdr agent list.
    found_at: 'packages/runner/src/herdr/adapter.ts:503 "const name = prop(found.value,"'
    mattered_because: >-
      The CLI holds a session id, not an agent. The adapter gained resolveAgent so no herdr call
      leaves it (I6).
decisions:
  - id: person-said-at-event-v9
    what: >-
      LedgerEvent gains person-said { session, said }, with PersonSaid { id, by, text, at,
      answers?, because? }, its guard, and personSaid, which derives id as the sha256 of the
      fact's own content. EVENT_SHAPE moves to event@v9. upcastV8 and a predatesPersonSaid
      wrapper on every older tag refuse person-said; every other older line passes unchanged.
    because: >-
      An older reader refuses an unknown kind, so person-said cannot be additive within event@v8.
      The acceptance gives this node the next event version and an upcaster so older journals
      replay unchanged. A content-derived id is the stable outbox identity the acceptance asks
      for: the same for whoever recomputes it, and the same across replay. at is a number
      because the CLI owns this time, and loom@v0 types heard.at as one.
    rests_on:
      - packages/ledger/src/envelope.ts
      - packages/ledger/src/upcast/v7.ts
      - packages/ledger/src/event.ts
    hunks:
      - packages/ledger/src/personSaid.ts:1-79
      - packages/ledger/src/event.ts:14-14
      - packages/ledger/src/event.ts:99-103
      - packages/ledger/src/event.ts:166-167
      - packages/ledger/src/envelope.ts:8-8
      - packages/ledger/src/envelope.ts:11-11
      - packages/ledger/src/envelope.ts:29-32
      - packages/ledger/src/envelope.ts:34-34
      - packages/ledger/src/envelope.ts:39-40
      - packages/ledger/src/upcast/v8.ts:1-11
      - packages/ledger/src/index.ts:99-100
      - packages/ledger/src/index.ts:105-105
      - packages/ledger/test/replay.test.ts:24-24
      - packages/ledger/test/replay.test.ts:565-565
      - packages/ledger/test/replay.test.ts:620-781
  - id: delivery-through-the-existing-outbox-fact
    what: >-
      A person-said's delivery is recorded by the existing outbox-delivery-recorded under
      said.id, acknowledged with an acknowledgment artifact or uncertain with a because. The
      projection keeps each session's said with its delivery, and folds a delivery whose id
      names no outbox intent onto the session whose said carries it.
    because: >-
      I7 already has a shape here: an intent with a stable identity, persisted before dispatch,
      then a delivery fact that is acknowledged or uncertain. Composing over it keeps one
      delivery fact for every outward effect. The person-said fact is itself the intent, so
      persisting it before the prompt is one confirmed append, not two. A delivery for an
      unknown id is still ignored, and a test pins that.
    rests_on:
      - packages/ledger/src/outbox.ts
      - packages/runner/src/gateJudge.ts
    hunks:
      - packages/ledger/src/projection.ts:11-11
      - packages/ledger/src/projection.ts:31-35
      - packages/ledger/src/projection.ts:52-52
      - packages/ledger/src/projection.ts:114-129
      - packages/ledger/src/projection.ts:185-185
      - packages/ledger/src/projection.ts:204-208
      - packages/ledger/src/projection.ts:244-244
  - id: resolve-agent-in-the-adapter
    what: >-
      The runtime seam gains an optional resolveAgent(query); the herdr adapter fills it from
      agent.list by the reported graph, node and session tokens, returning the agent's name and
      pane, or undefined when the matching entry lacks either.
    because: >-
      The CLI must prompt through the adapter's existing delivery, which needs an Agent. Finding
      it by the same tokens resolvePane uses keeps every herdr call inside the adapter (I6), and
      an entry without a name resolves to nothing rather than a guess.
    rests_on:
      - packages/runner/src/runtime.ts
      - packages/runner/src/herdr/adapter.ts
    hunks:
      - packages/runner/src/runtime.ts:88-88
      - packages/runner/src/herdr/adapter.ts:499-509
      - packages/runner/test/herdr/adapter.test.ts:15-15
      - packages/runner/test/herdr/adapter.test.ts:878-932
  - id: session-say-command
    what: >-
      interlock session say <graph> <node> <text> --by <name> [--because <why>] finds the
      node's live attempt, resolves its agent, names the open question it answers, appends
      person-said with a confirmed append, prompts through Runtime.prompt, then records the
      delivery. It refuses before writing anything when --by is missing, when there is no live
      attempt, or when the pane can't be found. An adapter refusal, an acknowledgment that can't
      be retained, or a delivery that can't be recorded is uncertain, and the command exits 1
      saying the words were recorded but their delivery is uncertain.
    because: >-
      A refusal is not a person-said, so nothing should enter the journal. The acknowledgment
      artifact is the JSON of said id, session, agent and pane, because Runtime.prompt returns
      no body to retain, and the acknowledged shape requires an artifact. The delivery's
      derivation is the outbox gate at runner@0, the same derivation the runner's own outbox
      deliveries carry. An uncertain delivery is not a success a face should show as done.
    rests_on:
      - packages/cli/src/node/cancel.ts
      - packages/runner/src/gateJudge.ts
    hunks:
      - packages/cli/src/session/say.ts:1-212
      - packages/cli/src/main.ts:22-22
      - packages/cli/src/main.ts:75-78
      - packages/cli/test/session/say.test.ts:1-360
  - id: heard-and-asking-follow-acknowledgment
    what: >-
      The position's attempt gains heard, the last acknowledged person-said (by, text, at). A
      question closes only when an acknowledged person-said names it in answers; asked becomes
      null with a because naming who answered and when. While an answer's delivery is uncertain
      or unrecorded, the question keeps its words and gains a because saying the answer is not
      known to have reached the pane and why. openQuestionOf gives the CLI the same rule.
    because: >-
      The acceptance makes heard and the close follow only an acknowledged delivery, and asks
      an uncertain one to leave the question open and say so. loom@v0's asking already has an
      optional because, so it maps without a new name. answers carries the order the projection
      cannot: notes and said are separate lists, so the question open at say time is captured
      as a fact, and a question asked after the words is not closed by them, which a test pins.
    rests_on:
      - packages/face/src/attempts.ts
      - schemas/position@v1.json
    hunks:
