open:
  - >-
    herdr refuses agent.prompt to a blocked agent (agent_blocked), and asking shows only while
    the agent is blocked. So answering a blocked session's question through say records an
    uncertain delivery and leaves the question open, which is honest but not useful. Either the
    adapter needs a delivery for a blocked agent (for example keys into its prompt, which is a
    guess about each runtime's dialog), or asking should also show while the agent is idle
    after writing a question, if sessions that ask in words read as idle rather than blocked.
    I did not change either: both are outside this node's acceptance, and the second changes
    asked-in-words' rule.
  - >-
    A question closes by answers, which the CLI fills from the journal at say time. A question
    a session has written but the runner has not yet recorded (it records questions when it
    observes blocked) is not in the journal, so words said then carry no answers and do not
    close it later.
  - >-
    loom@v0 mapping. heard maps exactly (by, text, at as a number). asking.because now has a
    producer on the open arm too. asking.at stays a string, as asked-in-words left it. loom's
    Attempt.pane is not filled by this node; resolveAgent returns the pane id, so a later node
    can carry it.
  - >-
    Uncertain deliveries are never reconciled. A person saying the same words again makes a new
    person-said with a new identity, since at differs. A reconciler that reads herdr's pane
    history to settle an uncertain delivery would need its own evidence and is not built.
  - >-
    The real shared journal (3,209 lines) replays to the same projection with and without the
    event@v9 reader, checked once by a throwaway test that was removed. The committed fixtures
    predate event@v8, so the committed proof of v8 replay is the synthetic v8 journal in
    replay.test.ts.
  - >-
    interlock debrief prepare refuses this node for the reason in journal-role-still-worker.
    The debrief is authored by hand, as the three earlier nodes' were.
