open:
  - >-
    Role mismatch. This session's session-started (event@v7) records brief.role worker while
    brief.md says implementer, so interlock debrief prepare refuses and this debrief is filed by
    hand. The interlock on PATH runs from main (cbb6bfa), which predates node roles and records
    worker; it goes away when #71 merges. The same mismatch makes this session's own live
    attempt read with no role in the real positions@v0 read: the live list reports the role
    the journal recorded, and the node's declared role is in the position beside it.
  - >-
    loom@v0 Attempt fields this node does not fill on a live attempt: pane (the herdr pane id
    belongs to the herdr adapter, I6, and the journal does not record it), startedAt (the
    session-started fact carries no time; the sink drops the entry timestamp) and branch (not
    asked for; the worktree branch is not in the session fact). A face needing them reads them
    elsewhere until a node adds them.
  - >-
    Workstream.repo in loom@v0 is one string; positions@v0 gives root and an optional origin
    (identified with url, owner, name, or unidentified). The cockpit's reader picks which one
    names the repository. Loom's top-level unreadable list maps from repositories that are
    not-found or whose journal is unreadable.
  - >-
    A journal that throws on read (permissions, a directory in its place, a missing git) reads
    unreadable with the error's message and no line; only the shape-tag refusal is pinned by a
    test.
  - >-
    The plain-text form (without --json) is a minimal rendering, the root, live attempts and
    each graph's renderPosition; the acceptance only specifies --json.
