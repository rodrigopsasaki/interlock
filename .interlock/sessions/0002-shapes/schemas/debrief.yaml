discoveries:
  - id: d1
    what: >
      Every real brief@v0 file in this repository's history (0001-bootstrap/scaffold, /ledger,
      /ledger-gaps, /runner-command-gate, /face-read, /debrief-schema, and
      0002-shapes/brief-shape) is free-form Markdown prose with no "---" front-matter block at
      all -- not a partial or malformed front matter, none whatsoever.
    found_at: >
      Reading all seven files directly, e.g. .interlock/sessions/0001-bootstrap/scaffold/brief.md:1-20
      and .interlock/sessions/0002-shapes/brief-shape/brief.md:1-8.
    mattered_because: >
      There is no partial structure to validate for brief@v0; schemas/brief@v0.json is the
      permissive schema {}, and interlock schema validate's brief.md handling dispatches on
      whether a "---" front-matter block exists at all, before ever trying to read an
      "interlock" key.
  - id: d2
    what: >
      packages/ledger/src/upcast/v2.ts and v3.ts are both, in full, "isLedgerEvent(raw) ? raw :
      undefined" -- a pure identity check against today's guard, with no version-specific
      transformation coded anywhere.
    found_at: "packages/ledger/src/upcast/v2.ts:1-6, packages/ledger/src/upcast/v3.ts:1-6."
    mattered_because: >
      schemas/event@v2.json and event@v3.json could be, and are, byte-identical to
      event@v4.json except for $id/title/description -- one real shape, three declared
      versions, rather than three independently-reasoned guesses that might have drifted from
      each other.
  - id: d3
    what: >
      No guard in packages/ledger, and no reader in packages/debrief, packages/face or
      packages/runner for a hand-authored file format, ever rejects an object for carrying an
      unknown key. Running the file-corpus test against every real file under .interlock/
      confirmed this is exercised, not theoretical: it refused six already-valid files on first
      run -- two notes.yaml files with an extra top-level key (graph, open), a debrief@v2 with
      three extra top-level keys carrying evidence text, a debrief@v1 whose discoveries write
      "matters_because" instead of "mattered_because", and a surprise note entry carrying an
      extra "mattered_because" field.
    found_at: >
      packages/debrief/src/notes.ts, packages/debrief/src/debrief.ts, packages/face/src/document.ts,
      packages/runner/src/standingGates.ts and packages/runner/src/localConfig.ts read in full;
      the six refusals surfaced by packages/schemas/test/corpus.files.test.ts against
      .interlock/sessions/0001-bootstrap/{position-model,runner-command-gate,verifier-hunks}
      and .interlock/sessions/readme-interlock-concept/readme.
    mattered_because: >
      Reversed this session's own first-draft stance of additionalProperties: false everywhere
      a TypeScript type is closed. That instruction still holds for the ledger's own
      discriminated unions (always code-constructed), but every hand-authored file format
      needed additionalProperties: true to keep validating this repository's own real history.
  - id: d4
    what: >
      A debrief-filed journal event embeds the ledger's Debrief in camelCase
      (graphBaseSha, gatesRunByAgent, ...); the debrief.yaml file on disk carries the same
      artifact in snake_case (graph_base_sha, gates_run_by_agent, ...). They are not the same
      bytes.
    found_at: >
      packages/ledger/test/fixtures/journal-v3-v4-2026-09-11.jsonl:77 (a debrief-filed event's
      "debrief" field, camelCase) compared against
      .interlock/sessions/0001-bootstrap/face/debrief.yaml:1-12 (snake_case) and
      packages/ledger/src/debrief.ts's isDebrief guard.
    mattered_because: >
      One artifact needed two schemas at two serialization layers: schemas/debrief@v0.json,
      v1.json and v2.json for the file; schemas/parts/debrief-event.json, always the full
      current shape, for the event (event@v1 refuses debrief-filed outright, so no legacy
      variant of the event-embedded shape exists to schema).
  - id: d5
    what: >
      packages/debrief/src/notes.ts's own note-entry reader silently drops a "rejected" field
      that is present but not a string array, rather than refusing the file; packages/ledger's
      isNote refuses the same shape outright. Real notes.yaml history relies on the lenient
      side: several entries write "rejected: >" as a YAML folded scalar, which parses to one
      long string, not a list.
    found_at: >
      packages/debrief/src/notes.ts:52-79 against packages/ledger/src/note.ts:36-56;
      .interlock/sessions/0001-bootstrap/{ledger-gaps,runner-command-gate,verbs}/notes.yaml's
      own "rejected: >" entries.
    mattered_because: >
      Not a bug on either side -- one reader is deliberately lenient for hand-typed YAML, the
      other deliberately strict for code-constructed values -- but it meant schemas/notes@v0.json
      (the file) and schemas/parts/note.json (the event-embedded note) could not share one
      "rejected" definition.
  - id: d6
    what: >
      packages/runner/src/standingGates.ts's loader never reads or checks either the
      "interlock" key or the "substrate" key of .interlock/config.yaml at all -- confirmed by
      reading the file in full; no branch touches either key.
    found_at: "packages/runner/src/standingGates.ts:41-109 (loadStandingGates), read in full."
    mattered_because: >
      config@v0 has no dedicated ledger guard for the corpus-agreement test to reconcile
      against, so schemas/config@v0.json still requires both fields as the artifact's declared
      shape (every artifact names its shape on its first line, per this repository's own
      compatibility convention). Listed under open below, since here the loader looks
      under-specified, not the schema.
  - id: d7
    what: >
      Neither position@v1 nor item@v1 has a reader anywhere in this repository. position@v1 is
      serialized only by "interlock graph show --json" (positionOf -> JSON.stringify); item@v1
      is a pure in-memory shape a test fixture or a future substrate client constructs directly.
    found_at: >
      Grepping the whole repository for a loader/parser of either shape found none;
      packages/cli/src/graph/show.ts:76-81 is the only place a Position is ever turned into
