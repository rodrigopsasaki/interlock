open:
  - >
    Mandate (packages/ledger/src/mandate.ts, isMandate) has no schema here and is not part of
    this node's corpus-agreement test: it is not in the brief's own ten-guard list, it is never
    embedded in any LedgerEvent kind, and upcastTable carries no tag for it. "mandate" is a
    ratified vocabulary term with no persisted shape behind it yet -- a real gap between the
    vocabulary and the ledger, not an oversight of this node's schema set.
  - >
    schemas/config@v0.json requires both "interlock" and "substrate", but
    packages/runner/src/standingGates.ts's loadStandingGates (read in full) checks neither --
    confirmed at packages/ledger/src/upcast (n/a) and packages/runner/src/standingGates.ts:41-109.
    This is a case where the loader looks under-specified against this repository's own
    compatibility convention (every artifact names its shape on its first line) rather than the
    schema being wrong; left as declared-shape-ahead-of-loader rather than laundered into the
    schema, per this node's scope (which does not include changing runner code).
  - >
    A real, already-accepted debrief@v1 file
    (.interlock/sessions/0001-bootstrap/runner-command-gate/debrief.yaml) writes
    "matters_because" on every discovery instead of the type's "mattered_because". The v0/v1
    reader never checks this field's name at all, so nothing is broken today, but a future
    debrief@v2 upcast of this exact history would need to decide whether that is a typo to
    carry forward as-is or a field this session's schema should special-case; left as-is here
    since debrief@v1's own schema (built to match the loose reader) does not require the field
    to exist at all.
  - >
    graph@v0's two referential checks -- every depends_on id names a real node in the same
    document, and the dependency edges form a DAG -- are whole-document, cross-field
    constraints that JSON Schema draft 2020-12 has no keyword to express; documented as
    loader-only checks in schemas/graph@v0.json's own description rather than approximated.
  - >
    Two incompatible "is this string a valid regex/matcher" grammars exist side by side --
    graph@v0/config@v0's expect_output is always a bare regex body compiled with new
    RegExp(source); local@v0's startup_answers[].matches is either a plain substring or a
    "/body/flags" delimited literal. Both are typed as plain strings in their schemas: JSON
    Schema's pattern keyword validates a value against a regex, it cannot assert that the value
    itself is a well-formed regex source, and neither grammar is validated by the code either.
  - >
    schemas/notes@v0.json's choice.rejected and schemas/parts/note.json's rejected intentionally
    disagree (untyped vs. strict string array) because packages/debrief/src/notes.ts and
    packages/ledger/src/note.ts disagree on the same question for the same conceptual field, at
    two different serialization layers (hand-typed YAML vs. code-constructed value). Neither
    reader looks wrong for its own layer; worth a maintainer's read since it is a real, load-
    bearing behavioral difference between two packages that is easy to lose track of.
