discoveries:
  - id: d1
    what: >
      This node's own brief.md carries two descriptions of the same case that read as
      contradictory on a literal parse: the Readers paragraph says a front-matter block "lacking
      the shape tag" validates as brief@v0 legacy, while the Errors bullet two sentences later
      lists "missing tag" as one of the reader's refusal kinds.
    found_at: >
      .interlock/sessions/0002-shapes/brief-shape/brief.md, the "Readers" paragraph against the
      "Errors are sentences with file and line" sentence immediately after it, read side by side
      while designing packages/debrief/src/brief.ts's dispatch.
    mattered_because: >
      The two readings produce different refusal unions and different behavior for a real,
      plausible file (front matter with no "interlock" key). Resolved in favor of the Readers
      paragraph, recorded as notes:1; the tension itself is worth a maintainer's eyes since a
      future brief@v2 could sharpen the wording rather than leave two paragraphs to disagree.
  - id: d2
    what: >
      packages/ledger/src/receipt.ts already implements the exact absolute-path/escapes-root
      check a scope path needs, as an unexported helper (resolveScopePath) behind the exported
      ScopeRefusal/explainScopeRefusal pair used for receipt identity.
    found_at: >
      packages/ledger/src/receipt.ts:42-74, found while searching the repository for existing
      scope-path validation before writing packages/debrief/src/briefScopePath.ts.
    mattered_because: >
      Composition over creation asks this to be reused first; it was not, and notes:11 records
      why (exporting a receipt-identity internal for a front-matter concern couples two packages
      that only need to agree informally). Recorded here as the honest alternative that was
      available and set aside, not missed.
  - id: d3
    what: >
      Vitest's --testNamePattern filters by each test's full describe-plus-it name, not by its
      file name.
    found_at: >
      Running "mise exec -- pnpm --filter debrief --fail-if-no-match test --testNamePattern
      brief" directly and reading its output (17 tests matched, from the "readBriefFile" and
      "every existing brief under .interlock/sessions" describe blocks) rather than trusting the
      flag's name.
    mattered_because: >
      This node's own brief-legacy gate depends on that exact invocation producing at least one
      passed test; the coverage is real, but it depends on test names containing "brief", a fact
      neither this brief nor AGENTS.md states, and future test renames could silently break the
      gate.
  - id: d4
    what: >
      git ls-files returns tracked paths in the git index's own byte-sorted lexicographic order.
    found_at: >
      A throwaway fixture repository built by hand (four files under .interlock/, committed,
      then "git ls-files" run against it) before writing packages/cli/test/run.test.ts's fixture
      brief; packages/runner/src/scope.ts itself documents the rule ("receipts address every
      tracked file") but not the order gitTrackedFiles returns them in.
    mattered_because: >
      Let the fixture brief's scope: list be hand-matched, with confidence, to what
      writeBriefIntoWorktree computes as authoritative, so the existing "narrates each step"
      test keeps asserting an exact, unchanged narration array (notes:16).
  - id: d5
    what: >
      face's GateDeclaration.run is optional (a human gate has no run command at all), so a
      node's own declared gates cannot all be spread into a BriefGate the same way.
    found_at: >
      packages/face/src/document.ts:9-13 (GateDeclaration) read against
      .interlock/graphs/0002-shapes.yaml's "approved" gate (kind: human, no run), while writing
      authoritativeBriefGates in packages/runner/src/briefRewrite.ts.
    mattered_because: >
      exactOptionalPropertyTypes forbids writing run: undefined into a BriefGate literal;
      authoritativeBriefGates conditionally spreads run in only when the source declaration
      carries one, the same pattern packages/debrief/src/briefGate.ts already uses for its own
      optional fields.
