gates_run_by_agent:
  - id: typecheck
    result: pass
    invocation: "mise exec -- pnpm typecheck"
  - id: test
    result: pass
    invocation: "mise exec -- pnpm test"
    note: "289 tests across ledger, face, debrief, runner, cli; run twice at the same head_sha, both green"
  - id: debrief-valid
    result: pass
    invocation: "mise exec -- pnpm interlock debrief validate 0002-shapes brief-shape"
    note: "run against this debrief@v2 and notes@v0 file"
  - id: brief-legacy
    result: pass
    invocation: "mise exec -- pnpm --filter debrief --fail-if-no-match test --testNamePattern brief"
    note: "17 tests passed (d3); at least one, as the gate's expect_output requires"
open:
  - >
    face's GateDeclaration does not parse expect_output, so a rewritten brief's gates never
    carry it even though every test gate in both .interlock/graphs/*.yaml declares one
    (notes:10). The brief-legacy gate's own expect_output is therefore descriptive intent on
    this graph today, not a runner-enforced check; wiring it belongs to whichever node next
    touches face's graph parser and the gate judge together.
  - >
    diffGates and diffScope narrate by id and by count, never by full path or full command,
    to keep the common case readable. If a team wants the exact before/after values (not just
    that something changed), that is a richer narration shape to design deliberately, not a
    gap to patch quietly.
  - >
    The tension between this node's own Readers paragraph and Errors bullet over what "missing
    tag" means (d1) is worth a maintainer's read; brief@v1's reader resolved it one way, and
    the design note could say so explicitly rather than leaving two paragraphs to disagree.
