  - id: preserve-authored-guidance-boundaries
    what: Recognized generated guidance only through its paired markers outside matching backtick or tilde fences, preserving authored headings and quoted marker pairs while keeping composition idempotent.
    because: A generic heading or a marker quoted in fenced author content is not harness-owned guidance and must not be removed during a later composition.
