open:
  - >-
    The historical ENOTEMPTY itself was not reproduced in the suite. One instrumented full parallel
    run was green, and the mechanism is demonstrated by a controlled reproducer and a deterministic
    regression. The link to run-64TMAq is inferred from foundAt's fixture having one object in
    objects/17 permanently; its commit id cannot be recovered.
  - >-
    packages/cli and packages/runner test fixtures also commit inside directories they
    remove with rmSync. Their own helpers do not disable auto maintenance, so they carry the same
    latent writer. Two cli fixtures (plan-88ffjG, run-7GKTDs) had a daemon still alive during
    teardown. This node's acceptance scopes the fix to the verifier, so those helpers are unchanged.
  - >-
    The brief's global-config snapshot came from `git config --global --get-regexp`. On this
    machine the global config lives at ~/.config/git/config, and auto maintenance is on by Git's
    default rather than by any key, so the snapshot's lack of maintenance keys never ruled it out.
