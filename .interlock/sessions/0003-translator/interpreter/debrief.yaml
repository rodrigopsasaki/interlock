open:
  - >
    `interlock verify 0003-translator interpreter`, run against this debrief after this fix pass,
    reports 34 unexplained files: every one of them arrived through merging main (the fix brief's
    own first step) partway through this branch's life -- the "evidence" node's own session files
    and every file its already-landed, already-reviewed commits touched. This debrief's decisions
    cover only this node's own work, never re-explain a sibling node's; the verifier's diff range
    runs from session_start_sha to head_sha regardless of what arrived by merge versus by this
    session's own commits, so a node that merges another mid-flight will always show its
    predecessor's files as unexplained here. Not a defect in this debrief, but a real gap in what
    the verifier's own diff range means once a node merges: it has no notion of "brought in by a
    merge, already explained elsewhere," only "in range."
  - >
    c7's evidence block was captured by running the same fixture shape as
    packages/cli/test/plan.test.ts's own tests outside vitest, for convenience in producing a
    clean, single-invocation transcript; packages/cli/test/plan.test.ts's own suite (committed,
    gated by plan-lands-unapproved) is the actual, continuously-verified evidence, this block is a
    readable copy of what it already proves.
  - >
    d5's fix (c5, package.json's lint script passing biome.json's includes prefixes explicitly)
    resolved the symptom this session could reproduce and verify, but never explained why biome
    2.5.13 rejects a bare "." against files.includes in the first place. It is moot now regardless:
    merging main (this fix pass's own first step) brought a different fix for the same bug --
    biome.json's own worktrees exclude went root-relative -- and per the fix brief this branch
    resolved toward main's version, so package.json is back to "biome check ." (commit
    86095fd). The underlying "why" is still unexplained, and no longer this repository's problem
    to explain unless biome regresses it again.
  - >
    The interpreter's brief template (interpreterBriefBody) never received a real interpreter
    session's output to react to -- every test and the evidence above drives a stub Runtime whose
    "session" only ever writes a fixture graph and an empty debrief@v2 stub. Whether the template
    gives a real agent enough to produce a well-shaped graph is unverified by this node's own
    acceptance and will only be known once graph "first-address" or a later ask actually runs one.
  - >
    Concurrent `interlock plan` calls on one graph id double-lease, same as `run` does today
    (packages/runner/src/lease.ts takes a lease unconditionally; nothing refuses a second lease
    over a live one). The fix would hold a lease keyed on the graph id itself, shared across a
    graph's real nodes and its synthetic plan/<graph-id> node, so a plan in flight blocks a second
    plan (or a node run) over the same graph the way a node's own lease already blocks a second
    session of that node; not implemented here, per the fix brief's own scope.
  - >
    d1, corrected above: attemptsFor has exactly one call site, position.ts's map over a graph
    document's declared nodes, so a planning session's attempts are invisible to the face today.
    Surfacing one would need positionOf to also walk each graph's synthetic plan/<graph-id> node
    (not a declared node, so not part of the existing map) and fold its attempts into Position
    under a new field -- plans, alongside nodes -- since a planning attempt is not itself a node of
    the graph it plans and does not belong in nodes without misrepresenting what "node" means in
    this vocabulary.
