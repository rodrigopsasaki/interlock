decisions:
  - id: c1
    what: >
      Added readRawEvents(directory) to packages/ledger/src/replay.ts: parses the shared
      journal the same way readReplay does, but returns the flat, unfolded LedgerEvent list
      instead of folding it into a projection. Shares its line-parsing loop with replayFromRaw
      via a new, private parseEvents helper rather than duplicating the parse-and-refuse loop a
      second time.
    because: >
      evidenceOf needs a node's full gate-moved/outcome-set history to catch a person's waive,
      approve, cancel or reset -- and the ledger's own LedgerProjection collapses a node's gates
      and outcome to their current state only (one Gate per id, one Outcome), so a reset that
      later got re-cleared is invisible in the projection's own final state. Reading the raw
      journal, via the parseLine/journalPath the ledger package already exported, is the only
      way back to that history.
    rests_on: []
    hunks:
      - "packages/ledger/src/replay.ts"
      - "packages/ledger/src/index.ts"
    produces:
      - packages/ledger/src/replay.ts
      - packages/ledger/src/index.ts
      - packages/ledger/test/replay.test.ts
    evidence: |
      packages/ledger/test/replay.test.ts's own new "readRawEvents" suite, run against this
      head_sha:

      ✓ readRawEvents > returns the flat event history a projection folds away, unfolded and in order
      ✓ readRawEvents > a directory with no journal yet reads as no events, never a missing-file error
      ✓ readRawEvents > refuses on the same line and tag replayFromRaw would, since both parse the same way
  - id: c2
    what: >
      VerifyResult gains decisionMarks (one entry per debrief.decisions, its own hunk-citation
      marks in order) and discoveryMarks (one entry per debrief.discoveries, its own found_at
      mark), built alongside the existing flat marks array rather than derived from it
      afterward. renderVerification's own parameter narrows to { marks } (a structural subset of
      VerifyResult), since counts-and-render never needed the new fields.
    because: >
      evidenceOf needs to know WHICH decision or discovery a rooted or unrooted mark belongs to.
      The flat marks array's own order (hunk marks, then discovery marks, then unexplained, then
      gaps) is verify.ts's own implementation detail, not a documented contract; slicing it
      elsewhere would silently break the moment that order changed. Building the correlation once,
      where the marks are produced, keeps every existing marks consumer (render.ts, cli/verify.ts,
      their own tests) unchanged.
    rests_on: []
    hunks:
      - "packages/verifier/src/verify.ts"
      - "packages/verifier/src/render.ts"
      - "packages/verifier/src/index.ts"
    produces:
      - packages/verifier/src/verify.ts
      - packages/verifier/src/render.ts
      - packages/verifier/src/index.ts
      - packages/verifier/test/verify.test.ts
  - id: c3
    what: >
      evidenceOf(session) in packages/substrate/src/evidence.ts, deterministic, no model call:
      a rooted decision (every one of its hunk-citation marks rooted) becomes a hypothesis
      decision item scoped to its hunks' one shared path, or the repository when they span more
      than one; a rooted discovery becomes a hypothesis item kinded by discoveryKind.ts's fixed
      word scan (absence/risk/tension/decision); every receipt becomes an observed item,
      discipline or risk by blockedGateIds(outcome) (d2); a person's verb (approve, waive,
      cancel, reset), read off the node's raw gate-moved/outcome-set history via
      personEventsFor, becomes a professed decision item, derivation human:<authority>.
      derivationString.ts renders a ledger Derivation or DebriefDerivation into the plain string
      item@v1's own derivation field requires.
    because: >
      This node's own acceptance, translated literally: "receipts become observed items with
      gate derivation; decisions and discoveries become hypotheses with model derivation... a
      person's verbs with their because become professed items with human derivation." Every
      rule chosen where the brief left a fork is recorded in notes.yaml (12:00-13:03) and in the
      mapping table below.
    rests_on:
      - "brief:What this node builds"
      - notes 12:00Z-13:03Z
    hunks:
      - "packages/substrate/src/evidence.ts"
      - "packages/substrate/src/derivationString.ts"
      - "packages/substrate/src/discoveryKind.ts"
      - "packages/substrate/src/index.ts"
    produces:
      - packages/substrate/src/evidence.ts
      - packages/substrate/src/derivationString.ts
      - packages/substrate/src/discoveryKind.ts
      - packages/substrate/test/evidence.test.ts
      - packages/substrate/test/derivationString.test.ts
      - packages/substrate/test/discoveryKind.test.ts
    evidence: |
      packages/substrate/test/evidence.test.ts, packages/substrate/test/discoveryKind.test.ts and
      packages/substrate/test/derivationString.test.ts together: 26 cases covering every rule
      above, run against this head_sha, all passing (see gates_run_by_agent's own "test" run).
  - id: c4
    what: >
      SubstrateClient.absorb gains a fifth, optional parameter (evidence?: {items, gaps});
      httpClient forwards items/gaps into the POST body only when given. absorb.request.json
      gains two optional, additive fields, "items" (item@v1[]) and "gaps" (parts/gap.json[]),
      both $ref'd from their existing artifact schemas rather than redefined.
    because: >
      The brief's own instruction: "the client's absorb call the previous node built now carries
      the evidence beside the debrief, notes and receipts... add one as an optional array of
      item@v1... if the schema has no field for items." debrief, notes and receipts stay
      required; noneClient and every existing 4-argument absorb call (gateJudge.test.ts's
