  - id: d6
    what: >
      blockedGateIds classified a receipt from the node's current outcome
      (outcome.on.failure, a field that exists only while an outcome is still "held" on a
      gate failure) rather than from history, so once a node's outcome later moved past
      "held" -- to "cleared" -- every one of its receipts read "discipline", proof of
      exitCode 1 included. A false observed item: the one thing this translation must never
      produce.
    found_at: >
      .interlock/sessions/0003-translator/evidence/debrief.yaml's own
