    rests_on:
      - "schemas/item@v1.json"
      - "schemas/parts/gap.json"
    hunks:
      - "packages/substrate/src/client.ts"
      - "packages/substrate/src/httpClient.ts"
      - "schemas/substrate/absorb.request.json"
    produces:
      - packages/substrate/src/client.ts
      - packages/substrate/src/httpClient.ts
      - schemas/substrate/absorb.request.json
    rejected: "a required evidence parameter, or folding items/gaps into the existing receipts array"
  - id: c5
    what: >
      interlock evidence <graph> <node> [--session <id>]: resolves the node's judged session
      from the shared journal's own projection (latest by default, or --session), runs
      verifyDebrief against the same repository for each decision's and discovery's own marks,
