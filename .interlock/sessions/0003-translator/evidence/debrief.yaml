discoveries:
  - id: d1
    what: >
      readRawEvents's own current-version upcaster (envelope.ts's identity arm for event@v4) is
      the same one replayFromRaw already used; it returns the raw parsed line as-is, envelope
      tag included, rather than a clean LedgerEvent. replayFromRaw never showed this, since fold()
      only ever reads the fields it knows and the extra "interlock" property is invisible after
      folding.
    found_at: >
      packages/ledger/test/replay.test.ts's own "readRawEvents > returns the flat event history"
      case, first written to assert strict equality against freshly-constructed events; failed
      with an extra "interlock":"event@v4" key on every entry, before the assertion was loosened
      to compare by kind.
    mattered_because: >
      Confirmed this is pre-existing envelope.ts behavior, not a bug this node introduced --
      readRawEvents is a mechanical wire-to-event decode, the same one replayFromRaw's own Ok
      branch already carries internally, so the test was fixed to compare what actually matters
      (event kind and, via fold(), the resulting projection) instead of asserting a stricter
      shape than the rest of the ledger package itself guarantees.
  - id: d2
    what: >
      A receipt's satisfied/blocked state cannot be read from outcome.receipts membership: a
      held outcome's own receipts field is the full, unfiltered node receipt list (every gate's
      receipt, blocked ones included), not only the ones that actually failed -- unlike a
      cleared outcome's receipts (buildCleared keeps only satisfied/waived ones).
    found_at: >
      packages/substrate/test/evidence.test.ts's own "a receipt absent from the outcome's own
      receipts is risk" case, which failed (both the satisfied and the blocked fixture receipt
      came back "discipline") against the first cut of receiptItem, before blockedGateIds
      existed.
    mattered_because: >
      Replaced the membership test with blockedGateIds(outcome) -- reads outcome.on.failure (the
      one field on a held-on-gate-failure outcome that actually names which gates were not
      satisfied or waived, packages/ledger/src/outcome.ts's own buildCleared) -- rather than
      shipping a rule that silently classified every receipt as discipline on held nodes. See
      notes.yaml, 13:02-13:03.
  - id: d3
    what: >
      Scanning both a discovery's "what" and its "mattered_because" for the absence vocabulary
      (no/not/never/...) classified all seven real discoveries in 0001-bootstrap/verifier-hunks's
      own debrief as absence, not the five a by-hand reading expected -- mattered_because's own
      hedging prose ("not a bug", "never block", "leaving no working-tree change behind") tripped
      the vocabulary even where "what" itself names nothing missing.
    found_at: >
      $ pnpm interlock evidence 0001-bootstrap verifier-hunks
      (run for real, this graph's own Deliverable 4, before the discoveryKind.ts fix)
      items 64 (discipline/observed 36, decision/professed 1, decision/hypothesis 20,
      absence/hypothesis 7), gaps 69, unrooted excluded 1
    mattered_because: >
      Narrowed discoveryItemKind's scan to discovery.what alone. Re-run after the fix: 5 of 7
      land on absence (two, d4 and d6 of that debrief, defensibly -- their own "what" quotes a
      real "does not exist" / "no --no-renames" fact), the other two default to decision. See
      notes.yaml, 13:30.
  - id: d4
    what: >
      A CLI test that opens no ledger before calling a command reads the REAL, main-checkout
      shared journal, not an isolated fixture: findRepoRoot climbs from a fresh, git-initialized
      but .interlock-less fixture directory all the way to this worktree's own .interlock, and
      sharedJournalDirectory on that root resolves, via git's own --git-common-dir, to the main
      checkout's real .interlock/ledger.
    found_at: >
      A throwaway debug print inside packages/cli/src/session/show.ts (added, exercised against
      the real session/show.test.ts suite, then reverted -- git diff on that file is empty at
      this head_sha) showed repoRoot resolving to the fixture only when a ledger was opened
      first, which mkdirSync's the fixture's own .interlock/ledger as a side effect of attaching
      its sink; a test that never opens one first has no such side effect to save it.
    mattered_because: >
      This node's own two "no judged session" tests in packages/cli/test/evidence.test.ts were
      reading the real shared journal until fixed by mkdirSync'ing the fixture's own .interlock
      directly -- confirmed harmless in practice only because "0003-translator"/"evidence" had
      not yet been judged in that real journal at the moment the test ran, not because the risk
      was not real. See notes.yaml, 13:20.
  - id: d5
    what: >
      `pnpm lint` (biome check .) refuses outright from inside this worktree -- "No files were
      processed... these paths were provided but ignored: -." -- reproduced before this session
      changed a single line. .worktrees/ is gitignored from the main checkout and biome.json's
      own files.includes excludes it (!**/.worktrees); biome resolves the bare "." argument
      against that exclude before walking into it, while an explicit subpath resolves fine.
    found_at: >
      $ git log --format="%H %ai %s" -- .interlock/config.yaml
      1d0c0b4 2026-09-11 23:35:21 -0300 feat(interlock): add lint as a standing gate
      dde8bf8 2026-09-12 00:12:57 -0300 feat(interlock): gate packages/*/src against leaked comments
      (this session's own brief.md: 2026-09-12 00:17)

      grepped the real shared journal directly for every gate-moved event's own "gate" field
      across its full history: 90 typecheck/test/debrief-valid runs, never once "lint" or
      "comments".
    mattered_because: >
      Per AGENTS.md's own Conventions, a gate command is "verified literally the first time it
      can run." This was that first time, for lint, and the command as declared cannot pass in
      the one place every worker session runs -- its own worktree. Fixed at root package.json:
      lint/format/lint:fix now pass biome the explicit top-level paths files.includes already
      names, instead of ".". Verified clean (296 files) from inside this very worktree. See
      notes.yaml, 13:45.
decisions:
  - id: c1
    what: >
      Added readRawEvents(directory) to packages/ledger/src/replay.ts: parses the shared
      journal the same way readReplay does, but returns the flat, unfolded LedgerEvent list
      instead of folding it into a projection. Shares its line-parsing loop with replayFromRaw
      via a new, private parseEvents helper rather than duplicating the parse-and-refuse loop a
      second time.
    because: >
      evidenceOf needs a node's full gate-moved/outcome-set history to catch a person's waive,
      approve, cancel or reset -- and the ledger's own LedgerProjection collapses a node's gates
      and outcome to their current state only (one Gate per id, one Outcome), so a reset that
      later got re-cleared is invisible in the projection's own final state. Reading the raw
      journal, via the parseLine/journalPath the ledger package already exported, is the only
      way back to that history.
    rests_on: []
    hunks:
      - "packages/ledger/src/replay.ts"
      - "packages/ledger/src/index.ts"
    produces:
      - packages/ledger/src/replay.ts
      - packages/ledger/src/index.ts
      - packages/ledger/test/replay.test.ts
    evidence: |
      packages/ledger/test/replay.test.ts's own new "readRawEvents" suite, run against this
      head_sha:

      ✓ readRawEvents > returns the flat event history a projection folds away, unfolded and in order
      ✓ readRawEvents > a directory with no journal yet reads as no events, never a missing-file error
      ✓ readRawEvents > refuses on the same line and tag replayFromRaw would, since both parse the same way
  - id: c2
    what: >
      VerifyResult gains decisionMarks (one entry per debrief.decisions, its own hunk-citation
      marks in order) and discoveryMarks (one entry per debrief.discoveries, its own found_at
      mark), built alongside the existing flat marks array rather than derived from it
      afterward. renderVerification's own parameter narrows to { marks } (a structural subset of
      VerifyResult), since counts-and-render never needed the new fields.
    because: >
      evidenceOf needs to know WHICH decision or discovery a rooted or unrooted mark belongs to.
      The flat marks array's own order (hunk marks, then discovery marks, then unexplained, then
      gaps) is verify.ts's own implementation detail, not a documented contract; slicing it
      elsewhere would silently break the moment that order changed. Building the correlation once,
      where the marks are produced, keeps every existing marks consumer (render.ts, cli/verify.ts,
      their own tests) unchanged.
    rests_on: []
    hunks:
      - "packages/verifier/src/verify.ts"
      - "packages/verifier/src/render.ts"
      - "packages/verifier/src/index.ts"
    produces:
      - packages/verifier/src/verify.ts
      - packages/verifier/src/render.ts
      - packages/verifier/src/index.ts
      - packages/verifier/test/verify.test.ts
  - id: c3
    what: >
      evidenceOf(session) in packages/substrate/src/evidence.ts, deterministic, no model call:
      a rooted decision (every one of its hunk-citation marks rooted) becomes a hypothesis
      decision item scoped to its hunks' one shared path, or the repository when they span more
      than one; a rooted discovery becomes a hypothesis item kinded by discoveryKind.ts's fixed
      word scan (absence/risk/tension/decision); every receipt becomes an observed item,
      discipline or risk by blockedGateIds(outcome) (d2); a person's verb (approve, waive,
      cancel, reset), read off the node's raw gate-moved/outcome-set history via
      personEventsFor, becomes a professed decision item, derivation human:<authority>.
      derivationString.ts renders a ledger Derivation or DebriefDerivation into the plain string
      item@v1's own derivation field requires.
    because: >
      This node's own acceptance, translated literally: "receipts become observed items with
      gate derivation; decisions and discoveries become hypotheses with model derivation... a
      person's verbs with their because become professed items with human derivation." Every
      rule chosen where the brief left a fork is recorded in notes.yaml (12:00-13:03) and in the
      mapping table below.
    rests_on:
      - "brief:What this node builds"
      - notes 12:00Z-13:03Z
    hunks:
      - "packages/substrate/src/evidence.ts"
      - "packages/substrate/src/derivationString.ts"
      - "packages/substrate/src/discoveryKind.ts"
      - "packages/substrate/src/index.ts"
    produces:
      - packages/substrate/src/evidence.ts
      - packages/substrate/src/derivationString.ts
      - packages/substrate/src/discoveryKind.ts
      - packages/substrate/test/evidence.test.ts
      - packages/substrate/test/derivationString.test.ts
      - packages/substrate/test/discoveryKind.test.ts
    evidence: |
      packages/substrate/test/evidence.test.ts, packages/substrate/test/discoveryKind.test.ts and
      packages/substrate/test/derivationString.test.ts together: 26 cases covering every rule
      above, run against this head_sha, all passing (see gates_run_by_agent's own "test" run).
  - id: c4
    what: >
      SubstrateClient.absorb gains a fifth, optional parameter (evidence?: {items, gaps});
      httpClient forwards items/gaps into the POST body only when given. absorb.request.json
      gains two optional, additive fields, "items" (item@v1[]) and "gaps" (parts/gap.json[]),
      both $ref'd from their existing artifact schemas rather than redefined.
    because: >
      The brief's own instruction: "the client's absorb call the previous node built now carries
      the evidence beside the debrief, notes and receipts... add one as an optional array of
      item@v1... if the schema has no field for items." debrief, notes and receipts stay
      required; noneClient and every existing 4-argument absorb call (gateJudge.test.ts's
      noneClient, substrate's own absorb.test.ts) compile and behave unchanged.
    rests_on:
      - "schemas/item@v1.json"
      - "schemas/parts/gap.json"
    hunks:
      - "packages/substrate/src/client.ts"
      - "packages/substrate/src/httpClient.ts"
      - "schemas/substrate/absorb.request.json"
    produces:
      - packages/substrate/src/client.ts
      - packages/substrate/src/httpClient.ts
      - schemas/substrate/absorb.request.json
    rejected: "a required evidence parameter, or folding items/gaps into the existing receipts array"
  - id: c5
    what: >
      interlock evidence <graph> <node> [--session <id>]: resolves the node's judged session
      from the shared journal's own projection (latest by default, or --session), runs
      verifyDebrief against the same repository for each decision's and discovery's own marks,
      reads the node's raw gate-moved/outcome-set history for a person's verb, feeds all of it to
      evidenceOf, and prints a header line of counts (items by kind and standing, gaps, unrooted
      excluded) followed by the items as YAML. A node with no judged session, or an unknown
      --session id, gets a sentence, exit 0. A verifyDebrief refusal degrades to zero marks
      rather than failing the command.
    because: "brief: \"interlock evidence <graph> <node> [--session <id>] prints the items and the gap count... a node with no judged session gets a sentence.\""
    rests_on:
      - "packages/cli/src/verify.ts"
      - "packages/cli/src/session/show.ts"
    hunks:
      - "packages/cli/src/evidence.ts"
      - "packages/cli/src/main.ts"
    produces:
      - packages/cli/src/evidence.ts
      - packages/cli/test/evidence.test.ts
    evidence: |
      $ pnpm interlock evidence 0001-bootstrap verifier-hunks
      (run for real against this repository's own shared journal; full output is the mapping
      table's own verbatim block below, this node's Deliverable 4)
  - id: c6
    what: "Narrowed discoveryItemKind's scan to discovery.what alone (d3)."
    because: d3
    rests_on:
      - d3
    hunks:
      - "packages/substrate/src/discoveryKind.ts"
    produces: []
  - id: c7
    what: >
      gateJudge.ts's absorbDebrief now runs verifyDebrief against the worktree and the just-filed
      debrief, repackages its decisionMarks/discoveryMarks into evidenceOf, and passes the
      resulting {items, gaps} as absorb's new fifth argument. Runs for both a cleared and a held
      outcome, matching absorb's own existing "cleared or held" condition. A new, optional
      GateJudgeRequest/JudgeWorktreeRequest.personEvents field (default []) carries the node's
      raw event history through; a verifyDebrief refusal degrades to empty evidence rather than
      failing the judgement. runner now depends on verifier (a leaf on ledger only, no cycle).
    because: >
      absorb sends the evidence "beside the debrief, notes and receipts" (brief's own words),
      and absorb already runs from inside judgeGates. Every existing gateJudge.test.ts fixture's
      own worktree is a bare temp directory, not a git repo, so the refusal path is the common
      case in that suite today; marks never block, and neither does the evidence built from them.
    rests_on:
      - "packages/verifier/src/verify.ts"
      - "packages/substrate/src/evidence.ts"
    hunks:
      - "packages/runner/src/gateJudge.ts"
      - "packages/runner/src/judgeWorktree.ts"
      - "packages/runner/package.json"
    produces:
      - packages/runner/src/gateJudge.ts
      - packages/runner/src/judgeWorktree.ts
      - packages/runner/test/gateJudge.test.ts
      - pnpm-lock.yaml
    evidence: |
      packages/runner/test/gateJudge.test.ts's own new "absorb carries live evidence" suite, a
      real git fixture (AGENTS.md, a widget.ts addition) against a spy SubstrateClient:

      ✓ absorb carries live evidence > passes items and gaps built from a real verifyDebrief pass to substrate.absorb
      ✓ absorb carries live evidence > degrades to empty evidence, without failing the judgement, when the debrief's range is not real ancestor commits
  - id: c8
    what: >
      interlock run and interlock judge each read the shared journal's raw event list once,
      alongside the ledger they already open, and pass it through
      JudgeWorktreeRequest.personEvents, unfiltered; gateJudge.ts's own absorbDebrief narrows it
      to the node with personEventsFor. A refused read degrades to [] rather than failing the
      run or judge command.
    because: >
      c7's own personEvents field needs a real source at the two places a node is actually
      judged; readRawEvents (c1) was already exported for exactly this.
    rests_on:
      - c1
      - c7
    hunks:
      - "packages/cli/src/run.ts"
      - "packages/cli/src/judge.ts"
    produces: []
  - id: c9
    what: >
      Root package.json's lint/format/lint:fix scripts now pass biome the explicit top-level
      paths biome.json's own files.includes already names (packages, vitest.config.base.ts,
      vitest.setup.ts, scripts) instead of ".".
    because: d5.
    rests_on:
      - d5
    hunks:
      - "package.json"
    produces:
      - package.json
    evidence: |
      $ pnpm lint
      (from inside this worktree, after the fix)
      Checked 296 files in 44ms. No fixes applied.
  - id: c10
    what: >
      This session's own notes.yaml: every choice and surprise recorded across this session's
      work, appended across every commit in this range.
    because: "brief:Deliverable 2"
    rests_on: []
    hunks:
      - ".interlock/sessions/0003-translator/evidence/notes.yaml"
    produces:
      - .interlock/sessions/0003-translator/evidence/notes.yaml
  - id: c11
    what: "This debrief, filed as the final commit in this range, in the debrief@v2 shape debrief-schema defined."
    because: "brief:Deliverable 3"
    rests_on: []
    hunks:
      - ".interlock/sessions/0003-translator/evidence/debrief.yaml"
    evidence: |
      $ pnpm interlock verify 0003-translator evidence
      rooted 27, unrooted 1, unexplained 0, gap 106
      unrooted: ".interlock/sessions/0003-translator/evidence/debrief.yaml" is not a file changed in this range

      The one unrooted mark is this decision's own self-citation -- the same structurally
      unavoidable case 0001-bootstrap/verifier-hunks's own c21 already named: head_sha precedes
      the commit that files this debrief, so the debrief can never appear inside its own diffed
      range.
