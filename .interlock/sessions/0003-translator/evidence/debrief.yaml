open:
  - >
    gate.waived and outcome.reset/cancelled are the only authority-bearing shapes evidenceOf's
    personVerbItem maps (plus gate.satisfied with a human derivation, for approve); gate.superseded
    and outcome.superseded carry an authority and a because the same way, but no CLI command
    produces either today (grepped packages/cli/src and packages/runner/src for "superseded":
    only graph/status.ts's own vocabulary list, no writer). If a future "supersede" verb is
    added, personVerbItem's two switch statements need a third arm each.
  - >
    A decision that cites zero hunks (hunks: [] and produces: []) generates no verifier mark at
    all -- checkHunkCitation runs per citation, not per decision -- so evidenceOf never sees it:
    neither an item nor a count toward "unrooted excluded." This is I4's own named gap ("a
    decision with no hunk... and no mark" is the broken case), pre-existing in the verifier, not
    something this node's evidenceOf is chartered to fix.
  - >
    "A satisfied standing gate" and "a blocked one" (the brief's own phrasing for the receipt
    kind rule) are read as applying uniformly to every declared gate on a node, not only entries
    in .interlock/config.yaml's own standing_gates table -- this repository's own corpus draws no
    real distinction between the two today (every node-declared gate is, per the brief's own
    front matter convention, always an addition to that same standing table). A team whose
    node-declared gates diverge meaningfully from its standing ones may want a real distinction
    here; none exists yet to test against.
  - >
    The ledger's own Outcome and Gate types carry "authority" as a bare string, with no
    person/harness discriminant -- evidenceOf's own harnessAuthorities (c13) is a practical
    exclusion list, not a type-level guarantee that a future harness authority gets named before
    it starts writing professed items nobody asked for. The real fix is a schema change (an
    Authority union, {kind: "human", who} | {kind: "harness", name}, on outcome-v1.json and
    gate-v1.json's own waived/satisfied-with-derivation-human shapes), deferred here because it
    touches every already-persisted outcome and gate fact in this repository's real journal, not
    only this node's own files.
mapping_table: |
  Artifact -> item@v1 kind, standing, derivation. The full reasoning for each row is in this
  session's own decisions (c1-c9 for the original rules; c12-c15 for this review-fix pass's own
  corrections), above.

  | artifact | condition | kind | standing | derivation |
  | --- | --- | --- | --- | --- |
  | receipt | referenced by a gate-moved to satisfied or waived, for this node, naming this exact receipt id | discipline | observed | gate:<gate>:<version>:<runner> (or model:.../human:... by the receipt's own derivation kind) |
  | receipt | never so referenced (a since-superseded attempt, or a real block) | risk | observed | as above |
  | decision | every hunk-citation mark rooted, hunks span exactly one path | decision | hypothesis, scoped to that path | agent:<runtime>:<model> or human:<who> (the debrief's own derivation) |
  | decision | every hunk-citation mark rooted, hunks span more than one path | decision, scoped to the repository, plus a gap naming the flattened paths | hypothesis | as above |
  | decision | any mark unrooted, or zero hunks (no mark at all) | excluded; unrooted ones counted in "unrooted excluded" | -- | -- |
  | discovery | rooted, "what" names a tension explicitly | tension | hypothesis, scoped to the mark's rooted hunk (or the repository, when that hunk is the verifier's own "command" or "out-of-band citation" sentinel) | as decisions, above |
  | discovery | rooted, "what" names something missing (no/not/nothing/none/missing/nowhere/never/absent/lacks), no tension match | absence | hypothesis, scoped as above | as decisions, above |
  | discovery | rooted, "what" names a conflict (conflict/contradict/clash/disagree/mismatch/inconsistent/collide/versus), no tension or absence match | risk | hypothesis, scoped as above | as decisions, above |
  | discovery | rooted, none of the above | decision | hypothesis, scoped as above | as decisions, above |
  | discovery | unrooted | excluded; counted in "unrooted excluded" | -- | -- |
  | gate-moved, to waived, authority not one of runner's own HARNESS_AUTHORITIES | -- | decision | professed | human:<authority> |
  | gate-moved, to waived, authority a harness's (the sweeper's, today) | -- | excluded; no item at all | -- | -- |
  | gate-moved, to satisfied, receipt.derivation.kind human | -- | decision | professed | human:<who> |
  | gate-moved, to approved, on the graph-level node ({graph, id: graph}) for the node's own session | -- | decision | professed | human:<who> -- the graph's own approval authorises every node in it |
  | outcome-set, cancelled or reset, authority not one of HARNESS_AUTHORITIES | -- | decision | professed | human:<authority> |
  | outcome-set, cancelled or reset, authority a harness's | -- | excluded; no item at all | -- | -- |
  | vocabulary-gap mark | -- | not an item; travels as absorb's own "gaps" field | -- | -- |

  Notes on fit: discipline/risk were judged a good fit for the vocabulary as given (no gap
  recorded); "satisfied standing gate" is read as every declared gate uniformly (open item,
  above). item@v1's scope is a single value, never a list, so a decision citing hunks in more
  than one path is scoped to the repository and the paths it flattened travel as a gap instead of
  an arbitrary pick among them; a single-path decision is scoped to that path, and a discovery to
  its own rooted hunk the same way. HARNESS_AUTHORITIES (packages/runner/src/sweep.ts) names the
  sweeper today; a future harness authority joins that same set rather than a second one. This
  table's own discovery-kind row order now matches discoveryKind.ts's real precedence -- tension,
  then absence, then conflict, else decision -- which it read looser than before this pass
  (absence, then conflict, then tension).
