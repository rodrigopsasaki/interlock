      held alike, since absorbDebrief already ran unconditionally before outcome-set.
    because: >
      The gate that proves this feature (pnpm --filter substrate --fail-if-no-match test
      --testNamePattern acknowledged) only runs packages/substrate's own tests, and substrate is a
      leaf package (depends on debrief and ledger only, per the substrate-client node's own
      notes.yaml) -- so the counting logic has to be testable from inside substrate without a fake
      worktree or the verifier package.
    rests_on: []
    hunks:
      - "packages/runner/src/gateJudge.ts:1-14"
      - "packages/runner/src/gateJudge.ts:327-348"
    produces:
