open:
  - >-
    The fixture policy is inferred from the smoke run's two observations, not taken from the
    runtime. If the real rule differs (it also protects sibling worktrees' git dirs, or denies
    metadata with no explicit-root exception), the proof passes while the runtime still refuses.
    The real check is a live smoke run in a sandboxed pane once this merges, before that runtime
    routes builds.
  - >-
    Signing is untouched and still blocks a sandboxed commit with signing on; the owner decides
    his commit identity, per the graph's read.
  - >-
    No change is owed to this machine's real catalogue: an entry with writable_root_args:
    [--add-dir, "{path}"] now gets two --add-dir pairs from the rebuilt runner.
