decisions:
  - id: typed-git-index-scope
    what: >-
      Carry Git index entries as typed file or gitlink scope entries, retaining the recorded
      gitlink commit and preserving the path-only projection for existing context consumers.
    because: >-
      A mode 160000 index entry names a commit rather than a readable file. Reading the index with
      NUL-delimited records makes that distinction independent of the checkout and keeps paths
      containing line breaks intact.
    rests_on:
      - packages/runner/src/scope.ts
      - packages/ledger/src/receipt.ts
      - .interlock/sessions/0059-submodule-receipts-2/gitlinks-hash-commit/notes.yaml
    hunks:
      - packages/runner/src/scope.ts
      - packages/ledger/src/receipt.ts
      - packages/runner/src/index.ts
      - packages/cli/src/plan.ts
  - id: framed-gitlink-receipts
    what: >-
      Keep the legacy gate-path-bytes file hashing stream for file-only scopes and use a leading
      NUL plus eight-byte big-endian length framing for every gate, path and content in scopes
      containing a gitlink.
    because: >-
      Existing file-only receipts must remain byte-identical, while kind bytes and explicit lengths
      keep mixed scopes and adversarial file/gitlink pairs unambiguous. Gitlink content comes from
      the index commit id, so checkout edits, missing directories and uninitialized submodules do
      not change the receipt.
    rests_on:
      - packages/ledger/src/receipt.ts
      - packages/runner/test/submoduleReceipts.test.ts
    hunks:
      - packages/ledger/src/receipt.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/src/backfill.ts
      - packages/runner/src/judgeWorktree.ts
      - packages/cli/src/gate/clear.ts
      - packages/runner/test/submoduleReceipts.test.ts
  - id: refuse-nul-gates
    what: >-
      Reject gate ids containing NUL at receipt hashing, graph loading, brief gate parsing and the
      gate-declaration schema with one readable refusal line.
    because: >-
      The framed receipt encoding begins with NUL, so allowing that byte in a gate id would make
      the legacy and framed encodings ambiguous. The shared predicate and explanation keep the
      three runtime boundaries aligned, and the schema rejects the persisted declaration too.
    rests_on:
      - packages/ledger/src/receipt.ts
      - packages/face/src/document.ts
      - packages/debrief/src/briefGate.ts
      - schemas/parts/gate-declaration.json
      - packages/runner/test/submoduleReceipts.test.ts
      - packages/schemas/test/gateDeclaration.test.ts
    hunks:
      - packages/ledger/src/receipt.ts
      - packages/face/src/document.ts
      - packages/debrief/src/briefGate.ts
      - schemas/parts/gate-declaration.json
      - packages/schemas/test/gateDeclaration.test.ts
  - id: real-submodule-proof
    what: >-
      Add a real local-submodule fixture proof covering judging, recorded-commit changes, working
      checkout changes, uninitialized and missing submodules, file/gitlink collisions, mixed
      framing, ordering and the fixed file-only receipt id.
    because: >-
      The acceptance depends on Git index truth and on framing boundaries that synthetic path
      inputs alone cannot establish; the fixture exercises those conditions through local Git
      repositories without network access.
    rests_on:
      - packages/runner/test/submoduleReceipts.test.ts
      - packages/schemas/test/gateDeclaration.test.ts
    hunks:
      - packages/runner/test/submoduleReceipts.test.ts
      - packages/schemas/test/gateDeclaration.test.ts
      - packages/cli/src/face/world.ts
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/graph/show.ts
      - packages/cli/src/judge.ts
      - packages/cli/src/position.ts
      - packages/cli/src/run.ts
      - packages/cli/src/plan.ts
      - packages/ledger/src/index.ts
