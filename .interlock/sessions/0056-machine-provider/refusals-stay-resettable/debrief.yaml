decisions:
  - id: probe-herdr-with-ping
    what: Make the herdr adapter probe liveness with ping, normalize a missing launch socket to the not-ready refusal, and make the fake server reject unsupported methods with herdr's invalid_request unknown-variant shape.
    because: The real herdr server serves ping but not server.status; matching the fake's unknown-method response to the real protocol prevents tests from accepting an unavailable method.
