decisions:
  - id: classify-refusals-by-disposition
    what: Model refusal steps as a closed discriminated union, with abandon steps separate from brief, code, and debrief commit steps; append a failed outcome only for a commit step on runner custody.
    because: The acceptance permits a failed outcome only for the four runner commit refusal classes, while runtime, setup, launch, prompt, wait, and gate refusals must leave the node resettable.
    rests_on:
      - packages/runner/src/sessionDrive.ts:136-165
      - packages/runner/src/sessionDrive.ts:260-270
    hunks:
      - packages/runner/src/sessionDrive.ts:136-165
      - packages/runner/src/sessionDrive.ts:260-270
      - packages/runner/src/sessionDrive.ts:291-318
      - packages/runner/src/sessionDrive.ts:488-551
      - packages/runner/src/sessionDrive.ts:607-613
    produces:
      - packages/runner/src/sessionDrive.ts
  - id: preflight-before-launch-state
    what: Create and check the runtime before reading the launch base into worktree setup, and return the preflight refusal before a worktree, session event, or lease can be written.
    because: A stale socket must not turn an unavailable runtime into a partially recorded launch or a decided node.
    rests_on:
      - packages/runner/src/sessionDrive.ts:198-224
      - packages/runner/src/sessionDrive.ts:241-258
    hunks:
      - packages/runner/src/sessionDrive.ts:198-217
    produces:
      - packages/runner/src/sessionDrive.ts
  - id: keep-runtime-wording-behind-the-adapter
    what: Let the herdr adapter query server.status and carry the exact not-ready sentence through the generic runtime refusal boundary; map a missing herdr socket to the same launch refusal without changing direct adapter no-socket behavior.
    because: The runner needs one stable preflight message, while the generic runtime seam must not name herdr or depend on a multiplexer protocol.
    rests_on:
      - packages/runner/src/runtime.ts:66-118
      - packages/runner/src/herdr/adapter.ts:388-405
      - packages/runner/src/herdr/adapter.ts:614-622
    hunks:
      - packages/runner/src/runtime.ts:66-118
      - packages/runner/src/herdr/adapter.ts:388-405
      - packages/runner/src/herdr/adapter.ts:614-622
    produces:
      - packages/runner/src/runtime.ts
      - packages/runner/src/herdr/adapter.ts
  - id: prove-resettable-refusals
    what: Add fixture coverage for server preflight, worktree setup, agent start, and an unjudged wait, asserting that each returns non-zero without an outcome; extend the fake adapter with a controllable server status.
    because: The regression must distinguish resettable refusals from the existing runner commit refusal proof and must observe that preflight opens no pane and appends no ledger event.
    rests_on:
      - packages/runner/test/refusalOutcomes.test.ts:57-129
      - packages/runner/test/herdr/fakeServer.ts:21-25
      - packages/runner/test/herdr/fakeServer.ts:183-186
    hunks:
      - packages/runner/test/refusalOutcomes.test.ts:57-129
      - packages/runner/test/herdr/fakeServer.ts:21-25
      - packages/runner/test/herdr/fakeServer.ts:111-118
      - packages/runner/test/herdr/fakeServer.ts:183-186
      - packages/runner/test/herdr/adapter.test.ts:157-180
    produces:
      - packages/runner/test/refusalOutcomes.test.ts
      - packages/runner/test/herdr/fakeServer.ts
      - packages/runner/test/herdr/adapter.test.ts
