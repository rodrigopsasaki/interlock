    result: pass
    invocation: mise exec -- pnpm --filter debrief --filter cli typecheck
  - id: focused-derived-handoff
    result: pass
    invocation: mise exec -- pnpm --filter debrief --filter cli --fail-if-no-match test
    note: Debrief's 70 tests and derived-handoff's 8 tests passed before an unrelated CLI repository-origin timeout made the aggregate command fail.
  - id: focused-opening-handoff
    result: pass
    invocation: mise exec -- pnpm --filter runner exec vitest run test/openingPrompt.test.ts
    note: 10 tests passed.
