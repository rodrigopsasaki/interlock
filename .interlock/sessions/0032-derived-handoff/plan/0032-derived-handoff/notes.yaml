interlock: notes@v0
node: plan/0032-derived-handoff
entries:
  - kind: choice
    at: "2026-09-16T11:41:23Z"
    chose: "Derive the implementation handoff from the published graph and debrief contracts, the cleared graph corpus, and source checks of the named workflow boundaries."
    because: "The ask requires a usable truthful workflow and explicitly makes supplied context provisional, so the plan must separate verified constraints from unrecorded authorship input before it decomposes work."
  - kind: choice
    at: "2026-09-16T11:43:48Z"
    chose: "Plan a creation-and-selection handoff that derives identity from the immutable brief, one typed session-started record, and Git, while requiring an explicit authored derivation declaration."
    because: "The current session record has graph, node, role, acceptance, gates, scope, session id, and graph base but no runtime/model identity; accepting a guessed derivation would make the required v2 field untruthful. Ordinary revise also does not compare candidate head_sha with Git, so selection must refuse a stale source head and direct the worker to regenerate the candidate after committing source changes."
  - kind: choice
    at: "2026-09-16T11:46:11Z"
    chose: "Keep the implementation graph to one independently executable node with a graph-level approval gate and one focused debrief/CLI proof gate."
    because: "Creation, identity proof, authored derivation input, first filing, revision custody, and stale-head refusal are one inseparable worker handoff; splitting them would leave an unusable partial workflow or make a dependency edge carry unproved behavior."
  - kind: surprise
    at: "2026-09-16T11:47:06Z"
    expected: "Requiring candidate head_sha to equal current Git HEAD in revise would complete the derived workflow without changing compatible historical correction behavior."
    observed: "Review identified that ordinary revisions can deliberately retain a source head below later metadata or debrief commits, so a global equality check would break an existing valid workflow."
  - kind: choice
    at: "2026-09-16T11:47:06Z"
    chose: "Keep ordinary revise unchanged and plan an explicit derived-filing door that owns first filing, source-head proof, and atomic no-clobber creation."
    because: "The new workflow needs stronger current-head evidence only for candidates it creates, while historical corrections retain their existing identity and custody semantics. A no-replace install is required because an existence check alone cannot protect a concurrently created canonical debrief."
