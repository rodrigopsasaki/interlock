decisions:
  - id: bounded-control-and-close
    applies_to: { kind: path, path: packages/runner/src/execRuntime.ts }
    what: Bound the full anchor control request, including connection establishment, and bound both launcher-close waits on the timeout path.
    because: A control socket that never connects or a launcher close event that never arrives must not leave runExecPhase waiting forever after the child end or run timeout has already been observed.
    rests_on:
      - .interlock/graphs/0060-headless-runtime.yaml
      - packages/runner/src/execRuntime.ts
    hunks:
      - packages/runner/src/execRuntime.ts:232-249
      - packages/runner/src/execRuntime.ts:732-757
  - id: short-ready-anchor
    applies_to: { kind: path, path: packages/runner/src/execRuntime.ts }
    what: Place each ephemeral control socket in the short per-user private temporary directory and publish the launcher anchor only after the control server is listening.
    because: The worktree-relative socket path exceeded macOS's Unix-socket path budget and the old early anchor publication made a failed listen look ready, allowing the runner to wait on a dead anchor.
    rests_on:
      - .interlock/graphs/0060-headless-runtime.yaml
      - packages/runner/src/execRuntime.ts
      - packages/runner/src/execLauncher.ts
    hunks:
      - packages/runner/src/execRuntime.ts:527-532
      - packages/runner/src/execLauncher.ts:151-154
