decisions:
  - id: ordered-transcript-writer
    what: Route native transcript writes and injected test writes through one serialized writer that records failures, seals stream lines at the drain boundary, and keeps runner lines ordered behind already-ready lines.
    because: The acceptance requires one writer for stdout, stderr, stream tails, and runner lines, while a held or failed write must not prevent bounded terminal publication.
    rests_on:
      - packages/runner/src/execRuntime.ts:137-184
      - packages/runner/src/execRuntime.ts:260-343
    hunks:
      - packages/runner/src/execRuntime.ts:137-184
      - packages/runner/src/execRuntime.ts:260-343
  - id: normal-stream-drain
    what: Attach stream delivery before launcher input, normalize chunks and tails in ready order, require normal end plus completed writes, and treat an explicitly destroyed stream as incomplete.
    because: The old handlers started after go, counted destroyed streams as ended, and allowed independent chunk promises to reorder stdout, stderr, and runner lines.
    rests_on:
      - packages/runner/src/execRuntime.ts:590-754
      - packages/runner/src/execRuntime.ts:917-925
    hunks:
      - packages/runner/src/execRuntime.ts:590-754
      - packages/runner/src/execRuntime.ts:917-925
  - id: bounded-terminal-finalization
    what: Finalize early launch failures and normal phases through the same capture result, bounded settle timers, group confirmation text, and closing runner line before publishing the terminal record.
    because: Every terminal path must retain launcher diagnostics, name failed or unsettled writes, avoid stream lines after the closing line, and tell confirmed group emptiness from an unconfirmed result.
    rests_on:
      - packages/runner/src/execRuntime.ts:756-814
      - packages/runner/src/execRuntime.ts:948-1097
      - packages/runner/src/execRuntime.ts:1201-1258
    hunks:
      - packages/runner/src/execRuntime.ts:756-814
      - packages/runner/src/execRuntime.ts:948-1097
      - packages/runner/src/execRuntime.ts:1201-1258
  - id: deterministic-capture-proof
    what: Add the ten named capture-drain cases, controlled transcript sink/timers/stream delivery, early-failure launcher fixture, and many-line real-program fixture.
    because: The acceptance requires deterministic proof of held tails, ordering, grace and settle bounds, failed writes, destroyed streams, early launcher diagnostics, and real multi-line capture without a test-only production switch.
    rests_on:
      - packages/runner/test/captureDrains.test.ts:1-422
      - packages/runner/test/fixtures/exec/earlyFailLauncher.mjs:1-2
      - packages/runner/test/fixtures/exec/manyLines.mjs:1-4
    hunks:
      - packages/runner/test/captureDrains.test.ts:1-422
      - packages/runner/test/fixtures/exec/earlyFailLauncher.mjs:1-2
      - packages/runner/test/fixtures/exec/manyLines.mjs:1-4
