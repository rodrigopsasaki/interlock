decisions:
  - id: preserve-git-status-diagnostics
    what: >-
      Route scope-guard's Git common-directory and main-checkout status reads through the owned
      command adapter, so a failed Git process carries its stderr into the recorded refusal; add a
      real fixture regression for a refused status command.
    because: >-
      The reported full-run refusal exposed only Node's generic command-failed text, so it could
      not distinguish a lock, missing path, maintenance writer, or another Git-side cause. The
      existing adapter already retains stderr at this boundary without changing scope ownership.
    rests_on:
      - packages/runner/src/scopeGuard.ts:46-69
      - packages/runner/src/scopeGuard.ts:81-94
    hunks:
      - packages/runner/src/scopeGuard.ts:1-6
      - packages/runner/src/scopeGuard.ts:46-69
      - packages/runner/src/scopeGuard.ts:81-94
      - packages/runner/test/scopeGuard.test.ts:194-209
