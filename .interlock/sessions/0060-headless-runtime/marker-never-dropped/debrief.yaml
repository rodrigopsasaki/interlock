decisions:
  - id: effective-codex-policy
    what: >-
      Added the Codex adapter policy that reads the effective base, selected profile, project and
      -c configuration, reconciles configured stdio servers with `codex mcp list --json`, refuses
      discovery/configuration failures and marker conflicts by server name, and returns a typed
      delivered-or-refused result to the runner.
    because: >-
      The marker must be delivered to every configured stdio server or the launch must be refused;
      generic orchestration cannot establish that invariant from inherited environment narration.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/brief.md
      - packages/runner/src/codex/config.ts
    hunks:
      - packages/runner/src/codex/config.ts:300-327
      - packages/runner/src/codex/config.ts:333-366
      - packages/runner/src/codex/config.ts:456-504
      - packages/runner/src/sessionDrive.ts:106-165
      - packages/runner/test/runnerMarker.test.ts:159-192
    applies_to: { kind: repository }
    produces:
      - packages/runner/src/codex/config.ts
      - packages/runner/src/sessionDrive.ts
      - packages/runner/test/runnerMarker.test.ts
  - id: owner-home-links
    what: >-
      Changed overflow overlays to symlink every existing owner CODEX_HOME entry except the
      generated config.toml and marker profile, while cleanup removes only the temporary overlay
      directory. Added a fixture proving auth.json has the owner's inode, writes through to the
      owner file, credential-like entries are not regular overlay files, and owner sessions survive
      cleanup.
    because: >-
      Copying auth.json would create an impermissible credential copy and would leave Codex logged
      out of the overflow launch. Links keep auth refreshes, sessions, history and logs in the
      owner's home without making cleanup responsible for any target.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/brief.md
      - packages/runner/src/codex/config.ts
      - packages/runner/test/markerNeverDropped.test.ts
    hunks:
      - packages/runner/src/codex/config.ts:406-454
      - packages/runner/test/markerNeverDropped.test.ts:96-136
    applies_to: { kind: path, path: packages/runner/src/codex/config.ts }
    produces:
      - packages/runner/src/codex/config.ts
      - packages/runner/test/markerNeverDropped.test.ts
  - id: overflow-overlay-delivery
    what: >-
      Retained UTF-8 byte-length selection between argv and a launch-local CODEX_HOME profile
      overlay, copying only generated config/profile files and composing marker env entries for
      every configured stdio server.
    because: >-
      Codex's stdio environment is assembled from its effective configuration, so inheriting the
      runner environment cannot prove marker delivery after argv exceeds the terminal limit. The
      generated profile carries the values while the owner-home links preserve the owner's state.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/brief.md
      - packages/runner/src/codex/config.ts
      - packages/runner/test/markerNeverDropped.test.ts
    hunks:
      - packages/runner/src/codex/config.ts:372-404
      - packages/runner/src/codex/config.ts:470-539
      - packages/runner/test/markerNeverDropped.test.ts:68-94
      - packages/runner/test/markerNeverDropped.test.ts:138-194
    applies_to: { kind: repository }
    produces:
      - packages/runner/src/codex/config.ts
      - packages/runner/test/markerNeverDropped.test.ts
  - id: all-codex-launch-phases
    what: >-
      Routed pane launches and exec-phase Codex launches through the same prepared launch result,
      passed its prepared arguments and environment to the actual start path, and invoked overlay
      cleanup from the session's finalization path; extended PreparedLaunch with the optional
      cleanup contract.
    because: >-
      A marker policy that covers only the pane opening path still leaves exec phases unmarked,
      and an overlay that is not cleaned up would violate the launch-local ownership boundary.
    rests_on:
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/runtime.ts
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/brief.md
    hunks:
      - packages/runner/src/sessionDrive.ts:512-542
      - packages/runner/src/sessionDrive.ts:752-761
      - packages/runner/src/sessionDrive.ts:1183-1223
      - packages/runner/src/runtime.ts:47-54
    applies_to: { kind: path, path: packages/runner/src/sessionDrive.ts }
    produces:
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/runtime.ts
  - id: real-child-delivery-proof
    what: >-
      Kept codex mcp list as configuration-validity evidence and added a protocol-capable stdio
      fixture that records its process environment. The real overflow test forces the overlay,
      launches actual `codex exec`, and asserts all four configured fixture children record the
      three marker values; it skips only when an authentication failure starts no child.
    because: >-
      Serialized transport.env proves only Codex configuration, not the environment inherited by
      the child process. The child record is the required delivery proof, while the local fixture
      avoids Dialeto and owner credentials. This Codex installation attempted the model request
      and returned 401, but started all MCP children before that request, so the proof remained
      active rather than being skipped.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/brief.md
      - packages/runner/test/realCodexMarkerOverflow.test.ts
      - packages/runner/test/fixtures/codex/recordMcpEnvironment.mjs
    hunks:
      - packages/runner/test/realCodexMarkerOverflow.test.ts:18-63
      - packages/runner/test/realCodexMarkerOverflow.test.ts:65-129
      - packages/runner/test/fixtures/codex/recordMcpEnvironment.mjs:1-37
    applies_to: { kind: repository }
    produces:
      - packages/runner/test/realCodexMarkerOverflow.test.ts
      - packages/runner/test/fixtures/codex/recordMcpEnvironment.mjs
  - id: session-receipts
    what: >-
      Appended typed notes for the two acceptance repairs, Codex CLI surprises, focused proofs,
      isolated full-test rerun and final pinned-toolchain gate counts, retaining the dependency
      session's marker notes.
    because: >-
      The brief requires every choice and surprise to keep a way back, and the revised debrief must
      close those notes beside the repaired diff.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/notes.yaml
      - .interlock/sessions/0060-headless-runtime/marker-configured-servers-only/notes.yaml
    hunks:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/notes.yaml:1-99
      - .interlock/sessions/0060-headless-runtime/marker-configured-servers-only/notes.yaml:1-39
    applies_to:
      kind: path
      path: .interlock/sessions/0060-headless-runtime/marker-never-dropped/notes.yaml
    produces:
      - .interlock/sessions/0060-headless-runtime/marker-never-dropped/notes.yaml
      - .interlock/sessions/0060-headless-runtime/marker-configured-servers-only/notes.yaml
