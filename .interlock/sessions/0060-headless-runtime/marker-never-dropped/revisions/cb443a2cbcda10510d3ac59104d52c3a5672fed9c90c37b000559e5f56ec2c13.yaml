    gap: Codex built-in and plugin-provided servers remain outside this proof because they have no
    configuration table that can carry the marker; the delivered/refused contract covers every
    configured stdio server.
  - >-
    note: The full workspace test and lint gates passed, while existing fixture-maintenance Git
    warning lines and runnerCommits.test.ts warning/info remain outside this node's source scope.
