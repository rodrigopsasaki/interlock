decisions:
  - id: wrapper-process-semantics
    what: >-
      Make state-folder-untouched pass an explicit copy of the caller environment, the repository
      cwd, and inherited stdin, stdout, and stderr to its command, and map signal termination to 128
      plus the signal number. Add fake-account tests that verify environment and cwd pass-through,
      ordinary exit codes, and signal exit codes without touching the real interlock state folder.
    because: >-
      The two judge-only failures did not reproduce in a direct focused run or in a fake-account
      wrapper reproduction; preserving direct-run process semantics removes the wrapper's implicit
      defaults as a source of divergence while retaining snapshots as its only extra behavior.
    applies_to: { kind: repository }
    rests_on:
      - "notes:surprise-2026-11-08T20:58:00Z"
      - "notes:choice-2026-11-08T20:59:00Z"
      - scripts/state-folder-untouched.ts:145-194
      - packages/runner/test/miseStateOutside.test.ts:195-242
    hunks:
      - scripts/state-folder-untouched.ts:145-194
      - packages/runner/test/miseStateOutside.test.ts:195-242
  - id: fixture-repository-scans
    what: >-
      Make the live-state and concurrent-allocation link scans use a disposable Git repository under
      the system temporary directory, and let allocateToolState validate its temporary state against
      the repository supplied by each scan fixture.
    because: >-
      The shared worktree is concurrently changing as Vitest runs other files, so walking it can
      observe an unrelated test/.runs entry disappearing and report ENOENT. The proof needs to show
      that tool state stays outside its protected repository, without coupling it to another test's
      scratch-directory lifecycle.
    applies_to: { kind: path, path: packages/runner/test/miseStateOutside.test.ts }
    rests_on:
      - packages/runner/test/miseStateOutside.test.ts:37-41
      - packages/runner/test/miseStateOutside.test.ts:70-80
      - packages/runner/test/support/toolState.ts:39-50
    hunks:
      - packages/runner/test/miseStateOutside.test.ts:37-41
      - packages/runner/test/miseStateOutside.test.ts:70-80
      - packages/runner/test/support/toolState.ts:39-50
  - id: child-scoped-interruption
    what: >-
      Make the interrupted-run proof spawn one child that creates its temporary state link, terminate
      that child through its ChildProcess handle, wait for its exit, and scan the disposable fixture
      repository afterwards.
    because: >-
      The interruption proof must show that only the child under test is signaled; a process-group
      signal could explain unrelated one-off failures in runnerCommits.test.ts and runnerMarker.test.ts.
    applies_to: { kind: path, path: packages/runner/test/miseStateOutside.test.ts }
    rests_on:
      - packages/runner/test/miseStateOutside.test.ts:43-57
      - packages/runner/test/miseStateOutside.test.ts:84-108
    hunks:
      - packages/runner/test/miseStateOutside.test.ts:1-18
      - packages/runner/test/miseStateOutside.test.ts:43-57
      - packages/runner/test/miseStateOutside.test.ts:84-108
