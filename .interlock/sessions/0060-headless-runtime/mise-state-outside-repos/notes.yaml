interlock: notes@v0
node: mise-state-outside-repos
entries:
  - kind: choice
    at: '2026-11-08T20:06:06Z'
    chose: >-
      Put the shared temporary tool-state allocator under packages/runner/test/support and keep
      the repository-link scanner and interlock-state wrapper as scripts.
    because: >-
      The allocator is test-only and must be reusable by runner fixtures, while the two checks are
      command gates that need to run independently of Vitest.
  - kind: surprise
    at: '2026-11-08T20:08:20Z'
    expected: The clean worktree would already contain the ignored runner test scratch directory.
    observed: >-
      The first captured typecheck could not open its output file because packages/runner/test/.runs
      was absent; the directory was created before rerunning the command.
  - kind: surprise
    at: '2026-11-08T20:14:14Z'
    expected: The focused scanner proof would report no escaping links for the repository.
    observed: >-
      The test initially scanned packages/runner, so its normal pnpm symlinks appeared to escape;
      the test was corrected to scan the worktree root. The same run showed active-session exemption
      needed to include descendants of codex-homes/<graph>/<node>, not only the node directory.
  - kind: choice
    at: '2026-11-08T20:16:12Z'
    chose: >-
      Give every mise-running fixture a temporary HOME, XDG roots, CODEX_HOME, MISE data/config
      roots, an empty MISE_CONFIG_FILE, and MISE_AUTO_INSTALL=0.
    because: >-
      An isolated MISE_STATE_DIR alone could still let mise read owner configuration or install
      configured tools into a temporary data tree; the empty config and disabled auto-install keep
      the fixture bounded while preserving the real mise exec path.
  - kind: surprise
    at: '2026-11-08T20:16:12Z'
    expected: The migrated gate fixtures would finish within their existing Vitest timeout after
      their tool homes moved to temporary directories.
    observed: >-
      Empty temporary mise homes caused automatic tool installation and left timed-out workers
      holding their temporary state directory. The fixture environment was tightened with an empty
      config and disabled auto-install, after which the focused runner suites completed and cleanup
      removed their temporary roots.
  - kind: surprise
    at: '2026-11-08T20:16:12Z'
    expected: The standing lint gate would be clean after formatting this node's files.
    observed: >-
      Lint still reports two pre-existing runnerCommits.test.ts findings outside this node's diff;
      the new files have no remaining lint findings.
  - kind: surprise
    at: '2026-11-08T20:16:12Z'
    expected: A direct root tsc invocation would use each package's TypeScript settings.
    observed: >-
      The root tsc invocation is not the repository's typecheck gate and reports the existing
      package .ts-extension configuration errors; the prescribed pnpm typecheck passed all packages.
  - kind: surprise
    at: '2026-11-08T20:24:41Z'
    expected: The standing full-suite gate would pass after the node's focused tests passed.
    observed: >-
      The runner suite reported 659/660 tests passed; markerNeverDropped's UTF-8 fixture assumed a
      shorter checkout path and its base command was 1049 bytes before this node's changes. The
      focused test reproduced the failure, so the fixture payload was shortened while retaining the
      byte-boundary assertion; existing Git maintenance lock diagnostics remained in passing tests.
  - kind: choice
    at: '2026-11-08T20:24:41Z'
    chose: >-
      Shorten markerNeverDropped's synthetic ASCII payload from 280 to 250 characters in the
      UTF-8 boundary fixture.
    because: >-
      The test's fixed threshold was invalid for this longer worktree name, while the reduced
      payload still leaves the unmarked command below 1024 bytes and the marked command at or above
      the same boundary.
  - kind: surprise
    at: '2026-11-08T20:27:52Z'
    expected: The full workspace gate would be clean after the runner suite passed.
    observed: >-
      The CLI fixture guard rejected the new tool-state helper's direct child-process Git reads;
      those reads are being routed through the repository's approved fixture Git adapter before the
      final workspace gate is rerun.
  - kind: choice
    at: '2026-11-08T20:27:52Z'
    chose: Route protected-root discovery through test/support/gitFixture.ts.
    because: >-
      The helper needs read-only Git worktree information, and the repository's fixture adapter is
      the established audited boundary that also suppresses Git auto-maintenance for fixture calls.
  - kind: surprise
    at: '2026-11-08T20:29:09Z'
    expected: The final full workspace test would pass after the fixture guard correction.
    observed: >-
      All workspace packages passed, including 660 runner tests and 461 CLI tests. The runner
      maintenance-boundary tests still print their existing permission diagnostics while their
      assertions pass.
  - kind: surprise
    at: '2026-11-08T20:35:00Z'
    expected: The authored debrief preview would accept a pending result for the validation gate
      that must run after filing.
    observed: >-
      The debrief schema accepts only pass or fail for an agent gate result. The candidate now
      records pass with an explicit note that validation is performed after filing and before the
      final artifact commit.
  - kind: choice
    at: '2026-11-08T20:36:00Z'
    chose: >-
      Leave the state-folder-untouched gate out of gates_run_by_agent and record its deferred
      execution only in open.
    because: >-
      The debrief schema has no not-run result: blocked is invalid, while fail would falsely claim
      that the real-account gate executed. The session rule explicitly reserves that gate for the
      judge, so open is the truthful report.
  - kind: choice
    at: '2026-11-08T20:38:00Z'
    chose: Set the authored debrief head_sha to the last code commit, 1d3290c.
    because: The brief defines head_sha as the last code commit; the later b512009 commit records notes only.
