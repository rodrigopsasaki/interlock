  - kind: surprise
    at: "2026-11-08T14:05:20Z"
    expected: A real Codex MCP child would inherit the shell_environment_policy.set values moved into the overlay profile.
    observed: The real Codex MCP child received the three runner markers, while the shell policy values are for Codex shell execution and were absent from the MCP child environment.
  - kind: surprise
    at: "2026-11-08T14:07:00Z"
    expected: The foreground typecheck command could be polled by matching its process name.
