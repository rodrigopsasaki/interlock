entries:
  - kind: choice
    at: "2026-11-08T13:58:49Z"
    chose: Keep the existing argv construction for launches below the limit and change only the overflow reconstruction.
    because: The acceptance requires the argv path to remain unchanged, while the overlay path is the escape hatch for generated Codex configuration.
  - kind: choice
    at: "2026-11-08T13:58:49Z"
    chose: Move a generated shell environment key into the overlay profile only when neither the trusted project config nor runtime selectors set that key.
    because: A profile is below project and command-line layers, so conflicting keys must retain the generated command-line override to preserve the effective value.
  - kind: choice
    at: "2026-11-08T13:58:49Z"
    chose: Emit generated MCP marker overrides and shell environment settings under explicit TOML table headers.
    because: Appending bare dotted assignments after a selected profile table can make them members of that prior table instead of the intended Codex sections.
