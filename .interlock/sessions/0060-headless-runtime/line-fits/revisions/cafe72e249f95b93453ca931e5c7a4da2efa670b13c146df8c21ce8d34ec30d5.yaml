    what: The generated overlay writes marker environments and moved shell policy values under explicit TOML tables, after the selected profile text, while retaining the existing base config and linked owner state.
    because: Explicit headers prevent generated assignments from being nested in a selected profile's final table, while copying the base and linking owner state preserves existing Codex configuration semantics.
