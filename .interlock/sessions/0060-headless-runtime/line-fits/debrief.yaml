decisions:
  - id: c1
    what: The overflow path now keeps generated shell-environment overrides on argv only when trusted project configuration or runtime -c selectors set the same key, and moves every other runner environment key into the overlay profile.
    because: Profile precedence is lower than project and command-line precedence, so only conflicting keys need their generated override retained on argv to preserve the effective value.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
    hunks:
      - packages/runner/src/codex/config.ts:247-390
      - packages/runner/src/codex/config.ts:472-495
      - packages/runner/src/codex/config.ts:634-652
    rejected: Moving every generated key would let the higher-precedence project or runtime value change the effective shell environment.
  - id: c2
    what: The generated overlay writes marker environments and moved shell policy values under explicit TOML tables, after the selected profile text, while retaining the existing base config and linked owner state.
    because: Explicit headers prevent generated assignments from being nested in a selected profile's final table, while copying the base and linking owner state preserves existing Codex configuration semantics.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
    hunks:
      - packages/runner/src/codex/config.ts:449-470
      - packages/runner/src/codex/config.ts:515-568
    rejected: Appending bare dotted assignments would allow the selected profile's final table to capture generated values under the wrong section.
  - id: c3
    what: Focused deterministic tests cover the byte threshold, UTF-8-sized overlay, profile-table preservation, project and runtime precedence, base-only policy, unchanged short argv, and irreducible refusal.
    because: Each acceptance edge needs a local proof at the launch-preparation seam, including the refusal after the overlay cannot reduce the line below the limit.
    rests_on:
      - brief:Tests
    hunks:
      - packages/runner/test/lineFits.test.ts:1-198
  - id: c4
    what: Real Codex overflow coverage verifies the generated profile values and confirms the fixture MCP child receives all three runner markers.
    because: The real runtime path is needed to show Codex loads the overlay and starts the configured child, while the deterministic fixture keeps the shell-policy assertions independent of model credentials.
    rests_on:
      - brief:Tests
    hunks:
      - packages/runner/test/lineFitsRealCodex.test.ts:1-91
  - id: c5
    what: The real Codex fixture records the moved shell-policy keys and all three runner markers from the child environment.
    because: The fixture gives the runtime proof a stable file receipt without depending on a model response.
    rests_on:
      - brief:Tests
    hunks:
      - packages/runner/test/fixtures/codex/recordShellEnvironment.mjs:1-45
  - id: c6
    what: The machine-provider fixture now asserts the overflow launch selects a profile instead of requiring generated shell-policy arguments to remain on argv.
    because: Its long machine environment intentionally exercises the new overlay path, so its old argv-only assertion contradicted the accepted line-fitting behavior.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
    hunks:
      - packages/runner/test/machineProvider.test.ts:353-358
