    note: >-
      The final serial workspace run passed all package suites: runner 545, schemas 1228, CLI 443,
      plus the ledger, debrief, verifier, substrate and face suites.
  - id: scope-guard-proof
    result: pass
    invocation: pnpm --fail-if-no-match --filter runner exec vitest run test/scopeGuard.test.ts --passWithNoTests=false
    note: 6 focused tests passed for main-checkout writes, tracked edits, watch paths, clean worktree-only writes, allowed interlock paths and all six node roles.
  - id: scope-guard-types
