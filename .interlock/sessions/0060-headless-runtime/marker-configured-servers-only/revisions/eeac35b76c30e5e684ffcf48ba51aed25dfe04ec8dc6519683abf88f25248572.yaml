decisions:
  - id: configured-codex-tables
    what: Read the effective Codex MCP configuration from CODEX_HOME/config.toml, the selected profile overlay, and legacy profile tables, then allow marker overrides only for configured stdio tables that the Codex list reports as stdio.
    because: The Codex list includes built-in and plugin-provided names without mcp_servers tables; overriding those names creates invalid bare tables and can reject the whole launch.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: marker-configured-servers-only)"
      - packages/runner/src/codex/config.ts:70-167
      - packages/runner/src/sessionDrive.ts:159-176
    hunks:
      - packages/runner/src/codex/config.ts:70-167
      - packages/runner/src/sessionDrive.ts:159-176
      - packages/runner/test/markerConfiguredServers.test.ts:49-90
  - id: profile-and-transport-resolution
    what: Preserve profile selection while resolving command versus url transport and merging profile values over base values; a configured HTTP entry therefore cannot receive a stdio marker override.
    because: The launched Codex process may read a profile-specific config file, and transport must be decided from the table Codex will actually use rather than from the name-only list.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: configured stdio servers and profile overrides)"
      - packages/runner/src/codex/config.ts:75-167
    hunks:
      - packages/runner/src/codex/config.ts:75-167
      - packages/runner/test/markerConfiguredServers.test.ts:80-90
  - id: bounded-marker-launch
    what: Keep per-server Codex marker overrides in argv while the complete launch line remains below 1024 bytes; on overflow, omit only those generated mcp_servers overrides and retain the shell environment policy and inherited marker environment.
    because: The terminal has a canonical 1024-byte line limit, while the runner already passes the marker environment to both pane and exec children, so the MCP child can inherit the marker without an oversized launch line.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: launch line limit and marker delivery)"
      - packages/runner/src/sessionDrive.ts:179-193
    hunks:
      - packages/runner/src/sessionDrive.ts:179-193
      - packages/runner/test/markerConfiguredServers.test.ts:92-118
  - id: codex-proof-fixtures
    what: Add a names-only real Codex MCP list fixture, a config fixture containing only dialeto and hypha, profile and long-line tests, and a real Codex mcp list launch assertion for all three marker values.
    because: The prior fake list omitted built-ins and could not reproduce the invalid override; the proof must show configured names survive while codex_app, computer-use, cua_repl and node_repl remain untouched.
    rests_on:
      - packages/runner/test/fixtures/codex/real-mcp-list.json:1-35
      - packages/runner/test/fixtures/codex/config.toml:1-5
      - packages/runner/test/realCodexMarkerLaunch.test.ts:39-80
    hunks:
      - packages/runner/test/fixtures/codex/real-mcp-list.json:1-35
      - packages/runner/test/fixtures/codex/config.toml:1-5
      - packages/runner/test/realCodexMarkerLaunch.test.ts:39-80
      - packages/runner/test/runnerMarker.test.ts:72-149
