interlock: notes@v0
node: runner-marker
entries:
  - kind: choice
    at: "2026-11-08T08:40:14Z"
    chose: Keep the runner marker in one shared environment merge and pass the resulting environment to both interactive panes and exec phases.
    because: The session, graph and node identity must be identical at every launch boundary, while existing machine values remain authoritative unless they conflict with a marker key.
  - kind: surprise
    at: "2026-11-08T08:40:14Z"
    expected: The focused exec-runtime tests would be stable once run with their current short timeout and grace values.
    observed: The focused file passed while idle, but the implementation polls wall-clock deadlines for exit and group disappearance; the missing-launcher path also has a fixed 30-second anchor deadline. The launch note's loaded-machine failures are therefore credible and require event-based test synchronization.
  - kind: choice
    at: "2026-11-08T08:50:00Z"
    chose: Make program-exit observation filesystem-event driven and let group checks yield on observed process state instead of sleeping for a fixed polling interval, while retaining the request timeout and grace values as explicit bounds.
    because: The tests must remain bounded under load without treating a wall-clock sleep as evidence that the child or its group ended.
  - kind: surprise
    at: "2026-11-08T08:50:00Z"
    expected: The complete runner suite would exercise execRuntime.test.ts without timing failures under suite load.
    observed: The complete runner suite passed 45 files and 556 tests; execRuntime.test.ts passed all 5 tests in the same run. Git auto-maintenance tests emitted permission-denied diagnostics from their intentional lock-down fixtures, but the suite exited successfully.
