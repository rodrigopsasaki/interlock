decisions:
  - id: marker-contract
    applies_to: { kind: repository }
    what: Add a typed runner marker and merge it into machine environment values without overwriting a conflicting marker key.
    because: Every launched agent and child must receive the same session, graph and node identity, while a machine value that disagrees must refuse the launch instead of being silently replaced.
    rests_on:
      - .interlock/graphs/0060-headless-runtime.yaml
      - packages/runner/src/runnerMarker.ts
    hunks:
      - packages/runner/src/runnerMarker.ts:3-41
      - packages/runner/src/sessionDrive.ts:377-387
  - id: codex-mcp-overrides
    applies_to: { kind: repository }
    what: Discover Codex stdio MCP servers through codex mcp list --json, narrate failure or an empty stdio set, and add quoted per-server marker env overrides alongside shell_environment_policy overrides.
    because: Codex does not forward its own environment to stdio MCP servers, so only the per-launch server env table reaches those servers; failed discovery must preserve the launch without inventing server entries.
    rests_on:
      - .interlock/graphs/0060-headless-runtime.yaml
      - packages/runner/src/codex/environment.ts
      - packages/runner/src/ownedCommand.ts
    hunks:
      - packages/runner/src/codex/environment.ts:3-29
      - packages/runner/src/sessionDrive.ts:98-205
      - packages/runner/src/ownedCommand.ts:11-29
      - packages/runner/src/index.ts:126-132
  - id: launch-boundaries
    what: Pass the merged marker environment to every exec phase and always to runtime.openPane, including provider none, while retaining the existing machine environment for provider setup and custody.
    because: The marker belongs at the agent and child launch boundaries, not to unrelated provider commands; passing it through the existing pane and exec seams gives non-Codex runtimes their environment and Codex its shell policy inputs.
    rests_on:
      - packages/runner/src/sessionDrive.ts
    hunks:
      - packages/runner/src/sessionDrive.ts:620-637
      - packages/runner/src/sessionDrive.ts:761-769
  - id: event-driven-exec-observation
    what: Replace fixed polling sleeps for program exit and group or anchor observation with filesystem events and event-loop yields, retaining the request timeout and grace values as explicit bounds.
    because: Under machine load, a short polling interval can miss a child or group event and make tests time out; observed completion should settle the phase, while the injected bounds still cap a missing event.
    rests_on:
      - packages/runner/src/execRuntime.ts
      - packages/runner/test/execRuntime.test.ts
    hunks:
      - packages/runner/src/execRuntime.ts:276-342
      - packages/runner/src/execRuntime.ts:601-607
  - id: marker-and-probe-proof
    applies_to: { kind: repository }
    what: Add focused marker coverage for shell and stdio Codex overrides, empty or failing discovery, conflicting machine values, provider-none pane delivery, exec child delivery, and a fake Codex probe server; update existing provider expectations for the required marker.
    because: The acceptance spans independent launch boundaries and requires the probe to observe the same three values, while existing provider tests must assert the new contract without depending on a random session literal.
    rests_on:
      - packages/runner/test/runnerMarker.test.ts
      - packages/runner/test/machineProvider.test.ts
      - packages/runner/test/fixtures/exec/codexProbe.mjs
      - packages/runner/test/fixtures/exec/appendEnvironment.mjs
      - packages/runner/test/fixtures/exec/recordEnvironment.mjs
    hunks:
      - packages/runner/test/runnerMarker.test.ts:45-213
      - packages/runner/test/machineProvider.test.ts:272-294
      - packages/runner/test/machineProvider.test.ts:333-370
      - packages/runner/test/fixtures/exec/codexProbe.mjs
      - packages/runner/test/fixtures/exec/appendEnvironment.mjs
      - packages/runner/test/fixtures/exec/recordEnvironment.mjs
