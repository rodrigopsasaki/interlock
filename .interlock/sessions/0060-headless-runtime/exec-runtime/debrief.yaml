decisions:
  - id: exec-catalogue-contract
    what: Keep the exec runtime additions additive to runtimes@v2 and let machine configuration own argv and MCP templates.
    because: The profile parser preserves the existing provider and routable contract while validating only the new exec fields, so the runner remains unaware of provider-specific names and flags.
    rests_on: [notes:choice-00:00, notes:choice-00:10]
    hunks: [packages/runner/src/runtimeCatalogue.ts:25-44, packages/runner/src/runtimeCatalogue.ts:251-356]
    applies_to:
      kind: path
      path: packages/runner/src/runtimeCatalogue.ts
  - id: detached-phase-containment
    what: Run each exec phase through a detached launcher that records its anchor before go, owns group signals, and publishes transcript-backed terminal state.
    because: A phase must stay running until the group is confirmed empty, and its transcript end line must precede publication of the terminal record.
    rests_on: [notes:choice-00:20, notes:surprise-01:15]
    hunks: [packages/runner/src/execLauncher.ts:48-60, packages/runner/src/execLauncher.ts:92-225, packages/runner/src/execRuntime.ts:482-509, packages/runner/src/execRuntime.ts:678-795]
    applies_to:
      kind: path
      path: packages/runner/src/execRuntime.ts
  - id: phase-sequence
    what: Reuse the runner's worktree, commit, debrief, and judge path while replacing the second prompt with work and debrief exec phases sharing one session id.
    because: This keeps approval, leases, declared-path custody, and graph judgment in the existing runner flow while making phase parentage explicit for the app.
    rests_on: [notes:choice-01:23, notes:choice-01:26]
    hunks: [packages/runner/src/sessionDrive.ts:430-570]
    applies_to:
      kind: path
      path: packages/runner/src/sessionDrive.ts
  - id: owned-command-boundary
    what: Route runner process starts and provider commands through the owned-command adapter, and expose the exec session and transcript view through the sessions CLI.
    because: The runner needs one process-start seam and the app contract reads durable sessions and transcript lines instead of runtime state.
    rests_on: [notes:choice-01:06]
    hunks: [packages/runner/src/ownedCommand.ts:1-75, packages/cli/src/sessions.ts:1-80, schemas/sessions@v0.json:1-47]
    applies_to:
      kind: repository
  - id: focused-exec-proof
    what: Add fixture-only exec tests for normal streams, refusal before spawn, grandchild reaping, timeout escalation, and launch/program failure distinctions.
    because: These tests exercise the durable record and transcript behavior without depending on a real agent runtime.
    rests_on: []
    hunks: [packages/runner/test/execRuntime.test.ts:27-180]
    applies_to:
      kind: path
      path: packages/runner/test/execRuntime.test.ts
