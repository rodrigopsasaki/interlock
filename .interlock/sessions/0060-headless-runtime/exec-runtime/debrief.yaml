decisions:
  - id: exec-catalogue-contract
    what: Keep the headless runtime fields additive to runtimes@v2 while preserving graph 0062's exec probe template unchanged.
    because: The catalogue carries the probe template as a WritableRootTemplate and validates the exec profile's args, prompt, read-only arguments, and MCP allowlist without making provider flags part of runner code.
    rests_on: [notes:choice-00:00, notes:choice-00:10]
    hunks: [packages/runner/src/runtimeCatalogue.ts:29-48, packages/runner/src/runtimeCatalogue.ts:247-345, schemas/runtimes@v2.json:53-104]
    applies_to:
      kind: path
      path: packages/runner/src/runtimeCatalogue.ts
  - id: detached-phase-containment
    what: Run each exec phase through the detached launcher that records its anchor, owns group signals, drains the transcript, and publishes terminal state only after group confirmation.
    because: The phase record and transcript must remain authoritative even when the child exits before its group or streams finish.
    rests_on: [notes:choice-00:20, notes:surprise-01:15]
    hunks: [packages/runner/src/execLauncher.ts:48-60, packages/runner/src/execLauncher.ts:92-225, packages/runner/src/execRuntime.ts:482-509, packages/runner/src/execRuntime.ts:678-795]
    applies_to:
      kind: path
      path: packages/runner/src/execRuntime.ts
  - id: phase-sequence-and-scope
    what: Run work and debrief as two exec phases sharing one session id, and snapshot the configured scope before and after each phase.
    because: The phase parentage replaces the second pane prompt while the merged scope guard keeps changes outside the allowed worktree from silently passing through either headless phase.
    rests_on: [notes:choice-01:23, notes:choice-01:26, notes:choice-07:45]
    hunks: [packages/runner/src/sessionDrive.ts:441-455, packages/runner/src/sessionDrive.ts:457-648, packages/runner/src/scopeGuard.ts:192-259]
    applies_to:
      kind: path
      path: packages/runner/src/sessionDrive.ts
  - id: owned-command-boundary
    what: Route runner process starts and provider commands through the owned-command seam, and expose the durable exec session and transcript view through the sessions CLI.
    because: The runner must own process containment while the app reads sessions and transcript lines from Interlock records rather than runtime state.
    rests_on: [notes:choice-01:06]
    hunks: [packages/runner/src/ownedCommand.ts:1-75, packages/cli/src/sessions.ts:1-80, schemas/sessions@v0.json:1-47]
    applies_to:
      kind: repository
  - id: focused-exec-proof
    what: Add fixture-only exec tests for streams, admission refusal, grandchild reaping, timeout escalation, and launch/program failure distinctions.
    because: The focused proof exercises durable records and transcripts without depending on a real agent runtime.
    rests_on: []
    hunks: [packages/runner/test/execRuntime.test.ts:27-180]
    applies_to:
      kind: path
      path: packages/runner/test/execRuntime.test.ts
  - id: merge-0062-and-scope-guard
    what: Resolve origin/main's runtime catalogue, schema, and session-driver conflicts by keeping graph 0062's exec probe field, graph 0060's additive headless fields, and origin/main's pane launch preparation and scope-guard behavior.
    because: The graph 0062 field owns the name exec, while this node's contract forbids reusing that name for its own fields; the scope guard must run around every exec phase and prepareLaunch must remain the pane-era launch seam.
    rests_on: [notes:choice-07:45, notes:surprise-07:45]
    hunks: [packages/runner/src/runtimeCatalogue.ts:29-48, packages/runner/src/runtimeCatalogue.ts:247-345, packages/runner/src/sessionDrive.ts:441-680, schemas/runtimes@v2.json:53-104]
    applies_to:
      kind: repository
