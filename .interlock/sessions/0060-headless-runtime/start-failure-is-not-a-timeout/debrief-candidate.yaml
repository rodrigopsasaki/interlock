decisions:
  - id: bounded-exit-observation
    what: Added a native-default watcher and scheduler seam whose single waiter polls exit.json, observes every directory event without trusting its filename, continues through watcher failure, and owns deadline cleanup.
    because: Atomic rename and watcher coalescing can hide a recorded spawn error; a watcher failure must not become an early timeout, and deterministic tests need ordering seams.
    rests_on:
      - packages/runner/src/execRuntime.ts:115-162
      - packages/runner/src/execRuntime.ts:316-385
      - "acceptance: watcher polling and bounded failure behavior"
    hunks:
      - packages/runner/src/execRuntime.ts:115-162
      - packages/runner/src/execRuntime.ts:316-385
  - id: reconcile-start-failure-evidence
    what: Re-read exit.json after the bounded launcher and group waits, retain the transcript distinction between confirmed and unconfirmed launcher death, and let an explicit program start error determine failed state and reason before timeout state.
    because: Evidence written before TERM, during TERM grace, or during later bounded exit waits must outrank a deadline, while a successfully spawned program that exits after the deadline must remain a run timeout.
    rests_on:
      - packages/runner/src/execRuntime.ts:742-810
      - packages/runner/src/execRuntime.ts:855-880
      - "acceptance: explicit error precedence in both state and reason"
    hunks:
      - packages/runner/src/execRuntime.ts:742-810
      - packages/runner/src/execRuntime.ts:855-880
  - id: deterministic-observation-proof
    what: Added controlled scheduler and watcher tests for dropped events, watcher creation failure, watcher error, polling, and the deadline-final read, and strengthened the existing missing-program assertion to require failed state.
    because: The acceptance names watcher delivery failures and both state and reason as proof boundaries; injected seams keep ordering deterministic without shipping a test-only launcher switch.
    rests_on:
      - packages/runner/test/startFailureNotTimeout.test.ts:1-172
      - packages/runner/test/execRuntime.test.ts:167-180
      - "acceptance: deterministic start-failure proof"
    hunks:
      - packages/runner/test/startFailureNotTimeout.test.ts
      - packages/runner/test/execRuntime.test.ts:167-180
  - id: retain-session-evidence
    what: Recorded implementation choices, gate evidence limits, and launch-local artifact handling in the notes@v0 session artifact.
    because: The brief requires every choice and surprise to remain available beside the immutable brief and final debrief.
    rests_on:
      - .interlock/sessions/0060-headless-runtime/start-failure-is-not-a-timeout/notes.yaml
    hunks:
      - .interlock/sessions/0060-headless-runtime/start-failure-is-not-a-timeout/notes.yaml
