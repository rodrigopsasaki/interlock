  - id: bounded-exit-observation
    what: Kept the watcher and scheduler as native-default observation seams, added an optional exit reader, and made every poll and final reconciliation use the selected reader.
    because: The deterministic integration cases must control exit-file timing while production continues to read the real exit.json through the native default.
