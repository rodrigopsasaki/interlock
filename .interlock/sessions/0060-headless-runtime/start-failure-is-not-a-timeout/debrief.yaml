  - id: reconcile-start-failure-evidence
    what: Reconciled exit evidence after the bounded launcher and group waits, and retained explicit program start errors as failed state and start-failure reason ahead of timeout state.
    because: Evidence written before TERM, during TERM grace, or during later bounded exit waits must outrank a deadline, while a successfully spawned program that exits after the deadline remains a run timeout.
    rests_on:
      - packages/runner/src/execRuntime.ts:750-817
      - packages/runner/src/execRuntime.ts:863-885
      - "acceptance: explicit error precedence in both state and reason"
    hunks:
      - packages/runner/src/execRuntime.ts:762-817
      - packages/runner/src/execRuntime.ts:863-885
  - id: deterministic-deadline-matrix
    what: Added five runExecPhase integration cases covering start errors before TERM, during TERM grace, and during bounded drain, plus spawned nonzero and still-running timeout outcomes; each checks state and reason, and spawned cases check handoff.json.
    because: The acceptance requires deterministic proof of every timing window and distinguishes explicit spawn errors from programs that successfully hand off.
    rests_on:
      - packages/runner/test/startFailureNotTimeout.test.ts:118-180
      - packages/runner/test/startFailureNotTimeout.test.ts:248-324
    hunks:
      - packages/runner/test/startFailureNotTimeout.test.ts:118-180
      - packages/runner/test/startFailureNotTimeout.test.ts:248-324
  - id: handoff-timing-fixture
    what: Added a fixture program that ignores TERM and exits only when the test writes a marker, allowing the successful-spawn and still-running cases to prove handoff timing without wall-clock ordering sleeps.
    because: The acceptance requires a successful handoff to remain a timeout after the deadline and requires deterministic control of the program's later exit.
    rests_on:
      - packages/runner/test/fixtures/exec/waitForMarker.mjs:1-11
    hunks:
      - packages/runner/test/fixtures/exec/waitForMarker.mjs:1-11
  - id: existing-start-failure-state-proof
    what: Retained the existing missing-program test's explicit failed-state and start-failure-reason assertions.
    because: The acceptance requires the pre-existing execRuntime start-failure case to assert state as well as reason.
    rests_on:
      - packages/runner/test/execRuntime.test.ts:167-180
    hunks:
