decisions:
  - id: state-contained-owned-overlays
    what: Resolve the interlock state directory once from XDG_STATE_HOME or the HOME fallback, reject physical containment in the launch or any repository, and create symlink-safe Codex overlays with an owner record under codex-homes/graph/node/session.
    because: The overlay must not place Codex state in a checkout or follow a symlink into one, while stale cleanup needs an owner journal and session identity before it can remove anything.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: overlays under machine state and physical containment)"
      - notes:choice-2026-11-08T17:54:18Z
      - packages/runner/src/codex/config.ts:519-673
      - packages/runner/src/codex/config.ts:675-800
    hunks:
      - packages/runner/src/codex/config.ts:519-673
      - packages/runner/src/codex/config.ts:675-800
      - packages/runner/src/codex/config.ts:812-914
      - packages/runner/test/codexHomeOutsideWorktree.test.ts:141-363
  - id: termination-evidence-controls-cleanup
    what: Make overlay cleanup require explicit termination evidence, retain overlays for held, retained, failed-close, unresolved, or unconfirmed launches, and let stale cleanup remove only a journal-confirmed terminal outcome for the overlay's own session.
    because: A pane left for drilldown or a launch with an unresolved process group still needs its environment, and another attempt's outcome, a lease expiry, or a person override does not prove this overlay terminated.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: removal only on confirmed termination)"
      - notes:choice-2026-11-08T17:54:18Z
      - packages/runner/src/codex/config.ts:675-800
      - packages/runner/src/sessionDrive.ts:692-724
      - packages/runner/src/sessionDrive.ts:1196-1239
    hunks:
      - packages/runner/src/codex/config.ts:675-800
      - packages/runner/src/runtime.ts:47-54
      - packages/runner/src/sessionDrive.ts:692-724
      - packages/runner/src/sessionDrive.ts:1196-1239
      - packages/runner/test/codexHomeOutsideWorktree.test.ts:189-306
  - id: tmux-receives-prepared-environment
    what: Carry the prepared launch environment through the tmux pane-opening adapter so CODEX_HOME and the marker environment reach the shell that starts the agent.
    because: Preparing an overlay without transporting its environment would leave tmux launches using the owner's Codex home and would violate the adapter boundary.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: tmux adapter carrying the prepared environment)"
      - packages/runner/src/sessionDrive.ts:758-775
      - packages/runner/src/tmux/adapter.ts:25-34
    hunks:
      - packages/runner/src/tmux/adapter.ts:25-34
      - packages/runner/test/tmuxOverlay.test.ts:5-16
  - id: isolated-overflow-and-real-child-proof
    what: Adapt marker and line-fit fixtures to isolated HOME, XDG_STATE_HOME, and CODEX_HOME roots, exclude only generated .runs scratch and dependencies from discovery, and require real Codex MCP-child evidence without authentication skips.
    because: The acceptance requires real overflow delivery and clean-checkout proofs without touching owner homes; generated plugin files are scratch, while missing real child evidence must fail the proof.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: isolated marker and line-fits tests)"
      - notes:choice-2026-11-08T17:54:18Z
      - packages/runner/test/markerNeverDropped.test.ts:1-225
      - packages/runner/test/realCodexMarkerOverflow.test.ts:27-165
      - packages/runner/test/lineFits.test.ts:1-220
      - vitest.config.base.ts:13-18
    hunks:
      - packages/runner/test/markerNeverDropped.test.ts:1-225
      - packages/runner/test/realCodexMarkerOverflow.test.ts:27-165
      - packages/runner/test/lineFits.test.ts:1-220
      - packages/runner/test/lineFitsRealCodex.test.ts:1-280
      - vitest.config.base.ts:13-18
  - id: configured-marker-fixture-isolation
    what: Isolate the configured marker-server long-line fixture with temporary HOME and XDG_STATE_HOME roots, a temporary CODEX_HOME, and a Git ceiling while preserving the inherited session marker assertion.
    because: The launch error was an existing overlay path caused by the fixture falling back to persistent state; the test must exercise overlay delivery without reading or reusing an owner home.
    rests_on:
      - ".interlock/graphs/0060-headless-runtime.yaml (Acceptance: carried-over marker tests adapted to main)"
      - notes:choice-2026-11-08T19:02:00Z
      - notes:surprise-2026-11-08T19:01:00Z
      - packages/runner/test/markerConfiguredServers.test.ts:1-140
    hunks:
      - packages/runner/test/markerConfiguredServers.test.ts:1-140
  - id: configured-marker-test-format
    what: Apply the repository formatter to the configured marker-server test's prepareLaunch call.
    because: The judge identified one formatting error in this file; formatting only that file made the lint gate pass without changing unrelated warnings.
    rests_on:
