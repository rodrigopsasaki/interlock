interlock: notes@v0
node: home-on-main
entries:
  - kind: choice
    at: '2026-11-08T17:54:18Z'
    chose: >-
      Port the cleared branch's Codex overlay containment and termination evidence onto main's
      marker-never-dropped and line-fits implementation instead of replacing main's config/profile
      generation.
    because: >-
      The acceptance gives main's regular generated base config, profile, symlinked shared entries,
      and moved shell-environment policy entries precedence over the stale branch's config.toml
      linking behavior.
  - kind: surprise
    at: '2026-11-08T17:54:18Z'
    expected: The session worktree would contain only repository files before implementation.
    observed: >-
      An untracked launch-local codex-home directory contained symlinks into the owner's ~/.codex;
      it was removed without staging it or following its links.
  - kind: surprise
    at: '2026-11-08T17:54:18Z'
    expected: The pinned typecheck command wrapper would capture its exit status normally.
    observed: >-
      zsh treats the variable name status as read-only after typecheck ran, so the command's exit
      status was not captured; the retained output file is the source for the result.
  - kind: choice
    at: '2026-11-08T17:54:18Z'
    chose: >-
      Bound fixture Git discovery at the package test .runs root while running overlay tests, and
      supplied isolated HOME and XDG_STATE_HOME values for every Codex fixture.
    because: >-
      The production containment check must reject state in any repository, while test fixture
      roots live inside this checkout; the ceiling reproduces a temporary fixture boundary without
      allowing tests to inspect or mutate the owner's state.
  - kind: surprise
    at: '2026-11-08T17:54:18Z'
    expected: The bounded real Codex marker-overflow command would return a complete Vitest receipt.
    observed: >-
      The command returned after only Vitest's initial line while its Codex and MCP fixture child
      processes remained alive; those explicit test processes were terminated and the incomplete
      output is not treated as proof.
  - kind: choice
    at: '2026-11-08T17:54:18Z'
    chose: >-
      Mark an exec overlay removable only after both work and debrief groups report successful
      confirmed termination, while pane overlays require a confirmed pane close.
    because: >-
      A launch can finish one phase and still leave an unresolved later group; cleanup must preserve
      the overlay on every uncertain or retained path and remove it only from explicit termination
      evidence.
  - kind: surprise
    at: '2026-11-08T17:54:18Z'
    expected: The standing lint gate would be clean after the focused implementation checks.
    observed: >-
      Lint found two pre-existing errors in packages/runner/test/runnerCommits.test.ts, plus one
      import ordering issue and formatting in the new files; the new-file issues were corrected,
      while the unrelated existing errors remain outside this node's diff.
  - kind: choice
    at: '2026-11-08T17:54:18Z'
    chose: Exclude package test .runs directories from Vitest discovery.
    because: >-
      The real Codex proof creates an MCP plugin checkout under its isolated overlay; those fixture
      files can have test-like names and are scratch, not workspace tests.
  - kind: surprise
    at: '2026-11-08T17:54:18Z'
    expected: Adding the .runs exclusion would preserve Vitest's normal dependency exclusions.
    observed: >-
      Vitest treats an explicit exclude list as a replacement, so linked node_modules tests were
      discovered; the default node_modules exclusion was restored explicitly.
  - kind: surprise
    at: '2026-11-08T18:12:00Z'
    expected: The standalone runner gate would use the isolated Codex home supplied in its
      environment.
    observed: >-
      The first standalone gate invocation failed before the runner tests could launch because
      CODEX_HOME pointed at a deliberately isolated directory that had not yet been created;
      the command did not inspect the owner's home.
  - kind: choice
    at: '2026-11-08T18:18:00Z'
    chose: Repair only this worktree's ignored pnpm dependency links with the pinned offline
      install before retrying the runner gate.
    because: >-
      The gate's worker process could not resolve the repository-local tinypool entry point;
      restoring ignored dependencies is within this worktree and does not copy or inspect any
      owner home or external repository.
  - kind: surprise
    at: '2026-11-08T18:18:00Z'
    expected: The runner suite would either pass or report only behavioral failures after its
      isolated homes were created.
    observed: >-
      It reported a pre-existing machine-provider profile assertion and then failed to start a
      Vitest worker because node_modules/.pnpm/tinypool@1.1.1 had no package contents.
  - kind: surprise
    at: '2026-11-08T18:24:00Z'
    expected: Restoring the local dependencies would make the standalone runner gate complete
      with its normal parallel worker pool.
    observed: >-
      The dependency repair removed the worker crash, but the parallel suite still timed out 69
      command-heavy tests; the overlay and marker proofs passed, and one machine-provider test
      deterministically expected an overlay profile for a short launch line.
  - kind: choice
    at: '2026-11-08T18:24:00Z'
    chose: Retry the runner suite with one Vitest worker while keeping the exact gate command and
      all fixture isolation variables.
    because: >-
      Serial execution separates suite-level resource contention from behavior without changing
      production code or excluding any test.
