open:
  - >-
    The scaffold brief's prose under its acceptance quote would be replaced if that brief were
    ever materialized again with a differing acceptance. If authored clarifications under the
    quote should survive, the section's end needs a different rule, such as the end of the
    blockquote run.
  - >-
    renderAcceptanceSection is exported from acceptanceSection.ts but used only inside it.
