open:
  - >-
    INTERLOCK_WARM_REPO_A and INTERLOCK_WARM_REPO_B are not configured anywhere persistent; this
    session set them per invocation to the interlock main checkout and preston. The runner will
    fail the warm-position gate until the owner exports them where gates run.
  - >-
    .interlock/landed-cache.json is ignored only in this repository. Preston (and interlock's main
    checkout until this merges) now shows it untracked after the warm gate ran; preston needs the
    same two .gitignore lines.
  - >-
    positions@v0 now admits position@v2 additively. The sibling node live-attempt-facts publishes
    positions@v1 assuming an unchanged v0; whichever merges second should make positions@v1 refer to
    position@v2 and keep v0 as it is at that point.
  - >-
    A single manual undo whose context changed (or any unrecognised manual undo) with no other undo
    evidence still reads on-main; the overlap rule applies only once something is proved undone.
    That keeps done reachable, at the cost of the detector's acknowledged blind spot.
  - >-
    A unit cherry-picked onto main more than once lands on its earliest copy; later copies count as
    overlapping edits only when undo evidence exists.
  - >-
    The herdr status read still asks agent.list once per live session, now concurrently;
    live-attempt-facts' single bulk observation would cut it to one call.
