      sync calls and in-flight children during a 24-node two-repository read; the CLI JSON test
      reads a real partial revert. Tests that validate positionOf output select position@v2.
    because: >-
      The acceptance names each file and case. A self-check that the child_process mock saw the
      fixture's own execFileSync keeps the empty sync list meaningful.
    rests_on:
