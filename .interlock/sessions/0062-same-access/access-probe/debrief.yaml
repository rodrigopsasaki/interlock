open:
  - >-
    The default process runner uses the named interlock-probe check commands, while the production
    adapter kinds currently have no executor and therefore report agent-side checks unavailable;
    fixture adapters and profile exec templates provide the non-conversational execution seam.
    A deployment that needs deciding checks to pass must supply those commands or an implementing
    adapter executor, and the runner must retain the resulting receipts.
