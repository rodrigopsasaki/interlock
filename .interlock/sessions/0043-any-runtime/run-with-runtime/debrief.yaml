discoveries:
  - id: d1
    what: >-
      packages/ledger/src/event.ts's isLedgerEventV4 delegated the session-started kind's deep
      shape wholesale to the CURRENT (strict) isLedgerEvent/isSession, and every pre-v5 upcast
      level (v1's PASS_THROUGH_KINDS, v2 and v3 via v4's shared shape) reused it as a
      boolean-gated identity pass-through, never reconstructing the event.
    found_at: >-
      Read at session_start_sha 633d12e2e2fadba8906892aee2bdc96e1deb3ab6, before decision c2
      replaced it: packages/ledger/src/event.ts, the now-deleted isLedgerEventV4 function.
    mattered_because: >-
      Making Session.runtime a required field (per this node's acceptance) would have made
      isLedgerEvent silently reject every historical session-started line the instant the field
      went missing, and identity pass-through cannot inject a missing field without lying about
      the type it claims to return (a real invalid state slipping through, not a caught one).
      This broke both real fixture journals on first pass (journal-v1-v2-2026-09-10.jsonl has 11
      session-started events, journal-v3-v4-2026-09-11.jsonl has 17), caught only by running the
      existing replay.test.ts suite, not by anything the brief named. Fixed by extracting one
      shared, version-agnostic upcastSessionStarted (packages/ledger/src/event.ts) that every
      pre-v6 level calls for that one kind, reconstructing runtime: "unknown" rather than
      identity-passing raw data, and retiring isLedgerEventV4 in favor of a genuine transform,
      upcastPreV5Event.
  - id: d2
    what: >-
      packages/cli/test/run.test.ts, plan.test.ts and judge.test.ts had no
      $INTERLOCK_RUNTIMES isolation at all: their fixture()-equivalent helpers never touched
      the env var, unlike packages/cli/test/runtime.test.ts, which already saved and restored
      it per test.
    found_at: >-
      Read at session_start_sha 633d12e2e2fadba8906892aee2bdc96e1deb3ab6: the afterEach block
      in packages/cli/test/run.test.ts, plan.test.ts and judge.test.ts, none of which set or
      restored $INTERLOCK_RUNTIMES.
    mattered_because: >-
      Once interlock run and interlock plan started calling loadRuntimeCatalogue() on every
      invocation (this node's own change), every test in those three files began reading
      whatever real $INTERLOCK_RUNTIMES or ~/.config/interlock/runtimes.yaml exists on the
      machine running the suite -- a hermeticity gap this node's change exposed, not a pre-
      existing bug it needed to fix on its own account, but one it could not leave behind
      either. Fixed by adding the same save/restore-in-afterEach pattern already used in
      runtime.test.ts to all three files, and setting INTERLOCK_RUNTIMES to a non-existent path
      inside each fixture-building helper (and the two run.test.ts call sites that build a
      directory without going through fixture()).
decisions:
  - id: c1
    what: >-
      Modeled Session.runtime (packages/ledger/src/session.ts) as a required field typed
      SessionRuntime = { name: string; kind: string; model: string | undefined } | "unknown",
      with constructors sessionRuntime.declared(...)/sessionRuntime.unknown() and a validator
      isSessionRuntime, rather than an optional field whose absence a reader would interpret as
      unknown by convention.
    because: >-
      The brief is explicit that Session "gains an additive field, typed as a union with two
      arms: declared... and unknown, the reading of every session recorded before this shape"
      and that "the upcast seam gains the step that reads a pre-v6 session as unknown" -- the
      upcast seam, not a bare-undefined convention every future reader must remember, is named
      as the mechanism. A required union with an explicit "unknown" value makes "we don't know"
      a real, unrepresentable-any-other-way value once in memory, matching how this codebase
      already treats other honest-absence readings (e.g. receipt.duration: Duration, never a
      bare-optional number).
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - docs/design/0001-interlock.md
    hunks:
      - packages/ledger/src/session.ts:1-44
    produces:
      - packages/ledger/src/session.ts
  - id: c2
    what: >-
      Built one shared, version-agnostic transform, upcastSessionStarted (session, brief,
      optional graphBaseSha; runtime defaulted to sessionRuntime.unknown() when absent or
      invalid), and a second, upcastPreV5Event, for the shape event@v2/v3/v4 share
      (packages/ledger/src/event.ts). event@v1's upcastV1 calls upcastSessionStarted directly
      for the session-started kind (removed from its PASS_THROUGH_KINDS); event@v2's and
      event@v3's upcast files, and envelope.ts's "event@v4" table entry, now all call
      upcastPreV5Event; a new upcastV5 (packages/ledger/src/upcast/v5.ts) does the same for
      event@v5, the only version raw session-started data legitimately still lacks runtime on
      when replayed under this node's own new code. The previously-exported isLedgerEventV4 is
      deleted (see discovery d1).
    because: >-
      A single reused constructive function, applied at every pre-v6 level, keeps "a pre-v6
      session reads as unknown" true by construction rather than by four separate
      implementations staying in sync, and avoids the identity-pass-through-with-a-lying-
      predicate bug found as d1. upcastV1 keeps its existing per-kind dispatch style (it already
      special-cases gate-moved, receipt-written, outcome-set locally) rather than being folded
      into upcastPreV5Event, since v1's shape differs from v2/v3/v4 in other ways already.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - packages/ledger/src/upcast/v1.ts
    hunks:
      - packages/ledger/src/event.ts:145-177
      - packages/ledger/src/upcast/v1.ts:189-206
      - packages/ledger/src/upcast/v2.ts:1-5
      - packages/ledger/src/upcast/v3.ts:1-5
      - packages/ledger/src/upcast/v5.ts:1-8
      - packages/ledger/src/envelope.ts:1-33
    produces:
      - packages/ledger/src/event.ts
      - packages/ledger/src/upcast/v1.ts
      - packages/ledger/src/upcast/v2.ts
      - packages/ledger/src/upcast/v3.ts
      - packages/ledger/src/upcast/v5.ts
      - packages/ledger/src/envelope.ts
    rejected: >-
      Keeping isLedgerEventV4 as a boolean predicate and reconstructing separately at each call
      site: rejected because the reconstruction logic (inject runtime: "unknown" for
      session-started) is identical at every level, and a predicate that returns true for data
      it hasn't actually verified conforms to the current Session shape is a lying type
      predicate, not a defensible narrowing.
  - id: c3
    what: >-
      EVENT_SHAPE advances to "event@v6" (packages/ledger/src/envelope.ts); projection.ts's
      session-started handler copies event.session.runtime onto SessionView (a new required
      field); schemas/event@v6.json adds an allOf branch requiring session.runtime via the new
      schemas/parts/session-runtime.json; schemas/position@v1.json's positionAttempt gains a
      required runtime field, $ref'd to the same part schema.
    because: >-
      The acceptance pins the version bump and upcaster explicitly. SessionView needed the same
      field as Session so every downstream reader (session show, graph show, runtime list) could
      read it without re-deriving it from raw events. position@v1.json needed the update because
      `interlock graph show --json` serializes PositionAttempt (which now carries runtime)
      through this exact schema, and its additionalProperties: false would otherwise reject the
      real producer's own output.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - schemas/event@v5.json
    hunks:
      - packages/ledger/src/envelope.ts:8
      - packages/ledger/src/projection.ts:32
      - packages/ledger/src/projection.ts:144
      - schemas/event@v6.json:1-73
      - schemas/parts/session-runtime.json:1-19
      - schemas/position@v1.json:182-193
    produces:
      - packages/ledger/src/envelope.ts
      - packages/ledger/src/projection.ts
      - schemas/event@v6.json
      - schemas/parts/session-runtime.json
      - schemas/position@v1.json
  - id: c4
    what: >-
      Built the new fixture packages/ledger/test/fixtures/journal-v5-run-with-runtime-2026-09-24.jsonl
      (49 lines) from real event@v5 lines copied verbatim from this repository's own shared
