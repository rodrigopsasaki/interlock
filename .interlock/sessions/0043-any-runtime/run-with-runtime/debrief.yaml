    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - .interlock/ledger/journal.jsonl
    hunks:
      - packages/ledger/test/fixtures/journal-v5-run-with-runtime-2026-09-24.jsonl:1-49
      - packages/ledger/test/runtime.test.ts:1-156
    produces:
      - packages/ledger/test/fixtures/journal-v5-run-with-runtime-2026-09-24.jsonl
      - packages/ledger/test/runtime.test.ts
  - id: c5
    what: >-
      Built packages/runner/src/runtimeSelection.ts's selectRuntime(merged, requested), the one
      resolution function: the requested name if given (refusing "unknown-runtime" with the
      known list if absent), else MergedRuntimes.defaultRuntime if set, else the entry named
      "default" (mergeRuntimes's own name for the legacy runtime: block), else
      "no-runtime-resolvable" naming the known list (possibly empty). Threaded a new required
      agentRuntime: ResolvedRuntime field through DriveSessionRequest
      (packages/runner/src/sessionDrive.ts), replacing every read of
      localConfig.runtime.{kind,args,startupAnswers,startupTimeoutMs} with agentRuntime's own
      fields; localConfig.runtime.promptTakenTimeoutMs is untouched, since ResolvedRuntime
      carries no such field and the brief names only the other four as what moves.
    because: >-
      The brief requires "run and plan both call this one function; neither grows its own
      copy" and that sessionDrive take a ResolvedRuntime rather than read localConfig.runtime
      directly. The field is named agentRuntime, not runtime, because DriveSessionRequest
      already has a runtime?: Runtime field -- the pane-driving test-injection adapter
      (packages/runner/src/runtime.ts) -- an unrelated concept that already owned that name;
      reusing it would have collided two different senses of "runtime" in one request object.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - .interlock/sessions/0043-any-runtime/runtime-catalogue/debrief.yaml
      - packages/runner/src/runtimeCatalogue.ts
      - packages/runner/src/runtime.ts
    hunks:
      - packages/runner/src/runtimeSelection.ts:1-52
      - packages/runner/src/sessionDrive.ts
      - packages/cli/src/run.ts
      - packages/cli/src/plan.ts
      - packages/runner/test/runtimeSelection.test.ts:1-102
    produces:
      - packages/runner/src/runtimeSelection.ts
      - packages/runner/src/sessionDrive.ts
      - packages/cli/src/run.ts
      - packages/cli/src/plan.ts
      - packages/runner/test/runtimeSelection.test.ts
  - id: c6
    what: >-
      Wired --runtime <name> into interlock run and interlock plan (packages/cli/src/run.ts,
      plan.ts): both load the catalogue, merge it with local.yaml, and call selectRuntime before
      the graph is even loaded (run.ts) or the ledger opened for leasing (both), refusing as a
      sentence, exit 1, with nothing appended to the journal, on any catalogue, merge or
      selection refusal. The resolved ResolvedRuntime is passed to driveInteractiveSession as
      agentRuntime.
    because: >-
      The acceptance requires "Refusals print as sentences and exit non-zero before anything is
      leased: a bad runtime name must not cost a lease." Placing the resolution before graph
      loading (run.ts) or the interpreter node's ledger open (plan.ts) means a bad name never
      even reaches the point where any event could be appended, not merely before the lease call
      specifically.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - packages/cli/src/runtime/list.ts
    hunks:
      - packages/cli/src/run.ts:1-40
      - packages/cli/src/plan.ts
      - packages/cli/test/run.test.ts:1440-1567
    produces:
      - packages/cli/src/run.ts
      - packages/cli/src/plan.ts
      - packages/cli/test/run.test.ts
  - id: c7
    what: >-
      Narrated the runtime by name, kind and declared model (or "model undeclared") in
      packages/runner/src/sessionDrive.ts, immediately after "pane ... opened" and before
      "agent ... started", and recorded the same declared runtime on the session-started
