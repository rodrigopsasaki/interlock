  - id: c9
    what: >-
      Built packages/face/src/runtimeAttempts.ts's lastAttemptByRuntimeName(projection),
      returning the last-recorded {session, outcome, startedAtWallMs} per declared runtime name
      across every graph and node (not scoped to one graph), by iterating
      projection.sessions.values() once and letting a later Map.set overwrite an earlier one for
