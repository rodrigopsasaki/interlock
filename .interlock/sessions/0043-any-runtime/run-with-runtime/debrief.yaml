      - packages/cli/src/runtime/list.ts:1-108
      - packages/face/src/index.ts
      - packages/cli/test/runtime.test.ts:1-254
    produces:
      - packages/face/src/runtimeAttempts.ts
      - packages/cli/src/runtime/list.ts
      - packages/cli/test/runtime.test.ts
  - id: c10
    what: >-
      Two repairs named by the brief as in-scope because they touch the same files: (a)
      loadRuntimeCatalogue (packages/runner/src/runtimeCatalogue.ts) now catches a non-ENOENT
      readFile error and returns a new RuntimeCatalogueRefusal arm, {kind: "unreadable", path,
      code}, instead of rethrowing as an uncaught stack trace; (b) interlock runtime list's
      empty-catalogue-and-no-local-yaml message (packages/cli/src/runtime/list.ts) now says
      "local.yaml is absent" when that is why the list is empty, rather than always claiming
      "local.yaml has no runtime block" (a claim only true when local.yaml exists but somehow
      lacks the block, which LocalConfig's own required runtime.kind field makes structurally
      impossible today).
    because: >-
      Both are named verbatim in the brief's "Two small repairs from the previous node, in
      scope because you touch the same files" section. (a) matches the existing
      readable-refusal convention every other loader in this codebase follows (e.g.
      loadLocalConfig's own ENOENT-vs-other-error handling). (b) is honest about which of the
      two possible reasons actually produced the empty list, even though only one is reachable
      given LocalConfig's current required fields; the conditional stays truthful to what
      actually happened at that call site rather than hard-coding the currently-only-reachable
      branch.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - packages/runner/src/localConfig.ts
    hunks:
      - packages/runner/src/runtimeCatalogue.ts:23-40
      - packages/runner/src/runtimeCatalogue.ts:190-198
      - packages/cli/src/runtime/list.ts:60-90
      - packages/runner/test/runtimes.test.ts
      - packages/cli/test/runtime.test.ts
    produces:
      - packages/runner/src/runtimeCatalogue.ts
      - packages/cli/src/runtime/list.ts
  - id: c11
    what: >-
      Recorded packages/runner/src/backfill.ts's synthesized session-started events with
      runtime: sessionRuntime.unknown(), never invented from local.yaml or the catalogue.
    because: >-
      A backfilled session represents work that predates the harness recording it at all (see
      docs/design/0001-interlock.md's debrief-schema bend-log row: "a backfilled session has
      receipts but no session view"); there is no real attempt with a resolved runtime behind
      it to report, so "unknown" is the honest reading (I8: never invent), not a brief
      deficiency to backfill in kind.
    rests_on:
      - docs/design/0001-interlock.md
    hunks:
      - packages/runner/src/backfill.ts
    produces:
      - packages/runner/src/backfill.ts
  - id: c12
    what: >-
      Fixed a hermeticity gap this node's own change exposed (discovery d2) by adding
      $INTERLOCK_RUNTIMES save/restore-in-afterEach and an explicit non-existent path inside
      each fixture-building helper of packages/cli/test/run.test.ts, plan.test.ts and
      judge.test.ts, matching the pattern packages/cli/test/runtime.test.ts already used.
    because: >-
      Once interlock run and interlock plan call loadRuntimeCatalogue() unconditionally, every
      test in those files that did not isolate the env var would silently read the real
      machine's catalogue path. Left unfixed, this node's own change would have made the whole
      cli test suite non-hermetic without a single new test failing on this particular machine,
