      it is started).
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
    hunks:
      - packages/runner/src/sessionDrive.ts
      - packages/cli/test/run.test.ts:800
      - packages/cli/test/run.test.ts:845
      - packages/cli/test/run.test.ts:908
    produces:
      - packages/runner/src/sessionDrive.ts
  - id: c8
    what: >-
      packages/face/src/sessionColumns.ts's renderContext prints "runtime: <rendering>" right
      after graph base sha and before derivation, under Context, using a new shared
      packages/face/src/runtimeLine.ts (renderSessionRuntime). packages/face/src/render.ts's
      renderPosition prints one "runtime: <rendering>" line per node (graph show, plain text),
      sourced from a new packages/face/src/attempts.ts helper, liveOrLatestAttempt(attempts,
      isLiveAttempt), reusing nodeRow.ts's existing isLiveAttempt rather than duplicating live-
      lease detection; the line is omitted entirely when a node has no attempts. frameRender.ts's
      TUI attempt row also gains the same rendering (cheap, reusing the shared renderer, no new
      frame built).

      Verified against a scratch fixture (git repo under packages/cli/test/.runs, never the
      real journal, removed with plain rm after use), a declared runtime "luna" (claude,
      claude-opus-5-5): `interlock session show demo a` prints under Context exactly
      "  runtime: luna (claude, claude-opus-5-5)" (between "graph base sha: ..." and
      "derivation: ..."). `interlock graph show demo` prints, for node a, exactly
      "  runtime: luna (claude, claude-opus-5-5)" between its gates line and its float line.
    because: >-
      The acceptance requires "interlock session show prints it under Context beside
      derivation", "interlock graph show shows... the runtime of the live or latest attempt...,
      or nothing when there is none, or unknown for a pre-v6 attempt", and permits but does not
      require the TUI to show it "where its shared view-model already carries the attempt...; do
      not build a new frame for it" -- PositionAttempt already needed a runtime field for graph
      show, so the TUI addition was one line, not a new frame, and adding it keeps the two
      attempt-row renderers (plain and TUI) from silently disagreeing about what an attempt
      carries. liveOrLatestAttempt takes isLiveAttempt as a parameter rather than importing it
      from nodeRow.ts, since nodeRow.ts already imports PositionAttempt from attempts.ts and a
      reverse import would be circular.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - packages/face/src/nodeRow.ts
    hunks:
