      shared journal (readReplay) and renders "last attempt <session> — <outcome>, <when>" or
      "last attempt never run" per runtime line.

      Verified against the same scratch fixture as c8 (a catalogue runtime "luna" with one
      cleared session, never the real journal): `interlock runtime list` prints exactly
      "luna — kind claude, model claude-opus-5-5, source catalogue, last attempt
      demo-session-1 — cleared, 2025-09-24T00:00:00.000Z" for the runtime with an attempt, and
      "default — kind claude, model (none), source local.yaml, last attempt never run" for the
      legacy runtime with none.
    because: >-
      The acceptance requires "interlock runtime list gains the last attempt per profile,
      outcome and when, from the projection, so 'can this profile start on this machine' is
      answered by the record." projection.sessions is a Map built by folding journal events in
      file order (see packages/ledger/src/projection.ts), so insertion order already is
      chronological order; the last session recorded for a given runtime name during that fold
      is genuinely the most recent one, the same convention packages/face/src/attempts.ts and
      frameRender.ts already rely on for "latest" (attempts[attempts.length - 1]). "When" is
      read from the session's own first narration entry's timestamp (the "leased ..." line
      narrated immediately after the lease is taken), since no session carries an explicit
      "started at" field of its own.
    rests_on:
      - .interlock/sessions/0043-any-runtime/run-with-runtime/brief.md
      - packages/face/src/attempts.ts
      - packages/ledger/src/projection.ts
    hunks:
