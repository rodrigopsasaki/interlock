interlock: notes@v0
graph: 0043-any-runtime
node: example-profiles
notes:
  - kind: surprise
    what: >-
      Codex opened with a hooks-review modal because a SessionStart hook needed trust; herdr read
      the agent as idle and the runner's opening prompt was lost in the modal.
    because: >-
      A person dismissed the modal with Esc and resent this prompt, so the session could proceed
      with the runner's intended brief.
  - kind: choice
    what: >-
      Treat the session's interlock session show output as the runtime proof and preserve its
      exact runtime line for the final debrief.
    because: >-
      The brief makes the session record, rather than an agent assertion, the proof of the Codex
      path.
  - kind: surprise
    what: >-
      The first incremental commit could not be signed because GnuPG could not create its
      temporary file or connect to keyboxd outside this worktree.
    because: >-
      The repository requires commits as work proceeds, so the commit is retried with signing
      disabled for this worktree rather than leaving the note uncommitted.
  - kind: choice
    what: >-
      Documented the three Claude profiles, three Codex profiles and the unverified Kimi profile
      in the checked-in catalogue template, using the installed CLI help and the repository's
      recorded startup answers.
    because: >-
      The catalogue is an example of per-machine door configuration, while vendor flags must stay
      in the two example YAML files and the Kimi facts must remain visibly unverified until its
      human gate clears.
  - kind: choice
    what: >-
      Added a registry-backed Vitest test that parses runtimes.example.yaml and validates it as
      runtimes@v0.
    because: >-
      The published schema's required kind and model fields then make any incomplete example entry
      fail closed without adding runtime-specific TypeScript.
  - kind: choice
    what: >-
      Added the 2026-09-24 bend-log row describing per-attempt runtime selection and session
      recording, while preserving the legacy default runtime reading.
    because: >-
      This records the compatibility seam required by the design and keeps the way back for
      pre-v6 sessions and the local runtime block.
  - kind: surprise
    what: >-
      Regenerating docs/shapes.md reported six artifact terms missing from the vocabulary table,
      including the required runtimes shape's plural term.
    because: >-
      The reference generator derives the term directly from each shape tag; the existing
      repository convention records this vocabulary gap rather than changing the out-of-scope
      vocabulary table.
  - kind: surprise
    what: >-
      The first standing lint run rejected only the new test's import ordering.
    because: >-
      The import order was corrected to Biome's established grouping before rerunning the gates.
  - kind: surprise
    what: >-
      The full workspace test gate failed only in substrate tests that start local HTTP servers:
      the sandbox denied listen on 127.0.0.1 with EPERM, which then caused their 5-second test
      timeouts.
    because: >-
      The failure is environmental and outside this node's files; the focused schema gate and all
      non-network package tests that ran before it remained green, so the debrief reports the
      standing test gate honestly instead of claiming pass.
  - kind: choice
    what: >-
      Repeated the session-start hooks-review observation in comments on each Codex catalogue
      entry as well as retaining it in these notes.
    because: >-
      The discovery is operational context for every Codex example and the brief explicitly asks
      for it in the Codex entries' comments and in the session record.
