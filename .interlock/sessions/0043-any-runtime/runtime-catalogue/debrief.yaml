open:
  - >-
    gap: the graph's acceptance text says "profile" for a named catalogue entry; the closed
    vocabulary has no such noun. Nearest term: "runtime" (I6, local.yaml's runtime: block, the
    runner's Runtime interface). Difference: "profile" would have named the concept by its
    configuration-file role; "runtime" names it by what it starts. Every artifact, CLI surface
    and test in this diff says "runtime"/"runtimes catalogue" and never "profile", per the
    brief's explicit instruction.
  - >-
    gap: AGENTS.md's vocabulary table lists "runtime" (singular); this node's shape tag is
    "runtimes@v0" (plural, dictated by the acceptance text). packages/schemas/src/reference's
    term extraction takes the shape tag's bare word literally, so `interlock schema reference`
    now reports "runtimes" as a term with no vocabulary row (informational only; exit code is
    unaffected). Nearest term: "runtime"; difference: pluralization of the artifact tag versus
    the vocabulary noun. AGENTS.md is out of scope for this node, so this is recorded rather
    than fixed.
