  - id: c2
    what: Emitted authored applicability only for rooted evidence and retained the old hunk-derived scope and multi-hunk gap when applies_to is absent.
    because: A verifier mark establishes support rather than semantic relevance; suppressing an untrue repository fallback is correct only when an explicit authored applicability already supplies the item scope.
    rests_on: ["brief: Preserve useful applicability without changing proof", "notes: canonical portable applicability choice"]
    hunks: [packages/substrate/src/evidence.ts, packages/substrate/test/evidence.test.ts]
