interlock: notes@v0
node: separate-learning-applicability
entries:
  - kind: choice
    at: "2026-09-15T22:46:22Z"
    chose: "Represent applies_to as the existing repository-or-safe-path scope shape, optional on debrief decision and discovery claims."
    because: "The graph acceptance requires one repository or repository-relative path without an organisation-wide grant, and packages/debrief/src/slice.ts already owns the identical item@v1 scope union used by evidence emission."
  - kind: choice
    at: "2026-09-15T22:50:37Z"
    chose: "Move the safe path predicate and the narrower applicability union into ledger, then have debrief parsing consume it."
    because: "Debrief already depends on ledger while ledger cannot depend on debrief; the move keeps one semantic path contract and lets the ledger event guard reject unsafe replay data without a dependency cycle."
  - kind: choice
    at: "2026-09-15T22:51:18Z"
    chose: "Forward applies_to only inside debrief decision and discovery entries, never as an item@v1 field."
    because: "The receiver audit cites apps/preston/schemas/substrate@v1/parts/decision.json and discovery.json as additive, while its absorb intake uses existing item.scope and item@v1 is strict; a rooted claim can therefore preserve authored applicability without changing the item contract."
  - kind: surprise
    at: "2026-09-15T22:52:51Z"
    expected: "The existing brief scope predicate could be shared directly by new applies_to."
    observed: "Independent receiver review found it accepts blank, dot, backslash-rooted, drive-colon, NUL, and parent-segment paths; the receiver-compatible applies_to guard must be stricter while brief@v1 keeps its prior interpretation."
  - kind: choice
    at: "2026-09-15T22:55:56Z"
    chose: "Require applies_to paths to be canonical portable repository paths and retain the legacy multi-hunk gap only when applicability is absent."
    because: "Receiver normalization trims then rejects whitespace, dot, rooted, and parent paths; an explicit authored scope makes the old hunk-derived repository fallback untrue, while the absent-field behavior remains an exact legacy interpretation."
  - kind: choice
    at: "2026-09-15T22:58:02Z"
    chose: "Document support and authored applicability together as a debrief example, without extending verifier or item@v1 behavior."
    because: "The example keeps the historical notes hunk as support and shows applies_to as a separately authored path; schema reference completed after the schema artifacts were finalized."
  - kind: surprise
    at: "2026-09-15T22:59:35Z"
    expected: "The canonical path guard and JSON Schema pattern rejected the same input set."
    observed: "A source check demonstrated that a path with an embedded line feed or carriage return passed the guard but failed the schema; both now need explicit control-character rejection while ordinary internal spaces remain valid."
  - kind: surprise
    at: "2026-09-15T23:00:35Z"
    expected: "The generic model family name was sufficient derivation metadata."
    observed: "Root verified session 01a0a73f-0899-74d1-9975-8b3dc3fe57b5 ran as codex / gpt-5.6-terra / high, so the final debrief must record gpt-5.6-terra exactly."
  - kind: surprise
    at: "2026-09-15T23:02:43Z"
    expected: "The schema control-character class matched the runtime guard beyond the reproduced line separators."
    observed: "Source review found the schema only excluded NUL while its dot handling happened to reject some line separators; parity requires one explicit policy rejecting C0, DEL, U+2028, and U+2029 at both boundaries without normalizing accepted bytes."
