  - id: focused-never-holds-proof
    what: "Add fixture-only runner tests proving EOF on stdin, runner-owned environment overrides, setup timeout and grandchild termination, heavy-prefix lock release, absence of machine and wrapper writes, and blocked-not-busy gate timeout behavior."
