decisions:
  - id: shared-noninteractive-process-boundary
    what: "Route setup commands, gate commands, and their node-engine preflights through one detached process-group runner that closes stdin, injects CI=1 and npm_config_confirm_modules_purge=false, captures raw output bytes, and terminates the whole group after a bounded grace period."
    because: "Both setup and command gates previously inherited a live stdin and had no hold bound; one shared runner keeps the non-interactive and descendant-cleanup guarantees identical at every command boundary."
    rests_on:
      - "brief:Acceptance (verbatim from the graph)"
      - "packages/runner/src/ownedCommand.ts:11-20"
      - "packages/runner/src/ownedCommand.ts:58-147"
    hunks:
      - packages/runner/src/ownedCommand.ts:11-24
      - packages/runner/src/ownedCommand.ts:58-147
    produces:
      - packages/runner/src/ownedCommand.ts
  - id: setup-timeout-and-retained-refusal
    what: "Give worktree setup a named 20-minute default hold timeout, apply it to the node-engine preflight and setup command, and report a timeout with the command, duration, output tail, and retained setup log."
    because: "A setup command that has started must not hold the heavy lock indefinitely; retaining the tail and content-addressed log preserves the evidence needed to repair the failed setup."
    rests_on:
      - "brief:Acceptance (verbatim from the graph)"
      - "packages/runner/src/worktreeSetup.ts:14-45"
    hunks:
      - packages/runner/src/worktreeSetup.ts:14-45
      - packages/runner/src/worktreeSetup.ts:92-159
      - packages/runner/src/worktreeSetup.ts:161-183
    produces:
      - packages/runner/src/worktreeSetup.ts
  - id: gate-timeout-is-blocked-failure
    what: "Give command gates a named 60-minute fallback timeout, use the existing session run timeout when supplied, retain stdout and stderr as gate artifacts, and classify a timed-out command as an ordinary blocked gate failure with one plain timeout line rather than as busy."
    because: "The command has started when its hold expires, so retry-on-never-started is the wrong disposition; the existing gate receipt and blocked state can carry the timeout evidence without changing artifact versions."
    rests_on:
      - "brief:Acceptance (verbatim from the graph)"
      - "packages/runner/src/gateJudge.ts:71-182"
      - "packages/runner/src/gateJudge.ts:318-365"
      - "packages/runner/src/gateJudge.ts:431-562"
    hunks:
      - packages/runner/src/gateJudge.ts:71-182
      - packages/runner/src/gateJudge.ts:318-365
      - packages/runner/src/gateJudge.ts:431-573
    produces:
      - packages/runner/src/gateJudge.ts
  - id: propagate-gate-hold-setting
    what: "Expose the gate hold timeout through judgeWorktree and sessionDrive, while exporting the named gate default from the runner package."
    because: "Direct gate callers need the documented fallback, and session-driven gates must inherit the configured run timeout without introducing runtime-specific assumptions into the gate implementation."
    applies_to: { kind: repository }
    rests_on:
