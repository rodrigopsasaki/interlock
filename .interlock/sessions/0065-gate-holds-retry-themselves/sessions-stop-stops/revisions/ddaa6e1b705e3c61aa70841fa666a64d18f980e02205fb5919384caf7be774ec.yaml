decisions:
  - id: durable-exec-stop-effect
    what: Persist a stable exec-stop intent before control-socket dispatch, record acknowledged or uncertain delivery, replay retained intents, and expose the durable socket locator while keeping the public sessions projection unchanged.
    because: The acceptance requires human and timeout exec stops to share the outbox boundary, survive a dispatch/replay gap, and identify the live phase without changing existing session listings or old records.
    applies_to: { kind: repository }
    rests_on:
      - packages/runner/src/execStop.ts
      - packages/runner/src/execRuntime.ts
      - packages/runner/src/index.ts
      - schemas/session@v0.json
      - docs/shapes.md
    hunks:
      - packages/runner/src/execStop.ts
      - packages/runner/src/execRuntime.ts
      - packages/runner/src/index.ts
      - schemas/session@v0.json
      - docs/shapes.md
  - id: stop-driver-continuation
    what: Consume phase and attempt stop signals in the exec driver, holding an attempt before commit or debrief while allowing a phase stop to follow timeout continuation, and route pane stops through the machine close outbox with by and because.
    because: A phase stop ends only the current phase, whereas an attempt stop must prevent every later phase, judgement, commit and renewal; pane close must have the same durable intent and one-close behavior.
    applies_to: { kind: repository }
    rests_on:
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/machineOutbox.ts
      - packages/runner/src/execStop.ts
    hunks:
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/machineOutbox.ts
      - packages/runner/src/execStop.ts
  - id: sessions-stop-grammar
    what: Add the sessions stop command, strict argument refusal, unique-prefix and live-session checks, exec dispatch, pane resolution, and main routing while preserving the existing list and read commands.
    because: The closed sessions vocabulary must refuse unknown arguments and invalid targets without recording or closing anything, while one ledger session may have both debrief and work phase records and must still resolve as one identity.
    applies_to: { kind: repository }
    rests_on:
      - packages/cli/src/main.ts
      - packages/cli/src/sessions.ts
      - packages/cli/test/sessionsStop.test.ts
    hunks:
      - packages/cli/src/main.ts
      - packages/cli/src/sessions.ts
      - packages/cli/test/sessionsStop.test.ts
  - id: stop-proof-and-session-receipts
    what: Add fixture coverage for pane close intent contents, refusal paths, exec intent persistence, uncertain delivery replay, and the compatibility rule that timeout records retain their timeout reason; record the session choices and surprises in notes@v0.
    because: The new behavior crosses CLI, runner, ledger and process-lifecycle seams, so focused fixtures prove durable ordering and refusal behavior while notes preserve the decisions that shaped the diff.
    applies_to: { kind: repository }
    rests_on:
      - packages/cli/test/sessionsStop.test.ts
      - packages/runner/test/execStop.test.ts
      - packages/runner/src/execRuntime.ts
      - .interlock/sessions/0065-gate-holds-retry-themselves/sessions-stop-stops/notes.yaml
    hunks:
      - packages/cli/test/sessionsStop.test.ts
      - packages/runner/test/execStop.test.ts
      - packages/runner/src/execRuntime.ts
      - .interlock/sessions/0065-gate-holds-retry-themselves/sessions-stop-stops/notes.yaml
