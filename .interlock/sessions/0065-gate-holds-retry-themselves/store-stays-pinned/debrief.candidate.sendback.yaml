  - id: pin-gate-children
    what: Add the recorded store to the non-interactive environment passed to command gates, once per gate-judgement, while leaving node-engine probing and the existing setup environment behavior intact.
    because: The full pnpm test gate runs before slow-tests-accounted and can purge the real worktree when its fixture HOME selects another store; passing the recorded store at the gate boundary prevents that first purge.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
    hunks:
      - packages/runner/src/gateJudge.ts:363-368
      - packages/runner/src/gateJudge.ts:453-456
  - id: pin-slow-test-children
    what: Give every pnpm child started by slow-tests-accounted the recorded worktree store when valid module metadata exists.
    because: The helper deliberately runs package Vitest suites from the real repository root, so inheriting a fixture HOME without an explicit store would recreate the mismatch inside the gate.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
    hunks:
      - scripts/gates/slow-tests.ts:6-14
      - scripts/gates/slow-tests.ts:282-296
  - id: prove-full-gate-preservation
    what: Extend the fake pnpm fixture with a purge path and judge a full pnpm test gate while snapshotting both .modules.yaml and the runner vitest link before and after it.
    because: The regression fails when gateEnv omits the recorded store, and it proves the exact send-back defect without real pnpm, a real store, network access, or installation into the worktree.
    rests_on:
