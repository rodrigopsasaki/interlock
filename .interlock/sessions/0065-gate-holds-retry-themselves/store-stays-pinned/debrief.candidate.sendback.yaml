    what: Read the recorded pnpm store through one YAML parser that narrows the document and storeDir field, while preserving the existing default-store fallback for absent, invalid, or unreadable metadata.
    because: The worktree metadata is the only stable store identity available when a fixture HOME changes pnpm's default; a malformed or missing file must retain the established fallback rather than becoming a new setup failure.
    rests_on:
      - brief:Acceptance (verbatim from the graph)
