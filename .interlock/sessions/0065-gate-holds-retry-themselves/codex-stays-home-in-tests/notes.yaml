interlock: notes@v0
notes:
  - kind: choice
    at: "2026-11-11T18:30:00Z"
    choice: "Keep the guard and supervisor in test/support and install the guard through the runner Vitest setup."
    because: "The acceptance makes the runner setup the single boundary for every runner test while keeping Codex-specific knowledge out of production adapters."
  - kind: choice
    at: "2026-11-11T18:31:00Z"
    choice: "Use a pinned-Node TypeScript guard entrypoint behind a generated PATH wrapper."
    because: "The guard needs to be the executable named codex for child processes, while the shared TypeScript supervisor remains directly testable with injected process-table data."
  - kind: surprise
    at: "2026-11-11T18:47:00Z"
    expected: "The platform process table would expose launch environment values in the same shape on macOS and Linux."
    observed: "macOS requires `ps eww` rather than the hyphenated flag form, and its output exceeds the default child-process buffer; the supervisor now uses the correct form and an explicit bounded buffer."
  - kind: choice
    at: "2026-11-11T18:48:00Z"
    choice: "Put the loopback Responses fixture in runner test support and use it for the marker-overflow exec case."
    because: "The guard must exercise the real Codex exec path without allowing the test to contact a non-loopback provider, while preserving the marker assertions."
  - kind: surprise
    at: "2026-11-11T18:49:00Z"
    expected: "Any process found at test cleanup would be a failed test."
    observed: "Normal real-Codex MCP children can still be present at the first cleanup snapshot but terminate during the supervisor's TERM grace; only processes surviving that grace are reported as leaks."
