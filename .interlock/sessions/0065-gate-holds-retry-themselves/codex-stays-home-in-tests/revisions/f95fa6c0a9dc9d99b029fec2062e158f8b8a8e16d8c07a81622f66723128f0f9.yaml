  - id: install-runner-codex-guard
    what: Extend the runner Vitest configuration with the base setup files followed by a runner-only Codex guard setup, while excluding nested fixture tests from the normal glob and allowing their explicit fixture invocation.
    because: The acceptance places the guard at the runner test boundary and requires the leak fixture to be nested without becoming a normal package test.
