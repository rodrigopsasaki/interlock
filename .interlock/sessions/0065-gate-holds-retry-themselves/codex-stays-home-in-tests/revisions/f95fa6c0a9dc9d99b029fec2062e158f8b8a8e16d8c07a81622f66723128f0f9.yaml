      - packages/runner/test/codexGuard.test.ts:112-292
      - packages/runner/test/fixtures/codexGuardLeak.test.ts:1-11
      - packages/runner/test/support/codexGuard.ts:226-255
  - id: exercise-overflow-through-loopback
    what: Add a local Responses-compatible loopback provider and route the marker-overflow exec case through its loopback provider configuration while preserving the existing marker assertions and child environment checks.
    because: The kept real-Codex overflow case must pass the guard without contacting a non-loopback provider and must still verify every marker value reaches every MCP child.
    rests_on:
      - packages/runner/test/support/loopbackProvider.ts:1-87
      - packages/runner/test/realCodexMarkerOverflow.test.ts:79-144
    hunks:
      - packages/runner/test/support/loopbackProvider.ts:1-87
      - packages/runner/test/realCodexMarkerOverflow.test.ts:79-144
