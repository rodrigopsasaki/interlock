      - packages/runner/vitest.config.ts:4-15
      - packages/runner/test/support/codexGuardSetup.ts:10-49
    hunks:
      - packages/runner/vitest.config.ts:4-15
      - packages/runner/test/support/codexGuardSetup.ts:10-49
  - id: refuse-unsafe-codex-forms
    what: Parse global profile and selector flags before the subcommand, resolve base and selected profile overlays, and permit only mcp list forms or exec against a loopback provider.
    because: Tests must never start the fake or real Codex for unsupported command forms, provider configuration, missing profiles, malformed URLs, or non-loopback endpoints; the accepted loopback forms still exercise the real launch path.
    rests_on:
      - packages/runner/test/support/codexGuard.ts:108-199
      - packages/runner/test/support/codexGuard.ts:266-303
    hunks:
      - packages/runner/test/support/codexGuard.ts:108-199
      - packages/runner/test/support/codexGuard.ts:266-303
  - id: register-and-reap-launches-safely
    what: Register guarded launches with process-group, start-time, and token identity, then terminate surviving token-bearing descendants after a grace period while rejecting reused leader pids.
    because: Detached Codex descendants must not outlive tests, but cleanup must fail closed when a pid has been reused and must not signal an unrelated process.
    rests_on:
      - packages/runner/test/support/codexSupervisor.ts:168-186
      - packages/runner/test/support/codexSupervisor.ts:188-251
    hunks:
      - packages/runner/test/support/codexSupervisor.ts:168-251
  - id: prove-guard-boundary-and-fixture-audit
    what: Add refusal, provider, mcp, nested-detached-descendant, and pid-reuse cases, plus the explicit fixture file; keep generated fake scripts and delegated launches statically readable and declare the nested lifecycle test as a slow integration.
    because: The runner acceptance requires each refusal and cleanup behavior to be observed through a fake Codex, while the repository fixture audit and slow-test gate must remain satisfied without exceptions.
    rests_on:
      - packages/runner/test/codexGuard.test.ts:51-75
      - packages/runner/test/codexGuard.test.ts:112-292
      - packages/runner/test/fixtures/codexGuardLeak.test.ts:1-11
      - packages/runner/test/support/codexGuard.ts:226-255
    hunks:
