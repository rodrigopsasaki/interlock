decisions:
  - id: repository-index-and-launch-registration
    applies_to: { kind: path, path: packages/runner/src/repositoryIndex.ts }
    what: >-
      Added a repository-index@v0 keyed by canonical common Git directory, with idempotent
      registration from both exec and pane launch paths and readable entries for --all discovery.
    because: >-
      Live-all must discover repositories beyond the caller while repeated launches of one
      repository must leave one stable index entry and a missing run root must remain reportable.
    rests_on:
      - packages/runner/src/repositoryIndex.ts:16-196
      - packages/runner/src/execRuntime.ts:843
      - packages/runner/src/sessionDrive.ts:880
    hunks:
      - packages/runner/src/repositoryIndex.ts:16-196
      - packages/runner/src/execRuntime.ts:843
      - packages/runner/src/sessionDrive.ts:880
    produces:
      - packages/runner/src/repositoryIndex.ts
      - packages/runner/src/execRuntime.ts
      - packages/runner/src/sessionDrive.ts
  - id: runtime-agent-enumeration
    applies_to: { kind: path, path: packages/runner/src/runtime.ts }
    what: >-
      Added a typed optional Runtime.listAgents seam and mapped herdr agent.list responses into
      tokened and untokened EnumeratedAgent values without exposing herdr protocol details to the
      CLI.
    because: >-
      The acceptance requires every runtime-listed pane to remain visible, including panes with no
      interlock tokens, while the CLI must depend on the Runtime seam rather than parse a screen.
    rests_on:
      - packages/runner/src/runtime.ts:45-55
      - packages/runner/src/runtime.ts:167-212
      - packages/runner/src/herdr/adapter.ts:227-292
      - packages/runner/src/herdr/adapter.ts:720-727
      - packages/runner/test/herdr/listAgents.test.ts:30-73
    hunks:
      - packages/runner/src/runtime.ts:45-55
      - packages/runner/src/runtime.ts:167-212
      - packages/runner/src/herdr/adapter.ts:227-292
      - packages/runner/src/herdr/adapter.ts:720-727
      - packages/runner/test/herdr/listAgents.test.ts:30-73
    produces:
      - packages/runner/src/runtime.ts
      - packages/runner/src/herdr/adapter.ts
      - packages/runner/test/herdr/listAgents.test.ts
  - id: live-all-composition-and-liveness
    applies_to: { kind: path, path: packages/cli/src/sessions.ts }
    what: >-
      Added sessions@v1 live-all composition for indexed exec roots and Runtime-listed panes,
      process-start liveness classification, phase collapse, cross-transport deduplication, source
      warnings and partial state, while stripping the row shape from the existing sessions@v0
      no-all JSON output.
    because: >-
      The graph acceptance counts live and unknown rows, excludes dead or reused exec anchors,
      preserves untracked panes and source failures, and keeps the prior local sessions contract
      readable forever.
    rests_on:
      - packages/cli/src/sessions.ts:38-45
      - packages/cli/src/sessions.ts:54-329
      - packages/cli/test/sessionsLiveAll.test.ts:42-79
    hunks:
      - packages/cli/src/sessions.ts:38-45
      - packages/cli/src/sessions.ts:54-329
      - packages/cli/test/sessionsLiveAll.test.ts:42-79
    produces:
      - packages/cli/src/sessions.ts
      - packages/cli/test/sessionsLiveAll.test.ts
  - id: sessions-v1-contract-and-reference
    applies_to: { kind: path, path: schemas/sessions@v1.json }
    what: >-
      Published sessions@v1 with nullable cross-repository row identity, transport, phase and
      liveness fields plus repository and herdr source states, and regenerated the shape reference.
    because: >-
      The new --all envelope is a public artifact and must validate its complete and partial reads
      without changing the sessions@v0 artifact used by local reads.
    rests_on:
      - schemas/sessions@v1.json:1-54
      - docs/shapes.md:1650-1671
      - packages/schemas/test/sessionsV1.test.ts:49-62
    hunks:
      - schemas/sessions@v1.json:1-54
      - docs/shapes.md:1650-1671
      - packages/schemas/test/sessionsV1.test.ts:49-62
    produces:
      - schemas/sessions@v1.json
      - docs/shapes.md
      - packages/schemas/test/sessionsV1.test.ts
  - id: session-receipts-retained
    applies_to: { kind: path, path: .interlock/sessions/0065-gate-holds-retry-themselves/sessions-live-all/notes.yaml }
    what: Retained each implementation choice and observed gate-environment surprise in notes@v0 beside the diff.
    because: The session debrief must preserve the way back from the compressed implementation and its proof boundary.
    rests_on:
      - .interlock/sessions/0065-gate-holds-retry-themselves/sessions-live-all/notes.yaml:1-24
    hunks:
      - .interlock/sessions/0065-gate-holds-retry-themselves/sessions-live-all/notes.yaml:1-24
    produces:
      - .interlock/sessions/0065-gate-holds-retry-themselves/sessions-live-all/notes.yaml
