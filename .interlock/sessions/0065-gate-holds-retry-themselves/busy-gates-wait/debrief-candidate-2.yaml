      - packages/runner/src/gateJudge.ts:444-500
      - packages/runner/src/gateJudge.ts:609-612
      - packages/runner/test/busyGatesWait.test.ts:57-113
  - id: prove-start-dominance-and-shared-boundary-retries
    what: Added real-prefix coverage for pre-start refusals, later admission, marker dominance, hidden boundary environment, gate-owned reports, incomplete refusals, and one allowance shared by the probe and two gates; asserted reference-prefix reason text and machine@v1 validation.
    because: Injected runners cannot prove the child-process boundary, and the acceptance requires each refusal to be bounded, identifiable, replayable, and distinct from an ordinary started failure.
    rests_on:
