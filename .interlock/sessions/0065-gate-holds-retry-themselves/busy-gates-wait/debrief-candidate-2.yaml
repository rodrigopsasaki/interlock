  - id: keep-the-boundary-before-the-command-tail
    what: Corrected busy launches to place the runner-owned shell boundary after the machine heavy prefix and before the bare mise exec command tail, while keeping ordinary argv unchanged; moved boundary state to a 0700 system-temporary directory.
    because: A real prefix must be able to refuse before the start marker is written, and transient marker/report files must not be hidden in or left behind in the worktree.
    rests_on:
      - packages/runner/src/busy.ts:1-75
      - packages/runner/src/gateJudge.ts:444-500
      - packages/runner/src/gateJudge.ts:609-612
      - packages/runner/test/busyGatesWait.test.ts:57-113
    hunks:
