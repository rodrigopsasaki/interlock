decisions:
  - id: assert-node-engine-boundary-argv
    what: Added exact node-engine argv assertions for both the ordinary machine path and the busy boundary path, including the shell script and command tail.
    because: The node-engine probe is part of the shared busy allowance, while machine@v0 must keep its argv byte-identical.
    rests_on:
      - packages/runner/test/busyGatesWait.test.ts:129-204
    hunks:
      - packages/runner/test/busyGatesWait.test.ts:129-204
  - id: preserve-started-command-judgement
    what: Preserved started-command judgement, marker dominance, hidden boundary variables, gate-owned busy-shaped reports, and ambiguous exit handling in the boundary regression cases.
    because: A gate that starts is its own proof boundary; the acceptance explicitly keeps ordinary gate behavior and judges a gate-written report as the gate's own result.
    rests_on:
      - packages/runner/test/busyGatesWait.test.ts:127-322
    hunks:
      - packages/runner/test/busyGatesWait.test.ts:127-322
  - id: carry-busy-policy-through-every-door
    what: Added busy refusals through judgeWorktree, backfill, and the interlock judge command, each admitting on a retry, and extended the drive fixture to inject the policy and command runner.
    because: Every judging door must apply the same machine policy, so a retry proven only in judgeGates would leave two production entry points untested.
    rests_on:
      - packages/runner/test/busyGatesWait.test.ts:599-639
      - packages/cli/test/judgeProvider.test.ts:149-175
      - packages/runner/test/machineProvider.test.ts:813-865
      - packages/runner/test/support/driveFixture.ts:186-221
    hunks:
      - packages/runner/test/busyGatesWait.test.ts:599-639
      - packages/cli/test/judgeProvider.test.ts:149-175
      - packages/runner/test/machineProvider.test.ts:813-865
      - packages/runner/test/support/driveFixture.ts:186-221
  - id: retain-replayable-busy-receipt-identity
    what: Proved that identical busy refusals from separate judgements carry distinct receipt and judgement identities, replay to the same projection, and assess as not-recorded rather than as a run.
    because: Busy is a harness refusal, not command execution; its proof must remain distinguishable and replayable without being mistaken for a gate run.
    rests_on:
      - packages/runner/test/busyGatesWait.test.ts:641-692
    hunks:
      - packages/runner/test/busyGatesWait.test.ts:641-692
  - id: renew-leases-during-busy-drive
    what: Added exec and pane drive tests that cross several lease periods, sweep between busy backoffs, and assert renewal continues until after the outcome event.
    because: A busy wait is still live runner work; the sweeper must abandon nothing while the runner holds the node and must stop only after the outcome is recorded.
    rests_on:
      - packages/runner/test/execWithoutHerdr.test.ts:190-322
      - packages/runner/test/support/driveFixture.ts:186-221
    hunks:
      - packages/runner/test/execWithoutHerdr.test.ts:190-322
      - packages/runner/test/support/driveFixture.ts:186-221
  - id: preserve-test-fixture-isolation
    what: Isolated the new ledger and drive artifacts under the package test runs directory and kept the fixture's existing runtime and Git setup seams injectable.
    because: The lease proof needs to inspect the live ledger while ensuring test artifacts do not escape into packages/runner/outbox or inherit the parent repository.
    rests_on:
