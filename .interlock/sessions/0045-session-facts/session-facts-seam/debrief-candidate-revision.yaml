derivation:
  kind: agent
  runtime: codex
  model: gpt-5.6-luna
discoveries: []
decisions:
  - id: stateful-session-facts
    what: >-
      Revised session-facts@v0 so every observation is an explicit known-or-unknown
      state object, with named optional input, output, cachedInput, and reasoning
      counters beside a required raw counter map.
    because: >-
      SessionFact<string> previously collapsed to string, making unknown
      indistinguishable from a value; stable counters give later consumers a
      vendor-neutral view while raw preserves counters not shared by every vendor.
    rests_on:
      - .interlock/graphs/0045-session-facts.yaml
      - packages/ledger/src/sessionFacts.ts
      - schemas/session-facts@v0.json
    hunks:
      - 'packages/ledger/src/sessionFacts.ts:5-42'
      - 'packages/ledger/src/sessionFacts.ts:67-158'
      - 'schemas/session-facts@v0.json:1-132'
      - 'schemas/parts/session-facts.json:1-132'
    produces:
      - packages/ledger/src/sessionFacts.ts
      - packages/ledger/src/index.ts
      - schemas/session-facts@v0.json
      - schemas/parts/session-facts.json
      - docs/shapes.md
    applies_to: { kind: path, path: packages/ledger/src/sessionFacts.ts }
  - id: delivery-basis-is-a-type-discriminant
    what: >-
      Made SessionFacts a delivery-basis union: record permits known yes or
      unknown prompt evidence, while status permits only unknown; runtime guards,
      JSON Schema conditionals, and negative type tests enforce the same rule.
    because: >-
      A status transition or successful prompt RPC cannot establish receipt of the
      opening prompt for a runtime with a reader; only the runtime record can do so.
      The union prevents both the type layer and event@v7 from representing that
      inferred state.
    rests_on:
      - .interlock/graphs/0045-session-facts.yaml
      - packages/ledger/src/sessionFacts.ts
      - packages/ledger/test/sessionFacts.test.ts
      - schemas/parts/session-facts.json
    hunks:
      - 'packages/ledger/src/sessionFacts.ts:28-42'
      - 'packages/ledger/src/sessionFacts.ts:146-158'
      - 'packages/ledger/test/sessionFacts.test.ts:43-63'
      - 'packages/schemas/test/corpus.guards.test.ts:379-394'
    produces:
      - packages/ledger/src/sessionFacts.ts
      - packages/ledger/test/sessionFacts.test.ts
      - packages/schemas/test/corpus.guards.test.ts
      - schemas/parts/session-facts.json
      - schemas/event@v7.json
    applies_to: { kind: path, path: packages/ledger/src/sessionFacts.ts }
