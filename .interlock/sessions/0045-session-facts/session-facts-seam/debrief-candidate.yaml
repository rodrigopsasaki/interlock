    note: All workspace packages typechecked successfully.
  - id: lint
    result: pass
    invocation: mise exec -- pnpm lint
    note: Biome checked the repository with no findings.
  - id: comments
    result: pass
    invocation: mise exec -- pnpm check:comments
    note: packages/*/src contains no comments.
  - id: schema-contract
    result: pass
    invocation: mise exec -- pnpm --filter schemas exec vitest run test/corpus.guards.test.ts test/reference.test.ts
    note: 49 schema guard and reference tests passed.
  - id: schema-reference
    result: pass
    invocation: mise exec -- pnpm interlock schema reference --check
    note: docs/shapes.md was fresh; the repository reports its existing vocabulary gaps.
  - id: test
    result: fail
    invocation: mise exec -- pnpm test
    note: >-
      Ledger, debrief, face, verifier, and non-network substrate tests passed;
      24 existing substrate capability, context, and absorb tests timed out
      after their local servers failed with listen EPERM on 127.0.0.1 in this
      sandbox.
  - id: notes-valid
    result: pass
    invocation: mise exec -- pnpm interlock debrief validate --file .interlock/sessions/0045-session-facts/session-facts-seam/notes.yaml
    note: The session notes validated as notes@v0.
open:
  - >-
    gap: schema reference reports session-facts as an artifact term with no
    AGENTS.md vocabulary row; the contract is retained as the required shape
    name and the unmatched term remains telemetry rather than a new face word.
  - >-
    The full test gate remains environment-limited by the sandbox's refusal to
    bind 127.0.0.1; rerun it in a network-capable environment before clearing
    the node's test receipt.
