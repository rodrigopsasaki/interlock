  - id: codex-rollout-reader
    what: "Added a Codex-only SessionFactsReader that reads the supplied rollout path, matches the opening prompt marker across user input contents, extracts the latest activity timestamp, latest cumulative usage, and same-record quota, and returns record-basis unknowns for unavailable or malformed evidence."
    because: "The acceptance requires the runtime-owned record to establish facts without pane or status inference, preserve raw counters, retain optional quota as unknown when absent, and keep vendor parsing behind the herdr adapter."
    rests_on:
      - packages/runner/src/herdr/codex.ts
