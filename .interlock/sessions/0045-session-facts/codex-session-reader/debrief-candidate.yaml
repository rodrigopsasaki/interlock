    what: "Exposed the Codex reader through the herdr Runtime implementation and runner package exports while retaining the existing runtime-neutral identity seam."
    because: "The existing AgentIdentity already carries the optional session path, so the adapter can retain vendor record access without adding Codex fields to core contracts."
