    rejected: Reading a further response chunk to discover whether an exactly 1024-byte body has more content would exceed the declared intake limit.
  - id: c3
    what: The fake substrate server can declare raw body media and bytes, and the regression suite requires JSON and plain-text details for both verbs, status-only handling for unsupported bodies, truncation and bearer redaction, network distinction, and deterministic stream-boundary and reader-failure behavior.
    because: The old non-2xx early return cannot satisfy a required detail assertion, while an in-memory stream makes the exact 1024-byte boundary reproducible without depending on transport chunking.
