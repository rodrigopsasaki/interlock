  - id: c2
    what: Received response detail is selected only from declared JSON error strings or plain text, normalized, redacted against the configured bearer token, and bounded to 1024 collected bytes and 512 rendered characters; a reader reaching the intake bound is cancelled without a probe read.
    because: The declared-media boundary avoids arbitrary-object narration, and immediate cancellation at the exact byte bound avoids both an unread stream and extra body intake while the limit marker preserves the way back for a person reading the refusal.
    rests_on:
      - .interlock/sessions/0004-readable-refusals/honest-http-refusals/brief.md
