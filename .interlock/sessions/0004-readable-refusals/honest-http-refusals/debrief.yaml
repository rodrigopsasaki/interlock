  - id: c1
    what: Non-2xx context, absorb, and capability calls construct one received-HTTP refusal that retains the verb and exact status, while successful bodies and transport exceptions keep their prior paths.
    because: A response that exists is a refused outcome, not a lost connection; placing the branch immediately after fetch distinguishes it from the surrounding catch path without changing either client outcome contract.
