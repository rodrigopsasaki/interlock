interlock: notes@v0
node: arcs-v1
entries:
  - kind: choice
    at: "2026-11-08T15:23:12Z"
    chose: Keep arcs parsing and resolution in packages/cli/src/arcs, with a typed normalized registry shared by the resolver and migration command.
    because: The acceptance names that package as the seam for repository identity and requires both arcs versions to remain readable without leaking YAML details into callers.
  - kind: choice
    at: "2026-11-08T15:23:12Z"
    chose: Preserve migration comments and existing scalar spelling through the YAML document tree, changing only the tag, repository, removed legacy key, duplicate graph entries, and shared context entries.
    because: The acceptance requires lossless asks, words, sources, comments, and key order, so rebuilding the registry from plain JavaScript values would discard provenance-bearing formatting.
  - kind: surprise
    at: "2026-11-08T15:23:12Z"
    expected: The assigned session would already contain its notes artifact.
    observed: notes.yaml was absent, so it was created before implementation work.
  - kind: surprise
    at: "2026-11-08T15:34:00Z"
    expected: The first migration serialization would preserve the original long scalar layout.
    observed: YAML's default line width rewrapped long asks, words, and sources; migration now disables wrapping and the repository file was checked for the nine explicit placeholder arcs.
  - kind: surprise
    at: "2026-11-08T16:10:00Z"
    expected: The focused migration and standing test gates would pass from a clean checkout.
    observed: The judge found three migration tests failing because mkdtemp assumed the ignored packages/cli/test/arcs/.runs parent already existed; the fixture now creates its directory directly under os.tmpdir(), while afterEach removes it.
  - kind: surprise
    at: "2026-11-08T16:12:00Z"
    expected: The shell wrapper would capture the focused proof and return its exit code.
    observed: zsh rejected the first wrapper's status variable because status is read-only; rerunning with rc captured the proof, which passed with 2 files and 6 tests.
  - kind: surprise
    at: "2026-11-08T16:15:00Z"
    expected: The clean-state full suite would run with the repository's normal environment after the stale session home was removed.
    observed: CODEX_HOME remained exported to the removed link-based session home, causing four runner machine-provider tests to refuse before their fake runtime calls; the migration tests passed, and the suite will be rerun with only that stale variable unset.
  - kind: surprise
    at: "2026-11-08T16:17:00Z"
    expected: Clearing test/.runs after the clean-state full suite would leave the session directory free of generated homes.
    observed: Runner tests recreated the link-based codex-home-cLYDFe folder under this session directory during the passing suite; it was removed again before handoff and is not part of the source or session artifacts.
