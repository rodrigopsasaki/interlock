open:
  - >-
    The acceptance requested runtimes@v1, but that version was already published
    for runner commit custody when main was integrated. This change uses runtimes@v2
    and keeps v0 and v1 readable rather than reassigning v1.
  - >-
    The investigated local sources for two runtime kinds do not expose an allowance
    to divide by; those adapters report unknown with reasons. A future usable source
    belongs behind the same runtime adapter and must not be estimated from another account.
  - >-
    Rodrigo reports all standing gates passing on the signed code, including runner
    478/478, schemas 1142/1142 and CLI 418/418. I ran no tests while preparing this
    debrief. The historical local runs above describe earlier dirty worktree checks;
    they do not replace runner gate receipts for the committed HEAD.
