interlock: commits@v0
entries:
  - message: |
      feat(ledger): retain why each provider was attempted

      Record provider attribution and the candidate allowance readings on session-started.
      Publish event@v10 and keep historical lines readable without inventing attribution.
      Exercise strict debrief preparation across every readable journal version and
      serialize runner handoff fixtures through the ledger's current envelope writer.
    paths:
      - packages/ledger/src/envelope.ts
      - packages/ledger/src/index.ts
      - packages/ledger/src/session.ts
      - packages/ledger/src/upcast/v9.ts
      - packages/ledger/test/replay.test.ts
      - packages/cli/test/debrief/derived.test.ts
      - packages/runner/test/runnerCommits.test.ts
      - schemas/event@v10.json
      - schemas/parts/chosen-by.json
      - schemas/parts/provider-headroom.json
      - schemas/parts/session-runtime-v1.json
  - message: |
      feat(runner): spread attempts across available provider allowances

      Route opted-in profiles by their own remaining fraction and ledger attempt order,
      keeping the configured last resort last. Preserve explicit selection, fallback,
      and the published runner commit mode across catalogue versions.
      Assert the explicit, configured-default and legacy-default selection evidence
      in CLI session records alongside the selected profile and model.
    paths:
      - packages/cli/src/plan.ts
      - packages/cli/src/run.ts
      - packages/cli/test/run.test.ts
      - packages/runner/src/claude/headroom.ts
      - packages/runner/src/codex/headroom.ts
