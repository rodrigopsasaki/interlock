  - id: retain-exact-history
    what: Treated only a regular hash-named session revision whose raw bytes match its SHA-256 filename as retained history in the real-file corpus.
    because: A retained invalid revision is evidence of a past mistake, while moved, malformed, tampered, and symbolic-link artifacts must retain ordinary validation or refusal.
    rests_on:
      - .interlock/graphs/0023-debrief-validation.yaml
      - .interlock/sessions/0023-debrief-validation/validate-current-debrief/notes.yaml
    hunks:
      - packages/schemas/test/corpus.files.test.ts
      - docs/design/0001-interlock.md
  - id: prove-repair-compatibility
    what: Proved that an invalid current v2 remains repairable through the existing revise command, which retains its exact old bytes before installing a schema-valid candidate.
    because: Validation must not close the repair path or rewrite the evidence that explains the correction.
    rests_on:
      - packages/debrief/src/revise.ts
      - .interlock/graphs/0023-debrief-validation.yaml
    hunks:
      - packages/cli/test/debrief/validate.test.ts
