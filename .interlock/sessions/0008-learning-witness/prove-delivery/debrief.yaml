discoveries:
  - id: d1
    what: The prepared environment runs Node 26.0.0 although the repository pins Node 24.14.0.
    found_at: pnpm typecheck
    mattered_because: Focused deterministic receipts pass under the prepared environment, but the runtime mismatch limits them to worker evidence rather than a substitute for the harness receipt.
decisions:
  - id: c1
    what: An acknowledged outbox delivery now requires a retained acknowledgment artifact in its TypeScript union, runtime guard, and event@v5 schema; artifact IDs and byte counts use the same SHA-256 and nonnegative-safe-integer constraints at runtime as in the schema.
    because: I7 permits neither acknowledged delivery without retained evidence nor malformed evidence metadata that a reader could mistake for proof.
    rests_on:
      - .interlock/graphs/0008-learning-witness.yaml
      - docs/design/0001-interlock.md
    hunks:
      - packages/ledger/src/outbox.ts
      - packages/runner/src/gateJudge.ts
      - schemas/event@v5.json
      - docs/shapes.md
  - id: c2
    what: Outbox lookup is exposed through Ledger by node, session, and effect identity, returning verified request and acknowledgment bytes or explicit absent, missing, or corrupt evidence; HTTP non-2xx absorb responses reuse the bounded redacted response-detail helper.
    because: A stored reference is not usable proof until its envelope, byte count, and hash verify, while useful refusal detail must survive without exposing credentials.
    rests_on:
      - .interlock/graphs/0008-learning-witness.yaml
      - packages/substrate/src/responseDetail.ts
    hunks:
      - packages/ledger/src/ledger.ts
      - packages/ledger/src/index.ts
      - packages/ledger/src/outbox.ts
      - packages/substrate/src/httpClient.ts
  - id: c3
    what: Added direct event@v4 and outbox boundary checks plus runner checks for prepared-adapter refusal and uncertain-identity redispatch suppression; regenerated the schema reference.
    because: The previous focused proof covered only a successful dispatch and the named v3-v4 fixture contained no v4 journal lines.
    rests_on:
      - .interlock/graphs/0008-learning-witness.yaml
      - packages/ledger/test/fixtures/journal-v3-v4-2026-09-11.jsonl
    hunks:
      - packages/ledger/test/outboxDurability.test.ts
      - packages/ledger/test/replay.test.ts
      - packages/runner/test/absorbOutbox.test.ts
      - packages/runner/test/absorbOutbox.failure.test.ts
      - packages/runner/test/support/memoryLedger.ts
      - .interlock/sessions/0008-learning-witness/prove-delivery/notes.yaml
