open:
  - The complete acceptance is not met. The added tests map request-before-dispatch and acknowledged artifact retention to absorbOutbox.test.ts; guard, lookup, corruption, and v4 compatibility to outboxDurability.test.ts and replay.test.ts; and missing preparation plus uncertain redispatch suppression to absorbOutbox.failure.test.ts. The required real sink write/fsync pre-dispatch proof, response-observed acknowledgment-artifact and delivery-append failure proofs, restart with intent-only proof, acknowledged identity suppression, changed-request conflict proof, malformed/schema-invalid response proof, none and unsafe target proof, and full request/ack ref matrix remain absent.
  - readable-absorb-proof and the full workspace test gate were not run locally because this worker sandbox blocks local listeners as the brief states. The harness must execute those gates under its own receipt; this worker did not retry the known blocked listener path.
