entries:
  - kind: choice
    at: "2026-09-11T13:24:03-03:00"
    chose: Keep the presentation in Markdown with separate image assets.
    because: >
      GitHub removes custom page styling. Native headings, tables, quotations, and lists keep
      explanations readable, searchable, and editable while the artwork carries the identity.
  - kind: surprise
    at: "2026-09-11T13:24:03-03:00"
    expected: The proposed quoted inline asset check could run as a command gate.
    observed: >
      packages/runner/src/gateJudge.ts splits the command on whitespace without shell parsing.
      The quoted script is therefore split into unrelated arguments. A standalone check file
      is needed. The original approved graph and brief are retained; a corrected invocation
      requires a separately recorded approval.
  - kind: choice
    at: "2026-09-11T13:24:03-03:00"
    chose: Refresh the status claims to include cancel, reset, and gate waive.
    because: >
      Those commands are present at this branch's base, although the local presentation still
      listed human-control commands as work in progress. Rich position and assisted planning
      remain separate, unfinished capabilities.
  - kind: choice
    at: "2026-09-11"
    chose: Correct the notes envelope to the existing notes@v0 reader before ingestion.
    because: >
      The first saved draft used notes/what instead of entries/chose and omitted at. Its
      contents are preserved here and in git; the first three timestamps identify their
      original recording commit rather than claiming separate observation times.
  - kind: choice
    at: "2026-09-11"
    chose: Push codex/readme-interlock-concept and create one draft PR targeting main.
    because: >
      The user explicitly authorized publishing this branch for GitHub review. The stable
      identity is rodrigopsasaki/interlock plus this head branch; query for an existing PR
      before creating one. Keep it draft, report unfinished gate approval honestly, and do
      not merge. Inspect the rendered README on the branch before declaring visual QA done.
  - kind: choice
    at: "2026-09-13T14:07:29Z"
    chose: Continue the README presentation with paired light and dark assets on a fresh branch.
    because: >
      The previous presentation has merged. The requested follow-up preserves the selected
      identity and existing prose while replacing bright artwork panels in dark mode with ink
      paper, ivory lettering, and adjusted blue and gold. No runtime behavior changes.
  - kind: choice
    at: "2026-09-13T14:07:29Z"
    chose: Separate the independent-work caption from its artifact and add a narrow-screen drawing.
    because: >
      The original caption overlapped the examples artifact. Moving it below the artifact and
      giving the diagram more vertical room fixes that collision. A vertical mobile arrangement
      keeps labels readable without scaling the desktop drawing down to phone width.
  - kind: choice
    at: "2026-09-13T14:07:29Z"
    chose: Check theme selection, contrast, and identical geometry between each SVG pair.
    because: >
      A fix in only one theme would recreate the discrepancy. The asset check now covers both
      sides of the 700-pixel breakpoint and both themes, while browser inspection checks actual
      text placement. The original approved graph remains unchanged pending permission to
      replace its malformed inline command with the standalone check.
  - kind: choice
    at: "2026-09-13T14:07:29Z"
    chose: Publish this follow-up for review, with no merge.
    because: >
      The publication identity is rodrigopsasaki/interlock plus head branch
      codex/readme-theme-consistency. No existing pull request for that branch was found before
      dispatch. Verify the pushed commit and query that identity before creating a draft pull
      request, retaining uncertainty if either response cannot be confirmed.
