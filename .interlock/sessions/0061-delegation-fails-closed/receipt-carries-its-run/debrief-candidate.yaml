decisions:
  - id: version-command-proof-identities
    what: Kept receiptId as the content-and-gate fingerprint and added commandReceiptId with command-proof@v1, then used that identity for runner-created command receipts so proof changes write distinct receipts while identical proof can be reused.
    because: Approvals and checkStale depend on the existing content fingerprint, while a command gate's exit code, combined output, expect_output result and retained stream references define whether a rerun has the same proof.
    rests_on:
      - packages/ledger/src/receipt.ts
      - packages/runner/src/gateJudge.ts
      - "acceptance: content identity stays as it is"
    hunks:
      - packages/ledger/src/receipt.ts
      - packages/ledger/src/index.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/receiptCarriesItsRun.test.ts
  - id: assess-recorded-proofs-on-read
    what: Added a ledger receipt assessment for recorded command proofs and projected failing satisfied command receipts as blocked proof mismatches on position, graph, session and face reads without appending journal corrections.
    because: Existing journals must replay unchanged, a satisfied gate must not display as passed when its own recorded run fails, and human or legacy receipts must remain recorded without an invented exit result.
    rests_on:
      - packages/ledger/src/receipt.ts
      - packages/face/src/positionGate.ts
      - packages/face/src/sessionColumns.ts
      - packages/face/src/frameRender.ts
      - "acceptance: existing journals stay readable and their history is not rewritten"
    hunks:
      - packages/ledger/src/receipt.ts
      - packages/face/src/positionGate.ts
      - packages/face/src/sessionColumns.ts
      - packages/face/src/frameRender.ts
      - packages/ledger/test/collidedReceipts.test.ts
      - packages/cli/test/collidedReceiptsRead.test.ts
  - id: prove-collisions-and-read-surfaces
    what: Added focused runner, ledger replay and CLI read fixtures covering fail-then-pass, pass-then-fail, identical proof reuse, expect_output changes, stdout/stderr split changes, collided ids, human and legacy receipts, and every named read surface.
    because: The acceptance names these behaviors as the proof boundary, and the fixtures make both the new receipt identity and the no-migration read assessment executable.
    rests_on:
      - packages/runner/test/receiptCarriesItsRun.test.ts
      - packages/ledger/test/collidedReceipts.test.ts
      - packages/cli/test/collidedReceiptsRead.test.ts
    hunks:
      - packages/runner/test/receiptCarriesItsRun.test.ts
      - packages/ledger/test/collidedReceipts.test.ts
      - packages/cli/test/collidedReceiptsRead.test.ts
  - id: retain-session-evidence
    what: Recorded implementation choices and test-environment surprises in the session notes@v0 artifact.
    because: The brief requires every choice and surprise to remain available beside the immutable brief and final debrief.
    rests_on:
      - .interlock/sessions/0061-delegation-fails-closed/receipt-carries-its-run/notes.yaml
    hunks:
      - .interlock/sessions/0061-delegation-fails-closed/receipt-carries-its-run/notes.yaml
