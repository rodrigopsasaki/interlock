decisions:
  - id: graph-proof-bound-to-parsed-declarations
    what: Passed the authoritative graph path and the SHA-256 hash of the exact graph bytes parsed by each production caller into judgment, and made the judge compare that hash with fresh authoritative and worktree reads.
    because: A delegated clearance must authorize the declarations that were actually parsed, and neither a second graph copy nor a read failure may make an old clearance count.
    rests_on:
      - packages/cli/src/judge.ts
      - packages/cli/src/run.ts
      - packages/cli/src/backfill.ts
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/backfill.ts
      - packages/runner/src/judgeWorktree.ts
    applies_to: { kind: path, path: packages/runner/src/gateJudge.ts }
    hunks:
      - packages/cli/src/judge.ts
      - packages/cli/src/run.ts
      - packages/cli/src/backfill.ts
      - packages/runner/src/sessionDrive.ts
      - packages/runner/src/backfill.ts
      - packages/runner/src/judgeWorktree.ts
      - packages/runner/src/gateJudge.ts
  - id: fail-closed-on-every-judgment-exit
    what: Centralized delegated-clearance invalidation and invoked it before human-gate handling, after command gates, and before every placeholder, output, and scope refusal; refusal paths persist a held outcome when a delegated clearance no longer stands.
    because: Command gates can remove or rewrite the graph, and receipt preparation can fail after that mutation; every judgment exit must leave the node held rather than return an unrecorded stale clearance.
    rests_on:
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
    applies_to: { kind: path, path: packages/runner/src/gateJudge.ts }
    hunks:
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
  - id: restore-only-unretracted-clearance
    what: Kept delegated receipts in the journal projection after a stale move, restored a pending gate only when its historical receipt still matches all graph proofs, and tracked retracted receipt ids so retraction cannot be undone by graph restoration.
    because: The acceptance requires recovery when the bound graph returns while preserving the separate append-only meaning of receipt retraction.
    rests_on:
      - packages/ledger/src/projection.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
    applies_to: { kind: path, path: packages/ledger/src/projection.ts }
    hunks:
      - packages/ledger/src/projection.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
  - id: scope-read-failure-is-a-refusal
    what: Added a typed unreadable scope refusal and converted file-read failures during receipt creation into that refusal so graph removal cannot escape as an uncaught exception.
    because: A tracked graph removed during a passing command must produce the runner's normal scope refusal while the delegated hold is already persisted.
    rests_on:
      - packages/ledger/src/receipt.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
    applies_to: { kind: path, path: packages/ledger/src/receipt.ts }
    hunks:
      - packages/ledger/src/receipt.ts
      - packages/runner/src/gateJudge.ts
      - packages/runner/test/delegatedFailsClosed.test.ts
