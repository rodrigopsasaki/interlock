    expected: mise exec would select the repository's pinned Node 24.14.0 toolchain.
    observed: The environment reported Node 26.13.0 during focused and standing gates, while typecheck, lint, comments, focused proof, and the full workspace test still passed.
  - kind: surprise
    at: "2026-11-08T08:19:00Z"
    expected: The full workspace test would be quiet apart from ordinary test summaries.
    observed: Runner fixture tests emitted expected-looking Git setup and maintenance errors on stderr, but the workspace command exited successfully and all suites passed.
