interlock: notes@v0
node: retraction-holds-outcome
entries:
  - kind: choice
    at: "2026-11-08T08:00:00Z"
    chose: Make receipt-retracted replay replace a matching node's cleared outcome with a held outcome in the same projection branch that moves the gate to pending.
    because: The acceptance makes the retraction itself the durable cause of the hold, so a later outcome-set event is neither required nor safe to rely on.
  - kind: choice
    at: "2026-11-08T08:02:00Z"
    chose: Preserve the cleared outcome's receipts, identify the retracted gate as a held decision for the owner, and set expiry to 0.
    because: The held outcome must retain proof history while making the human gate the immediate revisit point without introducing a new artifact or event shape.
  - kind: surprise
