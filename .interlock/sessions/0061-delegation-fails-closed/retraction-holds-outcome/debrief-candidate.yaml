decisions:
  - id: replay-retraction-as-held-outcome
    what: The ledger projection now moves a matching satisfied gate to pending and replaces a cleared node outcome with a held outcome on that gate, preserving the cleared receipts and using expiry 0.
    because: The retraction event must itself withdraw the authorization during replay, so a crash or a journal ending immediately after receipt-retracted cannot leave the node cleared.
    rests_on:
      - packages/ledger/src/projection.ts:255-273
    applies_to: { kind: path, path: packages/ledger/src/projection.ts }
    hunks:
      - packages/ledger/src/projection.ts:11
