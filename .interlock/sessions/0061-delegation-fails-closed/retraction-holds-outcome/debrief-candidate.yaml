  - id: prove-retraction-position-and-consumption
    what: Added the required CLI proof fixture for a cleared delegated human gate, asserting one receipt-retracted append, replayed held state, held position, unmet dependency reporting, immediate replay with no later event, and consumed-cite refusal; it also covers non-cleared and mismatched retractions.
    because: The acceptance makes replay behavior, outward position, dependency blocking, append discipline, and cite lifetime one regression boundary.
    rests_on:
