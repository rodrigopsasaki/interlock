decisions:
  - id: append-only-consumed-cite-projection
    what: Added consumedCites to the ledger projection and populate it monotonically from delegated derivations in gate-moved satisfied or waived gates, receipt-written events, outcome receipts, outbox intents, and outbox deliveries; delegatedReceipt now answers from that record.
    because: A cite remains spent after a gate becomes pending, is replaced, or is retracted, and carrying events must consume it even when no explicit receipt-written event exists.
    rests_on:
      - packages/ledger/src/projection.ts
      - packages/cli/src/delegation.ts
      - packages/ledger/test/consumedCite.test.ts
    applies_to: { kind: path, path: packages/ledger/src/projection.ts }
    hunks:
      - packages/ledger/src/projection.ts
      - packages/cli/src/delegation.ts
      - packages/ledger/test/consumedCite.test.ts
  - id: serialized-delegated-spending
    what: Added an exclusive shared-journal cite lock with a recorded holder PID, live-holder waiting, dead-holder takeover, and release; approval, gate clear, and plan publish open a fresh ledger replay inside the lock before checking and appending delegated authorization effects.
    because: Separate processes must not pass a cite check from stale projections; exclusive create and fresh replay make the check-plus-append one serialized act while preserving pre-lock verification and receipt preparation.
    rests_on:
      - packages/cli/src/delegationLock.ts
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/gate/clear.ts
      - packages/cli/src/planPublish.ts
      - packages/cli/test/concurrentCite.test.ts
    applies_to: { kind: path, path: packages/cli/src/delegationLock.ts }
    hunks:
      - packages/cli/src/delegationLock.ts
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/gate/clear.ts
      - packages/cli/src/planPublish.ts
      - packages/cli/test/concurrentCite.test.ts
  - id: preserve-landed-reuse-rules
    what: Kept approve and clear refusals for every consumed cite, while publication may reconcile only a consumed publish cite for the same graph and content hash; all other publication reuse remains refused.
    because: The projection supplies lifetime, but each caller's established authorization rule remains its own contract, including recovery from an interrupted publication.
    rests_on:
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/gate/clear.ts
      - packages/cli/src/planPublish.ts
      - packages/cli/test/consumedCite.test.ts
    applies_to: { kind: path, path: packages/cli/src/planPublish.ts }
    hunks:
      - packages/cli/src/graph/approve.ts
      - packages/cli/src/gate/clear.ts
      - packages/cli/src/planPublish.ts
      - packages/cli/test/consumedCite.test.ts
  - id: regression-proof
    what: Added the node-named ledger, CLI, and concurrent cite proof files covering gate-only replay, outcome and delivery carrying events, pending/replaced/retracted reuse, serialized contention, and dead-holder recovery.
    because: The acceptance names these proof gates as the harness evidence for append-only consumption and cross-process serialization.
    rests_on:
      - packages/ledger/test/consumedCite.test.ts
      - packages/cli/test/consumedCite.test.ts
      - packages/cli/test/concurrentCite.test.ts
    applies_to: { kind: repository }
    hunks:
      - packages/ledger/test/consumedCite.test.ts
      - packages/cli/test/consumedCite.test.ts
      - packages/cli/test/concurrentCite.test.ts
