interlock: notes@v0
node: cite-stays-consumed
entries:
  - kind: choice
    at: "2026-11-08T03:39:53Z"
    chose: Add consumed cites as an append-only projection map populated from every event carrying a delegated derivation, then make the three spending commands use one shared journal lock around fresh replay, checking, and authorization effects.
    because: The acceptance requires cite lifetime to survive gate replacement and retraction, while concurrent callers must not both pass a stale projection check.
  - kind: choice
    at: "2026-11-08T03:45:00Z"
    chose: Keep the exclusive cite lock in the CLI adapter and leave verification and receipt preparation outside it, while opening the ledger and performing the reuse check and append inside it.
    because: The brief explicitly bounds the lock to shared-journal spending and permits pre-lock verification; this preserves the existing adapters and makes the fresh replay the authority for each spend.
  - kind: surprise
    at: "2026-11-08T03:46:22Z"
    expected: A newly created lock file would be readable before a competing caller inspected it.
    observed: The concurrent regression exposed a short create-and-write window where the second caller could misread the incomplete file as a dead lock and take it over; incomplete lock records now wait, while a valid record with a dead PID is taken over.
  - kind: surprise
    at: "2026-11-08T04:00:00Z"
    expected: mise exec would run the pinned Node 24 toolchain and the standing lint gate would reflect only this branch.
    observed: The environment reported Node 26.13.0 despite mise exec, and lint still reports two existing runner test findings outside this node; typecheck, comments, focused proofs, and the full workspace test pass.
