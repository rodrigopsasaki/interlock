entries:
  - kind: choice
    at: "2026-09-16T12:40:07Z"
    chose: "Repair grace arming with a clock reading taken after each successful settled wait and add one time-consuming controlled-clock regression for each grace route."
    because: "The checked source takes now before runtime.waitUntil and reuses it when blocked-turn or unfinished-work settlement arms grace, while the checked tests leave those settled waits instantaneous; sampling immediately after the successful wait preserves the existing deadline cap and limits the repair to the session-wait seam."
