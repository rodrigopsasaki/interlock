  - id: fixture-environment-boundary
    what: Put landing HOME, XDG, tool state, Git identity, Git config restrictions and test limits behind the runner fixture environment adapter.
    because: The landing suites must be isolated from the caller's home and configuration while receiving the exact worker and heap limits selected for the run.
    rests_on:
      - 'brief: Acceptance (verbatim from the graph)'
      - packages/runner/src/fixtureEnv.ts
      - packages/runner/test/fixtureEnv.test.ts
