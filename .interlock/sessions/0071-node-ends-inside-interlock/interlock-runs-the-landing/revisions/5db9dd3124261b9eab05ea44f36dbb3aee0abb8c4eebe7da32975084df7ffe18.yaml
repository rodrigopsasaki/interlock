      - packages/runner/test/fixtureEnv.test.ts
    applies_to:
      kind: path
      path: packages/runner/src/fixtureEnv.ts
  - id: landing-workflow
    what: Build the land branch from the cleared node head, bring main in through the existing merge seam, install once, run every landing suite serially, and refuse unsigned or unknown-key commits without pushing.
    because: Reusing the judge's worktree and merge boundaries keeps landing behavior aligned with existing repository setup while the dedicated orchestration owns suite ordering, signature reporting and cleanup.
    rests_on:
      - 'brief: Acceptance (verbatim from the graph)'
      - packages/cli/src/land.ts
      - packages/runner/src/mergeMain.ts
    hunks:
      - packages/cli/src/land.ts
      - packages/cli/src/main.ts
      - packages/cli/test/land.test.ts
    applies_to:
      kind: path
      path: packages/cli/src/land.ts
  - id: strict-land-boundaries
    what: Reject malformed positive-integer limits and clean fixture state when internally created worktree setup refuses.
    because: CLI flags are a contract boundary, and a refused land attempt must not leak temporary state created by the command itself.
    rests_on:
      - notes.yaml
      - packages/cli/src/land.ts
    hunks:
      - packages/cli/src/land.ts
      - .interlock/sessions/0071-node-ends-inside-interlock/interlock-runs-the-landing/notes.yaml
