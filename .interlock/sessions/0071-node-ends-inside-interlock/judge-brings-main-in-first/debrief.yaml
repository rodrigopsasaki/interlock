decisions:
  - id: preflight-and-signed-merge
    applies_to: { kind: repository }
    what: >-
      Added a runner merge-main seam that refuses dirty worktrees, resolves origin/main with a
      local-main fallback for isolated repositories, preflights conflicts without mutation, and
      performs a configured signed git merge --no-ff with a why-subject.
    because: >-
      Judge must bring main into a settled node before running gates, while a dirty or conflicting
      tree must name its files and leave both the worktree and merge state unchanged.
    rests_on:
      - .interlock/graphs/0071-node-ends-inside-interlock.yaml
      - packages/runner/src/mergeMain.ts
    hunks:
      - packages/runner/src/mergeMain.ts:43-112
      - packages/runner/src/mergeMain.ts:139-220
      - packages/runner/test/mergeMain.test.ts:77-149
  - id: frozen-install-order
    applies_to: { kind: repository }
    what: >-
      Detect lockfile changes in the completed merge and run the existing setup boundary with
      pnpm install --frozen-lockfile only for those merges, returning install refusal separately.
    because: >-
      Dependencies must be refreshed after a lockfile-changing main merge without imposing an
      install on branches that already contain main or merges that change no lockfile.
    rests_on:
      - .interlock/graphs/0071-node-ends-inside-interlock.yaml
      - packages/runner/src/mergeMain.ts
    hunks:
      - packages/runner/src/mergeMain.ts:5-12
      - packages/runner/src/mergeMain.ts:103-122
      - packages/runner/src/mergeMain.ts:223-250
      - packages/runner/test/mergeMain.test.ts:151-187
  - id: judge-ordering
    applies_to: { kind: repository }
    what: >-
      Invoke merge-main after the existing lease and session checks but before recording and
      executing settled-worktree gates, narrating successful merges and refusing the judge on a
      merge or install refusal.
    because: >-
      A live session must not be mutated, and every accepted judge must use the merged tree as the
      input to the harness-produced gate proof.
    rests_on:
      - .interlock/graphs/0071-node-ends-inside-interlock.yaml
      - packages/cli/src/judge.ts
      - packages/cli/test/judge.test.ts
    hunks:
      - packages/cli/src/judge.ts:204-223
      - packages/cli/test/judge.test.ts:548-571
  - id: runner-public-seam
    what: Export the typed merge-main request, result, refusal, explanation, and runner function.
    because: >-
      The CLI needs one named runner seam and the focused tests need its contract without importing
      private implementation details.
    rests_on:
      - packages/runner/src/index.ts
    hunks:
      - packages/runner/src/index.ts:129-138
  - id: session-receipts
    what: >-
      Recorded the implementation choices, fixture corrections, focused gate results, full-suite
      deferral, pre-existing lint warning, signing-environment correction, and derived-filing
      identity correction in notes.
    because: >-
      The session requires every choice and surprise to retain its way back, including why the
      repository-wide test gate is not claimed as executed.
    rests_on:
      - .interlock/sessions/0071-node-ends-inside-interlock/judge-brings-main-in-first/notes.yaml
    hunks:
      - .interlock/sessions/0071-node-ends-inside-interlock/judge-brings-main-in-first/notes.yaml:1-100
