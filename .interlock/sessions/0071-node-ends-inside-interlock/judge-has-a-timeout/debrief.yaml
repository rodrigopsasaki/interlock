      - packages/cli/src/judge.ts
  - id: judge-owned-gate-processes
    applies_to: { kind: path, path: packages/runner/src/deadline.ts }
    what: >-
      Wrapped each command gate in a judge-owned process group using the remaining deadline and a
      ten-second TERM grace, then raised a typed gate-specific expiry for judge.ts to narrate and
      return non-zero.
    because: >-
      The acceptance requires ending every gate process the judge started without signalling
      unrelated processes, and the gate id must survive the process boundary for the required
      "gave up" report.
    rests_on:
      - packages/runner/src/deadline.ts:91-131
      - packages/cli/src/judge.ts:268-311
    hunks:
      - packages/runner/src/deadline.ts:91-131
      - packages/cli/src/judge.ts:268-311
    produces:
      - packages/runner/src/deadline.ts
      - packages/cli/src/judge.ts
  - id: held-lease-wait
    applies_to: { kind: path, path: packages/cli/src/judge.ts }
    what: >-
      Made a judge with a known session start wait in one-minute deadline-bounded intervals,
      reload lease-taken, lease-renewed and lease-expired events, and narrate the owning session
      and start time on every still-held interval; historical leases without a start time retain
      their immediate refusal with that limitation named.
    because: >-
      Waiting must count toward the same deadline and must not silently hide a live lease, while
      a backfilled session cannot honestly supply a start time it never recorded.
    rests_on:
      - packages/runner/src/deadline.ts:133-155
      - packages/cli/src/judge.ts:193-266
    hunks:
      - packages/runner/src/deadline.ts:133-155
      - packages/cli/src/judge.ts:193-266
    produces:
      - packages/runner/src/deadline.ts
      - packages/cli/src/judge.ts
  - id: deadline-regression-cases
    applies_to: { kind: path, path: packages/runner/test/deadline.test.ts }
    what: >-
      Added four focused cases covering deadline termination, unrelated-process preservation,
      minute-by-minute held-lease narration and per-graph timeout precedence.
    because: >-
      Each named acceptance case needs an executable proof at the new seam, including a real
      child process for the ownership boundary and a controlled clock for interval reporting.
    rests_on:
      - packages/runner/test/deadline.test.ts:28-92
    hunks:
      - packages/runner/test/deadline.test.ts:28-92
    produces:
      - packages/runner/test/deadline.test.ts
  - id: session-evidence
    applies_to: { kind: path, path: .interlock/sessions/0071-node-ends-inside-interlock/judge-has-a-timeout/notes.yaml }
    what: >-
      Retained the implementation choices, test-environment correction, clock-type correction,
      pre-existing lint warning and focused-test limit in notes@v0.
    because: >-
      The debrief is a compression with a way back to the choices and observed surprises that
      shaped the implementation and its proof boundary.
    rests_on:
