decisions:
  - id: timeout-resolution
    applies_to: { kind: path, path: packages/runner/src/deadline.ts }
    what: >-
      Added a 45-minute default with positive command-line and graph-level timeout resolution,
      and represented the running deadline as a clock-backed value with remaining and expired
      checks.
    because: >-
      The judge needs one precedence rule for the default, --timeout and judge_timeout_minutes,
      while injected clocks keep the deadline deterministic in focused tests.
    rests_on:
      - packages/runner/src/deadline.ts:5-89
      - packages/cli/src/judge.ts:124-148
    hunks:
      - packages/runner/src/deadline.ts:5-89
      - packages/cli/src/judge.ts:124-148
    produces:
