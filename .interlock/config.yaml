# The standing table for this repository.
#
# Every node whose graph runs in this repo carries these gates in addition to its own.
# A node may add gates. It may never remove one of these. This is the literal interlocking:
# the table of what must be true before a route can clear.
#
# The commands below name package scripts the `scaffold` node of the bootstrap graph had to
# create. The runner runs them for every node.

interlock: config@v0

standing_gates:
  - id: typecheck
    kind: command
    run: pnpm typecheck
  - id: test
    kind: command
    run: pnpm test
  - id: debrief-valid
    kind: command
    run: pnpm interlock debrief validate {graph} {node}
    # A session that produced no valid debrief is held here. A person working by hand in an
    # editor trips this gate on purpose; the post-hoc debrief is the escape hatch. The runner
    # substitutes {graph} and {node} when it runs a gate.

substrate:
  address: none
