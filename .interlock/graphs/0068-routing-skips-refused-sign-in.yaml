interlock: graph@v0
id: 0068-routing-skips-refused-sign-in
arc: bring-october-back
ask: Automatic launch routing never picks a provider whose sign-in the CLI itself cannot use, and never picks a provider the owner excludes, including as the last resort; when nothing allowed is left it refuses plainly and names each provider and why it is unavailable. A runtime the owner requests by name still wins.
derivation:
  kind: model
  model: claude-sonnet-5-5
  prompt: routing-skips-refused-sign-in-2026-11-14
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: bring-october-back (this repository's .interlock/arcs.yaml). The arc's ask is good results back; a launch routed
  to a provider that cannot start, or to one the owner has ruled out for builds, is the opposite. Two defects in
  packages/runner/src/providerRouting.ts (routeRuntime, main 8b1698ce), both seen on 2026-11-14.

  Defect one: a refused sign-in reads as unknown headroom, and unknown counts as available. routeRuntime treats a
  candidate as available when its headroom state is "unknown" (providerRouting.ts:74-77); when no provider has a known
  fraction, the pool is every available candidate and ledger round-robin picks among them (:83-89). Kimi's saved
  sign-in is refused today, so a launch can be routed to it and then fails at start.

  Defect two: the last resort defaults to anthropic (providerRouting.ts:78-80). When every other routable provider is
  known exhausted (or is the only one), the router routes to the last-resort provider (:79-80, :92-96, :101-104). The
  owner's standing rule is "Anthropic last, never default": Anthropic is the provider kept for when nothing else is
  usable, never the one launches default to; nothing in local configuration can say that a provider is refused outright,
  because last_resort only names which provider is kept last. The guarantee of this graph is about automatic routing
  (no runtime requested); a runtime the owner names explicitly still wins without any check, as today.

  Where headroom is read, and what each reader can detect today, from source. routeRuntime reads one headroom per
  routable candidate through options.readHeadroom, which defaults to readProviderHeadroom
  (packages/runner/src/headroom/adapter.ts:6-17), a switch on the runtime kind. The codex reader
  (packages/runner/src/codex/headroom.ts:96-120) reads the newest rate_limits report from the local rollout files and
  otherwise says unknown; it never talks to a provider, so it cannot see a refused sign-in. The claude reader
  (packages/runner/src/claude/headroom.ts) and the kimi reader (packages/runner/src/kimi/headroom.ts) return a fixed
  unknown with a reason and read nothing at all. So Interlock detects a refused sign-in nowhere today. The only
  detection that exists is outside this repository: the Preston cockpit's usage reader treats HTTP 401 and 403 from a
  provider's usage endpoint as "the plan refused the saved sign-in (HTTP n)" (Preston cockpit/server.ts, getJson), and
  for Kimi reads the sign-in Kimi Code saved under its own folder and calls the usages endpoint.

  A fact observed on 2026-11-14 changes what that signal means. Kimi Code keeps a short-lived access token in its saved
  sign-in and refreshes it whenever the CLI runs. The usages call (path /usages under KIMI_CODE_BASE_URL, default the
  CLI's own https://api.kimi.ai/coding/v1) with the saved token returned 401 about fifteen minutes after the CLI last
  ran, and passed right after a one-line CLI call refreshed the token. So a 401 on the saved token alone is a stale
  token, not a refused sign-in, and treating it as refused would route around a working Kimi. The CLI's help (kimi
  --help, kimi provider --help, kimi provider list --help, kimi doctor --help, kimi login --help) offers no
  non-interactive account check: `provider list` and `doctor config` only describe local configuration files, and
  `login` is an interactive device flow that must never run from the router. The one non-interactive way to make the
  CLI use its sign-in is its one-prompt mode (`kimi -p <prompt>`), which refreshes the token as a side effect. This plan
  therefore defines refused as: the saved token is rejected (401 or 403), the CLI is then run once through its own
  mechanism, and the same saved sign-in, re-read afterwards, is rejected again. A stale access token reads as unknown,
  never refused. The signal is brought into the runner for Kimi only, because Kimi is the provider whose refusal is
  observed; codex and claude have no refusal signal to map and the plan does not invent one, and the debrief does not
  claim refusal detection for them.

  What changes, and why this way.
  - A fourth reading, kept in the runner and out of the ledger. ProviderHeadroom (packages/ledger/src/session.ts:4-13) is
    persisted inside chosenBy.candidates on session-started events and checked by isProviderHeadroom, so adding a state
    to it would change an event shape and its version for no benefit: a refused provider is never chosen, so nothing
    about it needs to be recorded in a chosen attempt's candidates. The runner gains a small module
    (packages/runner/src/headroom/availability.ts) with ProviderAvailability: a ProviderHeadroom, or {state: "refused",
    reason, status?}, where the reason is the plain sentence ("the plan refused the saved sign-in (HTTP 401)"). It also
    holds the one function that maps an HTTP status to a reading: 401 and 403 are refused; every other status is not a
    refusal. RoutingOptions.readHeadroom and readProviderHeadroom return ProviderAvailability. The ledger package,
    event@v11 and every position shape are untouched, and the debrief says so.
  - Availability is resolved from the provider's identity and the runtime's adapter together, at selection time. Today
    the router reads headroom by runtime.kind alone (providerRouting.ts:56, adapter.ts:7-17), so a profile with
    kind exec and provider kimi would reach the adapter's unknown branch and bypass the Kimi check. The reader option
    becomes readHeadroom(kind, provider, environment): the adapter uses the kind's own reader when it has one, and for a
    kind with none (exec) uses the reader of the provider name when the provider has one (kimi). The environment (HOME)
    is a parameter so tests supply fixtures and the router passes the caller's. Availability is a selection-time fact:
    a new run or plan re-reads it, while prompt retries, in-session resume and the separate exec debrief launch keep the
    runtime already selected; run.ts and plan.ts both call this router, so planner and reviewer-node selection are
    covered by the same change.
  - The router treats refused as unavailable, never as unknown and never as available. A refused candidate is dropped
    from the pool before any choice, even when every other provider is unknown or exhausted, and it is not a last-resort
    candidate either. It is not copied into the persisted candidates list; the because text of a routed attempt names
    each provider that was skipped and why ("skipped kimi: the plan refused the saved sign-in (HTTP 401)"), so the
    record of why a launch did not go there is kept in the chosen attempt's own because, which is already a persisted
    string. This is not omitted merely because the provider was not chosen (today's candidates also hold unchosen
    providers); it is omitted because isProviderHeadroom (session.ts:39-55) accepts only known and unknown readings, and
    changing it would change an event shape. A test proves it end to end: the chosen runtime's attribution round-trips
    through isChosenBy and through an event replay from a fixture journal, with the skip reason surviving in because and
    no refused reading in candidates.
  - Kimi's reader gains the refusal check, as defined above. readKimiHeadroom becomes async and takes injected
    parameters (home folder from the environment, base URL, fetch, the kimi command, and its own clock for timeouts); the
    real defaults are the environment's HOME, KIMI_CODE_BASE_URL or the CLI's global default, the global fetch and the
    command `kimi`. The steps, in order:
    1. Choose one saved sign-in: the newest file by modification time under the Kimi Code state folder's oauth and
       credentials folders that parses and holds an access token; files that do not parse or hold none are skipped; none
       means unknown ("no saved sign-in"). Exactly one token is used; the cockpit's try-each-token loop is not copied.
    2. One request to the usages endpoint with that token, with a total deadline of three seconds that the probe itself
       creates and enforces (a named constant; the fetch is cancelled when it expires). 401 or 403 goes to step 3; a good
       answer, any other status, a timeout or a network error reads unknown with a plain reason.
    3. Only right after that 401 or 403, and only if no renewal was attempted in the last fifteen minutes (a named
       constant), run the CLI once, `kimi -p` with a one-word prompt, through the runner's owned-command runner with a timeout (a named
       constant of thirty seconds, shell-free, the whole process group ended on timeout, cwd a fresh folder under the
       system temp folder), to let the CLI refresh its own sign-in. Its output is discarded and never returned or
       recorded. A CLI that cannot start, times out or exits non-zero here still goes to step 4: the verdict is the
       second request, not the exit code. This is a model call, so it costs a one-line prompt, and only after a 401;
       a fresh token then lasts until it goes stale again. The renewal is a confirmation step and nothing else: it never
       runs on a timer, never while checks pass, and never for any other provider, none of which ever gets a model call
       for checking. The time of the last renewal attempt (not a token) is kept in memory only, in the process, through
       the probe's injected clock; within the fifteen minute window a 401 or 403 skips the renewal and the reading is
       unknown ("rejected, and the CLI was asked to renew less than fifteen minutes ago"), never refused, because
       refused needs the renewal's confirmation.
    4. Re-read the newest saved sign-in (the CLI may have rewritten it) and make one more request under a new
       three-second deadline. 401 or 403 again reads refused ("the plan refused the saved sign-in (HTTP n), and the
       CLI could not renew it"); anything else reads unknown, including success, because the sign-in then works.
    Nothing is cached: no token and no result survives the call, so the cockpit's sixty-second cache is not copied; the
    only thing kept between calls is the time of the last renewal attempt, in memory. The
    token exists only in memory for the request and the header that carries it; it is never logged, narrated, written,
    put in a returned reading, an error text or the CLI's argv or environment. Errors are mapped to plain sentences and
    never forwarded raw. The saved sign-in files are never written or copied by Interlock; the CLI alone rewrites them.
    The worst case of one read is thirty-six seconds (3 + 30 + 3) and only after a 401; a read that does not hit a 401
    is at most three seconds.
  - One owner setting, excluded_providers. A new optional list in local.yaml, a list of distinct nonempty provider
    names, spelled and validated the way provider_order is (packages/runner/src/localConfig.ts:277-289) and carried on
    LocalConfig as excludedProviders beside providerOrder and lastResort. A provider named in it is never routed to
    by routeRuntime: not as an ordinary candidate, not as the last resort, not when it is the sole routable provider.
    Its headroom is not even read. An excluded provider's exclusion wins over provider_order, over a configured
    last_resort and over an automatic fallback. Why a list and not `last_resort: none`: the rule is about which providers builds may
    never use, which is wider than which one is kept last, and last_resort keeps meaning what it means now (a provider
    kept last, still usable). Versioning: the setting is added to local@v1 the way provider_order and last_resort
    were (the shape history in docs/shapes.md lists them under local@v1 as optional additions), because adding an
    optional key is additive, local@v0 files read unchanged, and nothing is renamed; schemas/local@v1.json gains the
    property and docs/shapes.md is regenerated, with the shapes-fresh check holding it fresh. .interlock/local.example.yaml
    documents it. A local.yaml that names its own last_resort in excluded_providers is refused on load with a plain
    reason, because the two statements contradict.
  - The default, decided. A config that does not set excluded_providers excludes nothing, so its routing is exactly what
    it is today, including anthropic as the default last resort. The alternative, defaulting the list to anthropic,
    would match the owner's rule without being asked, but it would turn every existing single-provider or
    all-others-exhausted setup into a refusal with no change on the owner's side, and an existing configuration should
    not silently change behaviour. So the plan does not change any configuration's behaviour on its own; the owner's own
    local.yaml states the rule explicitly with `excluded_providers: [anthropic]`, a one-line edit made on the owner's
    machine and outside this node (local.yaml is gitignored and never committed), after which defect two is closed
    for that machine, provided the owner's local.yaml does not itself name anthropic as last_resort, which is a
    contradiction the loader refuses and which the owner would then also remove. The debrief says this in one line,
    naming the edit and that condition.
  - What a refusal says. The existing refusal kind providers-exhausted (packages/runner/src/runtimeSelection.ts:9, :23)
    gains an unavailable list of {provider, why}, and its message becomes "every allowed provider is unavailable:
    kimi (the plan refused the saved sign-in (HTTP 401)), codex (no allowance left), anthropic (excluded by
    excluded_providers)." It names every routable provider with its reason, whether refused, excluded, known exhausted
    or currently rate limited. The kind is kept so every caller (packages/cli/src/run.ts:174-181, packages/cli/src/plan.ts:245-252)
    keeps working unchanged, and its `known` field stays. When all routable profiles are excluded or unavailable the
    router refuses; it never falls to the "no routable profile" default-runtime branch (:58-69), which is only for a
    catalogue where no profile opts in. That fallback keeps resolving the owner's default_runtime, with two checks that
    apply only when they can matter: its availability is resolved the same way as a candidate's (identity plus adapter),
    and a refused one is refused plainly; and when excluded_providers is non-empty its provider must be identifiable and
    not excluded. A providerless runtime (the legacy runtime: block becomes a runtime named default with no provider,
    runtimeCatalogue.ts:713-726) gets its provider from the adapter's kind (claude is anthropic, kimi is kimi); a kind whose
    provider cannot be identified, with exclusions active, is refused plainly ("the fallback runtime's provider cannot be
    identified, so excluded_providers cannot be enforced"). With no exclusions and no refusal the fallback behaves exactly
    as today. The exec kind gets the same treatment in the candidate loop. A runtime the owner asks for
    explicitly (requested) still wins without reading headroom (:48-51), exactly as today: the owner's explicit word is
    never gated.
  - A provider that is rate limited or known exhausted is unchanged in how it is dropped; the plan only adds it to the
    refusal's list so the message is complete.

  Tests and the real services. Every test of this node uses stub providers (literal ResolvedRuntime catalogues), stub
  headroom readers or the production adapter over a stub fetch and a stub kimi command (an executable script written by the
  test under the system temp folder that, depending on the case, rewrites the stub saved sign-in with a fresh token or
  leaves it stale), never a real provider, never the network, never the real kimi, never herdr. Every
  fixture folder (the repository root holding .interlock/local.yaml, and the fixture HOME holding a fake Kimi Code
  sign-in file with a fake token) is created with mkdtemp under the system temp folder, never inside the worktree, and
  removed after; HOME, XDG_CONFIG_HOME, XDG_DATA_HOME, XDG_STATE_HOME and XDG_CACHE_HOME are set to folders under it for
  the test processes that need them, passed as the environment parameter of the readers; this node does not rely on
  vitest.setup.ts for isolation, which today sets no temporary HOME, and does not claim the whole suite is HOME-isolated
  (suite-wide HOME isolation and the codex guard's fixture-only rule are the baseline's, owned by graphs 0066 and
  0067's test work, and this node neither depends on nor widens them); no test reads or writes the owner's ~/.config/interlock or any real provider's saved sign-in, and the Kimi
  reader's tests pass the fixture home explicitly. The existing tests in packages/runner/test/providerRouting.test.ts
  keep their own fixtures and keep passing, updated only where the changed refusal message or the async Kimi reader
  requires it; in particular the existing readKimiHeadroom() assertion (providerRouting.test.ts:336) is changed to pass a
  fixture home, a stub fetch and a stub kimi command, so no existing test can reach a real sign-in through the new default
  probe. The honest state of the standing gates is as 0067 states it: the three existing real-codex tests run
  through the 0065 guard under `pnpm test`; this node does not add, change or widen them.

  What this plan cannot prove. The cases prove the router's behaviour over stubs and the Kimi reader's mapping over a
  stub fetch and a stub CLI. That the real Kimi usages endpoint and the real CLI behave as observed (a 401 that a CLI call
  clears, and a 401 that survives it for a truly refused sign-in) is unproven by any gate. The debrief names it and gives
  the manual check: with the owner's current Kimi state, `interlock run` with no runtime requested must route around
  Kimi only if the CLI cannot renew its sign-in, and its position must show the skipped reason in the attempt's because;
  with a working but stale sign-in it must route to Kimi as an ordinary candidate. Codex and claude have no refusal
  check, and the debrief says so.

  Out of scope: renewing or repairing a sign-in; the cockpit's own usage reading; codex and claude refusal detection (no
  signal exists to map); the ledger, events and positions; the owner's local.yaml; changing which provider is the default
  last resort; any change to the catalogue or to explicit runtime requests.

  Laws: AGENTS.md. No comments in packages/*/src; strict TypeScript with no `as`, `!`, `any` or `as unknown as`; plain
  engineering names; Biome.

gates:
  - id: approved
    kind: human

nodes:
  - id: routing-skips-refused-sign-in
    role: implementer
    acceptance: |
      As the read. Allowed paths: packages/runner/, packages/cli/ (only if a caller needs a type update), schemas/local@v1.json,
      docs/shapes.md, .interlock/local.example.yaml, scripts/gates/routing-refusals-proven.ts, scripts/gates/slow-tests.ts
      (declarations only, if the slow-tests-accounted gate requires them), and this graph's session folder. The ledger
      package and every event and position schema are untouched.
      1. packages/runner/src/headroom/availability.ts defines ProviderAvailability (ProviderHeadroom or a refused reading
         with a plain reason and optional status) and the status function (401 and 403 rejected, anything else not; a
         rejection is refused only as the read defines it for Kimi). RoutingOptions.readHeadroom and readProviderHeadroom
         take (kind, provider, environment) and return it; the adapter resolves by kind and, for a kind with no reader,
         by provider name, so a profile of kind exec and provider kimi is checked.
      2. routeRuntime drops a refused candidate before choosing, whatever the other providers read, never treats it as
         available or as a last resort, does not copy it into the persisted candidates, and names each skipped provider and
         its reason in the attempt's because. The chosen attribution round-trips through isChosenBy and a fixture
         journal replay with no refused reading in candidates and the skip reason in because.
      3. RoutingOptions and LocalConfig gain excludedProviders, loaded from the optional local.yaml list excluded_providers
         (distinct nonempty strings; malformed refused with a plain reason; a last_resort that is also excluded refused
         with a plain reason; absent means nothing excluded). schemas/local@v1.json gains the property; docs/shapes.md is
         regenerated; .interlock/local.example.yaml documents it. local@v0 and every existing local@v1 file still read.
      4. routeRuntime never routes to an excluded provider: not as ordinary, not as last resort, not as sole routable
         provider, and does not read its headroom. When nothing allowed remains it returns providers-exhausted with an
         unavailable list and the message "every allowed provider is unavailable: <provider> (<reason>), ..." naming
         every routable provider (refused, excluded, known exhausted, rate limited). The no-routable-profile fallback
         is availability-checked like a candidate and refused plainly when refused, when its provider is excluded, or
         when exclusions are active and its provider cannot be identified (a providerless legacy runtime takes its
         provider from the adapter's kind); with no exclusions and no refusal it behaves as today. An explicitly
         requested runtime still wins.
      5. readKimiHeadroom is async and implements steps 1 to 4 of the read: one saved sign-in chosen as the read says
         (malformed and token-less files skipped), one request under a three second deadline the probe creates and
         enforces, on 401 or 403 one run of the CLI through the owned-command runner (thirty second timeout, shell-free,
         fresh temp cwd, output discarded), the sign-in re-read, one more request under its own three second deadline;
         refused only when that second request is rejected too; every other outcome (stale token cleared by the CLI,
         success, other status, no saved sign-in, timeout, network error, CLI missing) reads unknown with a plain reason.
         Nothing is cached, copied, written or logged, and no returned reason, error text, CLI argument or CLI environment
         contains the token. The codex and claude readers are unchanged.
      6. Tests, each failing on main 8b1698ce for its intended assertion except where marked, with stub providers, stub
         readers, a stub fetch and fixtures under the system temp folder as the read says. Exactly these eight titles;
         the assertions named under each are inside that case:
         - "a refused sign-in is never routed to, even when every other headroom is unknown" (packages/runner/test/
           routingRefusals.test.ts: a refused kimi beside two unknown providers, repeated over a fixture ledger that
           makes kimi the next in round-robin and in provider_order, and with the refused provider first in the catalogue:
           the choice is never kimi; a refused provider beside a known one and beside a rate-limited one is also skipped;
           a profile of kind exec and provider kimi is skipped the same way; the same through the production adapter
           (readProviderHeadroom with a fixture environment, a stub fetch and a stub kimi command), not only through an
           injected reader; the chosen attribution round-trips through isChosenBy and a fixture journal replay with no
           refused reading in candidates and kimi named with its reason in because; a no-routable-profile fallback whose
           runtime is refused is refused plainly)
         - "a refused sign-in is named in the refusal when nothing else is available" (same file: kimi refused and the
           other provider known exhausted or rate limited, and kimi refused as the only routable provider, and a refused
           configured last resort: the result is an error of kind providers-exhausted, its unavailable list names each
           provider with its own reason, and explainRuntimeSelectionRefusal says "every allowed provider is unavailable:"
           followed by kimi and "the plan refused the saved sign-in (HTTP 401)" and the other provider's reason)
         - "an excluded last-resort provider is never routed to; the router refuses plainly instead" (same file: with
           excludedProviders ["anthropic"], the default last resort: every other provider known exhausted, anthropic the
           sole routable provider, and anthropic the only one left after another is refused: each is a
           providers-exhausted refusal naming anthropic as excluded, never a routed or last-resort choice; when another
           allowed provider is available, anthropic with the greatest fraction is still not chosen and the other provider
           is, not a refusal; an excluded ordinary provider listed first in provider_order is skipped; excluding a provider
           other than anthropic works the same; the stub reader is never asked about an excluded provider; a no-routable-
           profile fallback whose provider is excluded is refused, and so is a providerless legacy fallback whose kind
           maps to an excluded provider, and one whose kind cannot be identified while exclusions are active; with no
           exclusions that same legacy fallback resolves as today; an explicitly requested excluded runtime still
           resolves)
         - "a configured last resort that is not excluded still works as today" (same file: excludedProviders ["x"] with
           lastResort "a" and ordinary provider "b": b is routed first, a is the last resort chosen with kind last-resort
           when b is exhausted, with the because text the existing code gives; the outcomes equal the outcomes of the same
           calls with no excludedProviders; a preservation case, not a failing-on-main case)
         - "a config without the new setting keeps its stated default" (packages/runner/test/routingConfig.test.ts: real
           loadLocalConfig over fixture local.yaml files tagged local@v0 and local@v1 without excluded_providers:
           excludedProviders is undefined, the file bytes are unchanged, and anthropic is still routed as the last resort
           when every other provider is exhausted, with the unchanged because text; a preservation case, not a
           failing-on-main case)
         - "a config that excludes its own last resort is refused plainly" (same file: loadLocalConfig refuses
           excluded_providers containing the config's explicit last_resort, and refuses a non-list, an empty name and a
           duplicate, each with a reason naming "excluded_providers"; a valid list loads as excludedProviders in order; a
           config that excludes anthropic without setting last_resort still loads, and routing it then refuses plainly
           instead of using the implicit anthropic last resort)
         - "a kimi sign-in is refused only when the CLI also cannot renew it; a stale access token reads as unknown"
           (packages/runner/test/kimiRefusal.test.ts: a fixture home holding a stub saved sign-in, a stub fetch and a stub
           kimi command written under the system temp folder. Stale then renewed: the first request is rejected 401, the
           stub CLI rewrites the stub sign-in with a fresh token, the second request passes: unknown, never refused. Still
           rejected: the stub CLI changes nothing and the second request is 401 or 403: refused with the plain reason, for
           401 and for 403. Success on the first request, 500, a thrown network error, no saved sign-in, a malformed file
           beside a valid one (skipped), several files (only the newest valid one is used, one token per request), and a
           CLI that is missing or exits non-zero with a passing second request: unknown with a plain reason. A first
           request that never answers is cancelled by the probe's own three second deadline under fake timers, and a stub
           CLI that hangs is ended with its process group at its timeout, proved gone afterwards. No token appears in any
           returned reason, any captured console output, the stub CLI's recorded argv and environment, or any file other
           than the stub sign-in; the stub sign-in file and every other fixture file are byte for byte unchanged by the
           reader (the stub CLI alone rewrites the sign-in); nothing outside the fixture folder was read)
         - "the kimi renewal runs only right after a refusal and at most once per 15 minutes" (packages/runner/test/
           kimiRefusal.test.ts, with a fake clock and a stub kimi command that records each run: reads that pass, and
           reads of any number over a simulated hour that never see a 401 or 403, run the stub CLI zero times; a 401
           runs it exactly once, immediately after that 401; a second 401 within 15 minutes of the attempt runs it zero
           more times and reads unknown, never refused, whatever the second request would say; after 15 minutes of the
           fake clock a 401 runs it once more; the same for 403; nothing runs it on a timer; the stub CLI is never run
           for a codex, claude or exec-kind reading; the only state kept between reads is the attempt time, and no token
           is in it)
      7. Proof: scripts/gates/routing-refusals-proven.ts runs the three test files above once with vitest's JSON reporter,
         with a temporary HOME, fails on a missing file, and prints "routing refusals proven: 8 named cases passed" only
         when the run exits zero, every title above passes exactly once, and there are no failures, skips, todos, missing
         summaries or extra cases in those files. It proves execution and titles; the assertions above are what the judge
         reads each case for.
      8. Existing tests keep passing, including packages/runner/test/providerRouting.test.ts and the schema corpus tests
         for local@v1 (updated only where the refusal message or the async reader requires it). New tests are declared or
         baselined as the slow-tests-accounted gate requires.
      9. The debrief states: the default (nothing excluded, behaviour unchanged) and the one-line owner edit
         `excluded_providers: [anthropic]` in local.yaml, valid only if its explicit last_resort is not anthropic; that
         the guarantee is about automatic routing and an explicitly requested runtime still wins; that the ledger and all
         event and position shapes are untouched; that Kimi is the only provider with a refusal check, why, and that codex
         and claude have none; that the real endpoint and CLI behaviour is unproven by any gate, with the manual check
         from the read.
      Before you file the debrief (and before any refile), end every vitest worker and child process you started and
      confirm with pgrep that none survives.
    gates:
      - id: branch-contains-main
        kind: command
        run: git merge-base --is-ancestor origin/main HEAD
      - id: routing-refusals-proven
        kind: command
        run: node scripts/gates/routing-refusals-proven.ts
        expect_output: 'routing refusals proven: 8 named cases passed'
      - id: shapes-fresh
        kind: command
        run: pnpm interlock schema reference --check
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1[.]5 s'
