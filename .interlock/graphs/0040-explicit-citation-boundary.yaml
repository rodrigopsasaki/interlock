id: 0040-explicit-citation-boundary
ask: 'Inspect the actual latest surprise in .interlock/sessions/0039-authoring-feedback/make-authoring-actionable/notes.yaml: a bare evidence.txt explicit ranged citation allowed a wrong quote to root as out-of-band. Verify current reality and produce one complete bounded implementation node that makes explicit file-location claims go through existing range/path/quotation checks regardless of ordinary filename extension or extensionless basename. Preserve genuine out-of-band prose/quoted extracts and command-form legacy behavior; text inside the quoted extract must not become another locator just because it contains colon-number syntax. Keep malformed explicit ranges, missing files, wrong and missing quotes visibly unrooted, with exact discriminator tests and positive rooted-path assertions through the real verifier and evidence translation. Do not broaden arbitrary citation semantics, auto-correct old claims, change authority, dependencies, artifacts, receiver, outbox, or approve anything. Favor the existing parser seam and a complete25-minute implementation; make interpretation boundaries explicit rather than guessing. Produce graph, typed notes and truthful interpreter debrief only, not implementation or node approval. Use current sources and AGENTS; received hypotheses remain unratified, no-use is valid. Actual authorship codex/gpt-5.6-terra. Use actual UTC note times and full Git hashes, mise exec, one focused command at a time with retained yielded handles, lint before handoff; full suites belong to harness. Keep all earlier artifacts. No agents, trust/permission/config changes, external inference or live-brain calls, push, merge or deployment. Per-command unsigned commits allowed if signing unavailable. Stop after committed canonical debrief.'
