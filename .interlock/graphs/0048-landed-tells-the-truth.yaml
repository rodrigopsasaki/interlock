interlock: graph@v0
id: 0048-landed-tells-the-truth
ask: A cleared node's landed reading says what main actually holds, reads unknown when main is ambiguous, and costs nothing to redraw when nothing moved.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: landed-on-main-debrief-2026-11-05
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Gilb for Rodrigo Sasaki, after a cross-vendor vet; the human merges
read: >
  0046 landed-on-main (a6f878f, on PR #71) taught the position to say whether a
  cleared node's work is on main: packages/face/src/landed.ts judges by
  ancestry, then by per-commit patch ids (git cherry), then by one squash patch
  id, and reads revert lines ("This reverts commit <sha>"). Its debrief left
  three gaps open, and each one makes the reading say something main does not
  support.

  First, a commit on main that undoes one of the attempt's commits without a
  revert line is not noticed, so the work still reads plain on-main. A partial
  revert that does carry revert lines reads unknown today, which is honest
  but says less than is known.

  Second, a squash whose merge resolved conflicts, or changed the surrounding
  lines, no longer matches the attempt's whole patch id, so it reads
  not-on-main. That is a confident no where the truth is "can't tell". The
  cockpit's rule is that ambiguity reads unknown.

  Third, the face re-runs every git read for every cleared node on every
  redraw, so the cost grows with the number of cleared nodes and the length of
  main even when nothing moved.

  The fourth open item, Landed being a bare string in loom@v0, belongs to the
  cockpit thread and is out of scope here.

  Ordering: this graph changes packages/face/src/landed.ts and mainLine.ts,
  which exist only on PR #71's branch. It runs after #71 merges, and after
  0047-worktree-commits, branched from interlock main at that point.
gates:
  - id: approved
    kind: human
nodes:
  - id: landed-tells-the-truth
    role: implementer
    depends_on: []
    acceptance: |
      Make the landed reading truthful in three cases, all deterministic git
      reads with no model involved.

      1. Partly reverted. Landed gains a kind `partly-reverted-on-main`,
      carrying `main`, `head`, `reverted` and `revertedBy`. Publish the new
      discriminant in position@v2. Preserve schemas/position@v1.json and
      historical fixtures unchanged; register both versions and emit v2 from
      positionOf. Preserve existing Landed variants' shapes. Define reverted
      as original attempt commit SHAs in attempt order, and revertedBy as a
      mapping from each listed SHA to its full undo commit SHA, with exactly
      matching keys. Update POSITION_SHAPE, the active typed Position fixture in packages/face/test/faceReducer.test.ts, latest-output assertions, CLI JSON output tests and schema coverage. Tests validating positionOf output must select position@v2; retain separate fixed position@v1 compatibility fixtures. Retain v1 compatibility fixtures. A position containing a partly-reverted-on-main node must have done: false; isNodeDone must continue accepting only on-main. The consumers to update are
      the ones that exist: isNodeDone (which accepts only on-main), the
      position schema registry and the CLI JSON output; the text and terminal
      renderers omit Landed today and stay so.

      A commit of the attempt counts as undone on main when a main commit
      descending from its identified main landing counterpart carries a revert
      line naming that counterpart or the original attempt commit, or, with no
      relevant revert line, when that main commit's stable patch id equals the
      stable patch id of the attempt commit's inverse (`git diff <c> <c>^`). The no-trailer
      detector recognizes stable inverse-patch equivalence under identical,
      explicit diff options and path scope; it does not recognize every manual
      undo. An undo must descend from the identified main landing counterpart,
      not merely occur later in log output. Unresolved overlapping later edits
      read unknown. A later revert of the undoer or matching forward-patch
      reapplication also reads unknown. Emit partly-reverted-on-main only when
      some units are proved undone and every remaining unit is still
      established as landed; otherwise read unknown. When every unit is undone,
      the reading stays `reverted-on-main`, as today. A squash is one unit: its
      undo must name the squash landing commit or match the whole inverse of
      base..head. A trailer naming one constituent commit does not prove the
      whole squash undone.

      2. Ambiguous squash. Preserve the existing unknown result for a
      partially landed set of commits. Otherwise, after ancestry, per-commit
      equivalence and whole-patch matching fail, inspect commits reachable
      from the captured main SHA but not from the attempt's base. Return
      not-on-main only when none touches an attempt-changed path. Otherwise
      return unknown. Path overlap is conservative possible-landing evidence:
      an unrelated edit elsewhere in the same file intentionally returns
      unknown. Name the candidate with the largest number of distinct shared
      paths, breaking ties by earliest committer timestamp and then full SHA;
      include its SHA and the shared-path count out of the attempt's distinct
      path count.

      3. Cached redraws. Retain one repository-scoped mainLineReader/cache for
      the face process lifetime and pass it through buildPlansWorld and
      buildGraphWorld. At each world refresh, resolve the selected main branch
      and SHA once, shared across all graphs and nodes. Every comparison uses
      that immutable SHA; the outward main field retains the branch name.
      Cache successful judgments by (main branch, main SHA, cleared head SHA,
      base SHA). An unchanged refresh whose requested keys all have successful
      cached judgments performs only the shared main snapshot read and zero
      per-node git reads. A screen-only redraw performs none. Main movement
      invalidates every entry keyed by the previous SHA. Do not persist the
      cache. A judgment caused by a failed git read or an unavailable required
      head/base object is not cacheable; retry it on a later refresh even when
      its key is unchanged. Deterministic unknown results from complete,
      successful reads may be cached.

      Tests, in packages/face/test/landed.test.ts, each in a real temporary
      repository built by the test. Use three independently reversible commits
      in disjoint files and capture their exact SHAs. Test one exact manual
      inverse without a revert trailer, one trailer-based undo, and all three
      exact inverses in separate commits without trailers. Assert complete
      expected payloads, including original commit/undoer pairings. Add an
      inverse with changed context, an inverse followed by forward
      reapplication, and a squash undone by its whole inverse. Build an actual
      conflict-resolved squash and assert that neither its individual nor
      whole patch IDs match before asserting unknown. Add both a never-landed
      attempt followed by an unrelated same-file edit and a no-shared-path
      control. Test candidate ranking and ties, asserting the named SHA and
      overlap count. Test a cherry-picked unit reverted by a trailer naming its
      main counterpart; assert that the original attempt SHA maps to the
      undoer's full SHA.

      Create packages/schemas/test/landed.test.ts covering code-produced
      latest positions for every Landed kind, retained v1 fixtures, absent
      landed, done: false for partial reverts, and rejection of missing or
      malformed new evidence fields. Create
      packages/cli/test/face/landedCache.test.ts: with an injected runner
      delegating to real git, exercise consecutive world refreshes through the
      CLI lifecycle with multiple graphs and cleared nodes. Assert one shared
      main snapshot resolution per refresh, zero per-node reads on an
      unchanged refresh, one judgment when only one node's head or base
      changes, and fresh judgments for all entries when main changes. Assert
      zero reads for a screen-only redraw. Inject a transient per-node git
      failure and assert that an unchanged refresh retries the failed key while
      reusing successful cached judgments.

      Strict TypeScript, no assertions, no non-null operators. Preserve every
      historical artifact. Append typed notes for choices and discoveries. No
      push, no merge; the human merges.
    gates:
      - id: landed-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/landed.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: position-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/position.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: schema-proof
        kind: command
        run: pnpm --fail-if-no-match --filter schemas exec vitest run test/landed.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: cache-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/face/landedCache.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: live-attempt-facts
    role: implementer
    depends_on: []
    acceptance: |
      Two additions to the position that `interlock position --json` prints.

      1. Every live attempt, in every repository asked about, carries a
      `pane` and a `startedAt`. `startedAt` is the runner clock's
      epoch-millisecond wall time captured when it appends
      `session-started`. Record it as an optional top-level field on that
      event, validate it, and project it into `SessionView`. New
      runner-started sessions record it; historical and backfilled sessions
      without it report unknown with a reason. Never infer it from lease
      expiry, configured lease duration, narration or file timestamps. Test
      runner recording, replay and historical absence. This placement can
      remain event@v9: its top level is open and existing readers ignore
      extra keys.

      Publish `positions@v1` with required `pane` and `startedAt` fields on
      every live attempt. Each field is a closed known/unknown union: known
      requires a string pane address or numeric epoch-millisecond start
      respectively; unknown requires a nonempty `because`. Reject bare
      values and mixed branches. Retain the unchanged v0 schema and support
      v0 reads forever, interpreting absent facts as unknown without
      rewriting historical artifacts. Test both versions. The pane address is
      opaque: no reader parses it.

      Add a bulk-observation seam to `Runtime`. For a `positionsOf`
      invocation with live attempts, obtain one observation shared across
      every asked repository and graph. The herdr adapter performs one
      `agent.list` and resolves pane and agent status from that result using
      graph, node and session identity. Keep protocol calls and parsing
      inside the adapter. Missing capability, failed observation, unknown
      session or missing pane produces an unknown pane with a reason.
      Runtime unavailability does not erase a recorded start time. Test one
      observation across multiple graphs in two repositories.

      2. lines-in-voice: when `attentionOf` selects the approval standing
      with approval `not-approved`, `observedText` returns exactly "Drafted
      and waiting for your approval." Preserve stale-approval text and
      standing priorities. Add `drafted`, `waiting` and `approval` to
      AGENTS.md's Vocabulary table; add only `and`, `for` and `your` beside
      `at` in the I3 test's fixed grammar-word list. Strip sentence
      punctuation from token boundaries for observed-line vocabulary
      checking only. Preserve exact rendered text and said quotations.
      Update the existing sentences table so exact-output and I3 checks
      exercise this sentence.

      Strict TypeScript, no assertions, no non-null operators. Preserve every
      historical artifact. Append typed notes for choices and discoveries. No
      push, no merge; the human merges.
    gates:
      - id: live-facts-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/position.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: voice-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/position.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: render-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/render.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: schema-proof-positions
        kind: command
        run: pnpm --fail-if-no-match --filter schemas exec vitest run test/corpus.positions.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: brief-follows-acceptance
    role: implementer
    depends_on: []
    acceptance: |
      A node's authored brief can fall behind its graph. On 2026-11-05 a
      node's acceptance in another repository was rewritten three times
      after its brief was authored, and the runner started a session on the
      old brief body because it reconciles only the brief's front matter
      (role, gates, scope) with the graph. The worker built the smaller,
      older spec while the gates judged the newer one.

      When the runner materializes a brief for a session, it also
      reconciles the brief's "Acceptance (verbatim from the graph)" section
      with the acceptance from the same approved node declaration that
      supplies the session's recorded brief and node gates, even when a
      reused worktree has an older `graph_base_sha`. If the two differ, it
      replaces that section's body with the declaration's acceptance, quoted
      the same way, and reports the rewrite through the existing narration
      channel it uses for front-matter diffs, naming the node and that the
      acceptance changed. Comparison removes one blockquote marker and at
      most one following space per quoted line, normalizes line endings and
      excludes section-padding blank lines; it preserves whitespace
      belonging to the acceptance itself. Acceptance reconciliation
      preserves every body byte outside the section it replaces. Existing
      front-matter reconciliation and generated debrief-guidance, walk and
      context-slice transformations continue unchanged.

      For an otherwise valid brief@v1 without this section, append the
      canonical quoted acceptance section to the materialized copy and
      report its addition through the existing narration channel. The
      opening view identifies this section as authoritative over acceptance
      text elsewhere in the authored prose. Existing brief readers and
      repository files remain unchanged; the authored brief file in the
      repository is never edited by the runner.

      Tests: a matching acceptance section is retained byte for byte and
      produces no acceptance-rewrite narration; a stale section is replaced
      and reported, with outside bytes preserved by acceptance
      reconciliation and existing generated-body transformations retained;
      an existing brief@v1 without the section materializes successfully
      with the authoritative acceptance appended and its addition reported;
      every existing brief remains readable; a whitespace-only difference in
      quoting is not reported as a change. In packages/cli/test/run.test.ts,
      cover a reused worktree with an older base and prove that the
      materialized acceptance, recorded brief and node gates use the same
      approved declaration. Strict TypeScript, no assertions, no non-null
      operators. Preserve every historical artifact. Append typed notes for
      choices and discoveries. No push, no merge; the human merges.
    gates:
      - id: brief-follows-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/sessionBrief.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: brief-follows-run-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/run.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
