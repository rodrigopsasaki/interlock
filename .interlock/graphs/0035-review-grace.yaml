read: >
  Current sessionWait takes its clock sample before calling the potentially
  blocking runtime.waitUntil, then arms grace from that stale sample when a
  person-answer or unfinished-work settle returns. Existing controlled-clock
  tests verify that grace elapses, that resumption clears it, and that grace is
  capped at the original deadline, but their initial waits consume no time.
  One seam-local repair can sample after a successful wait without changing
  deadlines or runner policy. Two controlled-clock regressions must advance
  through the relevant blocking wait and then prove a complete configured grace
  remains; unchanged source instead leaves only the time remaining from the
  earlier sample. The focused runner test gate keeps the repair bounded while
  standing gates remain the harness's proof.
gates:
  - id: approved
    kind: human
nodes:
  - id: restore-post-settle-grace
    depends_on: []
    acceptance: |
      Repair packages/runner/src/sessionWait.ts so a grace window is armed from
      a fresh reading of the existing injected clock after a successful blocking
      runtime.waitUntil returns a settled status, rather than from the reading
      made before that wait. Apply the same seam-local timing correction to both
      the settled-after-a-person's-turn and unfinished-work-settled routes.
      When sufficient original run time remains, each route receives the full
      configured answerGraceMs after settlement; retain the existing cap at the
      original run deadline, so this repair never extends that deadline.

      Add deterministic controlled-clock regressions in
      packages/runner/test/sessionWait.test.ts. Each must advance the injected
      clock during the blocking wait that returns the settled status, then prove
      that the following grace wait is the full configured interval: one after
      blocked then settled, and one after an unfinished-work settle. They must
      fail on the unchanged stale-sample source and use no wall-clock sleep or
      real-time delay. Keep and run the relevant existing session-wait behavior
      coverage for grace expiration, deadline capping, resumption clearing and
      re-arming grace, clean immediate settlement, runtime refusal, and original
      deadline timeout. Do not alter resumption, terminal-status, retry, lease,
      approval, authority, runtime-adapter, dependency, artifact, or substrate
      behavior. Run lint on the touched files before committing, retain truthful
      typed notes and debrief, use actual authorship and Git identity, and do
      not lease or run another node, push, merge, deploy, change permissions or
      trust, or use agents. The harness runs standing gates.
    gates:
      - id: session-wait-grace-proof
        kind: command
        run: pnpm --filter runner exec vitest run test/sessionWait.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
