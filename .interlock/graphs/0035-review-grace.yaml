interlock: graph@v0
id: 0035-review-grace
ask: >
  An earlier review handoff advertised a 300-second answer grace but provided about 83 seconds; the retained next-briefing-strategy proposal identifies time spent inside runtime.waitUntil as a possible cause. Inspect current reality. If confirmed, propose one bounded implementation node that gives the full configured post-settle grace after a blocking wait, both after a person answers and when unfinished work settles, without extending the original run deadline or changing resumption, terminal status, retry, lease or authority rules. Require a deterministic controlled-clock regression that would fail unchanged source, no wall-clock sleeps, plus relevant existing behavior tests. Reuse the existing clock and session-wait seams. Produce only the graph, typed notes and a truthful debrief; never implement or lease its nodes. This is a real product repair, not a demand for a positive learning claim. Received hypotheses are provisional and must be checked before reliance. Actual authorship is agent/codex/gpt-5.6-terra; use current date and real full Git identities. Interpreter filing remains authored, not the worker-only derived command. Keep existing artifacts, no new dependencies, no agents, push, main merge, deployment, permission/trust changes or existing-brain access. Use mise exec for local commands, retain yielded exec session handles instead of duplicate runs, and leave full suites to the harness. Run lint on touched files before committing. Per-command unsigned commits are allowed if signing is inaccessible; no config changes. Stop after the committed debrief.
