interlock: graph@v0
id: 0055-runner-commits
ask: A runtime whose sandbox cannot sign still lands signed work, because the runner commits the attempt's changes with the owner's key outside the sandbox, only within the node's paths and never a secret.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: codex-signing-cause-2026-11-05
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Gilb for Rodrigo Sasaki, after a cross-vendor vet; the human merges
read: >
  Rodrigo, 2026-11-05 14:38: "but I don't want to have unsigned commits." Every commit stays signed with his key
  (commit.gpgsign=true since 2025-08-28).

  Cause, measured 2026-11-05 with `codex exec --sandbox workspace-write` (codex-cli 0.162.1). Inside codex's
  sandbox, gpg can neither write its lock files in ~/.gnupg ("failed to create temporary file ... Operation not
  permitted") nor connect to the agent socket /Users/rodrigosasaki/.gnupg/S.gpg-agent ("can't connect to the
  gpg-agent: Operation not permitted"), so every codex commit fails at signing with "Input/output error". Codex has
  never made a signed commit in this repo: its 13 commits of 2026-09-24 are all unsigned. The runner, which runs
  outside any sandbox, already makes signed commits: commitBriefIfChanged (packages/runner/src/worktree.ts:192),
  e.g. brief commit 26caf6d, signature G.

  Today an attempt that leaves changes uncommitted is held by judgeWorktree ("N uncommitted path(s) in the
  worktree; gates judge commits only", packages/runner/src/judgeWorktree.ts:61-79, called from
  packages/runner/src/sessionDrive.ts:471). Codex attempts end there.

  Order: this lands before graph 0054's routing reaches codex, so a routed codex build lands signed work. Out of
  scope: changing any signing, sandbox or keyring setting; giving any agent access to ~/.gnupg.
gates:
  - id: approved
    kind: human
nodes:
  - id: runner-commits
    role: implementer
    depends_on: []
    acceptance: |
      Profile flag. A runtimes.yaml profile gains `commits: runner | agent`, default agent. A profile without it
      reads as agent, so today's behaviour is unchanged. The catalogue reader accepts only runtimes@v0 today
      (packages/runner/src/runtimeCatalogue.ts:18, 207-213), and graph 0054 also adds catalogue fields. Whichever
      of 0055 and 0054 lands first publishes runtimes@v1, and the other extends it to runtimes@v2. Every earlier
      version stays readable, each with schema tests. Set `commits: runner` on every `kind: codex` profile in the example catalogue
      (.interlock/local.example.yaml or the catalogue reference the repo ships). The machine catalogue
      (~/.config/interlock/runtimes.yaml) is the owner's, so the debrief names the one key to add per codex profile
      and the runner never edits it.

      Prompting and settling are mode-aware. Today the opening prompt tells agents to commit
      (packages/runner/src/openingPrompt.ts:34-62), and settlement waits for a clean worktree and a committed
      debrief (packages/runner/src/sessionDrive.ts:402-410, sessionWait.ts:231-239). For a commits: runner attempt
      the prompt says instead: do not commit, leave your changes in the worktree, and write commits.yaml beside the
      brief. The attempt settles in two phases.

      Phase 1, code. The agent leaves code changes uncommitted and writes commits.yaml beside the brief, in a new
      versioned shape, commits@v0, with schema tests in packages/schemas:
        interlock: commits@v0
        entries: [{ message, paths }]    # ordered, possibly empty
        fallback_subject: <string>       # required when a changed code path is in no entry
        co_authored_by: <string>         # optional
      A message is a non-empty commit message whose first line is at most 100 characters. Paths are literal and
      repository-relative: no globs, no `..`, no absolute paths. A commits.yaml is invalid, and the attempt fails
      naming why, when a path appears in two entries, names a path that did not change, names a reserved session
      artifact (below), or is missing fallback_subject while some changed code path is in no entry. With no entries
      and no changed code paths, phase 1 makes no commit.

      Artifact custody. Phase 1 owns every changed path except this node's session artifacts. Phase 2 owns those:
      notes.yaml, debrief.yaml, the debrief candidates and their sources (candidate.yaml, final.candidate.yaml,
      fresh.candidate.yaml, packages/cli/src/debrief/derived.ts:267-282), revisions/, and commits.yaml itself. Phase 1 settles when the agent
      is done and commits.yaml validates, with the worktree dirty. The runner then:
      1. lists the worktree's changed and untracked paths (git status --porcelain, gitignored files excluded);
      2. refuses if any path lies outside the node's declared paths, or looks like a secret, as below;
      3. commits each commits.yaml entry in order, then any remainder under the fallback subject. It stages
         exactly the named paths, never `git add -A` or `.`, through a new exact-path helper, commitPaths(worktree,
         paths, message, trailers), generalised from commitBriefIfChanged (packages/runner/src/worktree.ts:192-223).
         commitBriefIfChanged keeps its own behaviour, including its trailer;
      4. signs every commit through the owner's normal git signing outside the sandbox, and adds `Attempt:
         <session id>` and `Runtime: <profile name> (<model>)`, plus the co_authored_by line when given;
      5. records the branch head before its first commit. If any commit in the sequence fails, signing included, it
         returns the branch to that head with a mixed `git reset <head>`, which keeps every changed file in the
         worktree, unstaged. So no partial or unsigned commit remains, and the worktree is left as the agent left
         it.
      A signing failure fails the attempt with git's message. The runner never retries unsigned and never passes
      a no-sign option.

      Phase 2, debrief. The runner tells the agent, in its pane, that its code is committed at <sha>, and to file
      its debrief and notes now, without committing. The agent runs `interlock debrief prepare`, which records the
      current HEAD, the last code commit (packages/cli/src/debrief/derived.ts:153-170), so the debrief's head_sha
      covers the runner's commits and the verifier's sessionStartSha..headSha diff includes them
      (packages/verifier/src/verify.ts:48-64). When the debrief files and validates, the runner commits the
      phase-2 artifacts as the final commit through commitPaths, signed with the same trailers: notes, the debrief,
      the candidates and their sources, revisions/ and commits.yaml. After it, the worktree must be clean. A path
      still dirty fails the attempt, naming it, rather than being held by judgeWorktree
      (packages/runner/src/judgeWorktree.ts:61-79). The same reset rule applies if this commit fails. That keeps the
      rule that head_sha is the last code commit and the debrief is the final commit (AGENTS.md). Then it judges,
      as today.

      Declared paths. A node may declare `paths`, a list of globs, in the graph. Thread it through the graph
      reader (NodeDeclaration, packages/face/src/document.ts:18-24 and 132-165), `interlock run`
      (packages/cli/src/run.ts:187-230) and the session request, so the commit check receives it. Without it, the declared paths
      are the repository's tracked tree plus new files anywhere except .git/, other nodes' session directories
      under .interlock/sessions/, and .interlock/graphs/. A node's own session directory is always declared.

      Secret-looking. A path is refused if its name matches .env, .env.*, *.pem, *.key, *.p12, *.pfx, id_rsa*,
      id_ed25519*, *credentials*, *.keystore, or .npmrc, .pypirc or .netrc. It is also refused if its first 64 KB
      contain a PEM private-key header ("-----BEGIN" ... "PRIVATE KEY-----"), an AWS access key id (AKIA followed
      by 16 uppercase alphanumerics), or a GitHub token (ghp_, gho_, ghs_ or github_pat_ followed by 20 or more
      word characters). The refusal names the path and which rule matched, never the content.

      Refusals. An out-of-paths or secret-looking path, an invalid commits.yaml, or a signing failure fails the
      attempt. Nothing more is committed, and the worktree is left as it was for drilldown. The runner records a
      failed outcome in the ledger before returning, with its failure, disposition and because
      (packages/ledger/src/outcome.ts:32-37), naming each path and its rule. Today some refusal paths return
      without an outcome (packages/runner/src/sessionDrive.ts:486-492). The position and the face
      (packages/face/src/sessionColumns.ts:57-72) show that reason.

      Tests in packages/runner/test/runnerCommits.test.ts with fixture repositories only through
      test/support/gitFixture.ts, and a fixture signing program in place of gpg (gpg.program pointing at a stub
      that writes a fixed signature), so no real key is touched:
      - a commits: runner attempt's prompt says not to commit, and phase 1 settles with a dirty worktree;
      - its changes land as the commits.yaml entries, in order, with both trailers, signed through the stub;
      - remainder paths go under the fallback subject;
      - phase 2's debrief head_sha is the last code commit, the verifier covers the runner's commits, and the
        debrief lands as the final signed commit before judging;
      - a node's declared paths reach the check from the graph;
      - `git add -A` is never run, which the stub git records;
      - a path outside declared paths fails the attempt naming it;
      - each secret rule fails the attempt naming the rule and never the content;
      - a signing failure fails the attempt with git's message and nothing unsigned is created;
      - a signing failure on the second of two declared commits leaves the branch at its pre-commit head and every
        change in the worktree;
      - each commits.yaml rule (duplicate path, unchanged path, reserved artifact, missing fallback_subject)
        fails naming why;
      - after phase 2 the worktree is clean, including the candidates;
      - every refusal records a failed outcome that the position shows;
      - a commits: agent profile behaves exactly as today.
      Strict TypeScript, no type assertions, no non-null operators. Preserve every historical artifact. Append
      typed notes for choices and discoveries. No push, no merge; the human merges.
    gates:
      - id: runner-commits-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/runnerCommits.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: catalogue-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/runtimes.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: debrief-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/debrief --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: schema-proof
        kind: command
        run: pnpm --fail-if-no-match --filter schemas exec vitest run --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
