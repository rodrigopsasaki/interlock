interlock: graph@v0
id: 0008-learning-witness
ask: Prove the remaining debrief-delivery boundary, then observe whether a fresh test-design session can use source-traceable learning from an earlier diagnosis without inheriting its conversation or checkout.
derivation:
  kind: model
  model: gpt-6-astra
  prompt: six-graphs-2026-09-14-slot-6
authorization:
  granted_by: Rodrigo Sasaki
  mandate: six-graphs-2026-09-14
  slot: 6
  limit: 6
  source: Root conversation delegation; interlock-notes/six-graph-mandate-2026-09-14.md.
read: >
  M4 to M5, one unblinded candidate-only usefulness observation. One explicit
  delivery-repair prerequisite, then two fresh diagnosis/test-design sessions;
  maximum three Terra/high workers, one per node, no retries. All serialized
  through this clone's isolated journal. Slot 5 stays held. If repair fails
  acceptance or independent review, downstream sessions are not launched.
  Root may fast-forward this isolated candidate to reviewed repair code before
  A starts, without changing graph content or incorporating A before B.
  Source A diagnoses; fresh B designs tests. The root checkout never incorporates
  A's output before B starts. Both source briefs are committed before A starts.
  Only the harness may put returned context into B's session brief. Root starts B
  only after A is cleared and its actual outbox delivery is acknowledged; no
  manual absorb, item seeding, copied finding, retry or hidden extra graph.
  Existing brain/main branches/remotes remain unchanged. No deployment,
  inference probes, key disclosure, automatic ratification, waiver or merge.
experiment:
  receiver_commit: a0d184d3f287bb47688a11a0698beb0548230b21
  receiver_manifest_sha256: 1a0854a819f7060811253e40b6e285dd6acedbd34df503e0e8748231508d44c8
  baseline: interlock-notes/evidence/six-graphs-2026-09-14/receiver-witness/before-a.json
  observations:
    - Returned means B's recorded context response contains an item derived from A.
    - Included means B's immutable rendered brief contains that item and provenance.
    - Used means B cites the context item in a decision tied to a specific verifier-rooted test hunk; self-report is labeled and checked against the diff.
  limitations:
    - Negative and inconclusive results are valid. No forced discovery or forced reuse.
    - One unblinded trial does not establish causal benefit, repeated improvement or compounding.
    - Runner retrieval scope is the tracked inventory, not just authored brief paths; no fine-grained selection claim.
    - Disposable receiver with fixture authority is not integration with the existing project brain.
gates:
  - id: approved
    kind: human
nodes:
  - id: prove-delivery
    depends_on: []
    acceptance: |
      Finish the concrete slot-5 acceptance on candidate 1237f0a, preserving its
      held outcome, brief and debrief. This is the only repair attempt in the
      final graph. No actual witness substrate calls from this node: the runner
      uses none for this prerequisite, and enables the isolated receiver only
      after review, before source-a. No seventh graph or hidden retry.

      Restore bounded, redacted HTTP refusal detail on the prepared absorb path
      by composing the existing response-detail helper. The public absorb API
      keeps its existing JSON/plain-text detail tests unchanged; durable dispatch
      still records uncertain rather than claiming a non-2xx means no write.
      Retain useful status/detail, never auth token/key or credential URL. Keep
      the old readable-refusal contract and strict receiver/no-fallback tests.

      Prove the actual I7 path through production judgeGates/HTTP adapter/ledger,
      not a duplicate test implementation. Add focused failure tests for:
      (1) real sink write failure and fsync failure before request dispatch:
      zero HTTP, no trusted intent projection, later confirmed appends poisoned;
      (2) response observed then acknowledgment-artifact or delivery-append
      failure: uncertain, never acknowledged, no re-send on reopen;
      (3) persisted intent with no delivery on process restart: uncertain and
      zero HTTP without requiring another judgment;
      (4) acknowledged and uncertain logical identities suppress redispatch;
      (5) same identity but changed receipt timing/request bytes refuses with
      original immutable artifact intact; new session/debrief can be distinct;
      (6) non-2xx, malformed/schema-invalid response and transport failure stay
      uncertain; (7) none and unsafe credential/query/fragment targets create
      no outbox effect or network call. Tests must discriminate these branches,
      not just label the same injected sink exception write and sync. A narrow
      fs-operation adapter or real filesystem failure is acceptable; preserve
      Phyxius and the confirmed persistence seam, no second journal/dispatcher.

      Validate request/ack refs and envelopes at public read boundaries with
      safe nonnegative integer byte counts, exact SHA/ref match, and correct
      missing versus corrupt classification. Prove round-trip/hash/corruption,
      missing data, unsafe refs and same-path conflicting bytes. Keep prior
      version readers and prove v1-v4 fixtures replay while old tags refuse
      v5-only events. Do not mutate old fixtures/schemas to bless new events.
      Add actual v4 coverage: the existing v3-v4-named fixture contains no v4
      lines. Acknowledged delivery requires a retained acknowledgment artifact
      in TypeScript, runtime guard and v5 schema; make the missing-proof state
      unrepresentable/refused. Runtime guards agree with published SHA-256 ID
      and nonnegative integer byte constraints. Provide a small public read
      seam by node/session/effect that returns verified evidence or explicit
      absent/missing/corrupt, not an unverified raw ref or a new position UI.
      Repair newly introduced contract/fixture mismatches exposed by the full
      suite (including older fake clients); use prepared fake adapters, never
      restore direct send fallback or weaken original assertions. A missing
      prepared adapter must remain a refusal, not fake successful absorption.

      Regenerate docs/shapes.md using the existing schema reference command and
      verify freshness at final HEAD. Keep scope to narrowly necessary outbox,
      sink, adapter, existing fake-client adaptation and corresponding focused
      tests/schema-reference fixes. Allowed source: packages/ledger/src and
      packages/runner/src/gateJudge.ts plus a small extracted outbox helper if
      needed; packages/substrate/src/{client,httpClient,responseDetail}.ts.
      Allowed tests: focused ledger/runner outbox and existing replay/absorb/
      fake-client tests directly affected. schemas only current new outbox/v5
      contracts if needed; docs/shapes.md and one design bend row if design
      changes. No unrelated feature/refactor, new dependency, other graph edits,
      production service, probe, main/remote merge, push or waiver.

      Create packages/runner/test/absorbOutbox.failure.test.ts and
      packages/ledger/test/outboxDurability.test.ts for the declared proof
      matrix; include a concise case-to-assertion map in the debrief. Every
      required case must exist and run, not just the previous one-test happy
      path. Mark any unmet obligation explicitly. Retain actual observed UTC
      timestamps, generated initial brief commit as session_start_sha, graph
      base and last-code SHA. Do not overwrite old provenance. Valid typed
      notes/debrief and code commits, then stop. Root reviews before proceeding.
    gates:
      - id: delivery-failure-proof
        kind: command
        run: pnpm --filter runner --fail-if-no-match exec vitest run test/absorbOutbox.test.ts test/absorbOutbox.failure.test.ts --reporter=verbose
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: durable-storage-proof
        kind: command
        run: pnpm --filter ledger --fail-if-no-match exec vitest run test/outboxDurability.test.ts test/replay.test.ts --reporter=verbose
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: readable-absorb-proof
        kind: command
        run: pnpm --filter substrate --fail-if-no-match exec vitest run test/absorb.test.ts --reporter=verbose
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: shape-reference-fresh
        kind: command
        run: pnpm interlock schema reference --check
  - id: source-a
    depends_on: [prove-delivery]
    acceptance: |
      Diagnose the current verified-debrief-to-evidence boundary using actual
      packages/substrate/src/evidence.ts, related derivation/classification,
      verifier source and existing tests. Explain a small number of concrete
      assumptions that a test designer should know, what the code establishes,
      and what it does not establish. Seek genuinely missing brief context;
      do not invent novelty or claim a defect merely because a case is subtle.
      Produce docs/experiments/learning-witness/source-a.md with exact source
      paths/lines and a concise proposed test-design direction. No production
      code, existing tests, schemas, runtime configuration or historical edits.
      Discoveries must name an actual source path in found_at; no invented
      receipt, confidence-as-proof or mandatory positive result. Notes/debrief
      are truthful and versioned, use actual observed UTC timestamps and the
      generated graph/session/code SHAs. Only this node's new artifacts may be
      edited. Commit report then valid notes/debrief and stop. The harness owns
      gates and absorb; do not contact any substrate or another session yourself.
    gates:
      - id: diagnosis-artifact
        kind: command
        run: test -s docs/experiments/learning-witness/source-a.md
  - id: fresh-b
    depends_on: [source-a]
    acceptance: |
      Independently design focused deterministic regression tests for the
      verified-debrief-to-evidence boundary. Inspect current source and existing
      tests, identify useful nonredundant cases, and add
      packages/substrate/test/learningBoundary.test.ts. Prefer 3-4 meaningful
      cases whose assertions would fail if the relevant selection, scope,
      provenance or standing boundary changed. Do not change production source
      just to satisfy tests. If no honest new case exists, report that result
      rather than add theatrical assertions or force a learning claim.
      B may read its own immutable brief/context, AGENTS/design and current
      source/tests. It must not read A's report, notes, debrief, session files,
      branch, journal/outbox artifacts or conversation, nor other session
      histories. A's branch is not a code dependency. Do not inspect sibling
      worktrees, notes repository, receiver data/key or external services.
      If returned context influenced a choice, identify its exact statement and
      derivation in B's notes and decision.because, connect it to a concrete new
      test hunk, and verify it against source. If not useful, state that without
      penalty; retrieved context is not an instruction or a correctness verdict.
      Notes/debrief include an acceptance-to-test map, actual model/runtime,
      observed UTC timestamps and generated graph/session/last-code SHAs.
      Allowed edits: that one new test file and this node's new notes/debrief.
      No production fixes, graph/brief changes, gate waiver, automatic ratification,
      other agent, new session, probe, deployment, push or merge. Commit and stop.
    gates:
      - id: learning-boundary-tests
        kind: command
        run: pnpm --filter substrate --fail-if-no-match exec vitest run test/learningBoundary.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
