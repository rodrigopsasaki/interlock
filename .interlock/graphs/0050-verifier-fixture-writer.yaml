interlock: graph@v0
id: 0050-verifier-fixture-writer
ask: A verifier test's temporary repository is removed only after everything writing into it has finished, so the suite never fails on ENOTEMPTY under load.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: land-0048-parallel-run-2026-11-05
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Gilb for Rodrigo Sasaki, after a cross-vendor vet; the human merges
read: >
  On 2026-11-05, in a full parallel `pnpm test` on land/0048-landed-tells-the-truth,
  packages/verifier/test/foundAt.test.ts "roots a repo-root-relative path embedded in
  prose, no quote to check" failed in afterEach: `rmSync(directory, { recursive: true,
  force: true })` threw ENOTEMPTY on its own packages/verifier/test/.runs/run-<id>
  directory. Something wrote into that directory after the test body returned. The
  verifier was untouched by that branch, the file passed alone, and the next full run
  was green.

  Checked before planning: the fixture helpers (test/support/gitFixture.ts) and
  packages/verifier/src/git.ts call git only through execFileSync, so no in-process
  child outlives a test; the machine's git config sets core.untrackedcache=true and no
  fsmonitor, maintenance or gc keys; git is 2.54.0. The writer is therefore not yet
  known. Candidates to rule in or out with evidence: a detached git background job
  (auto gc or maintenance, `gc.autoDetach`), another vitest worker or test sharing a
  path under test/.runs, an asynchronous call in the code under test that is not
  awaited, or a file watcher. Out of scope: retrying or delaying rmSync, raising
  timeouts, or serialising the whole suite.
gates:
  - id: approved
    kind: human
nodes:
  - id: writer-is-closed
    role: implementer
    depends_on: []
    acceptance: |
      Find the process or call that writes into a verifier test's temporary repository
      after the test body returns, with evidence: reproduce the ENOTEMPTY under load
      (the full parallel `pnpm test`, or the verifier suite run repeatedly beside other
      packages) and capture what was written and by whom (the leftover path names, and
      the process, for example with lsof or a write trace, or git's own trace). Record
      the evidence and the conclusion in the debrief. Then fix the cause where it lives:
      await or close an asynchronous writer, keep two tests from sharing a path, or, if
      it is a detached git background job, have every git invocation in the verifier's
      fixtures and the code under test run with background work disabled
      (`-c gc.auto=0 -c maintenance.auto=false`) and say why. Never retry, delay or
      force rmSync, and never serialise the suite to hide it.

      Tests: a regression in packages/verifier/test/fixtureCleanup.test.ts that fails
      before the fix and passes after, built on the cause found (for example, asserting
      no background git job is spawned by a fixture commit, or that a test's directory
      has no writer left when afterEach runs); the existing verifier suite stays green;
      the full parallel `pnpm test` passes three times in a row, recorded in the
      debrief. If the cause cannot be reproduced in a bounded effort, the debrief says
      "not reproduced", lists what was tried, and no code changes. Strict TypeScript,
      no assertions, no non-null operators. Preserve every historical artifact. Append
      typed notes for choices and discoveries. No push, no merge; the human merges.
    gates:
      - id: cleanup-proof
        kind: command
        run: pnpm --fail-if-no-match --filter verifier exec vitest run test/fixtureCleanup.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: verifier-suite
        kind: command
        run: pnpm --fail-if-no-match --filter verifier exec vitest run --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
