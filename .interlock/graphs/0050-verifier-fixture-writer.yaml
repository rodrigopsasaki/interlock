interlock: graph@v0
id: 0050-verifier-fixture-writer
ask: A verifier test's temporary repository is removed only after everything writing into it has finished, so the suite never fails on ENOTEMPTY under load.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: land-0048-parallel-run-2026-11-05
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Gilb for Rodrigo Sasaki, after a cross-vendor vet; the human merges
read: >
  On 2026-11-05, in a full parallel `pnpm test` on land/0048-landed-tells-the-truth,
  packages/verifier/test/foundAt.test.ts "roots a repo-root-relative path embedded
  in prose, no quote to check" failed in afterEach (foundAt.test.ts:14):
  `rmSync(directory, { recursive: true, force: true })` threw "ENOTEMPTY, Directory
  not empty" on its own packages/verifier/test/.runs/run-64TMAq directory (1 failed,
  58 passed). The failure suggests concurrent mutation during cleanup; it does not
  identify a writer or establish its timing. The verifier was untouched by that
  branch, the file passed alone, and the next full run was green.

  Verifier filesystem operations and direct Git calls are synchronous. verifyDebrief
  is declared async but performs no deferred work, and its tests await it. Four test
  files share test/.runs and the run- prefix, but mkdtempSync creates distinct
  directories and each teardown removes only its own child. execFileSync waits for
  the direct Git child, not necessarily detached descendants. Detached work launched
  by fixture Git commands is the leading code-level hypothesis, not an established
  cause. The failing fixture has one small root commit, so establish what would
  trigger maintenance rather than assuming it ran. Retain the reported Git version
  and configuration snapshot with their provenance: git 2.54.0 (Apple Git-157);
  global config core.untrackedcache=true and no fsmonitor, maintenance or gc keys;
  read with `git config --global --get-regexp` on 2026-11-05.
gates:
  - id: approved
    kind: human
nodes:
  - id: writer-is-closed
    role: implementer
    depends_on: []
    acceptance: |
      Spend at most 60 minutes on instrumented investigation, including at most
      three full parallel suite runs. Start with detached work launched by fixture
      Git commands. Retain evidence linking a writer to the exact fixture directory
      and invocation. A controlled reproducer may establish the conditions that
      trigger the mechanism; record those conditions and distinguish it from
      reproduction of the historical ENOTEMPTY. Fix only a demonstrated mechanism at
      its owning boundary. Change production Git invocations only if evidence
      implicates that boundary. Keep cleanup as one immediate rmSync(directory, {
      recursive: true, force: true }); add no cleanup retry, delay, timeout increase
      or suite serialization.

      Tests: a regression in packages/verifier/test/fixtureCleanup.test.ts exercises
      the demonstrated triggering condition and fails on the pre-fix code. Repeated
      green suites or assertions that Git flags are present alone are insufficient.
      On the final code, the runner's standing test gate and two additional full
      parallel suite gates must all pass in the same judgment. Retain their output
      as receipts.

      If the investigation budget expires without a demonstrated mechanism, record
      "not reproduced; cause unconfirmed", the attempts, retained evidence and
      remaining hypotheses. Make no source or regression-test changes; preserve
      notes and debrief. This is an unresolved handoff: do not claim acceptance
      satisfied, fabricate a cleanup test, or waive cleanup-proof. The node remains
      held for a person to choose its disposition.

      Strict TypeScript, no type assertions, no non-null operators. Preserve every
      historical artifact. Append typed notes for choices and discoveries. No push,
      no merge; the human merges.
    gates:
      - id: cleanup-proof
        kind: command
        run: pnpm --fail-if-no-match --filter verifier exec vitest run test/fixtureCleanup.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: verifier-suite
        kind: command
        run: pnpm --fail-if-no-match --filter verifier exec vitest run --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: parallel-suite-2
        kind: command
        run: pnpm test
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: parallel-suite-3
        kind: command
        run: pnpm test
        expect_output: 'Tests +[1-9][0-9]* passed'
