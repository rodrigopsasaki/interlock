interlock: graph@v0
id: 0070-refusals-never-suggest-sweep
arc: bring-october-back
ask: No refusal or narration tells a person to run interlock sweep. When judge or node reset refuses a node because its lease is live, it says who holds the lease and until when, to wait for the lease to end or for the agent to finish, and, for a reset, that the node can be reset only once the lease has ended and no agent is alive. The sweep command itself stays, and still works when run on purpose.
derivation:
  kind: model
  model: claude-sonnet-5-5
  prompt: refusals-never-suggest-sweep-2026-11-15
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: bring-october-back (this repository's .interlock/arcs.yaml). The owner's standing rule is that live agents are
  never swept: `interlock sweep` (packages/cli/src/sweep.ts, sweepExpiredLeases at packages/runner/src/sweep.ts:29)
  cancels terminally any session whose lease expiry has passed and whose outcome is unresolved, and it looks at expiry
  and outcomes, never at whether an agent is still alive. A lease can lapse under a working agent (graph
  0069-agent-keeps-its-lease is the plan that stops that), so a sentence that tells a person to sweep is a sentence that
  tells them to kill live work. Graph 0069 removed the sweep suggestion from the run and resume refusal and left two
  refusals untouched on purpose, listing them as an open item (its read, decision B and out-of-scope paragraph, and its
  debrief item). This graph closes that item.

  Found on main 94345094, by searching every string in packages/*/src that mentions sweeping:
    1. packages/cli/src/judge.ts:187, judge's refusal of a node with a live lease: "<node> is leased by session <id> until
       <iso>; wait for it or run interlock sweep."
    2. packages/cli/src/node/reset.ts:95, node reset's refusal of a node with a live lease: the same sentence.
    3. packages/runner/src/sessionDrive.ts:475, the drive's narration "lease not renewed; the sweeper will collect it at
       <iso>". It does not say to run anything, but it promises a sweep nobody schedules. Graph 0069 replaces this line
       (its decision E) and owns packages/runner/, so this node does not touch it; the proof scans for the instruction
       "interlock sweep" and this line is not one. If 0069 has not landed when this node runs, the line stays and is
       named in the debrief.
    4. packages/runner/src/localConfig.ts:78, the lease_ms description "how long a lease lasts before a sweep may call it
       abandoned". A description of a setting, true, and not an instruction; left as it is.
    5. packages/cli/src/sweep.ts:38-39, the sweep command's own output ("sweep: no expired, unresolved leases." and
       "sweep: abandoned <n> session(s): ..."), and the face key "s sweep (plans)" (packages/face/src/helpText.ts:12): the
       command and its own words, kept.
  Only items 1 and 2 tell a person to sweep. The message tests that pin them are packages/cli/test/node/reset.test.ts:150
  (exact text) and packages/cli/test/judge.test.ts:470 (a substring that survives).

  The new wording says what is true and what is safe, in plain sentences, and never offers a way to end a node whose
  agent may be working:
    judge:  "<node> is leased by session <id> until <iso>; its agent may still be working. Wait for the lease to end or
            for the agent to finish, then judge again."
    reset:  "<node> is leased by session <id> until <iso>; its agent may still be working. Wait for the lease to end or
            for the agent to finish. Once the lease has ended and no agent is alive in the node's pane, run this reset
            again."
  The lease end, not the agent's end, is what the ledger can state; the second sentence of the reset text is what makes
  the safe path explicit: a reset is offered only when both are true, and the text never claims either for the person.
  A lease that has genuinely expired is not refused by either command today and stays so; this node changes the words of
  the two live-lease refusals and nothing about when they fire.

  Plan, as decisions.
    A. One sentence builder. packages/cli/src/heldLease.ts exports explainLiveLease(held, then), where held carries the
       node id, the session id and the lease expiry in wall milliseconds and then is "judge" or "reset". It owns the ISO
       formatting both commands already do privately, so their two local isoOf functions go when nothing else uses
       them. judge.ts and node/reset.ts call it at their existing refusal points with their existing live-lease test;
       neither command's condition, order of checks, exit code or ledger effect changes. Two callers and one sentence
       family is the reason for the shared unit: the two texts must not drift apart again.
    B. Independent of 0069. This graph needs none of 0069's wording or helpers: 0069's refusal is a different sentence on
       a different path (run and resume, in packages/runner and packages/cli/src/run.ts and plan.ts), and 0069 declares
       judge and node reset untouched, so the two graphs touch disjoint files and may land in either order. There is no
       prerequisite gate. If 0069 lands first, its narration line (item 3) is gone; if not, the debrief says it remains.
    C. The sweep command stays. It is not edited, not renamed, not hidden. A named case runs it on purpose on a fixture
       with an expired, unresolved lease and expects it to abandon that session, and runs it through main's dispatch so the
       route is proven too.
    D. The proof. scripts/gates/sweep-wording-proven.ts runs packages/cli/test/refusalsNeverSuggestSweep.test.ts once with
       vitest's JSON reporter and prints "refusals never suggest sweep proven: 4 named cases passed" only when the run
       exits zero, the four titles below each pass exactly once, and there are no failures, skips, todos or extra cases.
       Its child process environment has HOME, the XDG folders, CODEX_HOME, CLAUDE_CONFIG_DIR and the Kimi equivalents
       pointing at a folder made under the system temp folder, and a PATH with no real agent CLI, so the run can never
       reach the owner's homes. It proves execution and titles; the assertions below are what the judge reads each case
       for.
    E. The scan. The first named case reads every .ts file under packages/*/src (not tests, not node_modules, not
       test/.runs), and fails on any string or template literal that contains "interlock sweep" or "run sweep", ignoring
       case, outside packages/cli/src/sweep.ts. It reads source with the TypeScript compiler's scanner already in the
       repository's toolchain, or if that is not available to the cli package, with a conservative text scan of quoted and
       backticked literals; the choice and why go in notes.yaml. The scan also asserts its own coverage: it reports the
       number of files read and fails when that is zero or when packages/cli/src/judge.ts and
       packages/cli/src/node/reset.ts were not among them, so an empty glob cannot pass.

  Tests and the real services. Every test uses a fixture repository made with mkdtemp under the system temp folder
  (os.tmpdir()), removed after, a controlled fake clock from @phyxiusjs/clock, and ledgers over journal folders in the
  fixture. The judge and reset cases reuse the fixture style of packages/cli/test/judge.test.ts (the "refuses a node whose
  lease has not expired" case) and packages/cli/test/node/reset.test.ts (the live-lease case): a session-started and a
  lease-taken event over a journal folder, then the real command function. Never real herdr, never a real agent CLI,
  never the real HOME or any provider folder, never the owner's ledger.

  Out of scope: the sweeper's behaviour, schedule or output; the run and resume refusal (0069); the drive's narration
  (0069); the lease_ms description; the face key; any event, schema, shape or setting; deciding for a person whether an
  agent is alive (this node never inspects a pane); renaming or removing the sweep command.

  Laws: AGENTS.md. No comments in packages/*/src; strict TypeScript with no `as`, `!`, `any` or `as unknown as`; plain
  engineering names; Biome; no em dashes.

gates:
  - id: approved
    kind: human

nodes:
  - id: refusals-never-suggest-sweep
    role: implementer
    acceptance: |
      As the read. Allowed paths: packages/cli/src/heldLease.ts (new), packages/cli/src/judge.ts,
      packages/cli/src/node/reset.ts, packages/cli/test/refusalsNeverSuggestSweep.test.ts (new),
      packages/cli/test/node/reset.test.ts and packages/cli/test/judge.test.ts (only the live-lease assertions),
      scripts/gates/sweep-wording-proven.ts (new), scripts/gates/slow-tests.ts (only if a declaration is required), and
      this graph's session folder. The runner package, the ledger package, packages/cli/src/sweep.ts, every event and
      position schema, local@v1 and docs/shapes.md are untouched.
      1. packages/cli/src/heldLease.ts exports explainLiveLease(held, then) returning exactly the two texts of the read for
         then "judge" and then "reset", with the lease expiry formatted as an ISO timestamp. judge.ts and node/reset.ts
         use it at their existing live-lease refusals; their conditions, check order, exit codes and ledger effects are
         unchanged; their private isoOf is removed if nothing else in the file uses it.
      2. No string in packages/*/src outside packages/cli/src/sweep.ts contains "interlock sweep" or "run sweep".
         The sessionDrive.ts narration and the lease_ms description are not edited by this node.
      3. packages/cli/test/refusalsNeverSuggestSweep.test.ts holds exactly these four titles:
         - "no refusal or narration suggests interlock sweep" (the source scan of decision E over packages/*/src: reads
           more than zero files, includes judge.ts and node/reset.ts, finds no literal containing "interlock sweep" or
           "run sweep" outside packages/cli/src/sweep.ts; and, through the real command paths, a live-lease refusal from
           judge and one from node reset, and the run refusal if it is present on main, contain neither "sweep" nor
           "sweeper")
         - "judge's lease refusal says who holds it and until when" (a fixture node with a session-started and a
           lease-taken event expiring at a known fake time, the fake clock before it: runInterlockJudge refuses with exit
           code 1 and exactly the judge text of the read, naming the session id and the ISO expiry, appends no event to the
           journal, and the same node with the clock past the expiry is not refused for the lease)
         - "node reset's refusal says who holds it and until when" (the same fixture through runNodeReset with --by and
           --because: exit code 1 and exactly the reset text of the read, naming the session id and the ISO expiry,
           including the sentence that a reset is possible only once the lease has ended and no agent is alive; the journal
           is unchanged; with the clock past the expiry and an outcome on the node, the reset proceeds as it does today)
         - "the sweep command itself still works when run on purpose" (a fixture with a session whose lease has expired and
           whose outcome is unresolved: runInterlockSweep returns exit code 0 and the abandoned-session message naming
           that session and the journal records the abandonment; a second run reports nothing to abandon; and main's
           dispatch of ["sweep"] reaches the same command)
      4. packages/cli/test/node/reset.test.ts:150 and the judge.test.ts live-lease assertion are updated to the new
         wording and nothing else in them changes.
      5. Proof: scripts/gates/sweep-wording-proven.ts as decision D, run under a fake-only child environment, prints
         "refusals never suggest sweep proven: 4 named cases passed".
      6. Existing tests keep passing, including sweep.test.ts unchanged. New tests are declared or baselined as the
         slow-tests-accounted gate requires.
      7. The debrief states: every message found (the five items of the read, with file and line), which two were
         changed and why only those, the exact new texts, that the sessionDrive.ts narration is owned by graph 0069 and
         whether it was still present when this node ran, that the lease_ms description and the face key were left,
         the scan's mechanism and its coverage assertion, and that nothing here decides whether an agent is alive.
      Before you file the debrief (and before any refile), end every vitest worker and child process you started and
      confirm with pgrep that none survives.
    gates:
      - id: branch-contains-main
        kind: command
        run: git merge-base --is-ancestor origin/main HEAD
      - id: sweep-wording-proven
        kind: command
        run: node scripts/gates/sweep-wording-proven.ts
        expect_output: 'refusals never suggest sweep proven: 4 named cases passed'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1[.]5 s'
