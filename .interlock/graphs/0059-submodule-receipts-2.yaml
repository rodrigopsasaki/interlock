# Re-plan of 0059-submodule-receipts for its gitlinks-hash-commit node only, written by Claude for Gilb on
# 2026-11-07: that node's attempt was cancelled at 03:41 UTC to relieve memory pressure (its agent ran 16 vitest
# workers beside 10 orphaned ones), and a cancelled outcome is terminal. Same acceptance and gates; the graph's
# resume-keeps-range node stays in 0059-submodule-receipts.
interlock: graph@v0
id: 0059-submodule-receipts-2
arc: talk-to-gilb-from-anywhere
ask: The judge hashes a submodule by the commit its gitlink records instead of reading it as a file, and a resumed session keeps the signed code of the attempt it resumes inside its debrief range, so a repository with submodules can be judged and a hand-committed attempt can be resumed.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: submodule-receipts-2026-11-06
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: talk-to-gilb-from-anywhere (.interlock/arcs.yaml). A repository on this machine whose graph 0002-doors has
  its first node, door-routes, done, signed, green by hand and debriefed, waits only on this graph, because
  Interlock's judge cannot judge any node in a repository that has a git submodule.

  The crash. `interlock judge` on a repository with a git submodule fails with EISDIR. The scope is plain
  `git ls-files` (packages/runner/src/scope.ts:6), which lists a gitlink (mode 160000, here that repository's one submodule)
  as a path; receiptId reads every scope path as a file (packages/ledger/src/receipt.ts:84, `readFile`), so the
  gitlink's directory throws, from createReceipt in judgeGates (packages/runner/src/gateJudge.ts:243). A gitlink's
  content, as git itself records it, is the commit id it points at.

  The range. In the hand-commit flow (profiles without a live-work evidence source use commits: agent), the runner's session commits the agent's code signed, and a resumed session writes a new brief commit
  after it (packages/runner/src/sessionDrive.ts:255, commitBriefIfChanged). deriveSessionStart selects the session's
  own session-started event (packages/cli/src/debrief/sessionIdentity.ts:138-142) and derives the start sha from the
  unique Git commit where the brief takes this session's identity, comparing its bytes with the local brief
  (sessionIdentity.ts:184-212). For a resumed session that transition is the new brief commit, so the signed code of
  the attempt it resumes falls before session_start_sha, outside the debrief's range, and the decisions that rest on
  it are unrooted. Seen on 2026-11-06 in a substrate repository's graph 0032-4 and in this repository's 0056
  refusals-stay-resettable.

  Dropped: an enter-submits node (herdr's prompt submit) is moot since graph 0060-headless-runtime removes herdr.

  Order. Built ahead of graph 0054, since it unblocks the waiting door-routes node. Every attempt
  opens with: run one heavy command at a time, never several in parallel or in the background; never clone the
  repository inside your worktree, use the worktree you were given.
gates:
  - id: approved
    kind: human
nodes:
  - id: gitlinks-hash-commit
    role: implementer
    depends_on: []
    acceptance: |
      The scope reads `git ls-files -s` (packages/runner/src/scope.ts:6) and keeps each entry's mode and object id
      beside its path. receiptId (packages/ledger/src/receipt.ts:79-87) hashes a mode 160000 entry (a gitlink) with
      its own framing, never by reading the path from disk. A scope of regular files only is hashed exactly as today
      (gate, then each sorted path and its bytes), so every receipt for a repository without submodules is
      byte-identical to today's (the receipt ids of existing receipts do not change). A scope that holds any gitlink
      is hashed in a framed encoding instead, unambiguous for every entry: one NUL byte, then the gate as its byte
      length (8 bytes, big-endian) and its bytes, then for each sorted entry its kind byte ("f" for a file, "g" for a
      gitlink), its path as length and bytes, and its content as length and bytes (a file's bytes, or the 40-hex
      commit id the index records for a gitlink). The leading NUL separates the two encodings because a gate id may
      not contain NUL: graph loading and gate-declaration validation now refuse a gate id with a NUL (today neither
      does, packages/face/src/document.ts:80, schemas/parts/gate-declaration.json:8), with one line naming it, and
      receiptId refuses one too; historical receipts keep reading. A submodule bump changes the recorded commit id and so the
      receipt; a submodule whose checkout on disk differs from its recorded commit does not, since the index is the
      truth the commit carries. A gitlink missing from disk, or a submodule never initialized, hashes the same way and
      never throws. The scope type names the entry kind (file or gitlink) so no caller reads a gitlink as a file.
      Tests in packages/runner/test/submoduleReceipts.test.ts on a real fixture: a temporary repository that adds a
      second temporary repository as a submodule (git -c protocol.file.allow=always submodule add, local paths only,
      no network):
      - judging a node whose scope includes the gitlink writes a receipt and does not throw;
      - committing a submodule bump changes the receipt id; changing only the submodule's working checkout does not;
      - an uninitialized submodule hashes without throwing;
      - a path that is a regular file containing a commit id, then replaced by a gitlink to that commit, yields two
        different receipt ids;
      - the adversarial pair: a regular file named "gitlink" whose bytes are a NUL, "sub", a NUL and a commit id, and
        a gitlink "sub" at that commit, under the same gate, yield different receipt ids;
      - the mixed-scope pair: scope A (regular file "gitlink" with bytes NUL "sub" NUL <oid>, and gitlink "z" at
        <zoid>) and scope B (gitlink "sub" at <oid>, and gitlink "z" at <zoid>) yield different receipt ids;
      - a gate id containing NUL is refused at graph loading, at gate-declaration validation and by receiptId, each
        with its line;
      - a repository without submodules yields the same receipt id as before the change, for a fixed fixture whose
        expected id is written in the test.
      Strict TypeScript, no type assertions, no non-null operators. No push, no merge; the human merges.
    gates:
      - id: submodule-receipts-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/submoduleReceipts.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

