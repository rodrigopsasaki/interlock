interlock: graph@v0
id: 0056-machine-provider
ask: The runner asks the machine before it starts agent work, so a configured provider can refuse a launch past the machine's limits, queue heavy commands, and set the limits environment of every agent and gate it starts.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: machine-limits-2026-11-06
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Rodrigo's Mac froze on 2026-11-06 at 15:30 UTC under concurrent agent builds started by Interlock runners and he cut
  the power. Rodrigo, 15:43 UTC: "this has to be managed via Preston settings, I don't want you working around the
  product when doing this is also the purpose of the product." Preston graph 0034-machine-limits makes the limits a
  Preston setting and provides the commands; this graph is the minimal Interlock side: one generic hook, naming no
  product. Revised after a strict cross-vendor vet (codex sol, reject), its findings on this graph all folded.

  Today the runner runs worktree setup before anything else (packages/runner/src/sessionDrive.ts:266, spawned
  directly in worktreeSetup.ts:84), backfill runs `pnpm install` itself (backfill.ts:99), the runner opens a pane and
  starts the agent through herdr's agent.start with the profile's args and no environment
  (sessionDrive.ts:292, 308-314; herdr/adapter.ts:330-340), spawns each gate without a shell (gateJudge.ts:131), and
  closes the pane when it has custody, ignoring the close's result, or leaves it open for drilldown
  (sessionDrive.ts:586-593; adapter.ts:541-543). Nothing asks the machine first.

  A pane left open counts as live work until its close is confirmed, so a session's release follows the pane, not
  the runner's exit: the provider holds the session under a stable token for the pane and reaps it when the pane's
  process is gone.

  Follow-on. Rodrigo ruled at 17:13 UTC that the product closes its own sessions; that lands as graph
  0057-own-sessions (own-sessions, then plan-reviews-are-sessions), sequenced after this graph so the machine
  provider protects launches first. Nothing is dropped.

  Out of scope: Interlock deciding any limit itself, reading memory, or knowing Preston. The machine file is
  required: without one the runner refuses agent launches and heavy commands, saying how to write it, and a
  machine that wants no provider says so explicitly with `provider: none`, which keeps today's behaviour. Landing
  this graph on Rodrigo's Mac: Gilb writes machine.yaml with `provider: none` at once (the bridge still limits
  work), then names Preston's commands when graph 0034 lands, per 0034's bridge-gone handoff.
gates:
  - id: approved
    kind: human
nodes:
  - id: machine-provider
    role: implementer
    depends_on: [refusals-stay-resettable]
    acceptance: |
      Machine file. A per-machine file, ~/.config/interlock/machine.yaml (path overridable by INTERLOCK_MACHINE for
      tests, like INTERLOCK_RUNTIMES), shape machine@v0 with a JSON schema and schema tests:
        interlock: machine@v0
        provider:
          admit: [argv...]      # {holder}, {token}, {pid}, {pane}, {workspace}, {agent}, {worktree} and {attempt}
          release: [argv...]    # {token}
          env: [argv...]        # prints a JSON object of string values
          heavy: [argv...]      # prefix for every heavy command
      or, explicitly, `provider: none`.
      An absent file refuses every launch and heavy command before anything is written, with one line ("no machine
      provider is configured; write ~/.config/interlock/machine.yaml, or `provider: none` to run without one").
      `provider: none` means today's behaviour, narrated once per launch. A provider is all or nothing: a
      provider missing any of the four keys, or malformed, refuses every launch before anything is written, naming the
      missing or bad field. The runner resolves the machine file before worktree setup.
      Order of a launch. Run env first (below); an env that fails, exits non-zero or prints anything but a JSON object
      of string values refuses the launch before setup, naming why. Then run worktree setup through heavy; open the
      pane with no agent in it; read the pane's process
      pid from the runtime adapter (herdr pane process-info), refusing the launch if no pid is available; run admit
      with the holder "<graph>/<node> (<session id>)", the token "<session id>/<pane id>" and that pid; start the
      agent only if admit exits zero. A non-zero admit refuses the launch: the runner narrates the provider's first
      output line verbatim and returns it as the exit message, closes the pane, abandons the lease with no outcome
      (refusals-stay-resettable), and starts no agent, so the same node runs again once the machine has room.
      Release. When the runner closes a pane it admitted and the close is confirmed, it runs release with the token.
      Both the close and the release are outbox effects (laws I7): intent persisted in the ledger before dispatch,
      a stable identity (pane id and session for the close, token for the release), delivery recorded, and a lost
      acknowledgement or a crash between the two recorded as uncertain and reconciled on the runner's next start
      (ask the adapter whether the pane still exists; re-send a release whose delivery is uncertain, which the
      provider treats as idempotent per token).
      Confirmation is complete or it is not: the herdr adapter's closePane (herdr/adapter.ts:541-555) returns an
      error whenever its tab inspection or the close itself fails, instead of reporting success, and the runner
      (sessionDrive.ts:587-593) reads that result instead of ignoring it. A close that fails or times out keeps the
      session held and is narrated; the
      provider reaps it when the pane's process is gone. A pane left open for drilldown is never released by the
      runner.
      Environment. The runner runs env once per attempt, before anything else. For a codex profile it appends
      `-c shell_environment_policy.set.<KEY>="<value>"` for each key, with TOML string quoting. For any other kind it
      passes the object to the pane it opens, inside the herdr adapter (laws I6): herdr 0.9.5's `tab create` takes
      `--env KEY=VALUE` for the launched process, measured 2026-11-06; measure agent.start for an environment
      parameter too and use whichever reaches the agent. If neither reaches it, refuse to launch a non-codex agent
      while env is configured, naming why (fail closed). The object is merged into the environment of every gate, worktree setup and backfill install.
      Heavy commands. When heavy is set, every gate command, worktree setup command and backfill install runs as
      heavy's argv followed by the command's argv, still without a shell (gateJudge.ts:131, worktreeSetup.ts:84,
      backfill.ts:99), including gates run by a standalone `interlock judge` (packages/cli/src/judge.ts:169-182,
      packages/runner/src/judgeWorktree.ts), which resolves the machine file the same way.
      Tests in packages/runner/test/machineProvider.test.ts with fixture provider scripts, no real provider:
      - no machine file refuses the launch with the line before writing anything; `provider: none` leaves setup,
        launch, env and gates unchanged and narrates no provider;
      - a crash after the close and before the release leaves an uncertain release that the next start re-sends
        once, and the provider sees one release per token;
      - admit runs after the pane opens and before the agent starts, with holder, token and pid; a non-zero admit
        refuses the launch with the provider's line, closes the pane, records no outcome and starts no agent, and
        a second run after the fixture provider admits succeeds;
      - no pane pid refuses the launch;
      - release runs with the token only after a confirmed close; a failed close keeps the session held;
      - env reaches a codex profile as -c flags with quoting cases (spaces, quotes), a kimi-shaped fixture agent
        reports the same values from its own environment, and a gate sees them;
      - heavy prefixes a gate, the worktree setup and the backfill install, and two runners sharing one fixture
        heavy prefix run their setup and gates one at a time;
      - a malformed machine.yaml, and one missing any of the four keys, refuses before anything is written, naming
        the field;
      - an env that fails or prints a non-object refuses before setup and admits nothing;
      - a herdr close whose tab inspection fails reports an error and the session stays held;
      - a standalone `interlock judge` runs its gates through heavy with the env (packages/cli/test/judgeProvider.test.ts).
      Strict TypeScript, no type assertions, no non-null operators. Preserve every historical artifact. No push, no
      merge; the human merges.
    gates:
      - id: provider-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/machineProvider.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: judge-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/judgeProvider.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: schema-proof
        kind: command
        run: pnpm --fail-if-no-match --filter schemas exec vitest run test/machine.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: refusals-stay-resettable
    role: implementer
    depends_on: []
    acceptance: |
      A machine that is not ready never decides a node. Since graph 0055, the runner's refuse (packages/runner/src/
      sessionDrive.ts:211-222) appends a failed outcome for every refusal on a `commits: runner` profile. A failed
      outcome is decided (packages/ledger/src/outcome.ts:66-71), so node reset refuses it and the runner asks for a new
      graph version (decidedNode.ts:9). On 2026-11-06 a launch made while herdr was not running ("herdr.sock: no
      socket found") failed preston's 0032 ceilings for good, and the graph had to be re-issued as
      0032-ceilings-per-operation-2. Graph 0055's acceptance asked for a recorded failure only on its four commit
      refusals.
      Only those four record a failed outcome, with their failure, disposition and because as 0055 specified: a path
      outside the node's declared paths, a secret-looking path, an invalid commits.yaml, and a commit or signing
      failure. Every other refusal, on any profile, abandons the lease with no outcome, as before 0055: the runtime
      or its server not attached, worktree or worktree setup, brief, pane or agent start, prompt delivery, and the
      machine provider's admit or env from this graph. Make the split a closed type over the refusal steps, so a new
      step must say which side it is on.
      Launch preflight. Before writing anything for a launch (no lease, no worktree change, no brief commit, no
      ledger event), the runner asks the runtime adapter whether its server is running: for herdr, the server
      status (`herdr status server` reporting running, or the adapter's equivalent call), never the presence of the
      socket file, which can be stale after a reboot (2026-11-06: a socket left from before a power reset made the
      runner try and fail twice). A server that is not running refuses the launch at once with one line, "herdr's
      server is not running; open herdr and run again", records nothing and exits non-zero.
      Tests in packages/runner/test/refusalOutcomes.test.ts with fixture runtimes:
      - a herdr-down refusal on a commits: runner profile records no outcome; `interlock node reset` then has
        nothing to refuse and a second `interlock run` proceeds;
      - a worktree setup refusal and an agent start refusal record no outcome, on runner and agent profiles;
      - each of the four commit refusals still records failed, as 0055's tests assert;
      - every refusal step is classified (the type check fails for an unclassified step).
      - with a stale socket file and no server, `interlock run` refuses with the preflight line and leaves the ledger,
        the worktree and its branch exactly as they were (no lease, no brief commit).
    gates:
      - id: refusal-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/refusalOutcomes.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: commit-refusals-still-fail
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/runnerCommits.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
