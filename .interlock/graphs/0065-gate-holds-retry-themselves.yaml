  - id: sessions-stop-stops
    role: implementer
    depends_on: [codex-stays-home-in-tests]
    acceptance: |
      As the read, "A third fault" and its four decisions. `interlock sessions stop <id> [--attempt] --by <who>
      --because <why>` stops the named session through the outbox: a pane session through closeMachinePane's close
      intent carrying by and because; an exec session through the new exec-stop effect, intent persisted before
      dispatch with its stable identity, delivery recorded acknowledged or uncertain, an unacknowledged intent
      re-dispatched on replay; the exec timeout goes through the same effect. The driver consumes the stop as the
      read says. New cases, each failing on today's implementation:
      - in packages/cli/test/sessionsStop.test.ts, through main's run() with a fake runtime and the real ledger:
        stop of a live pane session closes that pane once and records the stop with by and because; stop of a live
        exec session records the exec-stop intent before dispatch; unknown id, ambiguous prefix (matches named), an
        ended session, and missing --by or --because are each refused with one line, nothing closed or recorded; a
        session with a debrief phase record and a work phase record is one session, not an ambiguous prefix;
        `interlock sessions frobnicate` and `interlock sessions --bogus` are refused naming the argument, never
        answered with the list;
      - in packages/runner/test/execStop.test.ts, with a fixture driver program actually running under the exec
        runtime: a phase stop leaves the phase killed with reason "stopped by <who>" and continues as a timeout kill
        does; an attempt stop leaves "attempt stopped by <who>", no continuation, commit, debrief phase or
        judgement follows, the node is held at its lease generation, and renewal stops; a stop recorded just before
        the program exits 0 on its own still reads killed; the exec timeout writes the same exec-stop intent;
        replay of an unacknowledged intent dispatches once more and records the delivery.
      Kept cases: `interlock sessions`, `--live`, `--json` and `interlock sessions read` print as today. No real
      herdr, codex or agent CLI.
    gates:
      - id: sessions-stop-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/sessionsStop.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: exec-stop-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execStop.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'

  - id: sessions-live-all
    role: implementer
    depends_on: [sessions-stop-stops]
    acceptance: |
      As the read, "A fourth" and its five decisions. `interlock sessions --live --all [--json]` lists every live
      agent session on this machine from any repository and any orchestrator: every agent the Runtime seam's new
      enumeration returns (the herdr adapter over agent.list, never parsing a screen), and every live exec session
      in every run root the machine's repository index names plus the caller's own. Each row names its repository,
      graph, node, work kind, transport, runtime, pid where known and liveness; a pane interlock did not start is
      listed with null repository, graph, node and work kind, never dropped. The plain output ends with one line
      "live sessions: N" (N counts live and unknown rows), preceded by one line per unreadable source or index
      entry, and --json is sessions@v1 with count and each source's state. New cases, each failing on today's
      implementation, with the fake herdr socket server and two temp repositories registered in a temp state
      directory's index:
      - in packages/cli/test/sessionsLiveAll.test.ts, through main's run(): sessions in both repos and a pane from
        neither are all listed with the right count; an exec record in state running whose anchor pid is dead, or
        whose pid was reused by a later process, is not live; a record whose liveness cannot be read is listed as
        unknown and counted; the same session reported by herdr and by its exec record counts once; the same session
        id in two repositories is two rows; a session's work and debrief phases are one row; an index entry whose
        root is gone prints one line and is not counted; herdr unavailable prints one line and marks the count
        partial; --all --json validates against sessions@v1;
      - in packages/runner/test/herdr/listAgents.test.ts: the adapter's enumeration returns tokened and untokened
        agents from the fake socket server and refuses with a typed refusal when the socket is absent;
      - a launch registers its repository in the index once, however many times it launches;
      - `interlock sessions --live --json` without --all validates against sessions@v0 (rows carry no `interlock`
        key).
      Kept cases: without --all the caller's repository alone is listed with today's plain output. Also:
      schemas/sessions@v1.json with packages/schemas/test/sessionsV1.test.ts and docs/shapes.md regenerated. No real
      herdr, codex or agent CLI, and no test reads or writes the owner's interlock state directory.
    gates:
      - id: sessions-live-all-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/sessionsLiveAll.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: list-agents-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/herdr/listAgents.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: sessions-schema-tests
        kind: command
        run: pnpm --fail-if-no-match --filter schemas exec vitest run test/sessionsV1.test.ts test/reference.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: shapes-fresh
        kind: command
        run: pnpm interlock schema reference --check
        expect_output: ': fresh[.]'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'

  - id: setup-never-holds
    role: implementer
    depends_on: [codex-stays-home-in-tests]
    acceptance: |
      Found 2026-11-12: a worktree setup command, `pnpm install --frozen-lockfile` in the pane-startup-whole worktree
      (interlock run 0064, pid 27662), sat at 0% CPU for over 19 minutes inside the heavy wrapper, holding the
      machine's heavy lock (~/.cache/interlock-cap/heavy.lock) and blocking an urgent node's setup behind it. pnpm was
      almost certainly asking whether to remove and reinstall node_modules, a question the runner cannot answer:
      spawnSetupCommand (packages/runner/src/worktreeSetup.ts:87-111) spawns through spawnOwned with the parent's
      stdin and no timeout, and the gate spawns (spawnGateCommand, packages/runner/src/gateJudge.ts:147-184) have no
      timeout either. Nothing may hold the machine's lock waiting for a person.
      - Every worktree setup command and every command gate runs non-interactively: stdin is closed (/dev/null), and
        the environment carries CI=1 and npm_config_confirm_modules_purge=false (pnpm's purge question answered no
        and failing instead of waiting), added by the runner, not by the owner's config.
      - Every setup command and command gate has a hold timeout (a named setting with a stated default, setup 20
        minutes, gates the existing run timeout or 60 minutes if none), after which the runner ends the whole process
        group (TERM, a bounded grace, KILL), so the heavy wrapper exits and the lock is released; the setup fails, or
        the gate is blocked, with one plain line naming the command, the timeout and the last lines of its output, and
        the retained log. A timeout is never classified busy (busy-gates-wait's retry is only for commands that never
        started).
      - Tests in packages/runner/test/setupNeverHolds.test.ts with a fake command (no real pnpm, no real lock), each
        failing on main: a command that waits on stdin gets EOF and exits instead of hanging; CI=1 and
        npm_config_confirm_modules_purge=false reach the command's environment; a command that sleeps past the
        injected timeout is ended with its whole group (a grandchild too) and the setup fails with the plain line; a
        fake heavy prefix that holds a lock file is released when its child is ended; a gate past its timeout is
        blocked, not busy. The owner's machine.yaml and the out-of-repo wrapper are not written.
      Before you file the debrief (and before any refile), end every vitest worker and child process you started
      and confirm with pgrep that none survives.
    gates:
      - id: setup-never-holds-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/setupNeverHolds.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'

  - id: codex-never-real-in-tests
    role: implementer
    depends_on: [codex-stays-home-in-tests]
    acceptance: |
      Found 2026-11-13 while landing codex-stays-home-in-tests (main 6f556e6): the test guard still runs the real
      codex binary. packages/runner/test/support/codexGuard.ts resolves the first codex past the guard on PATH
      (realCodex, :445-463) and spawns it (start, :486-500) for `mcp list` / `mcp list --json` (:550-558) and for
      `exec` with a loopback base_url (:560-590). codexHomeOutsideWorktree.test.ts:335-376 ("keeps both checkouts
      clean after a real Codex launch through the overlay") runs `codex mcp list --json` through it, so every suite
      run starts the owner's installed codex (codex 0.162.1 through the mise shim) with a fixture home and fake auth,
      outside his signed-in profile. The rule (coordinator, from his 2026-11-11 words "why is openai opening windows,
      please stop"): a real codex runs only under his signed-in profiles; no test starts one. No opt-in, no
      environment switch that turns the pass-through back on.
      - The guard never execs a real codex binary for anything. realCodex and the spawn of a resolved binary are
        deleted. `mcp list` and `mcp list --json` are answered by a fixture codex in test/support that reads the
        fixture CODEX_HOME's config.toml (the overlay's, as the real binary would) and prints the configured
        servers in the same JSON shape the tests parse. Every `exec` form the guard admits today is answered by a
        fixture as well (name each test that relied on a real exec and what its fixture now proves); every other
        form is refused as today.
      - A run-wide check fails the suite if any codex process whose executable is outside test/support starts
        during the run: the guard records every invocation it would have passed through as a refusal in its
        registry, and the existing afterEach/exit accounting (codexGuardSetup.ts) fails the test that caused it;
        plus a process-table check at suite end that no process named codex with an executable outside
        test/support appeared (sampled with the run's own spawn accounting, not a timing window).
      - Tests in packages/runner/test/codexNeverReal.test.ts, each failing on main 6f556e6 for its intended
        assertion: a guard invocation of `mcp list --json` returns the fixture config's servers and starts no
        process outside test/support; with a stub "real codex" placed first past the guard on PATH (a script that
        records it ran), no test path reaches it, for `mcp list`, `mcp list --json` and a loopback `exec`; a
        deliberate pass-through attempt is recorded and fails its test.
      - codexHomeOutsideWorktree.test.ts keeps asserting that both checkouts stay clean after the launch, now
        through the fixture codex, and its title no longer says "real".
      - scripts/gates/codex-never-real.ts greps packages/*/test and the guard: it fails if the guard references
        PATH resolution of codex past itself, spawns or execs any binary named codex outside test/support, or if any
        test file calls a codex binary by an absolute path outside test/support; it prints "codex never real: no
        path from the guard to a real binary".
      Before you file the debrief (and before any refile), end every vitest worker and child process you started
      and confirm with pgrep that none survives; never run a real codex yourself outside the owner's signed-in
      profile.
    gates:
      - id: codex-never-real-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/codexNeverReal.test.ts test/codexHomeOutsideWorktree.test.ts test/codexGuard.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: codex-never-real-grep
        kind: command
        run: node scripts/gates/codex-never-real.ts
        expect_output: 'codex never real: no path from the guard to a real binary'
      - id: runner-suite
        kind: command
        run: pnpm --fail-if-no-match --filter runner run test
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'

  - id: slow-tests-load-robust
    role: implementer
    depends_on: [codex-stays-home-in-tests]
    acceptance: |
      Found 2026-11-13 judging codex-never-real-in-tests: slow-tests-accounted (scripts/gates/slow-tests.ts) judges
      each test by its wall-clock duration from the vitest report (thresholdMs 1_500 at :8, the half-budget rule at
      :337), so on a machine running agent sessions it fails on tests that are fast when idle. The judge's run (gate
      artifact 3af60a07, session 7ef786c2) flagged only other nodes' tests: absorbOutbox.test.ts (two cases, about
      1.5 to 1.7 s), backfill.test.ts (two cases over half of 10 s), execWithoutHerdr.test.ts (2.2 s) and
      machineProvider.test.ts (two cases, about 1.8 to 1.9 s). Every node with this gate is held until the machine is
      idle.
      - The gate judges each test by its own CPU time, not wall time: the vitest run records per-test CPU (for
        example process.cpuUsage() deltas taken in a setup file's beforeEach and afterEach, written beside the JSON
        report), and the undeclared threshold and the half-budget rule apply to CPU time. Wall time is still reported
        for information. Child processes a test starts count toward its CPU through their own reported usage where
        the test already collects it; where it cannot, the test is declared a slow integration as today.
      - The four tests above get declarations that match what they do (slow integrations with a budget and a reason
        where they start processes or wait on real timers), or are made fast; none is silenced by raising the global
        threshold.
      - Tests in packages/runner/test/slowTestsLoadRobust.test.ts, each failing on main ab731fa for its intended
        assertion: a test that sleeps 2 s without CPU passes the gate while a test that burns 2 s of CPU fails it
        undeclared; a declared test's half-budget rule uses CPU; the gate's output names CPU and wall time for each
        flagged test; the gate passes on the current suite while a CPU-bound sibling process loads the machine.
      Before you file the debrief (and before any refile), end every vitest worker and child process you started and
      confirm with pgrep that none survives; never run a real codex.
    gates:
      - id: slow-tests-load-robust-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/slowTestsLoadRobust.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'
