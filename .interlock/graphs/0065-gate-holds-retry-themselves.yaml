interlock: graph@v0
id: 0065-gate-holds-retry-themselves
arc: a-busy-machine-is-waited-for
ask: A command gate the machine refused to start (busy, locked, or missing a process it needs) is retried by the runner itself, with backoff and a bounded count, instead of parking the node for a person; a gate that ran and failed still fails; and no test may let a real codex reach a non-loopback provider, start an app-server or login, or outlive its test.
derivation:
  kind: model
  model: gilb
  prompt: gate-holds-retry-themselves-2026-11-11
authorization:
  granted_by: Rodrigo Sasaki
  mandate: go-on-everything-2026-11-11  # "And yes, the \"go\" means a go on everything", 12:28 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: a-busy-machine-is-waited-for (.interlock/arcs.yaml). Rodrigo, 2026-11-11 12:28 UTC
  (cmsg_01BN1q6CYuBjcZAFT6C2pgFd35LkBSn6VsAMLGrYVSZjNq): "And yes, the \"go\" means a go on everything", which
  approved the held Interlock item: when a node's command gate is held for a transient reason (load, lock, a missing
  process), the runner retries the gate itself with backoff and a bounded count instead of parking the node for a
  person. His earlier words, 2026-11-11 01:04 UTC: "why is openai opening windows, please stop". The rule read from
  them (coordinator, 12:45 UTC): nothing unauthenticated talks to OpenAI, starts a codex app-server or login, or
  opens windows. The two existing real-codex tests stay in the standing test gate under a guard.

  What is true today, from source (main 2b7adb3). A command gate either exits 0 and matches expect_output, or it is
  blocked: `satisfied = exitCode === 0 && (outputMatched ?? true)` (packages/runner/src/gateJudge.ts:425-427), and
  any gate not satisfied at the end holds the node with `heldOn.gateFailure(missing, "hold")` (gateJudge.ts:560-568)
  and a display-only 24 h expiry (judgeWorktree.ts:18); nothing re-judges. There is no transient class: load is
  invisible to interlock, the machine provider's heavy prefix (machine.yaml `heavy`, parsed in
  packages/runner/src/machineProvider.ts:43-73) blocks on its lock with no timeout, and a spawn error is exit -1
  (gateJudge.ts:171-175). The `retry` disposition (packages/ledger/src/disposition.ts:1) is never produced. Gates run
  from four call sites: interlock judge (packages/cli/src/judge.ts:202-222), after an exec debrief
  (packages/runner/src/sessionDrive.ts:783), after a pane session (sessionDrive.ts:1236) and backfill
  (packages/runner/src/backfill.ts:184), all through judgeGates. judgeGates already takes an injectable clock
  (@phyxiusjs/clock, with sleep) and commandRunner (gateJudge.ts:95, :125-129).

  Two tests on main start the real codex binary inside a temporary CODEX_HOME, run by the standing `pnpm test` gate:
  packages/runner/test/realCodexMarkerOverflow.test.ts (`codex mcp list --json`, no model call) and
  packages/runner/test/lineFitsRealCodex.test.ts (`codex exec` against a loopback fixture provider it starts). They
  are allowed. Nothing today proves they stay that way.

  Decisions.
  - Busy means the gate command never started. Only the machine provider can say so: an additive machine@v1 field
    `busy` declares an exit code (64-113) and a retry policy (attempts 1-10, first and max backoff in ms). The runner
    gives each gate spawn a fresh, runner-owned busy-report path in INTERLOCK_BUSY_REPORT. A prefix that declines to
    start the command writes one line of reason there and exits with the declared code, without exec. A gate is busy
    only when both hold: the declared exit code AND a reason line in that spawn's own report file. Anything else is
    the gate's own result and is judged exactly as today. The node-engine probe, which also runs through the heavy
    prefix (packages/runner/src/nodeEngine.ts:160-163), follows the same rule.
  - The retry is not a node retry. The seam "the retry budget belongs to the node and is conserved; nothing inside a
    node mints its own retries" (AGENTS.md) governs attempts at the node's work. A gate the machine refused to start
    measured nothing, so re-asking the machine spends no attempt; the bound is the machine's policy, not the node's
    budget. This is written into docs/design/0001-interlock.md beside that seam, citing the seam, so the reading is
    found where the rule is.
  - Every busy refusal is a fact: a receipt per refused attempt (derivation gate, proof naming busy, the reason line
    and the attempt number, no output hash) and a narration line; the gate stays pending between attempts and the
    runner sleeps on the clock with doubling backoff capped at max. When attempts run out the gate is blocked
    ("machine busy after N attempts: <last reason>") and the node holds with disposition "retry", so a person and the
    face can tell a busy hold from a failing one. No new event kind; the event schema is unchanged.
  - A machine.yaml without `busy` behaves exactly as today. machine@v0 files stay valid.
  - This graph never writes the owner's machine.yaml or the out-of-repo heavy wrapper. It ships the contract, a
    reference prefix in the repo (scripts/machine/busy-prefix.ts: declines on a load ceiling, on a lock it cannot
    take within a bound, and on a named process that is not running) and tests. Pointing the owner's machine at it
    is a separate, owner-visible step reported after landing.
  - The codex guard lives in the runner package's test setup: every test that spawns `codex` goes through a guard
    on PATH that refuses `app-server`, `login` and `logout` outright, refuses any model-calling subcommand unless the
    effective provider for that CODEX_HOME and profile resolves to a loopback base_url (127.0.0.1, ::1, localhost),
    records every pid it starts, and fails the test in afterEach if any recorded process or its group is still
    alive. A refusal fails the test with the reason; the guard never reaches the network.

  Laws: AGENTS.md (artifacts are the public API, additive and versioned; invariants; I9 conventions never gate).
  No test starts a real codex outside the guard, a codex app-server or login, or uses the owner's CODEX_HOME,
  runtimes.yaml or machine.yaml. Types: no `as` except `as const`, no `!`, no `as unknown as`.

  Order: the two nodes are independent and touch different files; they land together. New tests are declared or
  baselined as 0063's slow-tests-accounted gate requires.

gates:
  - id: approved
    kind: human

nodes:
  - id: codex-stays-home-in-tests
    role: implementer
    acceptance: |
      As the read, "The codex guard". In packages/runner/test/codexGuard.test.ts, through the guard and a fake codex
      binary the test writes (never the real one), each failing on today's implementation:
      - a fake `codex app-server`, `codex login` and `codex logout` are refused before the fake starts, and the
        refusal fails the calling test with the subcommand named;
      - `codex exec` with a CODEX_HOME whose provider is the default (no base_url) or a non-loopback base_url is
        refused; the same with a 127.0.0.1, ::1 or localhost base_url is let through; a profile overlay that
        overrides the provider is resolved, not the base config only;
      - `codex mcp list` with no model call is let through;
      - a fake codex that leaves a detached child alive fails the test in afterEach, naming the pid, and the child is
        reaped;
      - realCodexMarkerOverflow.test.ts and lineFitsRealCodex.test.ts run unchanged in assertions and pass through
        the guard (their spawns are recorded and reaped).
    gates:
      - id: codex-guard-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/codexGuard.test.ts test/realCodexMarkerOverflow.test.ts test/lineFitsRealCodex.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'

  - id: busy-gates-wait
    role: implementer
    acceptance: |
      As the read, "Busy means the gate command never started" through "A machine.yaml without busy". Tests in
      packages/runner/test/busyGatesWait.test.ts drive judgeGates and judgeWorktree with a controlled clock and a
      fake prefix the test writes, each failing on today's implementation:
      - bounded: a prefix busy on every attempt is asked exactly `attempts` times, the sleeps follow the doubling
        backoff capped at max (asserted from the clock), one receipt per refused attempt is written, and the node
        holds with disposition "retry" and because naming the attempts and the last reason;
      - recovers: busy twice then started and passing clears the node, with the two busy receipts kept;
      - a real failure still fails: a gate that started and exits nonzero, a gate that exits with the busy code but
        wrote no reason line, a reason line without the busy code, and an expect_output mismatch are each judged once,
        never retried, and hold with disposition "hold" as today;
      - nothing retries a gate that started: a gate command that starts a fake codex and then exits with the busy
        code is not retried, and the fake's start count is exactly 1; a busy report written by the gate command
        itself (not the prefix) does not make it busy;
      - the node-engine probe declined by the prefix is retried under the same policy;
      - without `busy` in machine.yaml, behaviour and events are byte-identical to today on the existing
        gateJudge.test.ts cases; machine@v0 files still parse; machine@v1 with an exit code or attempts out of range is
        refused at parse with the field named.
      Also: schemas/machine@v1.json (additive over v0) with its schema test; the reference
      scripts/machine/busy-prefix.ts with tests for its three refusals (load ceiling via an injected load reader, lock
      not taken within its bound, named process absent) and for exec without INTERLOCK_BUSY_REPORT in the child's
      environment; the docs/design/0001-interlock.md paragraph beside the retry-budget seam.
    gates:
      - id: busy-gates-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/busyGatesWait.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1\.5 s'
