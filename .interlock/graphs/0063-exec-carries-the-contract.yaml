interlock: graph@v0
id: 0063-exec-carries-the-contract
arc: agents-set-up-as-one
ask: A headless exec profile carries the whole agent contract Preston's setup writes, can be probed like any other profile, and launches without herdr, so the agents Preston sets up as one actually run.
derivation:
  kind: model
  model: gilb
  prompt: exec-carries-the-contract-2026-11-09
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: agents-set-up-as-one (.interlock/arcs.yaml, shared with the substrate's graph 0042-agents-as-one). Rodrigo,
  2026-11-07 16:05 UTC (cmsg_01BN1q6CYuBjcZAFT6C2pgFd4iBikfQH3F2s2VqUMcFUzN): "this should all be part of Preston's
  setup by the way. Requesting access for all its agents as one thing, even the interface we use to communicate with
  them should be shared in a way. This needs to happen by design and by construction". On herdr (arc
  herdr-only-for-visuals), 2026-11-06 21:54 UTC (cmsg_01BN1q6CYuBjcZAFT6C2pgFd59MV43pQgzhM6JeEnLuYQT): "I thought we
  needed it to manage sessions, but if we don't, then let's scrap it. I want Preston's install to be as lean as
  possible. We already have a UI, a server, an MCP and a postgres".

  What went wrong. Graph 0060 gave Interlock a headless runtime (kind exec), and the substrate's graph 0042 made
  Preston's setup write every agent's profile. On 2026-11-09, rendering a fixture config with Preston's render and
  reading it with this repository at 447b4af showed that Preston wrote a shape Interlock could not read (fixed on the
  substrate's side by its node render-emits-exec), and that vet found five things only Interlock can fix, because
  the exec path does less than the pane path for the same profile:
  - probing: `interlock runtime probe` prepares every profile through prepareLaunch (packages/cli/src/runtime/probe.ts
    :156), which takes an exec profile's program to be "exec"; execProbeInvocation (packages/runner/src/runtimeProbe.ts
    :77) then requires the probe template, minus `{command}`, to equal that program plus the profile's whole args,
    which for an exec profile includes the headless command and "{prompt}". No useful exec probe passes, so Preston's
    setup cannot prove an exec profile's access (graph 0062's probe, the one setup runs).
  - herdr: driveSession creates the herdr launch runtime and checks its server (packages/runner/src/sessionDrive.ts
    :300-317) before it reaches the exec branch (:542), so an exec launch is refused when herdr is not installed or
    not running, though it never uses a pane.
  - writable roots: the exec branch builds its argv with execRuntimeArgv (packages/runner/src/runtimeCatalogue.ts:457)
    and never expands the profile's writable_root_args for the attempt's worktree, which prepareLaunch does for panes
    (sessionDrive.ts:123-). A profile whose sandbox scopes writes to named roots cannot write its own worktree headless.
  - MCP policy: mcp_disable_args must hold exactly one whole "{name}" element (runtimeCatalogue.ts:281) and disables
    only servers declared in mcp_servers and outside mcp_allow (:467), so a kind whose CLI disables servers with one
    flag that takes no name cannot express "only these servers", and servers configured outside the profile are never
    accounted for.
  - environment passthrough: an exec launch inherits the runner's environment plus the machine provider's
    (sessionDrive.ts:583); a profile cannot name the variables that must reach the agent's own shells, which the pane
    path's adapters carry as arguments.
  The idle timeout is out of scope: exec uses the repository-wide run timeout, and Preston names that limit itself.

  Every test in this graph runs with temp homes (mkdtemp under the system temp folder; HOME, XDG_CONFIG_HOME and
  TMPDIR pointed there), fixture agent programs written by the test, fixture machine-provider scripts, and a fresh
  fixture repository; no real agent CLI runs, no herdr is started or stopped, and no file of the owner's is read or
  written. A test asserts every path it hands the runner is under its temp directory.

gates:
  - id: approved
    kind: human

nodes:
  - id: exec-never-needs-herdr
    role: implementer
    acceptance: |
      An exec launch, both its work and its debrief phases, and an exec review where one exists, never creates the herdr
      launch runtime, never checks a herdr server and never looks herdr up on PATH; pane launches are unchanged and still
      refuse when herdr is not ready, with today's message.
      - driveSession decides pane or exec from the resolved runtime before any herdr preflight, and only the pane path
        creates and checks the herdr runtime; the exec path's session records, lease, admission, bind, release and
        transcript are unchanged.
      - `interlock sessions --json` and `interlock judge --session` work for an exec session with herdr absent.
      Tests, packages/runner/test/execWithoutHerdr.test.ts and packages/cli/test/execWithoutHerdr.test.ts: in a fixture
      repository with an approved fixture graph, an exec profile whose program is a fixture script, a temp HOME with no
      herdr socket, and PATH rebuilt so that no directory on it contains a `herdr` executable (the test asserts this
      before launching), `interlock run <graph> <node> --runtime <exec profile>` succeeds: the fixture script records
      that both phases ran, the session ends with a successful exit, and `interlock sessions --json` listed it while it
      ran; the same setup with a pane profile is refused with the herdr-not-ready message; an injected herdr runtime
      that fails on creation or check is never called for an exec launch.
    gates:
      - id: exec-herdr-runner-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execWithoutHerdr.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: exec-herdr-cli-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/execWithoutHerdr.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: exec-profiles-can-be-probed
    role: implementer
    depends_on: [exec-never-needs-herdr]
    acceptance: |
      `interlock runtime probe <exec profile>` runs graph 0062's checks through the exec profile's own program and access
      arguments and reports passed, failed or unavailable as it does for pane profiles; an exec profile is never
      reported passed by a probe that ran outside its program.
      - preparing a probe for an exec profile takes the program and access arguments from the profile's args with the
        headless prompt parts removed: the whole "{prompt}" element, or nothing when the profile reads `prompt: stdin`;
        execProbeInvocation's equivalence compares the probe template against that, so a template written as the
        profile's program and access arguments around one whole `{command}` passes, and one that drops or changes an
        access argument is refused with today's difference message.
      - the probe of an exec profile gets the same writable-root expansion, machine environment and provider admission
        as an exec attempt does after exec-carries-roots-mcp-and-env (until then, as the exec attempt does today), from
        one shared preparation, not a copy.
      - runtimes@v2 is unchanged; existing pane profiles and their probes read and behave exactly as before.
      Tests, packages/runner/test/runtimeProbe.test.ts and packages/cli/test/runtimeProbe.test.ts (extended): an exec
      profile with "{prompt}" and one with `prompt: stdin`, each with a fixture program that records its argv and runs
      the check command, pass the probe; a template missing an access argument is refused naming it; a fixture program
      that fails the shared-memory check reports failed; existing pane-profile probe tests pass unchanged.
    gates:
      - id: exec-probe-runner-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/runtimeProbe.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: exec-probe-cli-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/runtimeProbe.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: exec-carries-roots-mcp-and-env
    role: implementer
    depends_on: [exec-profiles-can-be-probed]
    acceptance: |
      An exec launch carries the same profile contract a pane launch does: its writable roots, its MCP policy and the
      environment its profile names, so a profile behaves the same whichever path runs it.
      - writable roots: the exec argv includes the profile's writable_root_args expanded for the attempt's worktree,
        through the same expansion prepareLaunch uses, placed where the kind's headless command accepts them.
      - MCP policy: a profile can say "only these servers" for a CLI that disables servers with a single flag taking
        no name: runtimes@v2 gains an optional form for that (a published, additive schema change in
        schemas/runtimes@v2.json and docs/shapes.md, every existing catalogue still reading), applied on the exec path
        when the profile's allowed servers are fewer than all; the existing "{name}" form keeps its meaning.
      - environment passthrough: a profile may name environment variables (an optional additive key) that reach the
        exec agent's process and the shells it starts, from the runner's environment, alongside the machine provider's;
        a name not set in the runner's environment is simply absent, never invented.
      - review launches on the exec path get the same three, with read_only_args as today.
      - every existing catalogue, pane launch and exec launch without the new keys is byte-for-byte unchanged.
      Tests, packages/runner/test/execContract.test.ts: with fixture exec profiles whose program records its argv and
      environment, a work launch's argv carries the expanded writable roots for its worktree path, a single-flag MCP
      policy appears when allowed servers are fewer than declared and not otherwise, a named variable set in the
      runner's environment reaches the program and a shell the program starts (the fixture starts one through the
      profile's own shell-forwarding path), and a catalogue without the new keys produces exactly
      today's argv; schema tests validate old and new catalogues.
    gates:
      - id: exec-contract-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execContract.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
