interlock: graph@v0
id: 0063-exec-carries-the-contract
arc: agents-set-up-as-one
ask: A headless exec profile carries the whole agent contract the substrate's setup writes, can be probed like any other profile, and launches without herdr, so the agents the substrate sets up as one actually run.
derivation:
  kind: model
  model: gilb
  prompt: exec-carries-the-contract-2026-11-09
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  Arc: agents-set-up-as-one (.interlock/arcs.yaml, shared with the substrate's graph 0042-agents-as-one). Rodrigo,
  2026-11-07 16:05 UTC (cmsg_01BN1q6CYuBjcZAFT6C2pgFd4iBikfQH3F2s2VqUMcFUzN): "this should all be part of Preston's
  setup by the way. Requesting access for all its agents as one thing, even the interface we use to communicate with
  them should be shared in a way. This needs to happen by design and by construction". On herdr (arc
  herdr-only-for-visuals), 2026-11-06 21:54 UTC (cmsg_01BN1q6CYuBjcZAFT6C2pgFd59MV43pQgzhM6JeEnLuYQT): "I thought we
  needed it to manage sessions, but if we don't, then let's scrap it. I want Preston's install to be as lean as
  possible. We already have a UI, a server, an MCP and a postgres".

  What went wrong. Graph 0060 gave Interlock a headless runtime (kind exec), and the substrate's graph 0042 made the
  substrate's setup write every agent's profile. On 2026-11-09, reading the substrate's rendered profiles with this
  repository at 447b4af showed a shape Interlock could not read (fixed on the substrate's side), and that work's vet
  found five things only Interlock can fix:
  - probing: `interlock runtime probe` prepares every profile through prepareLaunch (packages/cli/src/runtime/probe.ts
    :156), which takes an exec profile's program to be "exec"; execProbeInvocation (packages/runner/src/runtimeProbe.ts
    :77) then requires the probe template, minus `{command}`, to equal that program plus the profile's whole args,
    which for an exec profile includes the headless command and "{prompt}". No useful exec probe passes, so the
    substrate's setup cannot prove an exec profile's access (graph 0062's probe, the one setup runs). Worse, the
    checks are only labels: the probe runs `interlock-probe-<check>` (runtimeProbe.ts:31) and counts any exit zero as
    passed (:120); no implementation of those commands exists, so a probe proves dispatch, not access.
  - herdr: driveSession creates the herdr launch runtime and checks its server socket (packages/runner/src/
    sessionDrive.ts:300-317, herdr/adapter.ts:313) before it reaches the exec branch (:542), so an exec launch is
    refused when herdr is not running, though it never uses a pane; and the CLI's machine recovery runs before runtime
    selection and can create the herdr runtime for pending pane-era intents (packages/cli/src/run.ts:171,
    machineOutbox.ts:306). Separately, an argv-delivered exec debrief reuses the opening prompt's argv, so only stdin
    delivery receives the debrief prompt (sessionDrive.ts:552, :653).
  - writable roots: the exec branch builds its argv with execRuntimeArgv (packages/runner/src/runtimeCatalogue.ts:457)
    and never expands the profile's writable_root_args, which prepareLaunch does for panes (sessionDrive.ts:129): the
    common and per-worktree git directories, so a sandboxed exec agent cannot commit.
  - MCP policy: mcp_disable_args must hold exactly one whole "{name}" element (runtimeCatalogue.ts:281) and disables
    only declared servers outside mcp_allow (:467), so a CLI that disables servers with one nameless flag cannot say
    "only these servers", and servers configured outside the profile (ambient) are never excluded.
  - environment passthrough: an exec process inherits the runner's environment plus the machine provider's
    (execRuntime.ts:583), but an agent CLI may filter the environment of the shells it starts; a profile cannot name
    variables to keep there without a product-specific branch (sessionDrive.ts:560), which the wall forbids.
  The idle timeout is out of scope: exec uses the repository-wide run timeout, and the substrate names that limit itself.

  Every test in this graph runs with temp homes (mkdtemp under the system temp folder; HOME, XDG_CONFIG_HOME, state
  and TMPDIR pointed there), an explicit child environment carrying no inherited INTERLOCK_*, GIT_* or agent-home
  variables, fixture agent programs written by the test, fixture machine-provider scripts that record env, admit,
  bind and release, a fixture git identity with no hooks or signing, and a fresh fixture repository (committed graph
  on main, config, local.yaml with substrate address none, brief, current-content approval); no real agent CLI runs,
  no herdr is started or stopped, and no file of the owner's is read or written. A test asserts every path it hands
  the runner is under its temp directory. A run passes a test only when its phase records are done with exit zero
  and its receipts are the expected ones; a runner exit of zero alone proves nothing (execRuntime.ts:1222,
  sessionDrive.ts:779). New behaviour is tested in new files, so no gate passes on today's code.

gates:
  - id: approved
    kind: human

nodes:
  - id: exec-never-needs-herdr
    role: implementer
    acceptance: |
      An exec launch, both its work and its debrief phases, never creates the herdr launch runtime, never connects to a
      herdr socket and never looks herdr up on PATH; pane launches are unchanged and still refuse when herdr is not ready,
      with today's message.
      - driveSession decides pane or exec from the resolved runtime before any herdr preflight; only the pane path
        creates and checks the herdr runtime.
      - machine recovery at run start: pending pane-era intents stay recorded exactly as they are (never resolved,
        dropped or guessed delivered, I7) and are reported as unresolved; their recovery runs only when a pane runtime is
        selected, so an exec launch proceeds without herdr.
      - each exec phase receives its own prompt in both delivery forms: with "{prompt}" the debrief phase's argv carries
        the debrief prompt, with `prompt: stdin` its stdin does.
      - `interlock sessions --json` and `interlock judge --session` stay herdr-free (regression checks).
      Out of scope: session steering, position and graph status still read herdr (say.ts:69, position.ts:196,
      herdrStatus.ts:43); there is no exec review launcher today.
      Tests, packages/runner/test/execWithoutHerdr.test.ts and packages/cli/test/execWithoutHerdr.test.ts, with PATH
      rebuilt so that no directory on it holds a `herdr` executable and no herdr socket under the temp HOME (both
      asserted before launching), and node, git, a shell, ps and a fixture `mise` passthrough available:
      `interlock run <graph> <node> --runtime <exec profile>` succeeds for a "{prompt}" profile and for a stdin
      profile; the fixture program records each phase's prompt and the two differ as the work and debrief prompts;
      after a synchronization barrier `interlock sessions --json` lists the running session by profile name; the work
      and debrief phase records end done with exit zero; with a pending pane-era intent in the ledger the exec launch
      still succeeds and the intent remains recorded and reported unresolved; a held, unleased exec session is judged
      with `interlock judge --session`; the same setup with a pane profile is refused with the herdr-not-ready message;
      an injected herdr runtime that fails on creation or check is never called for an exec launch.
    gates:
      - id: exec-herdr-runner-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execWithoutHerdr.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: exec-herdr-cli-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/execWithoutHerdr.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: exec-carries-roots-mcp-and-env
    role: implementer
    depends_on: [exec-never-needs-herdr]
    acceptance: |
      An exec launch carries the profile's writable roots, an exclusive MCP policy and named environment passthrough,
      through one shared preparation that the probe (next node) also uses. Every new behaviour is opt-in by a key or
      placeholder the profile writes; a catalogue that writes none of them launches exactly today's argv.
      - writable roots: an exec profile's args may hold one whole "{writable_roots}" element; there the runner places
        the profile's writable_root_args expanded through prepareLaunch's expansion (the common git directory first, the
        per-worktree git directory second, each as one argument). A profile without the element launches as today even
        when it declares writable_root_args.
      - MCP: an optional key `mcp_exclusive: { disable_all: [argv], allow_each: [argv with one whole "{name}"] }`. When
        present, disable_all is emitted once and allow_each once per server the phase allows (mcp_allow, or all of
        mcp_servers), so ambient servers are excluded; with no allowed servers only disable_all is emitted. The existing
        "{name}" mcp_disable_args form keeps its meaning and may not be combined with mcp_exclusive (refused at load).
      - environment: an optional key `environment_passthrough: [names]` (distinct valid variable names) and an optional
        `environment_forward_args: [argv with one whole "{name}"]`, emitted once per listed name, names only, never
        values (values reach the process by inheritance). A listed name unset in the runner's environment is not
        forwarded and not invented; machine-provider values keep precedence; a name colliding with an interlock marker
        variable is refused at load.
      - runtimes@v2 gains these optional keys additively: loader, schemas/runtimes@v2.json, docs/shapes.md and old and
        new catalogue tests; every existing catalogue still reads.
      - no product name appears outside adapters; no basename branch is added.
      Tests, packages/runner/test/execContract.test.ts (new), with fixture exec profiles whose program records argv,
      argument positions and environment: the expanded roots appear at the "{writable_roots}" position for the
      attempt's worktree; an exclusive MCP policy emits disable_all once and allow_each per allowed server for empty,
      full and subset allow lists, with an ambient server configured in the fixture never allowed; listed variables set
      in the runner's environment are emitted through environment_forward_args and reach a shell the fixture program
      starts with a filtered environment that keeps only forwarded names, while an unlisted variable does not reach that
      shell; catalogues without the new keys produce today's argv byte for byte; schema tests validate old and new
      catalogues and refuse the combinations above.
    gates:
      - id: exec-contract-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execContract.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: exec-profiles-can-be-probed
    role: implementer
    depends_on: [exec-carries-roots-mcp-and-env]
    acceptance: |
      `interlock runtime probe <exec profile>` runs graph 0062's checks, for real, through the exec profile's own program
      and access arguments, under the same preparation an exec attempt gets, and reports passed, failed or unavailable;
      it never reports passed for a check that did not run its real body inside the profile's access.
      - the checks are real: `interlock-probe-<check>` resolves to executables Interlock ships (create and remove a SysV
        shared memory segment, bind 127.0.0.1:0, create and remove a file in the probe worktree, commit on its branch);
        a check whose body fails reports failed with its output; pane-profile probes run the same bodies.
      - the access arguments are declared, not inferred: an exec profile may split its args into its program and access
        arguments (`args`) and an optional `headless_args` holding the non-conversational prompt tail with the whole
        "{prompt}" (an exec profile with headless_args may omit "{prompt}" from args; the launch argv is args, then
        headless_args). The probe template must expand with the program at argv[0] (a "{command}" before the program is
        refused before anything spawns) and equal args around one whole "{command}"; a profile without headless_args has
        no declared access split and its probe reports unavailable with that reason, never passed.
      - the probe uses the shared preparation of exec-carries-roots-mcp-and-env, including exec provider validation,
        bind with the real probe process identity, and release and launch cleanup on every exit path.
      - probe provenance includes a hash of the effective forwarded environment values (values never stored), so a
        changed forwarded variable reads the earlier pass as historical; the probe implementation version is bumped.
      - runtimes@v2 gains headless_args additively, with loader, schema, docs/shapes.md and tests.
      Tests, packages/runner/test/execProbe.test.ts and packages/cli/test/execProbe.test.ts (new), using fixture agent
      programs that run the check command inside a deliberately restricted fixture (one denies the shared-memory body
      by environment the test controls): an exec profile with headless_args passes every real check; the restricted
      one reports the shared-memory check failed; a template missing an access argument, or with "{command}" before
      the program, is refused before spawning; a profile without headless_args reports unavailable; roots, the MCP
      policy and forwarded environment reach the probed process; provider bind and release are recorded with the probe
      process identity and release runs when a check throws; changing a forwarded value makes the earlier pass
      historical; existing probe tests pass unchanged.
    gates:
      - id: exec-probe-runner-tests
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/execProbe.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: exec-probe-cli-tests
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/execProbe.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: tests-stand-alone
    role: implementer
    depends_on: [exec-carries-roots-mcp-and-env]
    acceptance: |
      Two runner tests depend on their surroundings instead of only on the code they test; both become deterministic,
      so a full-suite result means the code, not the machine or the checkout path.
      Found on 2026-11-09 while judging exec-carries-roots-mcp-and-env, and sharpened by this node's vet:
      - packages/runner/test/markerNeverDropped.test.ts "counts UTF-8 bytes rather than JavaScript characters" (:168)
        derives HOME, XDG_STATE_HOME and CODEX_HOME from its fixture root under the worktree (:44), and all three are
        serialized into the codex command (src environment.ts:16), so every character of worktree path adds three bytes:
        the pre-marker line measured 1037 bytes against the 1024-byte CODEX_CANONICAL_LINE_LIMIT from a long worktree
        path and passed from a short one. exec-carries-roots-mcp-and-env's branch shortens its filler (250 to 220), which
        only moves the cliff. The test also never requires the marked line to stay under 1024 characters, so a production
        change from bytes back to `.length` could still pass it.
      - packages/runner/test/receiptCarriesItsRun.test.ts timed out at vitest's 5 s default in the full suite on a loaded
        machine and passed alone. Each judgment spawns `mise exec -- <cmd>` through spawnOwned and waits for close
        (gateJudge.ts:130, :403), and output retention launches `git rev-parse --git-common-dir` (gateOutput.ts:116);
        each case also initializes and commits a git fixture (:36). The clock is already controlled (:51); its
        "ignoring duration" case compares two zero durations from an unadvanced clock (:102), and its matching case
        changes output bytes as well as the pattern (:116). Contention is not an accepted explanation.
      What changes:
      - marker test: its fixture root is a short directory under the system temp folder, independent of the worktree
        path; the filler is computed from the actual serialization: with an empty filler, B is the unmarked command's
        UTF-8 bytes and D the marked minus unmarked bytes; fillerLength = 1024 - (D - 15) - B, so the unmarked line is
        exactly D - 15 bytes under the limit and the marked line crosses it by exactly 15 bytes; it asserts both exact
        byte counts, that the marked line is under 1024 JavaScript characters, and that fillerLength is not negative. A
        separate case covers a base already at or over the limit and asserts today's behaviour for it (the overlay path
        or its refusal, whichever production does), so no path length is untested.
      - receipt test: GateJudgeRequest gains an optional typed command runner, defaulting to today's spawnGateCommand
        and receiving the full wrapper argv (so a fake can check it), returning { exitCode, output, stdout, stderr }; and
        an optional resolved output-storage directory, defaulting to today's resolution, used by the real
        storeGateOutput. The test fakes only execution results: proof construction, output hashing and storage,
        commandReceiptId, deduplication and gate selection stay real. Its fixture needs no git repository. The fake
        runner advances the controlled clock by different amounts for identical proof, and the case requires one
        receipt; a new case gives identical bytes with different patterns and requires distinct receipts.
      - production behaviour is unchanged; no timeout is raised; no case is skipped or weakened.
      Evidence, in notes.yaml, each tied to this node's head sha with exit status, totals and the output file kept:
      the receipt test's cases each finish under 1 s of real time alone; `pnpm test` passes three times in a row on that
      head, run one at a time.
    gates:
      - id: marker-stands-alone
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/markerNeverDropped.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'
      - id: receipt-stands-alone
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/receiptCarriesItsRun.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed \([1-9][0-9]*\)'

  - id: judge-tests-stand-alone
    role: implementer
    depends_on: [tests-stand-alone]
    acceptance: |
      No logic test waits on wall time, and every integration test that does takes real time says what it integrates and
      carries a budget derived from its own deadlines, so a busy machine cannot fail a test whose subject is logic, and a
      slow integration test is visible and bounded rather than hidden behind the 5 s default.
      Found on 2026-11-09: in a full-suite run on tests-stand-alone's head, gateJudge.test.ts "running the same gate twice
      over the same content writes one receipt identity and no duplicate" exceeded vitest's 5 s default under load, the
      same defect tests-stand-alone fixed in receiptCarriesItsRun. Contention is not an accepted explanation. A sweep
      measured every test in every package with vitest's JSON reporter on main fadc8e6 (one package at a time, quiet
      machine): 73 tests take 1 s or more; these 39 in 18 files take 1.5 s or more, the band where the 2.44 s case already
      timed out under load (counts and each file's slowest case; the implementer re-measures first and records every
      case's full identity and duration in notes):
        - packages/runner/test/realCodexMarkerOverflow.test.ts: 1 case(s), slowest 15.82s ("records marker values in real MCP children started by Codex exec")
        - packages/runner/test/herdr/adapter.test.ts: 2 case(s), slowest 5.11s ("loops past a slice herdr never answers, returning the status the next ")
        - packages/substrate/test/absorb.test.ts: 1 case(s), slowest 5.01s ("degrades to a narrated refusal instead of acknowledged, judgement stil")
        - packages/cli/test/run.test.ts: 4 case(s), slowest 3.55s ("sends a concise prompt projection after committing a complete 3000-pat")
        - packages/cli/test/face/landedCache.test.ts: 2 case(s), slowest 3.20s ("reads main once per refresh, judges only what moved, retries a failed ")
        - packages/cli/test/resumeRange.test.ts: 3 case(s), slowest 3.19s ("keeps the predecessor code and writes the runner provenance")
        - packages/runner/test/worktreeMaintenance.test.ts: 1 case(s), slowest 2.72s ("writes the detached tasks only into the common object store, never int")
        - packages/cli/test/plan.test.ts: 7 case(s), slowest 2.67s ("inherits a correction's context selector unless an explicit replacemen")
        - packages/runner/test/gateJudge.test.ts: 1 case(s), slowest 2.44s ("running the same gate twice over the same content writes one receipt i")
        - packages/runner/test/lineFitsRealCodex.test.ts: 1 case(s), slowest 2.34s ("runs a provider shell call with moved policy and marker values")
        - packages/runner/test/gatesRunOnEnginesNode.test.ts: 2 case(s), slowest 2.16s ("checks a space-joined range against v24.9.0")
        - packages/cli/test/judge.test.ts: 4 case(s), slowest 2.15s ("binds an enabled origin through judge's actual absorb client")
        - packages/runner/test/runnerCommits.test.ts: 1 case(s), slowest 1.87s ("commits entries in order, signs and adds both attempt trailers and aut")
        - packages/cli/test/debrief/recoverSessionStart.test.ts: 1 case(s), slowest 1.86s ("refuses later arbitrary commits, committed brief edits, and missing or")
        - packages/cli/test/execWithoutHerdr.test.ts: 5 case(s), slowest 1.82s ("judges a held unleased exec session with --session")
        - packages/face/test/noSyncGit.test.ts: 1 case(s), slowest 1.81s ("runs a two-repository position read with no synchronous child and at m")
        - packages/runner/test/submoduleReceipts.test.ts: 1 case(s), slowest 1.55s ("is judged into a receipt without throwing")
        - packages/cli/test/evidence.test.ts: 1 case(s), slowest 1.55s ("reads the corrected handoff from replay after supported revision and r")
      Classification, from this node's vet (file:line on fadc8e6), applied case by case, never by file:
      - logic, made deterministic: gateJudge.test.ts:68 (receipt identity; use the gate judge's commandRunner and
        outputDirectory seams, drop the git fixture); herdr/adapter.test.ts:393 and :669 (retry and deadline over a fake
        socket; inject a clock and sleep into the adapter, keeping its real HerdrCall); substrate absorb.test.ts:156 (a
        fixed 5 s HTTP abort; inject the abort scheduler at httpClient.ts:138); gatesRunOnEnginesNode.test.ts:136 and its
        sibling (version policy; add a narrow execution dependency to checkNodeEngine at nodeEngine.ts:153);
        landedCache.test.ts:100 (refresh and retry counts; its existing git injection); plan.test.ts selector and
        correction rules, judge.test.ts decided-node, lease and session-selection checks (seed ledger state directly
        rather than running whole sessions); resumeRange chain selection over supplied history facts where separable.
      - integration, kept real with a budget: run.test.ts:674 (3000-path committed brief), judge.test.ts:192 (run to
        absorb), landedCache.test.ts:178 (cache across real processes), resumeRange's ancestry, historical bytes and
        trailers, recoverSessionStart.test.ts:182, worktreeMaintenance.test.ts:278, runnerCommits.test.ts:209 (real
        signed commits), execWithoutHerdr's exec phases, noSyncGit.test.ts:100, submoduleReceipts.test.ts:91 (git index;
        fake only its incidental gate command), evidence.test.ts:360, and the real codex tests realCodexMarkerOverflow
        :77 and lineFitsRealCodex :208.
      - the gate judge's commandRunner and outputDirectory are forwarded through judgeWorktree (judgeWorktree.ts:14, :96)
        and the CLI and session-drive options, so CLI logic tests can use them.
      - two hollow cases are fixed: judge.test.ts:317 claims lease coverage and :409 session-override coverage, but both
        assert "outcome is cleared" because judge.ts:159 returns first; they seed undecided fixtures and assert the
        branch their names claim.
      - realCodexMarkerOverflow waits on a 15 s watchdog after its MCP children already wrote their evidence: it observes
        the evidence, terminates and reaps promptly, and keeps a bounded startup watchdog. The real codex tests run with an
        explicit allowlisted environment instead of inheriting process.env (toolState.ts:106); they stay credential-free
        (temp CODEX_HOME, fixture MCP children, a loopback provider), which is this graph's one exception to "no real
        agent CLI", stated here because these tests predate it.
      How slow tests are declared and gated:
      - a test helper declares a slow integration test: it sets that test's actual vitest timeout and records, as test
        metadata the JSON reporter carries, the budget and a one-line reason naming what it integrates. The budget is
        derived from the test's own constituent deadlines (watchdogs, child timeouts) plus a stated cleanup allowance, and
        is at least twice the measured duration across three runs. No vitest config, per-file or global testTimeout or
        hookTimeout changes; no blanket helper over whole files.
      - scripts/gates/slow-tests.ts runs each package's vitest with a JSON report into a fresh temp folder, one package at
        a time, recording worker settings; it fails, naming each offender, when any expected package's report is missing,
        empty, invalid or from a failed run; when any test is skipped; when a test of 1.5 s or more is not declared through
        the helper; when a declared test's measured duration exceeds half its budget; or when a declared test no longer
        exists. On success it prints "slow tests accounted: N declared, M logic under 1.5 s".
      Evidence, in notes.yaml, tied to this node's head sha with exit status, totals and output files kept: the full
      before list with identities; the slow-tests gate passing; `pnpm test` passing three times in a row on that head, one
      at a time.
    gates:
      - id: slow-tests-accounted
        kind: command
        run: node scripts/gates/slow-tests.ts
        expect_output: 'slow tests accounted: [0-9]+ declared, [0-9]+ logic under 1.5 s'
