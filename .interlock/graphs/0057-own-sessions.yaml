interlock: graph@v0
id: 0057-own-sessions
ask: Interlock closes the panes it opened once their work is provably over, never touches a pane it did not open, and runs reviews of plan graphs as sessions the harness can lease, count and show.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: machine-limits-2026-11-06
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Rodrigo Sasaki; Gilb relays the recorded approval and coordinates cleared-node merges. The cross-vendor vet is advisory.
read: >
  The follow-on to graph 0056-machine-provider, split from it so the machine provider protects launches first; its
  read binds this graph. Order: this graph starts after 0056 lands, since own-sessions records ownership through the
  provider's admit and releases through it, and closes go through the confirmed close 0056 introduces. Rodrigo,
  17:13 UTC: "Preston should be able to close its own sessions, if herdr is a problem and I have to choose between
  this and herdr, this wins." Rodrigo, 15:43 UTC, on reviews run outside the product: no working around the product.
gates:
  - id: approved
    kind: human
nodes:
  - id: own-sessions
    role: implementer
    depends_on: []
    acceptance: |
      Interlock closes the panes it opened. Rodrigo, 17:13 UTC: "Preston should be able to close its own sessions,
      if herdr is a problem and I have to choose between this and herdr, this wins. It makes no sense to tell a
      preston user 'hey, open up herdr and close down these things that I opened without even asking you...'" On
      2026-11-06 herdr restored 59 agent panes runners had opened, about 16 GB idle, and the owner had to close them
      by hand.
      Ownership record. Every pane the runner opens is recorded in the ledger beside the session: pane id,
      workspace, agent kind, pane pid, worktree path, graph/node/session and opened-at, and passed to the provider's
      admit. A pane with no record is the owner's, and the runner never touches it.
      Lifecycle. When an attempt's outcome is recorded (cleared, held or failed: the judge has run, so its work is
      over), the runner closes its own pane through the runtime adapter, unless the pane was kept for drilldown,
      which now carries an expiry (default 2 hours, a local.yaml key) after which it is closed like any other. An
      abandoned attempt (lease lapsed) or a restored copy is closed only when the adapter confirms no live work
      (liveWork none, packages/runner/src/sessionWait.ts:67), never on idle alone; a pane whose live work is present
      or unknown (codex has no live-work evidence source yet) is kept, counted by the provider, and listed by
      `interlock sessions` as waiting on its owner. herdr restore relaunches panes, so on every launch, and when
      the adapter finds herdr freshly started, the runner matches restored copies back to their records by worktree
      path, agent kind and pane id. A restored owned pane is never resumed or given work by the runner: it stays as
      herdr restored it, is counted, and new launches are admitted only within the limit counting it. Measure whether
      herdr 0.9.5 can restore a pane without relaunching its agent; if it can, the runner marks owned panes that way.
      All herdr calls stay inside the herdr adapter (laws I6). Every close and every release is an outbox effect
      (laws I7): intent persisted before dispatch, a stable identity (pane id and session), delivery recorded, and a
      lost acknowledgement recorded as uncertain and reconciled on the next start by asking the adapter whether the
      pane still exists. Each close records by runner, why (settled, drilldown expired, restored copy), the pane and
      its record, and is released through the provider only once confirmed (machine-provider).
      `interlock sessions` lists the panes the runner owns with their state; `interlock sessions close <session|--idle>`
      closes owned panes only and refuses any other pane with one line naming it as not opened by interlock. When a
      host refuses an agent's own call to close (an agent's safety checks), the owner's command or the app's click
      runs the same close; that is the owner's path to it, and nothing edits a permission.
      Tests in packages/runner/test/ownSessions.test.ts with a fixture runtime adapter:
      - a pane opened for an attempt is closed when the attempt settles, and recorded;
      - a drilldown pane is kept until its expiry, then closed;
      - a simulated herdr restore (same worktree, agent and pane id, new pid) closes the restored copy of a settled
        session whose live work is none, while an unowned pane with an agent survives;
      - a restored or abandoned pane that is idle but whose live work is present or unknown is kept and counted;
      - a restore while the limit is full admits no new launch, and no restored pane is resumed;
      - a close whose acknowledgement is lost is recorded uncertain and reconciled after a restart;
      - `interlock sessions close` refuses an unowned pane with its line and closes an owned idle one;
      - a close that the adapter cannot confirm keeps the record open and releases nothing.
      Strict TypeScript, no type assertions, no non-null operators. No push, no merge; the human merges.
    gates:
      - id: own-sessions-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/ownSessions.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: plan-reviews-are-sessions
    role: implementer
    depends_on: [own-sessions]
    acceptance: |
      A review of a plan graph runs as a session the harness can see, lease and count. Until now cross-vendor reviews
      of drafted graphs ran as bare `codex exec` calls outside interlock, invisible to the position, the face and the
      machine provider's limits (Rodrigo, 15:43 UTC: no working around the product).
      `interlock review <graph> --lens <name> --runtime <profile> [--prompt-file <path>]` starts a reviewer-role
      session on the graph file: leased like a node attempt under a review key (graph, lens, graph content hash), in
      a pane the runner owns and labels "review <graph> <lens> · <runtime>", admitted and given env through the
      machine provider like any launch, with the runtime's read-only sandbox (a profile key, read_only_args, for the
      flags; codex uses --sandbox read-only). The brief is the graph file path, the lens's instruction (from the
      prompt file or a named lens in local.yaml) and the reviewer role's opening. The session's judgment is saved as
      a versioned review document beside the graph (.interlock/reviews/<graph>/<content hash>/<lens>-<session>.md)
      and recorded as a receipt with derivation model, lens and runtime. A review is advisory: it never moves the
      approved gate or any node (laws I2, I9). The pane closes when the review is saved (own-sessions). The position
      shows reviews in flight and done for each drafted graph.
      Tests in packages/runner/test/planReview.test.ts with a fixture runtime and provider:
      - a review is admitted through the provider, runs in an owned labelled pane, saves its document and receipt,
        and closes its pane;
      - a refused admit starts nothing and records no outcome;
      - a review never changes the approved gate or any node's state;
      - two reviews of the same graph content and lens are both kept, versioned by session.
    gates:
      - id: review-proof
        kind: command
        run: pnpm --fail-if-no-match --filter runner exec vitest run test/planReview.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
