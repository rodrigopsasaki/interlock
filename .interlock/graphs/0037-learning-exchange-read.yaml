interlock: graph@v0
id: 0037-learning-exchange-read
ask: "The latest completed handoff preview shows one rooted repository-scoped hypothesis, but its completion says 0 decisions absorbed and 51 gaps. In the real items-capable receiver an empty legacy decisions_absorbed list does not count translated items. Inspect the current sender/narration seams and propose one complete bounded implementation graph that makes this learning exchange honest and legible: distinguish the translated request (when known), the receiver-reported response and any lexical discovery-reference comparison against a brief. Do not call an acknowledgment proof of storage, truth, adoption, usefulness or semantic prior knowledge; do not count unavailable evidence as zero. Preserve address-none, refusal, legacy/no-items and all outbox retry/identity/durability behavior. Prefer changing existing local narration and its supplied evidence over a new protocol, artifact or receiver. Require discriminating focused tests including positive translated evidence with zero reported decision IDs, true empty versus unknown evidence, refusal/none, real runner wiring and existing delivery-boundary regressions. Produce only graph, typed notes and truthful debrief; never implement, approve or lease its nodes. Use AGENTS and current source; received context is provisional and no-use is valid. Work from this checkout with mise exec; retain yielded exec handles and run one local check at a time, lint before handoff, leave full suites to harness. Actual authorship is codex/gpt-5.6-terra. Use date -u for each note, real full Git IDs, preserve all prior artifacts. Interpreter filing remains authored, not worker-only derived filing. No agents, dependencies, trust/permission/config changes, push, merge, deploy or real brain access. Per-command unsigned commits allowed if signing is inaccessible. Stop after committed debrief."
derivation:
  kind: agent
  runtime: codex
  model: gpt-5.6-terra
  graph_base_sha: 0f9f2572140be4e42937dd6ea7c659b35d2e25b3
  session_start_sha: b8eee70eddd0972fe63edda68812be95c0b82342
  session: 45d780f7-9f86-4dba-a902-289cad254a43
  date: 2026-09-16
read: >
  Current gate judging derives items and gaps before absorb, then sends that
  evidence through the durable outbox. The HTTP adapter accepts the existing
  receiver response with legacy decision IDs, discovery placements and gaps.
  Current narration conflates that receiver report with an optional lexical
  count of discovery references in the rendered brief, so a nonempty translated
  request can appear as zero decisions absorbed. Keep the existing request and
  response protocol, receiver, and outbox intact. One bounded implementation
  change defines local narration observation metadata that keeps sender
  translation, receiver response and lexical comparison explicitly separate,
  then wires the runner's already-derived evidence and readable brief slice to
  it. It preserves unknown versus observed-empty evidence and proves the actual
  judging route still retains and dispatches the same outbox artifacts.
gates:
  - id: approved
    kind: human
nodes:
  - id: make-honest-absorb-read
    depends_on: []
    acceptance: |
      Change the existing local substrate narration seam and its supplied local
      observation metadata, then wire packages/runner/src/gateJudge.ts to give
      it the actual observation used by the one existing outbound absorb path.
      One absorb position must separately report, when known: the translated
      request the sender supplied (its item and gap counts), the
      receiver-reported response (its decision IDs, discovery placements and
      gaps), and the lexical comparison of debrief discovery references against
      the actual brief Context slice. A receiver report is only a report in a
      received response: do not describe it as proof of storage, truth,
      adoption, usefulness, or semantic prior knowledge. Name the lexical result
      as a textual reference comparison, not receiver knowledge.

      Pass the already-derived local evidence through unchanged: do not
      recompute it, infer it from receiver IDs, introduce a second request, or
      change any wire payload. If evidenceForAbsorb has produced items or gaps,
      narrate that observed payload even when one claim source could not verify;
      verification refusal alone must not relabel known translated items as
      unavailable. Use unavailable only where the relevant local observation
      genuinely cannot be determined, and distinguish that state from a
      successfully observed empty translation. For the lexical comparison,
      distinguish an unreadable or absent Context slice from an explicitly
      present empty slice; neither may become invented known or unknown counts.
      Preserve receiver-reported placements exactly when they exist, and never
      use a lexical result to replace them.

      Preserve address none and refusal narration as their existing graceful
      outcomes, legacy/no-items omission, protocol bytes, stable effect identity,
      intent-before-dispatch durability, acknowledged and uncertain delivery
      handling, retry behavior, and retained request and response artifacts. Do
      not change the receiver, request or response schemas, artifact version,
      verification or evidence semantics, approval, authority, gates, leases,
      dependencies, trust, permissions, configuration, or network policy.

      Add focused substrate, runner, and command-route regressions using real
      judging wiring, not only a formatter stub. Prove a positive translated
      request is sent and narrated separately from a receiver response with zero
      decision IDs; prove observed translated items remain reported when claim
      verification refuses; prove true empty and genuinely unavailable sender
      evidence do not collapse; prove an explicit empty Context slice differs
      from a missing or unreadable slice; and retain receiver discovery-
      placement, refusal, and none behavior. Retain and run the existing outbox
      request-before-dispatch, identity/retry, acknowledged/uncertain, and
      storage-failure delivery-boundary regressions. Use actual authorship,
      typed notes and debrief, clean commits, and no dependency, trust,
      permission, config, approval, lease, push, merge, deployment, or receiver
      changes. The harness runs standing gates.
    gates:
      - id: honest-absorb-runner-proof
        kind: command
        run: pnpm --filter runner --filter substrate --filter cli --fail-if-no-match test
        expect_output: 'Tests +[1-9][0-9]* passed'
