interlock: graph@v0
id: 0007-absorb-outbox
ask: Preserve the intent and outcome of returning session evidence before trusting the learning loop with outward effects.
derivation:
  kind: model
  model: gpt-6-astra
  prompt: six-graphs-2026-09-14-slot-5
authorization:
  granted_by: Rodrigo Sasaki
  mandate: six-graphs-2026-09-14
  slot: 5
  limit: 6
  source: Root delegation and recorded I7 redirection in interlock-notes/six-graph-mandate-2026-09-14.md.
read: >
  M4 prerequisite for M5: the current absorb path calls the client directly,
  although I7 requires a persisted intent and honest uncertainty. Implement one
  bounded delivery path, not a general dispatcher, scheduler or recovery UI.
  Existing protocol and receiver unchanged. No automatic retry, new inference,
  live service, credential access, publish, push, merge, deployment, waiver or
  automatic ratification. Substrate stays none for this implementation session;
  tests use isolated fake HTTP and journal fixtures. Root approves exact content
  under the six-graph delegation; workers cannot.
gates:
  - id: approved
    kind: human
nodes:
  - id: retain-absorb-intent
    depends_on: []
    acceptance: |
      Route the actual runner debrief absorb path through a small typed outbox
      seam. Prepare and retain the exact outgoing request body and safe target
      before dispatch; include the bound optional repository selector from the
      preceding client work. Keep context read behavior and existing protocol
      bodies unchanged. No request is sent until durable intent is established.
      Do not persist Authorization, key contents, or a credential-bearing target
      URL. Refuse unsafe address userinfo/query/fragment without echoing secrets.
      None address bypasses the outbox and retains its empty/no-network behavior.

      Use the existing Phyxius journal, content-addressed artifacts and typed
      adapters. Raw outgoing payload and acknowledgment remain retrievable with
      hashes, byte counts, versioned structured envelopes and safe relative refs
      beneath the shared journal, surviving the worktree. Preserve every old
      receipt/event. Additive typed outbox events require a new event schema
      version and readers for all v1-v4 history; leave legacy string intents
      intelligible without inventing their payload or delivery outcome.

      Stable identity belongs to the logical delivery, not wall time or a newly
      measured gate duration. Bind destination/repository, node, session and the
      immutable debrief version/content. Store the first exact payload behind
      that identity. Repeated same identity and payload does not send again when
      acknowledged or uncertain. Changed payload under an existing identity is
      an explicit conflict/refusal retaining the original, not silent overwrite
      or a newly minted identity from timing noise. A genuinely new session or
      versioned debrief can name a new effect. No reconciliation or retry policy
      is authorized by this slice; return honest doubt for future judgment.

      A validated response becomes an acknowledged delivery fact only after its
      acknowledgment evidence is retained. Timeout, transport/HTTP/schema refusal,
      or interrupted intent without a recorded terminal fact is uncertain, not
      proof that no write happened. Reopening the journal preserves that doubt
      and makes zero automatic delivery requests. Do not reset uncertain to
      pending. Retain a meaningful because and derivation on these facts. Keep
      node work proof distinct from evidence-delivery status; no guessed success.

      The persistence boundary must be real: installed Phyxius Journal 0.2.1
      catches subscriber exceptions, and today's sink is a subscriber. Returning
      from ledger.append or updating projection therefore does not prove disk
      persistence. Establish a narrow tested append acknowledgment/error seam
      before dispatch, keeping Phyxius as owner. Confirm the actual entry's write
      and file sync, not only enqueue or in-memory notification. A failed
      persistence boundary poisons further confirmed dispatch from that ledger
      instance until reopened; test both write and sync failure. Do not swallow a sink failure,
      advance a trusted durable projection after failed persistence, or replace
      the journal with a second uncoordinated state store. Record the finding
      and its way back in the design bend log. Fail safely on storage trouble.

      Provide a small read/verification seam for the next graph to inspect
      intent, exact payload, delivery and acknowledgment by node/session/effect.
      This is not a new face, metrics platform or general effects abstraction.
      A missing/corrupt artifact is refused, never substituted with an empty
      payload or an invented acknowledgment. Local artifact writes are immutable.

      Tests exercise the real HTTP adapter and runner path: receiver can read
      persisted intent/payload before observing the request; exact payload bytes
      match the request; ack and readback verify; none emits no intent/network;
      real sink failure means zero HTTP calls and no durable-looking projection;
      transport/non-2xx/malformed-ack uncertainty; interrupted intent reopened
      before/after potential dispatch makes no resend; same effect and payload
      is not redelivered; changed-payload conflict preserves first evidence;
      credential refusal and legacy replay/schema corpus remain discriminating.
      No sleeps as proof, timeout inflation, disabled standing gates or live DB.

      Allowed: ledger event/projection/envelope/upcast/sink/append and narrow
      outbox types/read helpers; new versioned schemas and schema registry/corpus;
      runner absorb judgment and minimal artifact/plumbing helpers; substrate
      adapter preparation/dispatch/types preserving public compatibility; focused
      tests and fake-client adaptations; regenerated docs/shapes.md and a design
      0001 bend entry; this session's notes/debrief. Prior graphs/artifacts,
      standings, README, runtime integrations and unrelated code stay untouched.
      Strict types, no casts/non-null assertions, no packages/*/src comments.
      Conventional why-commits, actual provenance and acceptance-to-test notes.
    gates:
      - id: outbox-proof
        kind: command
        run: pnpm --filter runner --fail-if-no-match exec vitest run test/absorbOutbox.test.ts
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: shape-reference-fresh
        kind: command
        run: pnpm interlock schema reference --check
