interlock: graph@v0
id: 0052-count-tells-the-truth
ask: A position counts as waiting on a person only what is live and unfinished; a retired graph and a node already on main never add to that count.
derivation:
  kind: model
  model: gilb (Claude)
  prompt: needs-you-sweep-2026-11-05
authorization:
  granted_by: Rodrigo Sasaki
  mandate: loom-feed-2026-11-04  # "You're free to do changes on phyxius and interlock too", 23:25 UTC
  approver: Gilb for Rodrigo Sasaki, after a cross-vendor vet; the human merges
read: >
  On 2026-11-05 Rodrigo's Preston cockpit said "35 things need you. Five are
  yours to start." It derives that from positions@v1 (preston
  cockpit/loom/src/derive.ts: a not-approved or stale graph is tier 0, a graph
  whose nodes are all cleared but not done is tier 1). A sweep of the 40 items
  found three needs-you items truly his. The rest come from two Interlock gaps.

  First gap, no retire. 31 interlock graphs (0008-0015, 0018-0026, 0028, 0029,
  0031-0041) are September 14-16 drafts that were never approved. Three approved
  graphs (0005-gate-output-way-back, 0007-absorb-outbox,
  readme-interlock-concept) were held in September and later superseded on main.
  The CLI has graph approve/show/status, node cancel/reset and gate clear/waive.
  Nothing says a graph will not be done. Approving would start runs and spend. A
  waive records that a person accepted the work. `node cancel` acts per node,
  and a not-approved graph counts as needs-you whatever its nodes say.

  Second gap, landed work reading "on main unknown". These graphs' branches are
  ancestors of main, yet `interlock position --json` reports, per node:
  - interlock 0001-bootstrap scaffold, ledger, ledger-gaps, debrief-schema,
    face-read, runner-command-gate, and 0002-shapes brief-shape: unknown, "the
    attempt recorded no base commit, so its change cannot be compared with main".
    These are backfilled September attempts (session backfill-<graph>-<node>).
  - interlock 0003-translator substrate-client, evidence, interpreter, and preston
    0013-reviews-say-what-matters reconcile-prompt, land-review: unknown, "1 of
    the attempt's N landed units are undone on main, but <later main commit>
    there also changes <path>, which <attempt commit> changed, so what still
    stands is unresolved".
  The landed reader (packages/face/src/landed.ts, from 0048) knows `on-main` by
  ancestry, patch and squash, plus reverted and partly reverted. The first
  family never reaches ancestry because the base is missing, though ancestry
  needs only the cleared head and main. The second family lets an unresolved
  question about later main history replace the fact that the node landed.
gates:
  - id: approved
    kind: human
nodes:
  - id: retire
    role: implementer
    depends_on: []
    acceptance: |
      Add `interlock graph retire <graph> --by <who> --because <sentence>
      [--superseded-by <ref>]`. It refuses without --by or --because, and refuses
      an unknown graph id, as `node cancel` and `node reset` do. It works the same
      on an approved, not-approved or stale graph, and on a graph with live,
      held, cleared or never-started nodes. It refuses a graph with a live lease,
      naming the session and lease end, as judge does. Retiring an already retired
      graph is refused, and the refusal names the earlier retirement. A
      retirement starts no run, judges no gate, and records no approval or waive.

      The retirement is a ledger record carrying the graph id, who, why, when
      (from the injected clock), the optional superseded-by text (free text: a
      PR, commit, graph id or path, stored as given) and the graph file's content
      hash at retirement. Existing journals and ledgers read unchanged. Version
      any shape or event that changes, following the repo's existing
      versioning, with the schema tests.

      `interlock position --json` (positions@v1 and the per-graph position) moves
      a retired graph out of `graphs` into a `retired` list per repository. Each
      entry gives the graph id, who, why, when, superseded-by when given, and the
      final node states. A retired graph never appears in `graphs`, criticalPath,
      or any count of work waiting on a person. Consumers that read only
      `graphs`, the Preston cockpit included, then drop it without any change on
      their side. State this contract in the positions shape reference. The
      text face shows retired graphs in their own quiet section, never as
      waiting. `interlock graph show` and `status` on a retired graph say it is
      retired, by whom and why.

      A graph file edited after retirement stays retired. The retirement records
      the hash it retired, and the position reports when the file has changed
      since. Un-retiring is out of scope.

      Strict TypeScript, no type assertions, no non-null operators. Fixture git
      only through test/support/gitFixture.ts. Preserve every historical
      artifact. Append typed notes for choices and discoveries. No push, no
      merge; the human merges.
    gates:
      - id: retire-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/graph/retire.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: position-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/position.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: cli-position-proof
        kind: command
        run: pnpm --fail-if-no-match --filter cli exec vitest run test/position.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: full-suite
        kind: command
        run: pnpm test
        expect_output: 'Tests +[1-9][0-9]* passed'

  - id: landed
    role: implementer
    depends_on: [retire]
    acceptance: |
      Fix both landed families from the read at their cause in
      packages/face/src/landed.ts and its callers.

      Ancestry needs no base. When a node's cleared head is known and is an
      ancestor of main, the node is `on-main` by ancestry, whether or not the
      attempt recorded a base. A missing base still leaves patch and squash
      detection unknown when the head is not an ancestor, and the reason says
      so. If a backfilled attempt has no cleared head at all, find out why from
      the ledger. Fix it at that cause if the receipts name the head. Otherwise
      leave it unknown with a reason that names what is missing.

      Landing is a fact about the moment of landing. Once a node is on main (by
      ancestry, patch or squash), later main history cannot turn it back into
      unknown. Undone units stay reported beside the landing, never instead of
      it: a node with some units undone reads partly reverted (or a later-change
      variant naming the unresolved paths and commits, as the reason does
      today). A node whose every unit was reverted reads reverted. A graph is
      done when every node landed. Partly reverted, or unresolved after landing,
      counts as landed for `done` and for anything that waits on a person. Fully
      reverted does not. Keep 0048's evidence (patch ids, inverse detection,
      the cache), so no sync git returns.

      Prove both families with fixture repositories that reproduce their exact
      shape: a cleared attempt with no base whose head is an ancestor of main,
      and a landed unit whose inverse appears on main next to a later change to
      the same path. Each pins the new reading and `done`. After the change, run
      `interlock position --json` against ~/dev/private/interlock and
      ~/dev/private/preston, read-only. Record in the debrief, node by node,
      what 0001-bootstrap, 0002-shapes, 0003-translator and preston
      0013-reviews-say-what-matters read before and after. Anything still not
      on main gets its stated reason, never a guess.

      Strict TypeScript, no type assertions, no non-null operators. Fixture git
      only through test/support/gitFixture.ts. Preserve every historical
      artifact. Append typed notes for choices and discoveries. No push, no
      merge; the human merges.
    gates:
      - id: landed-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/landed.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: position-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/position.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: no-sync-git-proof
        kind: command
        run: pnpm --fail-if-no-match --filter face exec vitest run test/noSyncGit.test.ts --passWithNoTests=false
        expect_output: 'Tests +[1-9][0-9]* passed'
      - id: full-suite
        kind: command
        run: pnpm test
        expect_output: 'Tests +[1-9][0-9]* passed'
