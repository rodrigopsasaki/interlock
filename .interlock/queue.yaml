    graph: 0032-ceilings-per-operation-4
    node: ceilings
    arc: ceilings-per-operation
    state: running
    waitsOn: the agent's debrief at 24b6e48, then the runner stopped, the debrief committed signed and a hand judgment after the lease lapses

  - repo: preston
    graph: 0034-machine-limits
    with: interlock/0056-machine-provider
