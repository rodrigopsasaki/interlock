interlock: queue@v0
# The machine-wide order of work, as of 2026-11-06 18:45 UTC. The same list sits beside arcs.yaml in preston,
# interlock and gilb; at most 2 live agent sessions machine-wide (the bridge until preston 0034 lands).
# state: running | queued | held. waitsOn says what has to happen first.

queue:
