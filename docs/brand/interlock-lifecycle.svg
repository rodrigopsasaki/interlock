<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Where Interlock asks for proof</title>
  <desc id="desc">A node moves from left to right: plan, approval, work, gates, cleared. Two of those points are interlocks, drawn as the blue loop completed by its gold keystone. Before any work starts, a person approves the exact plan file. After the work, the gates the runner executes must be satisfied before the node is cleared.</desc>
  <defs>
    <path id="body" d="M 76.604 64.279 A 100 100 0 1 1 76.604 -64.279 L 63.198 -53.027 L 67.581 -47.319 L 53.245 -37.282 A 65 65 0 1 0 53.245 37.282 L 67.581 47.319 L 63.198 53.027 Z"/>
    <path id="key" d="M 76.604 -64.279 A 100 100 0 0 1 76.604 64.279 L 63.198 53.027 L 67.581 47.319 L 53.245 37.282 A 65 65 0 0 0 53.245 -37.282 L 67.581 -47.319 L 63.198 -53.027 Z"/>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".028"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <g filter="url(#paper)">
    <rect width="760" height="220" fill="#faf8f2"/>
    <g fill="none" stroke="#c9cfd5" stroke-width="3" stroke-linecap="round"><path d="M 24 88 H 56.5 M 83.5 88 H 176 M 268 88 H 366.5 M 393.5 88 H 492 M 584 88 H 677 M 703 88 H 734"/><path d="M 726 82 L 734 88 L 726 94" stroke-linejoin="round"/></g>
    <circle cx="70" cy="88" r="12" fill="#faf8f2" stroke="#8a8c85" stroke-width="3"/>
    <g transform="translate(222 88) scale(0.46)"><use href="#body" fill="#1559b1"/><use href="#key" fill="#e4af31"/></g>
    <circle cx="380" cy="88" r="12" fill="#faf8f2" stroke="#8a8c85" stroke-width="3"/>
    <g transform="translate(538 88) scale(0.46)"><use href="#body" fill="#1559b1"/><use href="#key" fill="#e4af31"/></g>
    <circle cx="690" cy="88" r="13" fill="#292d30"/>
  </g>
  <g text-anchor="middle" fill="#292d30" font-family="Georgia, serif" font-size="27">
    <text x="70" y="186">Plan</text>
    <text x="222" y="186">Approval</text>
    <text x="380" y="186">Work</text>
    <text x="538" y="186">Gates</text>
    <text x="690" y="186">Cleared</text>
  </g>
</svg>
