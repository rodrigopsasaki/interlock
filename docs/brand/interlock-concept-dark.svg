<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">An interlock: a condition, evidence that fits, and permission to continue</title>
  <desc id="desc">A blue open loop with stepped ends is a condition that has not been met. A matching gold keystone is the evidence that fits it. Together they complete the loop, and the line of work continues past it. The open and completed loops are the c and o of the Interlock wordmark.</desc>
  <defs>
    <path id="body" d="M 76.604 64.279 A 100 100 0 1 1 76.604 -64.279 L 63.198 -53.027 L 67.581 -47.319 L 53.245 -37.282 A 65 65 0 1 0 53.245 37.282 L 67.581 47.319 L 63.198 53.027 Z"/>
    <path id="key" d="M 76.604 -64.279 A 100 100 0 0 1 76.604 64.279 L 63.198 53.027 L 67.581 47.319 L 53.245 37.282 A 65 65 0 0 0 53.245 -37.282 L 67.581 -47.319 L 63.198 -53.027 Z"/>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".028"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <g filter="url(#paper)">
    <rect width="760" height="220" fill="#171d24"/>
    <g fill="none" stroke="#536273" stroke-width="3" stroke-linecap="round"><path d="M 24 88 H 70"/><path d="M 690 88 H 734"/><path d="M 726 82 L 734 88 L 726 94" stroke-linejoin="round"/></g>
    <g transform="translate(130 88) scale(0.6)"><use href="#body" fill="#79a9e8"/></g>
    <g transform="translate(334.4 88) scale(0.6)"><use href="#key" fill="#e5b756"/></g>
    <g transform="translate(630 88) scale(0.6)"><use href="#body" fill="#79a9e8"/><use href="#key" fill="#e5b756"/></g>
    <g stroke="#94a0ae" stroke-width="2.5" stroke-linecap="round"><path d="M 262.2 88 H 280.2 M 271.2 79 V 97"/><path d="M 473.2 83 H 491.2 M 473.2 93 H 491.2"/></g>
  </g>
  <g text-anchor="middle" fill="#ede8de" font-family="Georgia, serif" font-size="27">
    <text x="130" y="186">A condition</text>
    <text x="380" y="186">Evidence that fits</text>
    <text x="630" y="186">Work continues</text>
  </g>
</svg>
